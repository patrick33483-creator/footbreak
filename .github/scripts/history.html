<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>皇冠球賽預測系統V3 · 歷史</title>
  <style>
    :root {
      --bg: #0b1220; --panel: #131c30; --border: #1f2b45;
      --text: #e6ecf5; --muted: #7a8aa8; --accent: #f59e0b;
      --ok: #34d399; --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
           background: var(--bg); color: var(--text); font-size: 13px; }
    header { display:flex; align-items:center; gap:16px; padding: 10px 16px;
             background: var(--panel); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 15px; margin: 0; color: var(--accent); }
    header .tag { color: var(--muted); font-size: 12px; }
    nav { display:flex; gap: 8px; }
    nav a { padding:4px 12px; border:1px solid var(--border); color: var(--muted);
            border-radius:4px; text-decoration:none; font-size:12px; }
    nav a.active { color: var(--accent); border-color: var(--accent);
                   background: rgba(245,158,11,0.15); }
    #meta { margin-left:auto; color: var(--muted); font-size:12px; }
    #controls { display:flex; gap:12px; padding: 8px 16px; align-items:center;
                background: var(--panel); border-bottom: 1px solid var(--border); }
    #search { background: var(--bg); color: var(--text); border:1px solid var(--border);
              border-radius:4px; padding:6px 10px; width: 260px; font-size:12px; }
    #count { color: var(--muted); font-size:12px; }
    table { width:100%; border-collapse: collapse; }
    thead th { text-align:left; padding: 8px 12px; color: var(--muted);
               font-weight:normal; font-size: 12px; background: var(--panel);
               border-bottom:1px solid var(--border); position: sticky; top:0; }
    tbody td { padding: 8px 12px; border-bottom: 1px solid var(--border);
               vertical-align: middle; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    .team { font-weight: 500; }
    .score { font-size: 14px; text-align:center; min-width: 90px; }
    .score .ft { font-weight: 600; color: var(--text); }
    .score .ht { display:block; color: var(--muted); font-size: 11px; }
    .score .status { display:inline-block; padding: 1px 6px; margin-left: 4px;
                     background: var(--ok); color: #052014; border-radius:3px;
                     font-size: 10px; }
    .score .status.live { background: var(--accent); color: #201002; }
    .pred { color: var(--text); font-size: 12px; }
    .pred.wait { color: var(--muted); }
    #err { color: var(--bad); padding: 12px 16px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    @media (max-width: 720px) {
      #search { width: 160px; }
      thead th { font-size: 11px; padding: 6px; }
      tbody td { padding: 6px; font-size: 11px; }
      .score { min-width: 60px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>皇冠球賽預測系統V3</h1>
    <span class="tag">歷史</span>
    <nav>
      <a href="./" >即時開賽</a>
      <a href="./history.html" class="active">歷史</a>
    </nav>
    <div id="meta">載入中…</div>
  </header>
  <div id="controls">
    <input id="search" placeholder="搜尋聯賽 / 隊名…" />
    <div id="count">— 場</div>
  </div>
  <div id="err"></div>
  <table>
    <thead>
      <tr>
        <th>開賽</th>
        <th>聯賽</th>
        <th>主隊</th>
        <th>比分</th>
        <th>客隊</th>
        <th>初盤首預</th>
        <th>T-30預測</th>
        <th>T-5預測</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const $ = s => document.querySelector(s);
    let all = [];

    function esc(s) {
      return (s ?? "").toString().replace(/[&<>"']/g,
        c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }

    function predCell(v) {
      if (!v || v.startsWith("(")) {
        return `<span class="pred wait">${esc(v || "(等候中)")}</span>`;
      }
      return `<span class="pred">${esc(v)}</span>`;
    }

    function scoreCell(m) {
      if (m.home_score === null || m.home_score === undefined) {
        return `<span class="pred wait">—</span>`;
      }
      let statusCls = "";
      if (m.status && m.status !== "完") statusCls = "live";
      const ht = (m.ht_home_score !== null && m.ht_home_score !== undefined)
        ? `<span class="ht">半 ${m.ht_home_score}-${m.ht_away_score}</span>` : "";
      const st = m.status ? `<span class="status ${statusCls}">${esc(m.status)}</span>` : "";
      return `<span class="ft">${m.home_score}-${m.away_score}${st}</span>${ht}`;
    }

    function render(list) {
      const rows = $("#rows");
      if (!list.length) {
        rows.innerHTML = `<tr><td colspan="8" class="empty">未有記錄 — 由 2026-09-08 16:45 起累積</td></tr>`;
        $("#count").textContent = `0 場`;
        return;
      }
      rows.innerHTML = list.map(m => `
        <tr>
          <td>${esc(m.kickoff_display)}</td>
          <td>${esc(m.league)}</td>
          <td class="team">${esc(m.home)}</td>
          <td class="score">${scoreCell(m)}</td>
          <td class="team">${esc(m.away)}</td>
          <td>${predCell(m.first)}</td>
          <td>${predCell(m.t30)}</td>
          <td>${predCell(m.t5)}</td>
        </tr>`).join("");
      $("#count").textContent = `${list.length} 場`;
    }

    function filterRows() {
      const q = $("#search").value.trim().toLowerCase();
      if (!q) return render(all);
      const f = all.filter(m =>
        (m.league||"").toLowerCase().includes(q) ||
        (m.home||"").toLowerCase().includes(q) ||
        (m.away||"").toLowerCase().includes(q));
      render(f);
    }

    async function load() {
      try {
        const r = await fetch("./results.json?_=" + Date.now());
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        all = d.matches || [];
        const gen = d.generated_utc ? new Date(d.generated_utc) : null;
        const t = gen ? gen.toLocaleTimeString("zh-HK") : "—";
        $("#meta").textContent = `累積 ${d.count || 0} 場 · 更新 ${t} · 起點 ${d.epoch_display || ""}`;
        $("#err").textContent = "";
        filterRows();
      } catch (e) {
        $("#err").textContent = "載入錯誤: " + e.message;
      }
    }

    $("#search").addEventListener("input", filterRows);
    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
