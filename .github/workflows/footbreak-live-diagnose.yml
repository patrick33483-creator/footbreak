name: 診斷足破即時 T-5

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 抽取計時器、日誌及臨場賽事
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s" <<'REMOTE'
          set -uo pipefail
          date
          echo "=== timers ==="
          for unit in footbreak-tick.timer footbreak-t30.timer crown-tick.timer; do
            echo "--- $unit"
            systemctl is-enabled "$unit" || true
            systemctl is-active "$unit" || true
            systemctl show "$unit" \
              -p ActiveState -p SubState -p Result \
              -p LastTriggerUSec -p NextElapseUSecRealtime || true
          done
          systemctl list-timers footbreak-tick.timer footbreak-t30.timer crown-tick.timer --all --no-pager || true

          echo "=== services ==="
          for unit in footbreak-tick.service footbreak-t30.service crown-tick.service; do
            echo "--- $unit"
            systemctl show "$unit" \
              -p ActiveState -p SubState -p Result -p ExecMainStatus \
              -p ExecMainStartTimestamp -p ExecMainExitTimestamp || true
          done

          echo "=== Crown pending simulation settlement ==="
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -u - <<'PY'
          from datetime import datetime

          from crown.common import HKT, SETTLE_AFTER_SECONDS, parse_time
          from crown.config import settings
          from crown.hkjc import fetch_official_results
          from crown.state import load_ledger
          from crown.titan import TitanClient

          config = settings()
          bets = load_ledger(config).get("bets") or []
          now = datetime.now(HKT)
          pending = [bet for bet in bets if bet.get("status") == "PENDING"]
          due = [
              bet for bet in pending
              if parse_time(bet.get("kickoff"))
              and (now - parse_time(bet.get("kickoff"))).total_seconds() >= SETTLE_AFTER_SECONDS
          ]
          dates = {
              parse_time(bet.get("kickoff")).strftime("%Y-%m-%d")
              for bet in due if parse_time(bet.get("kickoff"))
          }
          ids = {
              str(bet.get("hkjc_match_id"))
              for bet in due if bet.get("hkjc_match_id")
          }
          try:
              official = fetch_official_results(ids, dates)
              official_error = None
          except Exception as exc:
              official = {}
              official_error = f"{type(exc).__name__}: {exc}"
          try:
              titan = TitanClient(config).results()
              titan_error = None
          except Exception as exc:
              titan = []
              titan_error = f"{type(exc).__name__}: {exc}"
          titan_by_id = {str(row.get("id")): row for row in titan}
          print({
              "bets": len(bets), "pending": len(pending), "due": len(due),
              "hkjc_ids": len(ids), "official_rows": len(official),
              "official_error": official_error, "titan_rows": len(titan),
              "titan_error": titan_error,
          })
          for bet in pending:
              kickoff = parse_time(bet.get("kickoff"))
              hkjc_id = str(bet.get("hkjc_match_id") or "")
              titan_id = str(bet.get("titan_match_id") or "")
              official_row = official.get(hkjc_id)
              titan_row = titan_by_id.get(titan_id)
              print({
                  "bet_id": bet.get("bet_id") or bet.get("id"),
                  "match_id": bet.get("match_id"),
                  "hkjc_match_id": hkjc_id or None,
                  "titan_match_id": titan_id or None,
                  "pinnapi_event_id": bet.get("pinnapi_event_id"),
                  "home": bet.get("home"), "away": bet.get("away"),
                  "league": bet.get("league"), "kickoff": bet.get("kickoff"),
                  "code": bet.get("code"), "side": bet.get("side"),
                  "condition": bet.get("condition"),
                  "due": bool(
                      kickoff
                      and (now - kickoff).total_seconds() >= SETTLE_AFTER_SECONDS
                  ),
                  "official": official_row,
                  "titan": titan_row,
              })
          PY

          echo "=== priority marker and lock ==="
          ls -la /run/footbreak-t5-priority /var/lock/footbreak.lock 2>&1 || true
          fuser -v /var/lock/footbreak.lock 2>&1 || true
          ps -eo pid,lstart,etime,cmd | grep -E 'run_all|deploy/run.sh|footbreak' | grep -v grep || true

          echo "=== recent tick journal ==="
          journalctl -u footbreak-tick.service --since "-25 minutes" --no-pager -o short-iso | tail -n 500 || true
          echo "=== recent t30 journal ==="
          journalctl -u footbreak-t30.service --since "-25 minutes" --no-pager -o short-iso | tail -n 300 || true
          echo "=== recent Crown tick journal ==="
          journalctl -u crown-tick.service --since "-25 minutes" --no-pager -o short-iso | tail -n 500 || true

          echo "=== dashboard fixtures around now ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = json.loads(Path("/var/www/footbreak/data.json").read_text())
          rows = data if isinstance(data, list) else (
              data.get("matches") or data.get("predictions") or []
          )
          now = datetime.now(timezone.utc)

          def parse(value):
              text = str(value or "").strip().replace("Z", "+00:00")
              if not text:
                  return None
              try:
                  result = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if result.tzinfo is None:
                  result = result.replace(tzinfo=timezone(timedelta(hours=8)))
              return result.astimezone(timezone.utc)

          for row in rows:
              kickoff_raw = (
                  row.get("kickoff_utc")
                  or row.get("kickoff_hkt")
                  or row.get("kickoff")
                  or row.get("start_time")
              )
              kickoff = parse(kickoff_raw)
              if kickoff is None or not (-timedelta(minutes=15) <= kickoff - now <= timedelta(minutes=20)):
                  continue
              print({
                  "match_id": row.get("match_id") or row.get("id"),
                  "home": row.get("home"),
                  "away": row.get("away"),
                  "kickoff": kickoff_raw,
                  "minutes": round((kickoff - now).total_seconds() / 60, 1),
                  "stage": row.get("stage"),
                  "status": row.get("status"),
                  "stages": [
                      {
                          "stage": item.get("stage"),
                          "ts": item.get("ts"),
                          "can_bet": item.get("can_bet"),
                          "no_bet_reason": item.get("no_bet_reason"),
                      }
                      for item in (row.get("stages") or [])
                  ],
              })
          PY

          echo "=== Footbreak uncomputable summary ==="
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -u - <<'PY'
          import collections
          import json
          from pathlib import Path

          data = json.loads(Path("/var/www/footbreak/data.json").read_text())
          history = data.get("prediction_history") or {} if isinstance(data, dict) else {}
          rows = history.get("rows") or [] if isinstance(history, dict) else []
          failed = [
              row for row in rows
              if row.get("forecast") in {
                  "未能計算", "資料不足（不列入準繩度）"
              }
          ]
          reasons = collections.Counter(
              str(row.get("no_bet_reason") or "未提供原因") for row in failed
          )
          print({
              "prediction_rows": len(rows),
              "uncomputable": len(failed),
              "reasons": reasons.most_common(20),
          })
          for row in failed[:50]:
              print({
                  "match_id": row.get("match_id"),
                  "home": row.get("home"),
                  "away": row.get("away"),
                  "kickoff": row.get("kickoff"),
                  "stage": row.get("stage"),
                  "reason": row.get("no_bet_reason"),
              })
          PY

          echo "=== Footbreak corner-result grades ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/var/www/footbreak/data.json").read_text())
          history = data.get("prediction_history") or {}
          rows = history.get("rows") or []
          for row in rows:
              predictions = [
                  prediction for prediction in (row.get("market_predictions") or [])
                  if isinstance(prediction, dict) and prediction.get("code") == "CHL"
              ]
              if not predictions:
                  continue
              grades = [
                  grade for grade in (row.get("market_grades") or [])
                  if isinstance(grade, dict) and grade.get("code") == "CHL"
              ]
              print({
                  "match_id": row.get("match_id"),
                  "fixture_id": row.get("fixture_id"),
                  "home": row.get("home"), "away": row.get("away"),
                  "league": row.get("league"), "kickoff": row.get("kickoff"),
                  "stage": row.get("stage"),
                  "result_status": row.get("result_status"),
                  "result_source": row.get("result_source"),
                  "score": row.get("score"),
                  "prediction": predictions,
                  "grade": grades,
              })
          print({
              "corner_prediction_rows": sum(
                  any(
                      isinstance(prediction, dict) and prediction.get("code") == "CHL"
                      for prediction in (row.get("market_predictions") or [])
                  )
                  for row in rows
              )
          })
          PY

          echo "=== Footbreak Titan corner fallback execution ==="
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          PYTHONPATH=/opt/footbreak/system:/opt/footbreak \
            /opt/footbreak/.venv/bin/python3 -u - <<'PY'
          import json
          from pathlib import Path

          from system import titan_results
          from crown.matching import (
              Event, canonical_league_key, canonical_team_key, match_event,
          )

          data = json.loads(Path("/var/www/footbreak/data.json").read_text())
          rows = (data.get("prediction_history") or {}).get("rows") or []
          client, titan_rows = titan_results.fetch_titan_result_rows()
          for row in rows:
              grades = [
                  grade for grade in (row.get("market_grades") or [])
                  if isinstance(grade, dict)
                  and grade.get("code") == "CHL"
                  and grade.get("reason") == "corners_result_missing"
              ]
              if not grades:
                  continue
              home_score, away_score = str(row.get("score") or "-").split("-", 1)
              official = {
                  "goals_home": int(home_score),
                  "goals_away": int(away_score),
                  "goals_total": int(home_score) + int(away_score),
                  "corners_home": None,
                  "corners_away": None,
                  "corners_total": None,
                  "source": row.get("result_source"),
              }
              try:
                  target = Event(
                      str(row.get("match_id") or ""),
                      str(row.get("league") or ""),
                      str(row.get("home") or ""),
                      str(row.get("away") or ""),
                      titan_results._kickoff(row),
                  )
                  candidates = [
                      Event(
                          str(item.get("id") or ""),
                          str(item.get("league") or ""),
                          str(item.get("home") or ""),
                          str(item.get("away") or ""),
                          item["kickoff"],
                          item,
                      )
                      for item in titan_rows
                      if item.get("id") and item.get("kickoff")
                  ]
                  matched = match_event(
                      target,
                      candidates,
                      team_key=canonical_team_key,
                      league_key=canonical_league_key,
                      allow_reversed=True,
                      require_qualifiers=True,
                  )
                  detail = (
                      client.result_detail(matched.event.id)
                      if matched.event else None
                  )
                  merged = titan_results.merge_titan_corners(
                      official,
                      {
                          "match_id": row.get("match_id"),
                          "league": row.get("league"),
                          "home": row.get("home"),
                          "away": row.get("away"),
                          "kickoff": row.get("kickoff"),
                      },
                      client=client,
                      rows=titan_rows,
                  )
                  print({
                      "match_id": row.get("match_id"),
                      "home": row.get("home"), "away": row.get("away"),
                      "match_reason": matched.reason,
                      "match_score": matched.score,
                      "titan_id": matched.event.id if matched.event else None,
                      "titan_row": matched.event.extra if matched.event else None,
                      "detail": detail,
                      "merged": merged,
                  })
              except Exception as exc:
                  print({
                      "match_id": row.get("match_id"),
                      "home": row.get("home"), "away": row.get("away"),
                      "error": type(exc).__name__,
                      "message": str(exc),
                  })
          PY

          echo "=== HKJC to PinnAPI matching diagnostics ==="
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -u - <<'PY'
          from datetime import datetime, timezone

          from system import hkjc_feed as H
          from system import sharp as S

          matches = [row for row in H.fetch_matches() if row.get("status") == "PREEVENT"]
          fixtures = S.list_fixtures()
          now = datetime.now(timezone.utc)
          failures = 0
          for match in matches:
              kickoff = H.parse_kickoff(match)
              if kickoff is None:
                  continue
              mins = (kickoff - now).total_seconds() / 60
              if not (0 < mins <= 720):
                  continue
              found, score = S.match_fixture(match, fixtures, kickoff)
              if found:
                  continue
              failures += 1
              home = match.get("homeTeam", {}).get("name_en") or ""
              away = match.get("awayTeam", {}).get("name_en") or ""
              candidates = []
              for fixture in fixtures:
                  try:
                      start = datetime.fromisoformat(
                          fixture["start_date"].replace("Z", "+00:00")
                      )
                  except Exception:
                      continue
                  delta = abs((start - kickoff).total_seconds()) / 60
                  if delta > 90:
                      continue
                  fh = fixture.get("home_team_display") or ""
                  fa = fixture.get("away_team_display") or ""
                  direct = (S._sim(home, fh) + S._sim(away, fa)) / 2
                  reverse = (S._sim(home, fa) + S._sim(away, fh)) / 2
                  candidates.append({
                      "fixture_id": fixture.get("id"),
                      "home": fh,
                      "away": fa,
                      "kickoff": fixture.get("start_date"),
                      "delta_min": round(delta, 1),
                      "direct": round(direct, 3),
                      "reverse": round(reverse, 3),
                      "hk_qual": sorted(S.hk_qual(match)),
                      "pin_qual": sorted(S.fx_qual(fixture)),
                  })
              candidates.sort(key=lambda row: (-row["direct"], row["delta_min"]))
              print({
                  "match_id": match.get("id"),
                  "home": home,
                  "away": away,
                  "kickoff": kickoff.isoformat(),
                  "mins_to_ko": round(mins, 1),
                  "best_score": round(score, 3),
                  "candidates": candidates[:5],
              })
          print({"eligible_hkjc": len(matches), "unmatched_within_12h": failures})
          PY

          echo "=== Crown dashboard fixtures around now ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = json.loads(Path("/var/www/crown/data.json").read_text())
          rows = data.get("matches") or data.get("predictions") or []
          now = datetime.now(timezone.utc)

          def parse(value):
              text = str(value or "").strip().replace("Z", "+00:00")
              if not text:
                  return None
              try:
                  result = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if result.tzinfo is None:
                  result = result.replace(tzinfo=timezone(timedelta(hours=8)))
              return result.astimezone(timezone.utc)

          for row in rows:
              kickoff_raw = (
                  row.get("kickoff_utc")
                  or row.get("kickoff_hkt")
                  or row.get("kickoff")
                  or row.get("start_time")
              )
              kickoff = parse(kickoff_raw)
              if kickoff is None or not (-timedelta(minutes=15) <= kickoff - now <= timedelta(minutes=20)):
                  continue
              print({
                  "match_id": row.get("match_id") or row.get("id"),
                  "home": row.get("home"),
                  "away": row.get("away"),
                  "kickoff": kickoff_raw,
                  "minutes": round((kickoff - now).total_seconds() / 60, 1),
                  "stage": row.get("stage"),
                  "status": row.get("status"),
                  "stages": [
                      {
                          "stage": item.get("stage"),
                          "ts": item.get("ts"),
                          "can_bet": item.get("can_bet"),
                          "no_bet_reason": item.get("no_bet_reason"),
                      }
                      for item in (row.get("stages") or [])
                  ],
              })
          PY

          echo "=== Crown unresolved prediction-result matching ==="
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -u - <<'PY'
          from crown.common import read_json
          from crown.config import settings
          from crown.matching import (
              Event, canonical_league_key, canonical_team_key, match_event,
          )
          from crown.prediction_history import _target
          from crown.titan import TitanClient

          config = settings()
          history = read_json(config.state_dir / "prediction_history.json", {})
          rows = history.get("rows") or []
          titan_rows = TitanClient(config).results()
          titan_by_id = {str(row.get("id")): row for row in titan_rows}
          for row in rows:
              grades = row.get("market_grades") or []
              has_chl = any(
                  prediction.get("code") == "CHL"
                  for prediction in (row.get("market_predictions") or [])
                  if isinstance(prediction, dict)
              )
              corner_done = any(
                  grade.get("code") == "CHL" and grade.get("grade_status") == "GRADED"
                  for grade in grades if isinstance(grade, dict)
              )
              if not has_chl or corner_done:
                  continue
              titan_id = str(row.get("titan_match_id") or row.get("match_id") or "")
              titan = titan_by_id.get(titan_id)
              target = _target(row)
              match = None
              if titan and target:
                  candidate = Event(
                      str(titan["id"]), str(titan.get("league") or ""),
                      str(titan.get("home") or ""), str(titan.get("away") or ""),
                      titan["kickoff"],
                  )
                  match = match_event(
                      target, [candidate],
                      team_key=canonical_team_key,
                      league_key=canonical_league_key,
                      allow_reversed=False,
                      require_qualifiers=True,
                  )
              nearby = [
                  {
                      "id": item.get("id"), "league": item.get("league"),
                      "home": item.get("home"), "away": item.get("away"),
                      "kickoff": item.get("kickoff").isoformat(),
                      "score": [item.get("home_score"), item.get("away_score")],
                  }
                  for item in titan_rows
                  if target and abs((item["kickoff"] - target.kickoff).total_seconds()) <= 15 * 60
              ][:10]
              print({
                  "match_id": row.get("match_id"),
                  "hkjc_match_id": row.get("hkjc_match_id"),
                  "titan_match_id": row.get("titan_match_id"),
                  "home": row.get("home"), "away": row.get("away"),
                  "league": row.get("league"), "kickoff": row.get("kickoff"),
                  "result_status": row.get("result_status"),
                  "result_missing_reason": row.get("result_missing_reason"),
                  "direct_titan_row": bool(titan),
                  "direct_match_reason": None if match and match.event else (
                      match.reason if match else "no_direct_titan_row"
                  ),
                  "nearby_titan": nearby,
              })
          PY
          REMOTE
