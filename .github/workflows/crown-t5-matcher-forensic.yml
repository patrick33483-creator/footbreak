name: Crown T-5 matcher forensic (read only)

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Inclusive HKT ISO-8601 deployment boundary'
        required: true
        default: '2026-08-22T01:01:00+08:00'
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Read persisted Crown T-5 matcher evidence only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env SINCE='$SINCE' bash -s" <<'REMOTE' > crown-t5-matcher-forensic.json
          set -euo pipefail
          set -a
          [ ! -r /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -r /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            /opt/footbreak/deploy/audit-crown-t5-matcher.py --since "$SINCE"
          REMOTE
          python3 -m json.tool crown-t5-matcher-forensic.json >/dev/null

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-t5-matcher-forensic-${{ github.run_id }}
          path: crown-t5-matcher-forensic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish forensic summary
        if: always() && hashFiles('crown-t5-matcher-forensic.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          report = json.loads(Path('crown-t5-matcher-forensic.json').read_text(encoding='utf-8'))
          summary = report.get('summary', {})
          registry = report.get('registry', {})
          body = json.dumps({
              'mode': report.get('mode'), 'since': report.get('since'),
              'registry': registry, 'summary': summary,
              'structural_matcher_rejections': report.get('structural_matcher_rejections', []),
          }, ensure_ascii=False, indent=2)
          payload = {
              'name': 'Crown T-5 matcher forensic evidence',
              'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed',
              'conclusion': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure',
              'output': {'title': 'Read-only Crown T-5 matcher forensic', 'summary': '```json\n' + body[:60000] + '\n```'},
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode('utf-8'),
              headers={'Accept': 'application/vnd.github+json', 'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"evidence_check_url={created['html_url']}")
          PY

  condition-four-replay:
    name: Crown condition 4 historical replay (read only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure strict SSH host identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Replay Crown condition 4 from persisted history only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 - \
              --condition-number 4 --since '$SINCE'" \
            < deploy/audit-crown-condition-replay.py \
            > crown-condition-4-replay.json
          python3 -m json.tool crown-condition-4-replay.json >/dev/null

      - name: Remove SSH material
        if: always()
        run: |
          shred -u ~/.ssh/id_ed25519 ~/.ssh/known_hosts 2>/dev/null || \
            rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Render sanitized replay report
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("crown-condition-4-replay.json").read_text())
          summary = report["summary"]
          lines = [
              "# 皇冠 Wilson 條件 #4 唯讀歷史重播",
              "",
              f"- 活躍邊界：{report['activation_boundary_hkt']}",
              f"- 歷史來源列數：{report['history_source_rows']}",
              f"- 條件形態符合：{summary['matching_fixture_count']}",
              f"- 達 Wilson 1.99 入注價：{summary['wilson_price_pass_fixture_count']}",
              f"- 低於入注價、應記 observation：{summary['low_price_observation_fixture_count']}",
              f"- 已有相應記錄：{summary['recorded_expected_fixture_count']}",
              f"- 缺少相應記錄：{summary['missing_expected_record_fixture_count']}",
              f"- 經歷史及 learning DB 仍未知賽果：{summary['unknown_result_fixture_count']}",
              "",
              "## 逐場",
          ]
          for row in report["matching_fixtures"]:
              lines.append(
                  f"- {row.get('kickoff_hkt')}｜{row.get('league') or ''}｜"
                  f"{row.get('home') or ''} 對 {row.get('away') or ''}｜"
                  f"線 {row.get('selected_line_path')}｜T-5 賠率 {row.get('t5_odds')}｜"
                  f"{'達入注價' if row.get('passes_wilson_price') else '低賠 observation'}｜"
                  f"{'已記錄' if not row.get('missing_expected_record') else '漏記候選'}｜"
                  f"{row.get('score') or row.get('result_status') or '未知賽果'}"
              )
          if not report["matching_fixtures"]:
              lines.append("- 活躍邊界後沒有符合場次。")
          Path("crown-condition-4-replay.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload condition replay
        uses: actions/upload-artifact@v4
        with:
          name: crown-condition-4-read-only-replay-${{ github.run_id }}
          path: |
            crown-condition-4-replay.json
            crown-condition-4-replay.md
          retention-days: 14
          if-no-files-found: error

      - name: Publish replay result as a check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          body = Path("crown-condition-4-replay.md").read_text()
          payload = {
              "name": "Crown condition 4 read-only replay",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success",
              "output": {
                  "title": "皇冠 Wilson 條件 #4 唯讀歷史重播",
                  "summary": body[:60000],
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode(),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"condition_replay_check_url={created['html_url']}")
          PY
