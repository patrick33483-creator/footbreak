name: Crown T-5 matcher forensic (read only)

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Inclusive HKT ISO-8601 deployment boundary'
        required: true
        default: '2026-08-22T01:01:00+08:00'
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Read persisted Crown T-5 matcher evidence only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          # Stream the reviewed audit script from this read-only workflow
          # ref.  The imports remain the deployed production code; this
          # never installs or changes it.
          printf -v remote_command \
            "sudo env SINCE=%q bash -c 'set -a; [ ! -r /etc/footbreak.env ] || . /etc/footbreak.env; [ ! -r /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env; set +a; exec env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -'" \
            "$SINCE"
          cat deploy/audit-crown-t5-matcher.py | ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" > crown-t5-matcher-forensic.json
          python3 -m json.tool crown-t5-matcher-forensic.json >/dev/null

      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-t5-matcher-forensic-${{ github.run_id }}
          path: crown-t5-matcher-forensic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish forensic summary
        if: always() && hashFiles('crown-t5-matcher-forensic.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          report = json.loads(Path('crown-t5-matcher-forensic.json').read_text(encoding='utf-8'))
          summary = report.get('summary', {})
          registry = report.get('registry', {})
          # The full artifact retains internal fixture identifiers.  Publish
          # only the bounded immutable admission evidence requested for
          # operations: names, native signal fields, frozen axes and formal
          # lifecycle state.  No provider payload or raw fixture ID is emitted.
          records = []
          for row in report.get('records', []):
              if not isinstance(row, dict):
                  continue
              records.append({
                  'fixture_name': row.get('fixture_name'),
                  'kickoff': row.get('kickoff'),
                  'market': row.get('market'),
                  'native_first_pre_kickoff_t5': row.get('native_first_pre_kickoff_t5'),
                  'signal': row.get('signal'),
                  'signal_reason': row.get('signal_reason'),
                  'structural_registry_matches': row.get('structural_registry_matches'),
                  'no_match_reason': row.get('no_match_reason'),
                  'formal_observations': row.get('formal_observations'),
                  'admission': row.get('admission'),
              })
          body = json.dumps({
              'mode': report.get('mode'), 'since': report.get('since'),
              'registry': registry, 'summary': summary, 'records': records,
              'structural_matcher_rejections': report.get('structural_matcher_rejections', []),
          }, ensure_ascii=False, indent=2)
          payload = {
              'name': 'Crown T-5 matcher forensic evidence',
              'head_sha': os.environ['GITHUB_SHA'], 'status': 'completed',
              'conclusion': 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure',
              'output': {'title': 'Read-only Crown T-5 matcher forensic', 'summary': '```json\n' + body[:60000] + '\n```'},
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode('utf-8'),
              headers={'Accept': 'application/vnd.github+json', 'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}", 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"evidence_check_url={created['html_url']}")
          PY
