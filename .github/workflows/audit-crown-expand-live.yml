name: Audit Crown evidence expansion (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Inspect deployed Crown asset and evidence rows
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /bin/sh -s' <<'REMOTE'
          set -eu
          cd /opt/footbreak
          printf 'server_sha=%s\n' "$(git rev-parse HEAD)"
          printf 'asset_helper_count=%s\n' "$(grep -c 'function evidenceBatchDetails' /var/www/crown/app.js || true)"
          printf 'asset_toggle_count=%s\n' "$(grep -c 'evidence-batch-toggle-' /var/www/crown/app.js || true)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/var/www/crown/data.json").read_text(encoding="utf-8"))
          ranking = (
              payload.get("stats", {})
              .get("granular_conditions", {})
              .get("ranking", [])
          )
          print(f"ranking_count={len(ranking)}")
          with_detail = [
              item for item in ranking
              if isinstance(item.get("last_merged_evidence"), dict)
              and item["last_merged_evidence"].get("version")
          ]
          print(f"ranking_with_last_merged_evidence={len(with_detail)}")
          for item in ranking:
              number = item.get("condition_number")
              if number == 4 or item in with_detail:
                  detail = item.get("last_merged_evidence") or {}
                  rows = detail.get("rows")
                  print(json.dumps({
                      "condition_number": number,
                      "active_version": (item.get("active_evidence") or {}).get("version"),
                      "detail_version": detail.get("version"),
                      "complete": detail.get("complete"),
                      "expected_decided": detail.get("expected_decided"),
                      "expected_hits": detail.get("expected_hits"),
                      "rows_count": len(rows) if isinstance(rows, list) else None,
                  }, ensure_ascii=False, sort_keys=True))
          PY
          REMOTE
