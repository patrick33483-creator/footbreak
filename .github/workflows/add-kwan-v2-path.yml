name: 新增 kwan-v2 subpath
on:
  workflow_dispatch:
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload script and patch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp deploy/add-kwan-v2.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/add-kwan-v2.sh"
          scp deploy/patch-kwan-v2.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/patch-kwan-v2.py"
      - name: Run remote deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo cp /tmp/patch-kwan-v2.py /opt/footbreak/deploy/patch-kwan-v2.py && sudo chmod +x /tmp/add-kwan-v2.sh && sudo /tmp/add-kwan-v2.sh"
