name: 核對皇冠生產掃描

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 皇冠執行模式
        required: true
        default: tick
        type: choice
        options:
          - tick
          - sweep

jobs:
  verify:
    name: 掃描及安全摘要
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行皇冠掃描並核對計時器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CROWN_MODE: ${{ inputs.mode }}
        run: |
          set -o pipefail
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo CROWN_MODE='$CROWN_MODE' bash -s" \
            <<'REMOTE' 2>&1 | tee crown-verify.log
          set -euo pipefail
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          echo "=== Crown service state before check ==="
          systemctl show crown-tick.service \
            -p ActiveState -p SubState -p ExecMainStartTimestamp -p ExecMainPID
          echo "=== Crown verification: pause tick timer and wait for scan lock ==="
          systemctl stop crown-tick.timer
          trap 'systemctl start crown-tick.timer' EXIT
          systemctl stop crown-tick.service || true
          while ! flock -n /var/lock/footbreak-crown.lock -c true; do
            echo "$(date '+%F %T') waiting for Crown scan lock"
            sleep 15
          done
          echo "=== Crown production ${CROWN_MODE} ==="
          if [ "$CROWN_MODE" = "sweep" ]; then
            /opt/footbreak/deploy/crown-run.sh "$CROWN_MODE" &
            crown_pid=$!
            while kill -0 "$crown_pid" 2>/dev/null; do
              echo "$(date '+%F %T') Crown sweep is running"
              sleep 15
            done
            wait "$crown_pid"
          else
            /opt/footbreak/deploy/crown-run.sh "$CROWN_MODE"
          fi
          systemctl start crown-tick.timer
          trap - EXIT
          echo "=== Run bounded provider-free Crown history-shape repair ==="
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            -m crown.history_shape_repair --lock-timeout-seconds 30
          echo "=== Inspect normal result reconciliation service ==="
          systemctl show footbreak-result-reconcile.service --no-pager \
            -p ActiveState -p SubState -p Result -p ExecMainStatus \
            -p ExecMainStartTimestamp -p ExecMainExitTimestamp
          journalctl -u footbreak-result-reconcile.service -n 120 --no-pager \
            -o short-iso || true
          echo "=== Crown live HKJC mapping diagnostic ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          from collections import Counter
          from datetime import datetime

          from crown.common import HKT
          from crown.config import settings
          from crown.engine import _event_from_titan
          from crown.hkjc import event_from_match, fetch_matches
          from crown.matching import same_event_for_hkjc, same_identity_for_hkjc
          from crown.titan import TitanClient

          config = settings()
          now = datetime.now(HKT)
          titan_rows = TitanClient(config).fixtures()
          titan_events = [
              event for row in titan_rows
              if (event := _event_from_titan(row)).kickoff > now
          ]
          hkjc_events = [
              event for row in fetch_matches()
              if (event := event_from_match(row)) and event.kickoff > now
          ]
          linked = set()
          direct_linked = set()
          reversed_linked = set()
          reasons = Counter()
          for titan in titan_events:
              match = same_event_for_hkjc(titan, hkjc_events)
              if match.event:
                  linked.add(str(match.event.id))
                  direct_linked.add(str(match.event.id))
              else:
                  identity = same_identity_for_hkjc(titan, hkjc_events)
                  if identity.event:
                      linked.add(str(identity.event.id))
                      reversed_linked.add(str(identity.event.id))
                  else:
                      reasons[match.reason or "unknown"] += 1
          unmatched = [
              {
                  "id": event.id,
                  "home": event.home,
                  "away": event.away,
                  "kickoff": event.kickoff.isoformat(),
              }
              for event in hkjc_events
              if str(event.id) not in linked
          ]
          print({
              "titan": len(titan_rows),
              "titan_upcoming": len(titan_events),
              "hkjc_upcoming": len(hkjc_events),
              "direct_price_safe_hkjc_linked": len(direct_linked),
              "reversed_identity_only_hkjc_linked": len(reversed_linked),
              "total_identity_hkjc_linked": len(linked),
              "unmatched_hkjc_count": len(unmatched),
              "top_reasons": reasons.most_common(8),
              "unmatched_hkjc": unmatched,
          })
          PY
          echo "=== Crown dashboard summary ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = json.loads(Path("/var/www/crown/data.json").read_text())
          summary = data.get("summary") or {}
          print({
              "generated_at": data.get("generated_at"),
              "crown_matches": summary.get("crown_matches"),
              "hkjc_overlaps": summary.get("hkjc_overlaps"),
              "predicted": summary.get("predicted"),
              "actionable": summary.get("actionable"),
              "signal_data_missing": summary.get("signal_data_missing"),
          })
          hkt = timezone(timedelta(hours=8))
          now = datetime.now(hkt)
          recent = []
          for match in data.get("matches") or []:
              if not isinstance(match, dict):
                  continue
              raw_kickoff = match.get("kickoff_hkt") or match.get("kickoff")
              try:
                  kickoff = datetime.fromisoformat(str(raw_kickoff).replace("Z", "+00:00")).astimezone(hkt)
              except (TypeError, ValueError):
                  continue
              if now - timedelta(minutes=60) <= kickoff <= now + timedelta(minutes=60):
                  recent.append({
                      "home": match.get("home"),
                      "away": match.get("away"),
                      "kickoff_hkt": kickoff.isoformat(),
                      "stages": [
                          {"stage": row.get("stage"), "ts": row.get("ts")}
                          for row in (match.get("stages") or [])
                          if isinstance(row, dict)
                      ],
                  })
          print({"recent_public_cards": recent})
          PY
          echo "=== Result integrity verifier (read-only) ==="
          /opt/footbreak/.venv/bin/python3 deploy/verify-result-integrity.py || true
          echo "=== Crown private history shape detail (read-only) ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          from collections import Counter
          import importlib.util
          from pathlib import Path

          path = Path("deploy/verify-result-integrity.py")
          spec = importlib.util.spec_from_file_location("result_integrity", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          history_rows = module.rows(module.load(module.CROWN_HISTORY))
          keys = [
              (str(row.get("match_id") or ""), str(row.get("stage") or ""))
              for row in history_rows
          ]
          missing = [key for key in keys if not all(key)]
          duplicates = [
              {"key": key, "count": count}
              for key, count in Counter(keys).items()
              if count > 1
          ]
          actual = [module._sort_key(row) for row in history_rows]
          first_inversion = None
          for index in range(len(actual) - 1):
              if actual[index] < actual[index + 1]:
                  first_inversion = {
                      "index": index,
                      "left_key": keys[index],
                      "left_sort": actual[index],
                      "right_key": keys[index + 1],
                      "right_sort": actual[index + 1],
                  }
                  break
          print({
              "rows": len(history_rows),
              "missing": missing[:20],
              "duplicates": duplicates[:20],
              "first_inversion": first_inversion,
          })
          PY
          echo "=== Telegram configuration (presence only; no secrets) ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import os
          from pathlib import Path

          def present(value):
              return bool(str(value or "").strip())

          radar = {}
          radar_env = Path("/opt/odds-radar/.env")
          if radar_env.exists():
              for raw in radar_env.read_text(errors="ignore").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  radar[key.strip()] = value.strip().strip("'\"")

          radar_token = next((radar.get(k) for k in (
              "TELEGRAM_BOT_TOKEN", "TG_BOT_TOKEN", "BOT_TOKEN"
          ) if present(radar.get(k))), "")
          radar_chat = next((radar.get(k) for k in (
              "TELEGRAM_CHAT_ID", "TG_CHAT_ID", "CHAT_ID"
          ) if present(radar.get(k))), "")
          print({
              "footbreak": {
                  "token": present(os.getenv("TELEGRAM_BOT_TOKEN")),
                  "chat_id": present(os.getenv("TELEGRAM_CHAT_ID")),
                  "bet_only_code_path": True,
              },
              "crown": {
                  "enabled": str(os.getenv("CROWN_TELEGRAM_ENABLED", "")).lower() in {"1", "true", "yes", "on"},
                  "token": present(os.getenv("CROWN_TELEGRAM_BOT_TOKEN")),
                  "chat_id": present(os.getenv("CROWN_TELEGRAM_CHAT_ID")),
                  "bet_only_code_path": True,
              },
              "odds_radar": {
                  "env_file": radar_env.exists(),
                  "token": present(radar_token),
                  "chat_id": present(radar_chat),
              },
          })
          PY
          echo "=== Crown timers ==="
          systemctl is-active crown-tick.timer
          systemctl is-enabled crown-tick.timer
          systemctl is-active crown-sweep.timer
          systemctl is-enabled crown-sweep.timer
          systemctl list-timers crown-tick.timer crown-sweep.timer --no-pager
          REMOTE

      - name: 保存皇冠驗證日誌
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-verify-log-${{ github.run_id }}
          path: crown-verify.log
          if-no-files-found: warn
          retention-days: 7
