name: 核對皇冠生產掃描

on:
  workflow_dispatch:

jobs:
  verify:
    name: 掃描及安全摘要
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行皇冠掃描並核對計時器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          echo "=== Crown service state before check ==="
          systemctl show crown-tick.service \
            -p ActiveState -p SubState -p ExecMainStartTimestamp -p ExecMainPID
          echo "=== Crown production tick ==="
          /opt/footbreak/deploy/crown-run.sh tick
          echo "=== Crown live mapping diagnostic ==="
          /opt/footbreak/.venv/bin/python3 -m crown.diagnose_matching --limit 2000 > /tmp/crown-mapping.json
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path("/tmp/crown-mapping.json").read_text())
          fixtures = data.get("fixtures") or []
          coverage = data.get("hkjc_coverage") or []
          hkjc_ids = {
              str(row.get("bridge", {}).get("hkjc_id"))
              for row in fixtures
              if row.get("bridge", {}).get("hkjc_id")
          }
          full_ids = {
              str(row.get("bridge", {}).get("hkjc_id"))
              for row in fixtures
              if row.get("bridge", {}).get("hkjc_id")
              and row.get("bridge", {}).get("pinnapi_id")
          }
          reasons = Counter(
              str(row.get("bridge", {}).get("reason") or "matched")
              for row in fixtures
          )
          print({
              "titan": data.get("counts", {}).get("titan"),
              "hkjc_upcoming": len(coverage),
              "pinnapi": data.get("counts", {}).get("pinnapi"),
              "unique_hkjc_linked_to_titan": len(hkjc_ids),
              "unique_hkjc_full_bridge": len(full_ids),
              "top_reasons": reasons.most_common(8),
          })
          PY
          echo "=== Crown dashboard summary ==="
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/var/www/crown/data.json").read_text())
          summary = data.get("summary") or {}
          print({
              "generated_at": data.get("generated_at"),
              "crown_matches": summary.get("crown_matches"),
              "hkjc_overlaps": summary.get("hkjc_overlaps"),
              "predicted": summary.get("predicted"),
              "actionable": summary.get("actionable"),
              "signal_data_missing": summary.get("signal_data_missing"),
          })
          PY
          echo "=== Crown timers ==="
          systemctl is-active crown-tick.timer
          systemctl is-enabled crown-tick.timer
          systemctl is-active crown-sweep.timer
          systemctl is-enabled crown-sweep.timer
          systemctl list-timers crown-tick.timer crown-sweep.timer --no-pager
          REMOTE
