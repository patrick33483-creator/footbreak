name: Fix V3 matches.json perm

on:
  workflow_dispatch:
    inputs:
      confirmation: {description: "打 FIXPERM", required: true, type: string}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/fix-v3-perm.yml']

concurrency: {group: production-maintenance, cancel-in-progress: false}
permissions: {contents: read}

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: diagnose/crown-v2-pending-20260906}
      - env: {E: "${{ github.event_name }}", C: "${{ inputs.confirmation }}"}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "FIXPERM" ]; then exit 1; fi
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"
          SCP="scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519"

          # update merge script with chmod 644
          $SCP deploy/v3/merge_titan_v2.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/merge_titan_v2.py"
          $SSH 'sudo install -m 755 /tmp/merge_titan_v2.py /opt/footbreak/deploy/v3/merge_titan_v2.py'
          # fix existing file perm
          $SSH 'sudo chmod 644 /var/www/crownsystem-v3/matches.json'
          # verify
          $SSH 'sudo systemctl start crownsystem-v3-merge.service; sleep 2; ls -la /var/www/crownsystem-v3/matches.json'
          $SSH 'curl -sS -o /dev/null -w "matches.json=%{http_code}\n" -u radar:toberich http://127.0.0.1/crownsystem-v3/matches.json'
          $SSH 'curl -sS -u radar:toberich http://127.0.0.1/crownsystem-v3/matches.json | head -c 800'
