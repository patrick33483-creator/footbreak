name: deploy v2 and radar
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp deploy/nginx-unified-dashboard.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/nginx-unified-dashboard.conf"
          scp deploy/deploy-v2-and-radar.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/deploy-v2-and-radar.sh"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo chmod +x /tmp/deploy-v2-and-radar.sh && sudo /tmp/deploy-v2-and-radar.sh"
