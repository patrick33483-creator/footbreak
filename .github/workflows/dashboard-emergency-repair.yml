name: 緊急修復 Dashboard 網站

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair nginx and dashboard services
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 即時修復並驗證
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # A damaged global Bash startup-file mode can block stdin-driven SSH
          # maintenance before the repair body starts. A direct command still
          # executes, so restore the standard root-owned readable mode first.
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo chown root:root /etc /etc/nginx /etc/bash.bashrc && sudo chmod 0755 /etc /etc/nginx && sudo chmod 0644 /etc/bash.bashrc'

          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /bin/sh -s' <<'REMOTE'
          set -eu

          chown root:root /etc /etc/nginx
          chmod 0755 /etc /etc/nginx
          footbreak_auth=/etc/nginx/.htpasswd-footbreak
          crown_auth=/etc/nginx/.htpasswd-crown
          repair_auth_identity() {
            auth_file="$1"
            expected_user="$2"
            password_backup="$3"
            if [ -s "$auth_file" ] && grep -q "^${expected_user}:" "$auth_file"; then
              return 0
            fi
            if [ ! -s "$password_backup" ]; then
              echo "$expected_user dashboard auth cannot be safely restored" >&2
              return 1
            fi
            IFS= read -r dashboard_password < "$password_backup"
            [ -n "$dashboard_password" ]
            htpasswd -bc "$auth_file" "$expected_user" "$dashboard_password" >/dev/null
            unset dashboard_password
          }
          repair_auth_identity "$footbreak_auth" footbreak /root/footbreak-dashboard-password.txt
          repair_auth_identity "$crown_auth" crown /root/crown-dashboard-password.txt

          for auth_file in /etc/nginx/.htpasswd-footbreak /etc/nginx/.htpasswd-crown; do
            chown root:www-data "$auth_file"
            chmod 0640 "$auth_file"
            runuser -u www-data -- test -r "$auth_file"
          done

          for root in /var/www/footbreak /var/www/crown; do
            [ -d "$root" ]
            chown -R root:www-data "$root"
            find "$root" -type d -exec chmod 0755 {} +
            find "$root" -type f -exec chmod 0644 {} +
          done

          for service in footbreak-dashboard-api.service crown-dashboard-api.service; do
            systemctl is-active --quiet "$service" || systemctl restart "$service"
          done

          nginx -t
          systemctl reload nginx || systemctl restart nginx

          for dashboard in footbreak:8081 crown:8082; do
            name="${dashboard%%:*}"
            port="${dashboard##*:}"
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 5 \
              "http://127.0.0.1:${port}/" || true)"
            if [ "$status" != 401 ]; then
              echo "$name entrypoint failed with HTTP ${status:-unreachable}" >&2
              exit 1
            fi
            echo "$name entrypoint healthy"
          done

          validate_dashboard_json() {
            dashboard_user="$1"
            dashboard_port="$2"
            password_file="$3"
            expected_schema="$4"
            IFS= read -r dashboard_password < "$password_file"
            curl --silent --show-error --fail --max-time 8 \
              --user "${dashboard_user}:${dashboard_password}" \
              "http://127.0.0.1:${dashboard_port}/data.json?health=$(date +%s)" \
              | python3 -c 'import json,sys; p=json.load(sys.stdin); c=sys.argv[1]; assert (c=="crown-dashboard-v2" and p.get("schema_version")==c) or (c=="footbreak-dashboard" and isinstance(p.get("matches"),list) and isinstance(p.get("ledger"),dict) and bool(p.get("generated_at")))' "$expected_schema" \
              >/dev/null
            unset dashboard_password
          }

          if ! validate_dashboard_json \
              footbreak 8081 /root/footbreak-dashboard-password.txt footbreak-dashboard; then
            /opt/footbreak/.venv/bin/python3 -m system.gen_app_data \
              --out /var/www/footbreak/data.json
            chown root:www-data /var/www/footbreak/data.json
            chmod 0644 /var/www/footbreak/data.json
          fi
          if ! validate_dashboard_json \
              crown 8082 /root/crown-dashboard-password.txt crown-dashboard-v2; then
            /opt/footbreak/.venv/bin/python3 -m crown.dashboard_data \
              --out /var/www/crown/data.json
            chown root:www-data /var/www/crown/data.json
            chmod 0644 /var/www/crown/data.json
          fi
          validate_dashboard_json \
            footbreak 8081 /root/footbreak-dashboard-password.txt footbreak-dashboard
          validate_dashboard_json \
            crown 8082 /root/crown-dashboard-password.txt crown-dashboard-v2
          REMOTE
