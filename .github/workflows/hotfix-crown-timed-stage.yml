name: 皇冠時點收集緊急熱修

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只更新 Crown 收集器並即時補跑
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/footbreak
          export GIT_SSH_COMMAND="ssh -i /home/radar/.ssh/footbreak_github -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/radar/.ssh/known_hosts -o ConnectTimeout=10 -o Hostname=ssh.github.com -p 443 -o HostKeyAlias=github.com"
          git fetch --quiet origin main
          git show origin/main:crown/engine.py > /tmp/crown-engine.py
          /opt/footbreak/.venv/bin/python3 -m py_compile /tmp/crown-engine.py
          install -m 0644 /tmp/crown-engine.py /opt/footbreak/crown/engine.py
          rm -f /tmp/crown-engine.py

          install -d -m 0755 /etc/systemd/system/crown-tick.service.d
          cat > /etc/systemd/system/crown-tick.service.d/timed-stage-budget.conf <<'EOF'
          [Service]
          Environment=CROWN_TICK_PASS_DEADLINE_SECONDS=50
          Environment=CROWN_TIMED_STAGE_DIRECT_MAX_SECONDS=20
          EOF
          systemctl daemon-reload
          systemctl reset-failed crown-tick.service >/dev/null 2>&1 || true
          timeout 150s systemctl start crown-tick.service || true
          systemctl enable --now crown-tick.timer >/dev/null 2>&1
          systemctl show crown-tick.service --no-pager \
            -p ActiveState -p SubState -p Result -p ExecMainStatus \
            -p ExecMainStartTimestamp -p ExecMainExitTimestamp
          grep -n 'CROWN_TIMED_STAGE_DIRECT_MAX_SECONDS' \
            /opt/footbreak/crown/engine.py
          systemctl show crown-tick.service -p Environment
          REMOTE
