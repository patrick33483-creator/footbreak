name: find dashboard self-heal
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/find-self-heal.yml']
concurrency: {group: production-maintenance-4, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          echo "=== footbreak-dashboard-self-heal.service ==="
          sudo -n systemctl cat footbreak-dashboard-self-heal.service 2>&1
          echo ""
          echo "=== footbreak-dashboard-self-heal.timer ==="
          sudo -n systemctl cat footbreak-dashboard-self-heal.timer 2>&1
          echo ""
          echo "=== dashboard-emergency-repair (any script?) ==="
          sudo -n ls /opt/footbreak/deploy/ | grep -i -E "self.heal|dashboard|repair" | head
          echo ""
          echo "=== crownsystem-v3-merge.service (fully) ==="
          sudo -n systemctl cat crownsystem-v3-merge.service 2>&1
          echo ""
          echo "=== other timers that ExecStart nginx or sites-available ==="
          for u in $(sudo -n systemctl list-unit-files --type=service | awk '{print $1}' | grep -iE "dashboard|nginx|deploy|heal|repair|install"); do
            echo "-- $u --"
            sudo -n systemctl cat "$u" 2>&1 | grep -iE "ExecStart|nginx|sites-avail" | head
          done
          EOF
