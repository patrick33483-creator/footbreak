name: 診斷皇冠階段排程

on:
  workflow_dispatch:
    inputs:
      future_hours:
        description: Future fixture window (hours)
        required: true
        default: "12"
        type: choice
        options: ["6", "12", "24"]
      current_grace_minutes:
        description: Include fixtures started within this many minutes
        required: true
        default: "30"
        type: choice
        options: ["15", "30", "60"]
      fixture_limit:
        description: Maximum redacted fixture rows
        required: true
        default: "50"
        type: choice
        options: ["25", "50", "100"]
      restart_t5_worker:
        description: Stop a stale Crown tick and start a fresh T-5 pass
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only Crown stage diagnosis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀取得皇冠階段及計時器摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          FUTURE_HOURS: ${{ inputs.future_hours }}
          CURRENT_GRACE_MINUTES: ${{ inputs.current_grace_minutes }}
          FIXTURE_LIMIT: ${{ inputs.fixture_limit }}
        run: |
          set -euo pipefail
          case "$FUTURE_HOURS" in 6|12|24) ;; *) exit 2;; esac
          case "$CURRENT_GRACE_MINUTES" in 15|30|60) ;; *) exit 2;; esac
          case "$FIXTURE_LIMIT" in 25|50|100) ;; *) exit 2;; esac

          echo "=== read-only Crown scheduler status (allowlisted fields) ==="
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl show crown-tick.timer crown-sweep.timer crown-tick.service crown-sweep.service --no-pager -p Id -p LoadState -p UnitFileState -p ActiveState -p SubState -p Result -p ExecMainStatus -p LastTriggerUSec -p NextElapseUSecRealtime 2>/dev/null || true'

          # Inputs are choice-constrained above and shell-quoted here.  The
          # streamed script reads only local Crown state; it does not source
          # environment files or contact a provider.
          printf -v remote_command \
            'sudo env CROWN_STAGE_FUTURE_HOURS=%q CROWN_STAGE_CURRENT_GRACE_MINUTES=%q CROWN_STAGE_FIXTURE_LIMIT=%q PYTHONPATH=%q /opt/footbreak/.venv/bin/python3 -' \
            "$FUTURE_HOURS" "$CURRENT_GRACE_MINUTES" "$FIXTURE_LIMIT" "/opt/footbreak"
          echo "=== bounded redacted Crown fixture-stage report ==="
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" \
            < deploy/audit-crown-stage-state.py

      - name: 只讀取得 HKJC identity reconciliation 摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl show crown-first-look-reconcile.timer crown-first-look-reconcile.service --no-pager -p Id -p LoadState -p UnitFileState -p ActiveState -p SubState -p Result -p ExecMainStatus -p LastTriggerUSec -p NextElapseUSecRealtime 2>/dev/null || true'
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' <<'PY'
          import json
          from pathlib import Path

          root = Path("/var/lib/footbreak/crown")

          def read_json(name, default):
              try:
                  return json.loads((root / name).read_text(encoding="utf-8"))
              except Exception:
                  return default

          ledger = read_json("ledger.json", {})
          predictions = read_json("predictions.json", [])
          health = read_json("hkjc-identity-reconciliation-health.json", {})
          watch = ledger.get("watch", {}) if isinstance(ledger, dict) else {}
          watch_rows = [row for row in watch.values() if isinstance(row, dict)]
          card_rows = [row for row in predictions if isinstance(row, dict)]
          print(json.dumps({
              "read_only": True,
              "provider_requests": False,
              "identity_health": health,
              "ledger_watch_total": len(watch_rows),
              "ledger_hkjc_identity_count": sum(
                  bool(str(row.get("hkjc_match_id") or "").strip())
                  for row in watch_rows
              ),
              "prediction_total": len(card_rows),
              "prediction_hkjc_identity_count": sum(
                  bool(str(row.get("hkjc_match_id") or "").strip())
                  for row in card_rows
              ),
          }, ensure_ascii=False, sort_keys=True))
          PY
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo journalctl -u crown-first-look-reconcile.service --since "2026-08-24 21:55:00" --no-pager -o cat | tail -n 80'

      - name: 純讀取診斷 HKJC board 與 strict matcher
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env FOOTBREAK_REMOTE_TIMEOUT_SECONDS=8 PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' <<'PY'
          import json
          import time
          from collections import Counter
          from datetime import datetime

          from crown.common import HKT, parse_time
          from crown.config import settings
          from crown.hkjc import event_from_match, fetch_matches
          from crown.matching import (
              KICKOFF_TOLERANCE_SECONDS,
              Event,
              _score,
              canonical_league_key,
              canonical_team_key,
              qualifiers,
              same_event_for_hkjc,
          )
          from crown.state import load_ledger, load_predictions

          started = time.monotonic()
          rows = fetch_matches()
          elapsed = round(time.monotonic() - started, 3)
          events = [event for row in rows if (event := event_from_match(row)) is not None]
          config = settings()
          ledger = load_ledger(config)
          predictions = load_predictions(config)
          watches = ledger.get("watch", {}) if isinstance(ledger, dict) else {}
          now = datetime.now(HKT)
          reasons = Counter()
          low_similarity_examples = []
          eligible = matched = 0
          for card in predictions:
              if not isinstance(card, dict):
                  continue
              match_id = str(card.get("match_id") or card.get("titan_match_id") or "").strip()
              watch = watches.get(match_id)
              if not match_id or not isinstance(watch, dict):
                  continue
              if card.get("hkjc_match_id") or watch.get("hkjc_match_id"):
                  continue
              kickoff = parse_time(watch.get("kickoff_hkt") or watch.get("kickoff"))
              if kickoff is None or kickoff <= now:
                  continue
              eligible += 1
              result = same_event_for_hkjc(Event(
                  match_id,
                  str(watch.get("league") or ""),
                  str(watch.get("home") or ""),
                  str(watch.get("away") or ""),
                  kickoff,
                  None,
              ), events)
              if result.event is not None and not result.reversed:
                  matched += 1
              else:
                  reasons[str(result.reason or "unmatched")] += 1
                  if result.reason == "team_name_similarity_below_floor":
                      candidates = []
                      for candidate in events:
                          if abs((candidate.kickoff - kickoff).total_seconds()) > KICKOFF_TOLERANCE_SECONDS:
                              continue
                          if qualifiers(Event(
                              match_id,
                              str(watch.get("league") or ""),
                              str(watch.get("home") or ""),
                              str(watch.get("away") or ""),
                              kickoff,
                              None,
                          )) != qualifiers(candidate):
                              continue
                          score, names, league = _score(
                              Event(
                                  match_id,
                                  str(watch.get("league") or ""),
                                  str(watch.get("home") or ""),
                                  str(watch.get("away") or ""),
                                  kickoff,
                                  None,
                              ),
                              candidate,
                              False,
                              canonical_team_key,
                              canonical_league_key,
                              True,
                          )
                          candidates.append((score, names, league, candidate))
                      candidates.sort(key=lambda item: item[0], reverse=True)
                      if candidates:
                          score, names, league, candidate = candidates[0]
                          low_similarity_examples.append({
                              "target": {
                                  "league": str(watch.get("league") or ""),
                                  "home": str(watch.get("home") or ""),
                                  "away": str(watch.get("away") or ""),
                                  "kickoff": kickoff.isoformat(),
                              },
                              "best_hkjc": {
                                  "league": candidate.league,
                                  "home": candidate.home,
                                  "away": candidate.away,
                                  "kickoff": candidate.kickoff.isoformat(),
                                  "official_team_ids_present": bool(
                                      isinstance(candidate.extra, dict)
                                      and candidate.extra.get("home_team_id")
                                      and candidate.extra.get("away_team_id")
                                  ),
                              },
                              "combined_score": round(score, 3),
                              "minimum_team_score": round(names, 3),
                              "league_score": round(league, 3),
                          })
          print(json.dumps({
              "read_only": True,
              "state_writes": False,
              "elapsed_seconds": elapsed,
              "hkjc_board_rows": len(rows),
              "hkjc_valid_events": len(events),
              "eligible_unresolved_predictions": eligible,
              "strict_matches": matched,
              "rejection_reasons": dict(reasons),
              "low_similarity_examples": low_similarity_examples[:10],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: 明確要求後重啟皇冠 T-5 worker
        if: ${{ inputs.restart_t5_worker == 'yes' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl stop crown-tick.service
             sudo systemctl reset-failed crown-tick.service
             sudo systemctl start --no-block crown-tick.service
             sudo systemctl show crown-tick.service --no-pager \
               -p Id -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus'
