name: Spy crown-radar final
on:
  workflow_dispatch: {}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/spy-cr-v2.yml']
concurrency: {group: production-maintenance-21, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: diagnose/crown-v2-pending-20260906}
      - env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H"

          echo "=== nginx crown-radar location block (full context) ==="
          $SSH "sudo -n grep -B1 -A15 'crown-radar' /etc/nginx/sites-available/unified-dashboard"
          echo ""

          echo "=== curl directly to node app port 5002 (bypass nginx) ==="
          for ep in api/status api/opportunities api/research api/ou-signals api/matches-crown; do
            printf "  5002/$ep = "
            $SSH "curl -s -o /dev/null -w '%{http_code} ' http://127.0.0.1:5002/$ep && curl -s http://127.0.0.1:5002/$ep | head -c 80"
            echo ""
          done
          echo ""

          echo "=== match counts by field presence ==="
          $SSH "curl -s -u radar:toberich http://127.0.0.1/crown-radar/api/matches-crown -o /tmp/mc.json && python3 << 'PYEOF'
import json
d = json.load(open('/tmp/mc.json'))
items = d if isinstance(d, list) else d.get('matches') or []
print(f'total: {len(items)}')
with_meds = [m for m in items if m.get('medians') and (isinstance(m['medians'], dict) and any(m['medians'].values()))]
with_subs = [m for m in items if m.get('sublines') and (isinstance(m['sublines'], dict) and any(m['sublines'].values()))]
print(f'with medians (Pinnacle): {len(with_meds)}')
print(f'with sublines: {len(with_subs)}')
if with_meds:
    m = with_meds[0]
    print(f'\\nSample match WITH medians: {m[\"home\"]} v {m[\"away\"]}')
    print(json.dumps(m, ensure_ascii=False, indent=2)[:2500])
PYEOF"
