name: V3 diag source
on:
  workflow_dispatch:
    inputs:
      confirm: {description: 'CONFIRM', required: true}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/v3-diag-source.yml']

concurrency: {group: production-maintenance, cancel-in-progress: false}

jobs:
  diag:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - name: Guard
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - name: SSH
        env:
          SSHKEY: ${{ secrets.DEPLOY_SSH_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          $SSH bash <<'EOF'
          set +e
          echo "=== 1. V3 systemd services + processes ==="
          systemctl list-units --all --no-pager 2>/dev/null | grep -iE "footbreak|v3|crown|predict" | head -20
          echo ""
          ps auxf | grep -iE "python|node" | grep -iE "footbreak|v3|predict|crown" | grep -v grep | head -20
          
          echo ""
          echo "=== 2. Repo layout /opt/footbreak (top-level) ==="
          ls -la /opt/footbreak/ 2>/dev/null | head -30
          
          echo ""
          echo "=== 3. Files referencing 'V3' or 'crown-radar' or DATA_MISSING ==="
          grep -rlE "DATA_MISSING|crown-radar|matches-crown" /opt/footbreak/ 2>/dev/null | grep -vE "\.pyc|__pycache__|node_modules|\.git/" | head -30
          
          echo ""
          echo "=== 4. Any web UI serving V3 (port 5xxx / 8xxx) ==="
          ss -tlnp 2>/dev/null | grep -E "LISTEN" | head -20
          
          echo ""
          echo "=== 5. Files referencing titan007 in /opt/footbreak ==="
          grep -rlE "titan007|vip\.titan|AsianOdds" /opt/footbreak/ 2>/dev/null | grep -vE "\.pyc|__pycache__|node_modules|\.git/" | head -20
          
          echo ""
          echo "=== 6. V3 initial/T30/T5 fetch code ==="
          grep -rlE "initial.*T30|T-30|T-5|three_stage|stage_1|stage_2" /opt/footbreak/ 2>/dev/null | grep -vE "\.pyc|__pycache__|\.git/" | head -10
          
          echo ""
          echo "=== 7. Recent v3 log ==="
          journalctl -u 'footbreak*' -n 100 --no-pager 2>/dev/null | tail -50
          EOF
