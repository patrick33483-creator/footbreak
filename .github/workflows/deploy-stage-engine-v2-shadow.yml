name: 部署 stage-engine-v2 shadow 模式

# Shadow 部署：v2 記錄所有 stage 但唔發 Telegram
# 例外：3個T-5細分條件(S-HIL-T5-OVER-185 / A-HIL-OPEN-T5-OVER-180 /
#       A-HDC-HHH-SAME-LINE)透過 STAGE_V2_CONDITION_ALERT_ENABLED=1
#       實際發送Telegram(沿用/etc/footbreak.env已有嘅bot/channel,
#       即V1皇冠通知同一個)。逐stage原始預測同第4個開賽前條件維持shadow。
# 舊 crown-tick 唔動、舊 dashboard 唔動
# 只裝: /opt/footbreak/stage_engine_v2/  +  /var/www/stage_engine_v2/dashboard/
#       + systemd timers: tick（30s）及 fast results（2min）

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要部署嘅 branch（預設 stage-engine-v2）'
        required: true
        default: 'stage-engine-v2'
      enable_timer:
        description: '部署後啟動 timer（true）定只裝唔啟動（false）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      diagnose_only:
        description: '只讀取 production 快速賽果及 TG 診斷（true）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  shadow-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 打包 stage_engine_v2 tarball
        if: inputs.diagnose_only != 'true'
        run: |
          tar czf /tmp/stage_engine_v2.tgz \
            stage_engine_v2/ \
            deploy/systemd/stage-engine-v2-fast-results.service \
            deploy/systemd/stage-engine-v2-fast-results.timer \
            design/stage-engine-v2-thresholds.md
          ls -lh /tmp/stage_engine_v2.tgz

      - name: 上傳到 droplet
        if: inputs.diagnose_only != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp /tmp/stage_engine_v2.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/stage_engine_v2.tgz"

      - name: 遠端部署（不 touch 舊 pipeline）
        if: inputs.diagnose_only != 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ENABLE_TIMER: ${{ inputs.enable_timer }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" ENABLE_TIMER="$ENABLE_TIMER" 'sudo -E bash -s' <<'REMOTE'
          set -euo pipefail
          echo "===== BEGIN shadow deploy $(date -u +%FT%TZ) ====="

          # 1. 備份現有 stage_engine_v2 目錄（如有）
          if [ -d /opt/footbreak/stage_engine_v2 ]; then
            BACKUP=/opt/footbreak/backup-stage-engine-v2-$(date +%Y%m%d-%H%M%S)
            cp -a /opt/footbreak/stage_engine_v2 "$BACKUP"
            echo "backed up old to $BACKUP"
          fi

          # 2. 解壓新版本
          cd /opt/footbreak
          tar xzf /tmp/stage_engine_v2.tgz
          chown -R footbreak:footbreak /opt/footbreak/stage_engine_v2 2>/dev/null || true

          # 3. 建立資料 / 日誌目錄
          install -d -m 755 /var/lib/footbreak/stage_engine_v2
          install -d -m 755 /var/log/footbreak
          install -d -m 755 /var/www/stage_engine_v2
          # root 跑 tick，但 dashboard 目錄 www-data 充得讀
          chown -R www-data:www-data /var/www/stage_engine_v2 2>/dev/null || true

          # 4. 派前端（dashboard 目錄 → /var/www/stage_engine_v2/）
          install -m 644 /opt/footbreak/stage_engine_v2/dashboard/index.html \
                         /var/www/stage_engine_v2/index.html
          # 歷史頁 history.html（如果仱存在就派，向後兼容舊 branch）
          if [ -f /opt/footbreak/stage_engine_v2/dashboard/history.html ]; then
            install -m 644 /opt/footbreak/stage_engine_v2/dashboard/history.html \
                           /var/www/stage_engine_v2/history.html
            echo "history.html 已派"
          else
            echo "(舊 branch、無 history.html、跳過)"
          fi
          if [ -f /opt/footbreak/stage_engine_v2/dashboard/conditions.html ]; then
            install -m 644 /opt/footbreak/stage_engine_v2/dashboard/conditions.html \
                           /var/www/stage_engine_v2/conditions.html
            echo "conditions.html 已派"
          else
            echo "(舊 branch、無 conditions.html、跳過)"
          fi

          # 5. 派 systemd unit files
          cat > /etc/systemd/system/stage-engine-v2-tick.service <<'UNIT'
          [Unit]
          Description=Stage engine v2 tick (shadow)
          After=network.target

          [Service]
          Type=oneshot
          # 對齊舊 crown-tick.service：不指定 User=（舊 pipeline 也係 root 跑）
          Environment=STAGE_V2_TELEGRAM_ENABLED=0
          # 3個T-5細分條件通知獨立開關(唔影響上面逐stage原始預測嘅shadow設定)
          # 沿用 /etc/footbreak.env 已有嘅 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (V1皇冠同一個bot/channel)
          EnvironmentFile=-/etc/footbreak.env
          Environment=STAGE_V2_CONDITION_ALERT_ENABLED=1
          Environment=PYTHONPATH=/opt/footbreak
          WorkingDirectory=/opt/footbreak
          ExecStart=/opt/footbreak/.venv/bin/python3 -m stage_engine_v2 tick \
            --crown-data /var/www/crown/data.json \
            --ledger /var/lib/footbreak/stage_engine_v2/ledger.json \
            --dashboard /var/www/stage_engine_v2/data.json \
            --sent-log /var/log/footbreak/stage-v2-sent.jsonl \
            --condition-sent-log /var/lib/footbreak/stage_engine_v2/condition_telegram_sent.jsonl \
            --native-queue-dir /var/lib/footbreak/crown/native_stage_projection_queue \
            --window-hours 48
          StandardOutput=append:/var/log/footbreak/stage-v2-tick.log
          StandardError=append:/var/log/footbreak/stage-v2-tick.log
          # 防識止跑太久非 mask timer trigger
          TimeoutStartSec=25s
          UNIT

          cat > /etc/systemd/system/stage-engine-v2-tick.timer <<'UNIT'
          [Unit]
          Description=Trigger stage-engine-v2 tick every 30s

          [Timer]
          OnBootSec=30s
          OnUnitActiveSec=30s
          AccuracySec=5s
          Unit=stage-engine-v2-tick.service

          [Install]
          WantedBy=timers.target
          UNIT

          install -m 644 \
            /opt/footbreak/deploy/systemd/stage-engine-v2-fast-results.service \
            /etc/systemd/system/stage-engine-v2-fast-results.service
          install -m 644 \
            /opt/footbreak/deploy/systemd/stage-engine-v2-fast-results.timer \
            /etc/systemd/system/stage-engine-v2-fast-results.timer

          systemctl daemon-reload

          # 6. 驗證 Python module 可以 import（試跑不寫任何嘢）
          #    避開 sudo audit issue：直接用 root 跑 python check，因為 systemd unit 回程才係 footbreak user 跑
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -c \
            "import stage_engine_v2; from stage_engine_v2.cli import build_parser; build_parser().parse_args(['tick', '--help'])" \
            > /tmp/import_check.log 2>&1 || {
              echo "!!! import check FAILED"
              cat /tmp/import_check.log
              # 唔 fatal：unit files 已就位，可以手動重試
              echo "(unit files 已就位；timer 未啟；以下部署摘要供 debug)"
            }
          echo "import check step 完成"

          # 7. 按參數決定啟唔啟 timer
          if [ "$ENABLE_TIMER" = "true" ]; then
            # Stop any previous timed-out generation before validating the new
            # one. Start the timer only after a complete successful pass.
            systemctl stop stage-engine-v2-fast-results.timer || true
            systemctl stop --no-block stage-engine-v2-fast-results.service || true
            systemctl kill stage-engine-v2-fast-results.service || true
            systemctl reset-failed stage-engine-v2-fast-results.service || true
            systemctl enable --now stage-engine-v2-tick.timer
            systemctl enable stage-engine-v2-fast-results.timer
            # Two failed rollout attempts used the shared sender path while
            # testing settlement. Remove only their post-rollout shadow rows;
            # preserve all live sends and all pre-existing idempotency keys.
            python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/var/lib/footbreak/stage_engine_v2/condition_telegram_sent.jsonl")
          if path.exists():
              backup = path.with_name(path.name + ".pre-fast-results-cleanup")
              backup.write_bytes(path.read_bytes())
              kept = []
              for line in path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      kept.append(line)
                      continue
                  if (
                      row.get("mode") == "shadow"
                      and str(row.get("sent_at_utc") or "") >= "2026-09-03T02:58:00"
                  ):
                      continue
                  kept.append(line)
              path.write_text(
                  "".join(f"{line}\n" for line in kept),
                  encoding="utf-8",
              )
          PY
            if ! systemctl start stage-engine-v2-fast-results.service; then
              echo "!!! fast-result validation FAILED"
              systemctl status stage-engine-v2-fast-results.service --no-pager || true
              echo "--- fast-result application log ---"
              tail -n 160 /var/log/footbreak/stage-v2-fast-results.log || true
              journalctl -u stage-engine-v2-fast-results.service -n 120 --no-pager || true
              exit 1
            fi
            systemctl start stage-engine-v2-fast-results.timer
            echo "tick + fast-result timers ENABLED"
            systemctl status stage-engine-v2-tick.timer --no-pager | head -12
            systemctl status stage-engine-v2-fast-results.timer --no-pager | head -12
            systemctl is-active --quiet stage-engine-v2-fast-results.timer
            test -s /var/www/stage_engine_v2/data.json
          else
            echo "timer NOT enabled (enable_timer=$ENABLE_TIMER)"
            echo "手動起 timer 用: sudo systemctl enable --now stage-engine-v2-tick.timer"
          fi

          # 8. 顯示部署摘要
          echo "===== 部署摘要 ====="
          ls -la /opt/footbreak/stage_engine_v2/ | head -20
          echo "---"
          ls -la /var/www/stage_engine_v2/ 2>/dev/null || echo "(dashboard dir 空)"
          test -s /var/www/stage_engine_v2/conditions.html
          grep -q "皇冠系統V2 · 三階段細分" /var/www/stage_engine_v2/conditions.html
          if [ -s /var/www/stage_engine_v2/direction-path-conditions.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("/var/www/stage_engine_v2/direction-path-conditions.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("report") == "direction_path_conditions"
          assert payload.get("mode") == "shadow_only_no_bets_no_notifications"
          assert int(payload.get("schema_version") or 0) >= 2
          summary = payload.get("summary") or {}
          assert int(summary.get("historical") or 0) > 0
          assert "excluded_by_same_line_or_price_rule" in summary
          definitions = payload.get("definitions") or {}
          assert "三段主盤線位必須完全相同" in definitions.get("line_rule", "")
          assert "嚴格 >1.70" in definitions.get("accumulation", "")
          assert (payload.get("tracking") or {}).get("source") == "odds_radar_read_only"
          assert payload.get("conditions")
          print("direction-path JSON: OK")
          PY
          else
            echo "direction-path JSON 尚未生成，等 main worker 下一輪建立"
          fi
          echo "---"
          ls -la /var/lib/footbreak/stage_engine_v2/ 2>/dev/null || echo "(ledger dir 空)"
          echo "===== END shadow deploy $(date -u +%FT%TZ) ====="
          REMOTE

      - name: Production 快速賽果及 TG 診斷摘要
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          {
            echo '## Crown V2 fast-result production diagnostic'
            echo '```text'
            ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          echo "=== unit ==="
          systemctl show stage-engine-v2-fast-results.service \
            -p ActiveState -p SubState -p Result -p ExecMainStatus \
            -p ExecMainStartTimestamp -p ExecMainExitTimestamp
          echo "=== timer ==="
          systemctl is-enabled stage-engine-v2-fast-results.timer || true
          systemctl is-active stage-engine-v2-fast-results.timer || true
          systemctl list-timers stage-engine-v2-fast-results.timer --no-pager || true
          echo "=== application log ==="
          tail -n 120 /var/log/footbreak/stage-v2-fast-results.log || true
          echo "=== result cache / condition stats / delayed sends ==="
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          cache_path = Path("/var/lib/footbreak/stage_engine_v2/automatic_results.json")
          cache = json.loads(cache_path.read_text()) if cache_path.exists() else {}
          results = cache.get("results") if isinstance(cache, dict) else {}
          print("automatic_results_updated_at=", cache.get("updated_at_utc"))
          print("automatic_results_count=", len(results or {}))

          board_path = Path("/var/www/stage_engine_v2/data.json")
          board = json.loads(board_path.read_text()) if board_path.exists() else {}
          print("dashboard_generated_at_hkt=", board.get("generated_at_hkt"))
          for row in board.get("segmented_conditions") or []:
              if not isinstance(row, dict):
                  continue
              print(
                  "condition=",
                  row.get("id"),
                  "sample=", row.get("sample_size"),
                  "prospective=", row.get("prospective"),
              )

          sent_path = Path(
              "/var/lib/footbreak/stage_engine_v2/condition_telegram_sent.jsonl"
          )
          delayed = []
          if sent_path.exists():
              for line in sent_path.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  stamp = str(row.get("sent_at_utc") or "")
                  if "2026-09-03T02:5" in stamp or "2026-09-03T03:0" in stamp:
                      delayed.append(row)
          print("tg_rows_1050_to_1109_hkt=", len(delayed))
          print("tg_modes=", dict(Counter(str(x.get("mode")) for x in delayed)))
          for row in delayed[-30:]:
              print(
                  "tg_row",
                  row.get("sent_at_utc"),
                  row.get("mode"),
                  row.get("condition_id"),
                  row.get("match_id"),
                  row.get("kickoff_hkt"),
              )
          PY
          REMOTE
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          COMPACT="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          printf 'unit='
          systemctl show stage-engine-v2-fast-results.service \
            -p ActiveState -p SubState -p Result --value | paste -sd, -
          printf '; phase='
          grep 'stage-v2-settle:' /var/log/footbreak/stage-v2-fast-results.log \
            | tail -1 | tr '\n' ' '
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          sent = Path("/var/lib/footbreak/stage_engine_v2/condition_telegram_sent.jsonl")
          rows = []
          if sent.exists():
              for line in sent.read_text(encoding="utf-8").splitlines():
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  stamp = str(row.get("sent_at_utc") or "")
                  if "2026-09-03T02:5" in stamp or "2026-09-03T03:0" in stamp:
                      rows.append(row)
          print(f"; tg_rows={len(rows)}; tg_modes={dict(Counter(str(x.get('mode')) for x in rows))}")
          PY
          REMOTE
          )"
          echo "::warning title=Crown V2 production diagnostic::$COMPACT"
