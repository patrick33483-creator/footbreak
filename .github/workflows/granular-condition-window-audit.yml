name: 足破皇冠細緻條件逐場稽核（只讀）

on:
  workflow_dispatch:
    inputs:
      start_hkt:
        description: 開始時間（香港時間，包含）
        required: true
        default: "2026-08-26T11:59:00+08:00"
      end_hkt:
        description: 結束時間（香港時間，不包含）
        required: true
        default: "2026-08-27T11:59:00+08:00"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 在 production lock 下擷取 ledger 及唯讀賽果
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 audit-input
          capture_locked() {
            lock_path="$1"
            ledger_path="$2"
            output_path="$3"
            ssh -o BatchMode=yes -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo python3 - '$lock_path' '$ledger_path'" > "$output_path" <<'PY'
          import fcntl
          import os
          import signal
          import sys
          lock_path, ledger_path = sys.argv[1:3]
          signal.alarm(180)
          lock_fd = os.open(lock_path, os.O_RDWR | os.O_NOFOLLOW)
          try:
              fcntl.flock(lock_fd, fcntl.LOCK_EX)
              with open(ledger_path, "rb") as handle:
                  payload = handle.read(134_217_729)
              if len(payload) > 134_217_728:
                  raise RuntimeError("ledger exceeds 128 MiB capture bound")
          finally:
              fcntl.flock(lock_fd, fcntl.LOCK_UN)
              os.close(lock_fd)
          signal.alarm(0)
          sys.stdout.buffer.write(payload)
          PY
          }
          capture_locked /var/lock/footbreak.lock \
            /opt/footbreak/system/sim_ledger.json audit-input/footbreak-ledger.json
          capture_locked /var/lib/footbreak/crown/.state.lock \
            /var/lib/footbreak/crown/ledger.json audit-input/crown-ledger.json
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' \
            > audit-input/learning-results.json <<'PY'
          import json
          import sqlite3
          path = "file:/var/lib/footbreak/learning/predictions.sqlite?mode=ro"
          db = sqlite3.connect(path, uri=True)
          db.row_factory = sqlite3.Row
          rows = db.execute("""
              SELECT r.system, r.fixture_id, r.home_score, r.away_score,
                     r.home_corners, r.away_corners, r.terminal_status,
                     r.provenance_json, r.observed_at, r.recorded_at
                FROM results r
                JOIN (
                      SELECT system, fixture_id, MAX(result_attempt) AS result_attempt
                        FROM results
                       GROUP BY system, fixture_id
                     ) latest
                  ON latest.system=r.system
                 AND latest.fixture_id=r.fixture_id
                 AND latest.result_attempt=r.result_attempt
          """).fetchall()
          print(json.dumps([dict(row) for row in rows], ensure_ascii=False))
          db.close()
          PY
          python3 -m json.tool audit-input/footbreak-ledger.json >/dev/null
          python3 -m json.tool audit-input/crown-ledger.json >/dev/null
          python3 -m json.tool audit-input/learning-results.json >/dev/null

      - name: 移除 SSH 私鑰
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: 離線產生逐場報告
        env:
          START_HKT: ${{ inputs.start_hkt }}
          END_HKT: ${{ inputs.end_hkt }}
        run: |
          set -euo pipefail
          python3 deploy/audit-granular-condition-window.py \
            --start "$START_HKT" --end "$END_HKT" \
            --footbreak-ledger audit-input/footbreak-ledger.json \
            --crown-ledger audit-input/crown-ledger.json \
            --learning-results-json audit-input/learning-results.json \
            --json-output granular-condition-window.json \
            --markdown-output granular-condition-window.md
          cat granular-condition-window.md

      - name: 上載稽核證據
        uses: actions/upload-artifact@v4
        with:
          name: granular-condition-window-audit
          path: |
            granular-condition-window.json
            granular-condition-window.md
          retention-days: 7
          if-no-files-found: error
