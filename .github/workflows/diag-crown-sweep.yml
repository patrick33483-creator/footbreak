name: Diag crown sweep
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-crown-sweep.yml']
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      E: ${{ github.event_name }}
      C: ${{ inputs.confirmation }}
    steps:
      - name: guard
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "DIAGCS" ]; then exit 1; fi
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: diag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          echo '=== crown related systemd units ==='
          $SSH 'sudo systemctl list-unit-files | grep -iE "crown|first.look|sweep|footbreak" 2>&1 | head -20'
          echo
          echo '=== crown-sweep service ==='
          $SSH 'sudo systemctl cat crown-sweep.service 2>&1 | head -25 || echo "no unit"'
          echo
          echo '=== crown-sweep recent log ==='
          $SSH 'sudo journalctl -u crown-sweep.service --since "20 min ago" --no-pager -o cat 2>&1 | tail -20'
          echo
          echo '=== crown-first-look-reconcile service ==='
          $SSH 'sudo systemctl cat crown-first-look-reconcile.service 2>&1 | head -25 || echo "no unit"'
          echo
          echo '=== search sweep script ==='
          $SSH 'sudo find /opt/footbreak -type f -name "*sweep*" -o -name "*first_look*" 2>/dev/null | head -10'
          echo
          echo '=== crown data.json meta ==='
          $SSH "sudo /opt/footbreak/.venv/bin/python3 -c 'import json,os,datetime;p=\"/var/www/crown/data.json\";s=os.stat(p);d=json.load(open(p));print(\"mtime:\",datetime.datetime.fromtimestamp(s.st_mtime));print(\"top:\",list(d.keys()));m=d.get(\"matches\",[]);print(\"matches:\",len(m));sample=m[0] if m else None;print(\"keys:\",list(sample.keys()) if sample else None);import re;print(\"first_titan:\",json.dumps(next((x for x in m if x.get(\"titan_match_id\")), None), ensure_ascii=False, indent=2)[:2000])'"
