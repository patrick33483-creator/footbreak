name: Crown condition 5 verified result apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit is read-only; apply settles the 28 verified results
        required: true
        default: audit
        type: choice
        options: [audit, apply]
      confirmation:
        description: "Required for apply: APPLY_CROWN_CONDITION5_VERIFIED_RESULTS"
        required: false
        type: string

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Audit or apply exact condition 5 results
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$MODE" = apply ]; then
            test "$CONFIRMATION" = APPLY_CROWN_CONDITION5_VERIFIED_RESULTS
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_work="$(
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              'umask 077; mktemp -d /tmp/crown-condition5-results.XXXXXX'
          )"
          cleanup_remote() {
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              "rm -rf -- $(printf '%q' "$remote_work")" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT
          scp -q -o BatchMode=yes -o ConnectTimeout=20 \
            analysis/apply_crown_condition5_verified_results.py \
            analysis/crown_condition5_verified_results_20260828.json \
            "$target:$remote_work/"
          script_sha="$(
            sha256sum analysis/apply_crown_condition5_verified_results.py |
              awk '{print $1}'
          )"
          manifest_sha="$(
            sha256sum analysis/crown_condition5_verified_results_20260828.json |
              awk '{print $1}'
          )"
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$target" \
            "sudo env MODE='$MODE' REMOTE_WORK='$remote_work' \
              SCRIPT_SHA='$script_sha' MANIFEST_SHA='$manifest_sha' bash -s" \
            <<'REMOTE' | tee crown-condition5-verified-results.json
          set -euo pipefail
          cd /opt/footbreak
          python=/opt/footbreak/.venv/bin/python3
          [ -x "$python" ] || python=python3
          if [ -f /etc/footbreak.env ]; then set -a; . /etc/footbreak.env; set +a; fi
          if [ -f /etc/footbreak-crown.env ]; then
            set -a; . /etc/footbreak-crown.env; set +a
          fi
          state="${CROWN_STATE_DIR:-/var/lib/footbreak/crown}"
          ledger="$state/ledger.json"
          script="$REMOTE_WORK/apply_crown_condition5_verified_results.py"
          manifest="$REMOTE_WORK/crown_condition5_verified_results_20260828.json"
          test -s "$ledger" && test -s "$script" && test -s "$manifest"
          test "$(sha256sum "$script" | awk '{print $1}')" = "$SCRIPT_SHA"
          test "$(sha256sum "$manifest" | awk '{print $1}')" = "$MANIFEST_SHA"
          work="$(mktemp -d)"
          active_timers=""
          stopped=0
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ -s "$work/ledger.before" ] && [ "$MODE" = apply ]; then
              install -m 0600 "$work/ledger.before" "$ledger"
            fi
            if [ "$stopped" = 1 ]; then
              for timer in $active_timers; do systemctl start "$timer" || true; done
            fi
            rm -rf "$work"
            exit "$rc"
          }
          trap cleanup EXIT
          if [ "$MODE" = apply ]; then
            for timer in crown-round-update.timer crown-first-look-reconcile.timer \
              crown-early-admission-reconcile.timer crown-sweep.timer \
              crown-tick.timer crown-settle.timer crown-reverse-t5-drain.timer; do
              if systemctl is-active --quiet "$timer"; then
                active_timers="$active_timers $timer"
              fi
              systemctl stop "$timer" || true
            done
            systemctl stop crown-round-update.service crown-first-look-reconcile.service \
              crown-early-admission-reconcile.service crown-sweep.service \
              crown-tick.service crown-settle.service \
              crown-reverse-t5-drain.service || true
            stopped=1
          fi
          exec 8>"$state/.state.lock"
          flock -w 180 8
          install -m 0600 "$ledger" "$work/ledger.before"
          install -m 0600 "$ledger" "$work/ledger.audit"
          PYTHONPATH=/opt/footbreak "$python" \
            "$script" \
            --ledger "$work/ledger.audit" --manifest "$manifest" \
            > "$work/audit.json"
          if [ "$MODE" = apply ]; then
            test "$(jq -r .status "$work/audit.json")" = audit_ready
            test "$(
              jq -r '.newly_settled + .already_settled_same' "$work/audit.json"
            )" = 28
            test "$(jq -r '.postponed_pending[0].match_id' "$work/audit.json")" = 3041538
            stamp="$(TZ=Asia/Hong_Kong date +%Y%m%d-%H%M%S)"
            install -m 0600 "$work/ledger.before" \
              "$ledger.before-condition5-verified-results-$stamp"
            PYTHONPATH=/opt/footbreak "$python" \
              "$script" \
              --ledger "$ledger" --manifest "$manifest" --apply \
              > "$work/apply.json"
            test "$(jq -r .status "$work/apply.json")" = applied
            test "$(
              jq -r '.newly_settled + .already_settled_same' "$work/apply.json"
            )" = 28
            timeout 300s "$python" -m crown.dashboard_data \
              --out /var/www/crown/data.json
            chown root:www-data /var/www/crown/data.json
            chmod 0644 /var/www/crown/data.json
            install -m 0600 "$ledger" "$work/ledger.verify"
            PYTHONPATH=/opt/footbreak "$python" \
              "$script" \
              --ledger "$work/ledger.verify" --manifest "$manifest" \
              >"$work/verify.json"
            test "$(jq -r .status "$work/verify.json")" = already_applied
            test "$(jq -r .already_settled_same "$work/verify.json")" = 28
            jq -s '{apply: .[0], verification: .[1]}' \
              "$work/apply.json" "$work/verify.json"
          else
            cat "$work/audit.json"
          fi
          flock -u 8
          REMOTE

      - name: Remove SSH key
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Upload settlement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-condition5-verified-results-${{ github.run_id }}
          path: crown-condition5-verified-results.json
          retention-days: 30
          if-no-files-found: error
