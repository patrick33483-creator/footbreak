name: Audit Crown pending results (read only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dispatched audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Stream pending audit to production (read only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test "${GITHUB_REF_NAME}" = "audit/crown-strict-holdout-100" || {
            echo "Refusing non-audit ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          cat analysis/crown_pending_results_audit.py | \
            ssh -o BatchMode=yes -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'sudo python3 - --input /var/lib/footbreak/crown/prediction_history.json --report /tmp/crown-pending-results.json --csv /tmp/crown-pending-results.csv'

      - name: Fetch report and CSV
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /tmp/crown-pending-results.json' > crown-pending-results.json
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /tmp/crown-pending-results.csv' > crown-pending-results.csv
          python3 -m json.tool crown-pending-results.json >/dev/null

      - name: Upload pending-audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: crown-pending-results-audit
          path: |
            crown-pending-results.json
            crown-pending-results.csv
          if-no-files-found: error
          retention-days: 30

      - name: Save reports on audit branch
        run: |
          install -d analysis/output
          cp crown-pending-results.json analysis/output/crown_pending_results.json
          cp crown-pending-results.csv analysis/output/crown_pending_results.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output/crown_pending_results.json analysis/output/crown_pending_results.csv
          if git diff --cached --quiet; then
            echo "Reports unchanged"
          else
            git commit -m "Save Crown pending-results audit"
            git push origin HEAD:audit/crown-strict-holdout-100
          fi
