name: Analyze Crown V3.1 recalibration (read only)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dispatched audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Stream V3.1 recalibration to production (read only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test "${GITHUB_REF_NAME}" = "audit/crown-strict-holdout-100" || {
            echo "Refusing non-audit ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          cat analysis/crown_v3_1_recalibrate.py | \
            ssh -o BatchMode=yes -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'sudo python3 - --input /var/lib/footbreak/crown/prediction_history.json --output /tmp/crown-v3-1-report.json'

      - name: Fetch JSON report
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /tmp/crown-v3-1-report.json' > crown-v3-1-report.json
          python3 -m json.tool crown-v3-1-report.json >/dev/null

      - name: Upload Crown V3.1 report
        uses: actions/upload-artifact@v4
        with:
          name: crown-v3-1-recalibrate-report
          path: crown-v3-1-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Save report on audit branch
        run: |
          install -d analysis/output
          cp crown-v3-1-report.json analysis/output/crown_v3_1_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output/crown_v3_1_report.json
          if git diff --cached --quiet; then
            echo "Report unchanged"
          else
            git commit -m "Save Crown V3.1 recalibration report"
            git push origin HEAD:audit/crown-strict-holdout-100
          fi
