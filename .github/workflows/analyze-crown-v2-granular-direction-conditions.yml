name: Analyze Crown V2 granular direction conditions (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Backtest granular model-direction conditions
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' <<'PY'
          import hashlib
          import json
          import math
          import random
          from collections import Counter, defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          PATH = Path("/var/lib/footbreak/crown/prediction_history.json")
          STAGES = ("首預", "T-30", "T-5")
          DISPLAY = {"首預": "初盤預測", "T-30": "T-30", "T-5": "T-5"}
          THRESHOLDS = (0.0, 1.70, 1.75, 1.80, 1.85)
          DECIDED = {"全贏", "半贏", "半輸", "全輸"}
          HITS = {"全贏", "半贏"}

          def hash_state(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              stat = path.stat()
              return {"sha256": digest.hexdigest(), "size": stat.st_size, "mtime_ns": stat.st_mtime_ns}

          before = hash_state(PATH)
          payload = json.loads(PATH.read_text(encoding="utf-8"))
          rows = payload.get("rows") or []

          def number(value):
              try:
                  parsed = float(value)
                  return parsed if math.isfinite(parsed) else None
              except (TypeError, ValueError):
                  return None

          def parse_time(value):
              try:
                  return datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              except (TypeError, ValueError):
                  return None

          def side_key(item):
              code = str(item.get("code") or "").upper()
              side = str(item.get("side") or "").upper()
              if code == "HDC":
                  return {"H": "主", "A": "客"}.get(side)
              if code in {"HIL", "CHL"}:
                  return {"H": "大", "O": "大", "L": "細", "U": "細"}.get(side)
              return None

          def market_name(item):
              code = str(item.get("code") or "").upper()
              return {"HDC": "讓球", "HIL": "入球大細", "CHL": "角球大細"}.get(code)

          def pick_lead(row):
              scored = []
              for index, item in enumerate(row.get("market_predictions") or []):
                  if not isinstance(item, dict):
                      continue
                  probability = number(item.get("probability", item.get("prob")))
                  odds = number(item.get("odds", item.get("decimal_odds")))
                  line = number(item.get("line", item.get("condition")))
                  direction = side_key(item)
                  market = market_name(item)
                  if (
                      probability is None or not (0 < probability <= 1)
                      or odds is None or odds <= 1
                      or line is None or direction is None or market is None
                  ):
                      continue
                  scored.append((
                      probability * odds - 1,
                      -index,
                      {
                          "market": market,
                          "code": str(item.get("code")).upper(),
                          "direction": direction,
                          "line": line,
                          "odds": odds,
                          "probability": probability,
                          "label": item.get("label"),
                      },
                  ))
              if not scored:
                  return None
              scored.sort(key=lambda value: (value[0], value[1]), reverse=True)
              return scored[0][2]

          def split_line(value):
              if abs(value * 2 - round(value * 2)) < 1e-9:
                  return [value]
              return [value - 0.25, value + 0.25]

          def half_outcome(diff):
              return 1 if diff > 1e-9 else -1 if diff < -1e-9 else 0

          def settle(lead, result):
              code = lead["code"]
              side = lead["direction"]
              hs, aw = result["home_score"], result["away_score"]
              outcomes = []
              for line in split_line(lead["line"]):
                  if code == "HDC":
                      adjusted = hs + line - aw
                      outcomes.append(half_outcome(adjusted if side == "主" else -adjusted))
                  else:
                      total = (
                          result["corners_total"]
                          if code == "CHL"
                          else hs + aw
                      )
                      if total is None:
                          return None
                      outcomes.append(half_outcome(total - line if side == "大" else line - total))
              if len(outcomes) == 1:
                  return {1: "全贏", 0: "走盤", -1: "全輸"}[outcomes[0]]
              total = sum(outcomes)
              if outcomes[0] == outcomes[1] == 1:
                  return "全贏"
              if total == 1:
                  return "半贏"
              if total == 0:
                  return "走盤"
              if total == -1:
                  return "半輸"
              return "全輸"

          def unit_return(grade, odds):
              return {
                  "全贏": odds - 1,
                  "半贏": (odds - 1) / 2,
                  "走盤": 0,
                  "半輸": -0.5,
                  "全輸": -1,
              }[grade]

          canonical = {}
          diagnostics = Counter()
          for row in rows:
              if not isinstance(row, dict):
                  continue
              stage = str(row.get("stage") or "")
              if stage not in STAGES or row.get("post_hoc_backfill"):
                  continue
              if row.get("exclude_from_primary_statistics") or row.get("exclude_from_settlement"):
                  continue
              if stage == "首預":
                  diagnostics[
                      f"initial_model:{row.get('prediction_model') or 'unknown'}"
                  ] += 1
              predicted = parse_time(row.get("predicted_at"))
              kickoff = parse_time(row.get("kickoff"))
              if predicted is None or kickoff is None or predicted >= kickoff:
                  diagnostics["invalid_or_post_kickoff"] += 1
                  continue
              fixture_id = str(row.get("titan_match_id") or row.get("match_id") or "")
              lead = pick_lead(row)
              if not fixture_id or lead is None:
                  diagnostics["missing_id_or_lead"] += 1
                  continue
              key = (fixture_id, stage)
              candidate = {"row": row, "lead": lead, "predicted": predicted}
              if key not in canonical or predicted > canonical[key]["predicted"]:
                  canonical[key] = candidate

          by_fixture = defaultdict(dict)
          for (fixture_id, stage), item in canonical.items():
              by_fixture[fixture_id][stage] = item

          observations = []
          funnel = Counter()
          for fixture_id, stages in by_fixture.items():
              funnel["fixtures_with_any_stage"] += 1
              if not all(stage in stages for stage in STAGES):
                  continue
              funnel["complete_three_stage"] += 1
              leads = [stages[stage]["lead"] for stage in STAGES]
              markets = [lead["market"] for lead in leads]
              if len(set(markets)) != 1:
                  continue
              funnel["same_market"] += 1
              directions = [lead["direction"] for lead in leads]
              direction_path = "→".join(directions)
              if len(set(directions)) == 1:
                  funnel["all_three_same_direction"] += 1
              lines = [lead["line"] for lead in leads]
              same_line = max(lines) - min(lines) <= 1e-9
              if same_line:
                  funnel["same_line"] += 1

              line_movement = None
              selected_lines = None
              if len(set(directions)) == 1:
                  if markets[0] == "讓球":
                      selected_lines = [
                          line if directions[0] == "主" else -line
                          for line in lines
                      ]
                      advantage = selected_lines[2] - selected_lines[0]
                  elif markets[0] in {"入球大細", "角球大細"}:
                      selected_lines = list(lines)
                      advantage = (
                          lines[0] - lines[2]
                          if directions[0] == "大"
                          else lines[2] - lines[0]
                      )
                  else:
                      advantage = 0
                  line_movement = (
                      "T-5比初盤更著數" if advantage > 1e-9
                      else "T-5與初盤同線" if abs(advantage) <= 1e-9
                      else "T-5比初盤更蝕底"
                  )

              result_row = next(
                  (
                      stages[stage]["row"]
                      for stage in reversed(STAGES)
                      if stages[stage]["row"].get("result_status") == "已核對"
                      and isinstance(stages[stage]["row"].get("result_detail"), dict)
                  ),
                  None,
              )
              result = None
              if result_row is not None:
                  detail = result_row["result_detail"]
                  if detail.get("home_score") is not None and detail.get("away_score") is not None:
                      result = {
                          "home_score": float(detail["home_score"]),
                          "away_score": float(detail["away_score"]),
                          "corners_total": number(detail.get("corners_total")),
                      }
              grade = settle(leads[2], result) if result else None
              observation = {
                  "fixture_id": fixture_id,
                  "kickoff": stages["T-5"]["row"].get("kickoff"),
                  "home": stages["T-5"]["row"].get("home"),
                  "away": stages["T-5"]["row"].get("away"),
                  "market": markets[0],
                  "direction_path": direction_path,
                  "initial_direction": directions[0],
                  "T30_direction": directions[1],
                  "T5_direction": directions[2],
                  "line": lines[0],
                  "stage_lines": lines,
                  "selected_stage_lines": selected_lines,
                  "same_line": same_line,
                  "line_movement": line_movement,
                  "initial_odds": leads[0]["odds"],
                  "T30_odds": leads[1]["odds"],
                  "T5_odds": leads[2]["odds"],
                  "min_odds": min(lead["odds"] for lead in leads),
                  "grade": grade,
                  "return": unit_return(grade, leads[2]["odds"]) if grade else None,
                  "score": result_row.get("score") if result_row else None,
              }
              observations.append(observation)
              if grade:
                  funnel["same_market_settled"] += 1
                  if same_line:
                      funnel["same_line_settled"] += 1

          def wilson(hits, n, z=1.959963984540054):
              if not n:
                  return [None, None]
              p = hits / n
              den = 1 + z*z/n
              centre = (p + z*z/(2*n)) / den
              margin = z * math.sqrt((p*(1-p) + z*z/(4*n))/n) / den
              return [centre-margin, centre+margin]

          def percentile(values, q):
              ordered = sorted(values)
              pos = (len(ordered)-1)*q
              lo, hi = math.floor(pos), math.ceil(pos)
              return ordered[lo] if lo == hi else ordered[lo]*(hi-pos)+ordered[hi]*(pos-lo)

          def summarize(group, label):
              settled = [row for row in group if row["grade"]]
              grades = Counter(row["grade"] for row in settled)
              decided = sum(grades[key] for key in DECIDED)
              hits = sum(grades[key] for key in HITS)
              returns = [row["return"] for row in settled]
              rng = random.Random(label)
              boot = []
              if returns:
                  for _ in range(3000):
                      boot.append(sum(rng.choice(returns) for __ in returns) / len(returns))
              interval = wilson(hits, decided)
              return {
                  "observations": len(group),
                  "settled": len(settled),
                  "full_win": grades["全贏"],
                  "half_win": grades["半贏"],
                  "push": grades["走盤"],
                  "half_loss": grades["半輸"],
                  "full_loss": grades["全輸"],
                  "hits": hits,
                  "decided": decided,
                  "hit_rate_pct": round(hits/decided*100, 2) if decided else None,
                  "hit_wilson_95_pct": [
                      round(value*100, 2) if value is not None else None
                      for value in interval
                  ],
                  "unit_pnl": round(sum(returns), 3),
                  "roi_pct": round(sum(returns)/len(returns)*100, 2) if returns else None,
                  "roi_bootstrap_95_pct": [
                      round(percentile(boot, 0.025)*100, 2),
                      round(percentile(boot, 0.975)*100, 2),
                  ] if boot else [None, None],
                  "mean_t5_odds": round(sum(row["T5_odds"] for row in settled)/len(settled), 3) if settled else None,
              }

          def result_from_stages(stages):
              result_row = next(
                  (
                      stages[stage]["row"]
                      for stage in reversed(STAGES)
                      if stage in stages
                      and stages[stage]["row"].get("result_status") == "已核對"
                      and isinstance(stages[stage]["row"].get("result_detail"), dict)
                  ),
                  None,
              )
              if result_row is None:
                  return None
              detail = result_row["result_detail"]
              if detail.get("home_score") is None or detail.get("away_score") is None:
                  return None
              return {
                  "home_score": float(detail["home_score"]),
                  "away_score": float(detail["away_score"]),
                  "corners_total": number(detail.get("corners_total")),
              }

          all_stage_records = []
          complete_records = []
          for fixture_id, stages in by_fixture.items():
              result = result_from_stages(stages)
              leads = {
                  stage: stages[stage]["lead"]
                  for stage in STAGES
                  if stage in stages
              }
              anchor_stage = next(stage for stage in reversed(STAGES) if stage in stages)
              kickoff = stages[anchor_stage]["row"].get("kickoff")
              record = {
                  "fixture_id": fixture_id,
                  "kickoff": kickoff,
                  "kickoff_dt": parse_time(kickoff),
                  "home": stages[anchor_stage]["row"].get("home"),
                  "away": stages[anchor_stage]["row"].get("away"),
                  "leads": leads,
                  "result": result,
                  "grades": {
                      stage: settle(leads[stage], result) if result else None
                      for stage in leads
                  },
              }
              all_stage_records.append(record)
              if all(stage in stages for stage in STAGES):
                  complete_records.append(record)

          # 所有條件共用同一組全局時間分界，避免每個條件自行切割造成時段漂移。
          settled_fixture_records = sorted(
              [
                  record for record in all_stage_records
                  if record["result"] is not None and record["kickoff_dt"] is not None
              ],
              key=lambda record: (record["kickoff_dt"], record["fixture_id"]),
          )
          global_discovery_end = int(len(settled_fixture_records) * 0.60)
          global_selection_end = int(len(settled_fixture_records) * 0.80)
          discovery_fixture_ids = {
              record["fixture_id"]
              for record in settled_fixture_records[:global_discovery_end]
          }
          selection_fixture_ids = {
              record["fixture_id"]
              for record in settled_fixture_records[
                  global_discovery_end:global_selection_end
              ]
          }
          holdout_fixture_ids = {
              record["fixture_id"]
              for record in settled_fixture_records[global_selection_end:]
          }

          def selected_line(lead):
              if lead["market"] == "讓球" and lead["direction"] == "客":
                  return -lead["line"]
              return lead["line"]

          def line_relation(earlier, later):
              if earlier["market"] != later["market"] or earlier["direction"] != later["direction"]:
                  return None
              early_line = selected_line(earlier)
              late_line = selected_line(later)
              if earlier["market"] == "讓球":
                  advantage = late_line - early_line
              elif earlier["direction"] == "大":
                  advantage = early_line - late_line
              else:
                  advantage = late_line - early_line
              if advantage > 1e-9:
                  return "更著數"
              if advantage < -1e-9:
                  return "更蝕底"
              return "同線"

          def candidate_part(rows, decision_stage, bootstrap_label=None, alpha=0.05):
              grades = Counter(record["grades"][decision_stage] for record in rows)
              decided = sum(grades[key] for key in DECIDED)
              hits = sum(grades[key] for key in HITS)
              returns = [
                  unit_return(
                      record["grades"][decision_stage],
                      record["leads"][decision_stage]["odds"],
                  )
                  for record in rows
              ]
              interval = wilson(hits, decided)
              result = {
                  "n": len(rows),
                  "full_win": grades["全贏"],
                  "half_win": grades["半贏"],
                  "push": grades["走盤"],
                  "half_loss": grades["半輸"],
                  "full_loss": grades["全輸"],
                  "hit_rate_pct": round(hits / decided * 100, 2) if decided else None,
                  "wilson_95_pct": [
                      round(interval[0] * 100, 2),
                      round(interval[1] * 100, 2),
                  ] if interval[0] is not None else [None, None],
                  "wilson_low_pct": round(interval[0] * 100, 2) if interval[0] is not None else None,
                  "unit_pnl": round(sum(returns), 3),
                  "roi_pct": round(sum(returns) / len(returns) * 100, 2) if returns else None,
              }
              if bootstrap_label is not None and returns:
                  rng = random.Random(bootstrap_label)
                  boot = [
                      sum(rng.choice(returns) for _ in returns) / len(returns)
                      for _ in range(5000)
                  ]
                  result["roi_bootstrap_95_pct"] = [
                      round(percentile(boot, alpha / 2) * 100, 2),
                      round(percentile(boot, 1 - alpha / 2) * 100, 2),
                  ]
              return result

          def candidate_stats(records, decision_stage, label):
              settled = [
                  record for record in records
                  if record["grades"].get(decision_stage) is not None
              ]
              discovery = [
                  record for record in settled
                  if record["fixture_id"] in discovery_fixture_ids
              ]
              selection = [
                  record for record in settled
                  if record["fixture_id"] in selection_fixture_ids
              ]
              holdout = [
                  record for record in settled
                  if record["fixture_id"] in holdout_fixture_ids
              ]
              pre_holdout_signature = hashlib.sha256(
                  "|".join(sorted(
                      str(record["fixture_id"]) for record in discovery + selection
                  )).encode()
              ).hexdigest()[:16]
              return {
                  "label": label,
                  "decision_stage": DISPLAY[decision_stage],
                  "sample_counts": {
                      "all": len(settled),
                      "discovery_60pct": len(discovery),
                      "selection_20pct": len(selection),
                      "holdout_20pct": len(holdout),
                  },
                  "discovery_60pct": candidate_part(discovery, decision_stage),
                  "selection_20pct": candidate_part(selection, decision_stage),
                  "pre_holdout_signature": pre_holdout_signature,
                  "_decision_stage_key": decision_stage,
                  "_period_rows": {
                      "all": settled,
                      "discovery_60pct": discovery,
                      "selection_20pct": selection,
                      "holdout_20pct": holdout,
                  },
              }

          candidates = []
          odds_thresholds = (0.0, 1.70, 1.75, 1.80, 1.85)
          markets = ("讓球", "入球大細", "角球大細")
          market_directions = {
              "讓球": ("主", "客"),
              "入球大細": ("大", "細"),
              "角球大細": ("大", "細"),
          }

          # 單一時點：初盤預測、T-30、T-5 可各自成為完整條件。
          for stage in STAGES:
              for market in markets:
                  for direction in market_directions[market]:
                      for threshold in odds_thresholds:
                          group = [
                              record for record in all_stage_records
                              if stage in record["leads"]
                              and record["leads"][stage]["market"] == market
                              and record["leads"][stage]["direction"] == direction
                              and (threshold == 0 or record["leads"][stage]["odds"] > threshold)
                          ]
                          odds_label = "無賠率門檻" if threshold == 0 else f"賠率>{threshold:.2f}"
                          candidates.append({
                              "market": market,
                              "family": "單一時點",
                              **candidate_stats(
                                  group,
                                  stage,
                                  f"{DISPLAY[stage]}={direction}｜{odds_label}",
                              ),
                          })

                          exact_lines = sorted({
                              selected_line(record["leads"][stage])
                              for record in group
                          })
                          for exact_line in exact_lines:
                              line_group = [
                                  record for record in group
                                  if abs(selected_line(record["leads"][stage]) - exact_line) <= 1e-9
                              ]
                              candidates.append({
                                  "market": market,
                                  "family": "單一時點＋固定中位線",
                                  **candidate_stats(
                                      line_group,
                                      stage,
                                      (
                                          f"{DISPLAY[stage]}={direction}｜"
                                          f"中位線={exact_line:g}｜{odds_label}"
                                      ),
                                  ),
                              })

          # 任意兩時點：方向可相同或相反，按較後時點的選擇結算。
          pair_specs = (
              ("首預", "T-30"),
              ("首預", "T-5"),
              ("T-30", "T-5"),
          )
          for early_stage, late_stage in pair_specs:
              for market in markets:
                  for early_direction in market_directions[market]:
                      for late_direction in market_directions[market]:
                          for threshold in odds_thresholds:
                              group = [
                                  record for record in all_stage_records
                                  if early_stage in record["leads"]
                                  and late_stage in record["leads"]
                                  and record["leads"][early_stage]["market"] == market
                                  and record["leads"][late_stage]["market"] == market
                                  and record["leads"][early_stage]["direction"] == early_direction
                                  and record["leads"][late_stage]["direction"] == late_direction
                                  and (
                                      threshold == 0
                                      or min(
                                          record["leads"][early_stage]["odds"],
                                          record["leads"][late_stage]["odds"],
                                      ) > threshold
                                  )
                              ]
                              odds_label = "無賠率門檻" if threshold == 0 else f"兩段賠率>{threshold:.2f}"
                              pair_label = (
                                  f"{DISPLAY[early_stage]}={early_direction}＋"
                                  f"{DISPLAY[late_stage]}={late_direction}｜{odds_label}"
                              )
                              candidates.append({
                                  "market": market,
                                  "family": "兩時點方向",
                                  **candidate_stats(group, late_stage, pair_label),
                              })
                              if early_direction == late_direction:
                                  for relation in ("更著數", "同線", "更蝕底"):
                                      relation_group = [
                                          record for record in group
                                          if line_relation(
                                              record["leads"][early_stage],
                                              record["leads"][late_stage],
                                          ) == relation
                                      ]
                                      candidates.append({
                                          "market": market,
                                          "family": "兩時點方向＋線位變化",
                                          **candidate_stats(
                                              relation_group,
                                              late_stage,
                                              f"{pair_label}｜較前段{relation}",
                                          ),
                                      })

          # 三時點：八種完整方向路徑，不要求三段方向一致。
          for market in markets:
              directions = market_directions[market]
              paths = [
                  (a, b, c)
                  for a in directions
                  for b in directions
                  for c in directions
              ]
              for path in paths:
                  for threshold in odds_thresholds:
                      group = [
                          record for record in complete_records
                          if all(record["leads"][stage]["market"] == market for stage in STAGES)
                          and tuple(record["leads"][stage]["direction"] for stage in STAGES) == path
                          and (
                              threshold == 0
                              or min(record["leads"][stage]["odds"] for stage in STAGES) > threshold
                          )
                      ]
                      odds_label = "無賠率門檻" if threshold == 0 else f"三段賠率>{threshold:.2f}"
                      path_label = "→".join(path)
                      candidates.append({
                          "market": market,
                          "family": "三時點完整路徑",
                          **candidate_stats(
                              group,
                              "T-5",
                              f"{path_label}｜{odds_label}",
                          ),
                      })
                      same_line_group = [
                          record for record in group
                          if max(record["leads"][stage]["line"] for stage in STAGES)
                          - min(record["leads"][stage]["line"] for stage in STAGES) <= 1e-9
                      ]
                      candidates.append({
                          "market": market,
                          "family": "三時點路徑＋同中位線",
                          **candidate_stats(
                              same_line_group,
                              "T-5",
                              f"{path_label}｜三段同中位線｜{odds_label}",
                          ),
                      })

          eligible_candidates = [
              candidate for candidate in candidates
              if candidate["sample_counts"]["all"] >= 100
              and candidate["sample_counts"]["discovery_60pct"] >= 60
              and candidate["sample_counts"]["selection_20pct"] >= 20
              and candidate["sample_counts"]["holdout_20pct"] >= 20
          ]
          for candidate in eligible_candidates:
              discovery = candidate["discovery_60pct"]
              selection = candidate["selection_20pct"]
              candidate["ranking_score"] = round(
                  min(
                      discovery["wilson_low_pct"] or 0,
                      selection["wilson_low_pct"] or 0,
                  )
                  + min(
                      max(min(
                          discovery["roi_pct"] or -100,
                          selection["roi_pct"] or -100,
                      ), -50),
                      50,
                  ) * 0.10,
                  3,
              )

          def deduplicated_ranked(market):
              ranked = sorted(
                  [
                      candidate for candidate in eligible_candidates
                      if candidate["market"] == market
                  ],
                  key=lambda candidate: (
                      candidate["ranking_score"],
                      candidate["selection_20pct"]["n"],
                      candidate["sample_counts"]["all"],
                  ),
                  reverse=True,
              )
              seen = set()
              unique = []
              for candidate in ranked:
                  signature = candidate["pre_holdout_signature"]
                  if signature in seen:
                      continue
                  seen.add(signature)
                  unique.append(candidate)
              return unique

          ranked_candidates = {
              market: deduplicated_ranked(market)
              for market in markets
          }
          # 每個市場只鎖定最多五個候選；排序完全不使用 holdout 成績。
          locked_finalists = {
              market: ranked_candidates[market][:5]
              for market in markets
          }
          for market, finalists in locked_finalists.items():
              for locked_rank, candidate in enumerate(finalists, start=1):
                  decision_stage = candidate["_decision_stage_key"]
                  candidate["locked_rank"] = locked_rank
                  for period, rows in candidate["_period_rows"].items():
                      candidate[period] = candidate_part(
                          rows,
                          decision_stage,
                          bootstrap_label=(
                              f"{market}|{candidate['label']}|{period}|strict-holdout"
                          ),
                      )
                  holdout = candidate["holdout_20pct"]
                  holdout_interval = holdout.get("roi_bootstrap_95_pct", [None, None])
                  candidate["strict_holdout_pass"] = bool(
                      holdout["n"] >= 20
                      and (holdout["hit_rate_pct"] or 0) >= 55
                      and (holdout["roi_pct"] or -100) > 0
                      and holdout_interval[0] is not None
                      and holdout_interval[0] > 0
                  )

          def public_candidate(candidate, include_holdout=False):
              result = {
                  key: value for key, value in candidate.items()
                  if not key.startswith("_")
                  and key not in ("all", "holdout_20pct")
                  and (include_holdout or key != "strict_holdout_pass")
              }
              if include_holdout:
                  result["all"] = candidate["all"]
                  result["holdout_20pct"] = candidate["holdout_20pct"]
              return result

          ranked_candidates_public = {
              market: [
                  public_candidate(candidate)
                  for candidate in ranked_candidates[market][:25]
              ]
              for market in markets
          }
          locked_finalists_public = {
              market: [
                  public_candidate(candidate, include_holdout=True)
                  for candidate in locked_finalists[market]
              ]
              for market in markets
          }

          threshold_stats = {}
          market_stats = {}
          path_stats = {}
          line_stats = {}
          same_direction_line_movement_stats = {}
          same_direction_line_movement_detail_stats = {}
          for threshold in THRESHOLDS:
              key = "無門檻" if threshold == 0 else f">{threshold:.2f}"
              eligible = [
                  row for row in observations
                  if threshold == 0 or row["min_odds"] > threshold
              ]
              subset = [row for row in eligible if row["same_line"]]
              threshold_stats[key] = summarize(subset, f"all|{key}")
              market_stats[key] = {
                  market: summarize(
                      [row for row in subset if row["market"] == market],
                      f"market|{key}|{market}",
                  )
                  for market in ("讓球", "入球大細", "角球大細")
              }
              path_stats[key] = {
                  f"{market}:{path}": summarize(
                      [
                          row for row in subset
                          if row["market"] == market and row["direction_path"] == path
                      ],
                      f"path|{key}|{market}|{path}",
                  )
                  for market, paths in (
                      ("讓球", ("主→主→主", "主→主→客", "主→客→主", "主→客→客",
                               "客→主→主", "客→主→客", "客→客→主", "客→客→客")),
                      ("入球大細", ("大→大→大", "大→大→細", "大→細→大", "大→細→細",
                                   "細→大→大", "細→大→細", "細→細→大", "細→細→細")),
                      ("角球大細", ("大→大→大", "大→大→細", "大→細→大", "大→細→細",
                                   "細→大→大", "細→大→細", "細→細→大", "細→細→細")),
                  )
                  for path in paths
              }
              grouped = defaultdict(list)
              for row in subset:
                  grouped[(row["market"], row["direction_path"], row["line"])].append(row)
              line_stats[key] = {
                  f"{market}|{path}|{line:g}": summarize(
                      group, f"line|{key}|{market}|{path}|{line}"
                  )
                  for (market, path, line), group in sorted(grouped.items())
              }
              same_direction_line_movement_stats[key] = {
                  movement: summarize(
                      [
                          row for row in eligible
                          if row["line_movement"] == movement
                      ],
                      f"movement|{key}|{movement}",
                  )
                  for movement in (
                      "T-5比初盤更著數",
                      "T-5與初盤同線",
                      "T-5比初盤更蝕底",
                  )
              }
              movement_grouped = defaultdict(list)
              for row in eligible:
                  if row["line_movement"] is not None:
                      movement_grouped[
                          (row["market"], row["direction_path"], row["line_movement"])
                      ].append(row)
              same_direction_line_movement_detail_stats[key] = {
                  f"{market}|{path}|{movement}": summarize(
                      group,
                      f"movement-detail|{key}|{market}|{path}|{movement}",
                  )
                  for (market, path, movement), group in sorted(movement_grouped.items())
              }

          target = [
              row for row in observations
              if row["same_line"] and row["min_odds"] > 1.70
          ]
          recent_results = sorted(
              [row for row in target if row["grade"]],
              key=lambda row: str(row["kickoff"]),
              reverse=True,
          )[:50]

          after = hash_state(PATH)
          report = {
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "read_only_hash_unchanged": before == after,
              "file_state_before": before,
              "file_state_after": after,
              "definition": {
                  "direction": "皇冠模型每階段最高 EV lead 的主／客／大／細，不是報價方向",
                  "initial": "完整皇冠歷史初盤預測；模型版本分布另列，沒有把舊模型偽裝成嚴格 V2",
                  "same_line": "三階段 lead 的標準化亞洲中位線完全相同",
                  "odds_filter": "三階段所選 lead 的 decimal odds 均嚴格高於門檻",
                  "decision": "完整條件在 T-5 才成立，以 T-5 lead、線位及賠率結算",
              },
              "diagnostics": dict(diagnostics),
              "funnel": dict(funnel),
              "threshold_stats": threshold_stats,
              "market_stats": market_stats,
              "path_stats": path_stats,
              "line_stats_all_observed": line_stats,
              "same_direction_line_movement_stats": same_direction_line_movement_stats,
              "same_direction_line_movement_detail_stats": same_direction_line_movement_detail_stats,
              "condition_mining": {
                  "scope": "單一時點只要求該時點存在；兩時點只要求指定兩段存在；完整路徑才要求初盤預測、T-30、T-5齊全",
                  "settlement": "單一時點用該時點；兩時點用較後時點；三時點用T-5的方向、線位及賠率結算",
                  "split_method": "所有條件共用全局開賽時間60% discovery、20% selection、20% untouched holdout；排名只使用前80%",
                  "minimum_sample": "總樣本至少100，discovery至少60，selection至少20，holdout至少20",
                  "finalist_lock": "每市場按前80%成績去重後鎖定最多5個候選，之後才計算holdout成績",
                  "strict_holdout_pass": "holdout至少20場、命中率至少55%、ROI為正，且5000次bootstrap ROI 95%區間下限大於0",
                  "global_time_split": {
                      "settled_fixture_count": len(settled_fixture_records),
                      "discovery_fixture_count": len(discovery_fixture_ids),
                      "selection_fixture_count": len(selection_fixture_ids),
                      "holdout_fixture_count": len(holdout_fixture_ids),
                      "discovery_end_kickoff": (
                          settled_fixture_records[global_discovery_end - 1]["kickoff"]
                          if global_discovery_end else None
                      ),
                      "selection_end_kickoff": (
                          settled_fixture_records[global_selection_end - 1]["kickoff"]
                          if global_selection_end else None
                      ),
                      "holdout_start_kickoff": (
                          settled_fixture_records[global_selection_end]["kickoff"]
                          if global_selection_end < len(settled_fixture_records) else None
                      ),
                  },
                  "fixtures_with_any_stage": len(all_stage_records),
                  "complete_records": len(complete_records),
                  "candidate_count": len(candidates),
                  "eligible_candidate_count": len(eligible_candidates),
                  "unique_eligible_candidate_count_by_market": {
                      market: len(ranked_candidates[market])
                      for market in markets
                  },
                  "ranked_pre_holdout_top_25_by_market": ranked_candidates_public,
                  "locked_finalists_with_holdout": locked_finalists_public,
              },
              "recent_results_gt_1_70": recent_results,
          }
          print("CROWN_V2_GRANULAR_REPORT_BEGIN")
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          print("CROWN_V2_GRANULAR_REPORT_END")
          if before != after:
              raise SystemExit("Read-only integrity check failed")
          PY
