name: Analyze Crown V3 strict holdout (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dispatched audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Stream strict V3 backtest to production (read only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test "${GITHUB_REF_NAME}" = "audit/crown-strict-holdout-100" || {
            echo "Refusing non-audit ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          cat analysis/crown_v3_backtest.py | \
            ssh -o BatchMode=yes -o ConnectTimeout=20 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'sudo python3 - --input /var/lib/footbreak/crown/prediction_history.json --output /tmp/crown-v3-report.json'

      - name: Fetch JSON report
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /tmp/crown-v3-report.json' > crown-v3-report.json
          python3 -m json.tool crown-v3-report.json >/dev/null

      - name: Upload Crown V3 report
        uses: actions/upload-artifact@v4
        with:
          name: crown-v3-strict-holdout-report
          path: crown-v3-report.json
          if-no-files-found: error
          retention-days: 30
