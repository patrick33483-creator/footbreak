name: 診斷皇冠 Tick Process

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀檢查 Tick 等待位置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              set -eu
              sudo systemctl show crown-tick.service --no-pager \
                -p ActiveState -p SubState -p Result -p MainPID \
                -p ExecMainStartTimestamp -p TimeoutStartUSec
              pid=$(sudo systemctl show crown-tick.service -p MainPID --value)
              case "$pid" in ""|0|*[!0-9]*) exit 0 ;; esac
              echo "=== process tree (no arguments/environment) ==="
              sudo ps -o pid=,ppid=,etimes=,stat=,wchan:32=,comm= \
                -p "$pid" --ppid "$pid"
              for child in $(sudo pgrep -P "$pid" || true); do
                sudo ps -o pid=,ppid=,etimes=,stat=,wchan:32=,comm= \
                  --ppid "$child" || true
              done
            '

      - name: 只讀取得皇冠 Telegram 通知摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          printf -v remote_command \
            'sudo env CROWN_NOTIFY_AUDIT_HOURS=%q PYTHONPATH=%q bash -c %q' \
            "12" "/opt/footbreak" \
            'set -a; . /etc/footbreak-crown.env; set +a; exec /opt/footbreak/.venv/bin/python3 -'
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" \
            < deploy/audit-crown-notification-state.py

      - name: 只讀取得皇冠通知警告計數
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              sudo journalctl -u crown-tick.service --since "12 hours ago" \
                --no-pager -o cat |
              python3 -c '"'"'import json,sys
          text=sys.stdin.read()
          print(json.dumps({
            "notification_warning_count": text.count("notification_warning"),
            "telegram_error_count": text.count("telegram_"),
            "failed_tick_count": text.count("\"ok\": false")
          }, sort_keys=True))'"'"'
            '
