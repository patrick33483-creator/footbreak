name: 診斷皇冠 Tick Process

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀檢查 Tick 等待位置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          install -d -m 700 diagnostic-output
          exec 3>&1
          exec > diagnostic-output/crown-tick-process-summary.txt 2>&1
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              set -eu
              echo "=== deployed revision ==="
              sudo git -C /opt/footbreak rev-parse HEAD 2>/dev/null || true
              sudo systemctl show crown-tick.service --no-pager \
                -p ActiveState -p SubState -p Result -p MainPID \
                -p ExecMainStartTimestamp -p TimeoutStartUSec -p ExecMainStatus
              echo "=== aggregate exception types ==="
              sudo journalctl -u crown-tick.service --since "-20 minutes" \
                --no-pager -o cat \
                | grep -oE "upstream_[A-Za-z0-9_]+" \
                | sort | uniq -c || true
              pid=$(sudo systemctl show crown-tick.service -p MainPID --value)
              case "$pid" in ""|0|*[!0-9]*) exit 0 ;; esac
              echo "=== process tree (no arguments/environment) ==="
              sudo ps -o pid=,ppid=,etimes=,stat=,wchan:32=,comm= \
                -p "$pid" --ppid "$pid"
              for child in $(sudo pgrep -P "$pid" || true); do
                sudo ps -o pid=,ppid=,etimes=,stat=,wchan:32=,comm= \
                  --ppid "$child" || true
              done
            '
          cat diagnostic-output/crown-tick-process-summary.txt >&3

      - name: 保存已遮罩 Process 摘要到臨時私人分支
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add diagnostic-output/crown-tick-process-summary.txt
          git commit -m 'Store redacted Crown tick process diagnosis' || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
