name: Patch v2 history.html to table layout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "打 V2TBL"
        required: true
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/patch-v2-history-20260907.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HTML_B64: 
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "V2TBL" ]; then exit 1; fi
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HTML_B64: ${{ env.HTML_B64 }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=60 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s $HTML_B64" <<'REMOTE'
          set -eu
          B64="$1"
          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP=/var/www/stage_engine_v2/history.html.backup-${STAMP}
          cp -a /var/www/stage_engine_v2/history.html "$BACKUP"
          echo "Backup: $BACKUP"

          echo "$B64" | base64 -d > /var/www/stage_engine_v2/history.html.tmp
          wc -c /var/www/stage_engine_v2/history.html.tmp

          # Sanity check new file
          grep -q '初盤預測</th>' /var/www/stage_engine_v2/history.html.tmp || { echo "ERR: header missing"; exit 1; }
          grep -q 'stageCell' /var/www/stage_engine_v2/history.html.tmp || { echo "ERR: stageCell missing"; exit 1; }
          grep -q 'table.hist' /var/www/stage_engine_v2/history.html.tmp || { echo "ERR: table missing"; exit 1; }

          mv /var/www/stage_engine_v2/history.html.tmp /var/www/stage_engine_v2/history.html
          chown root:root /var/www/stage_engine_v2/history.html
          chmod 644 /var/www/stage_engine_v2/history.html
          ls -la /var/www/stage_engine_v2/history.html "$BACKUP"
          echo
          echo "===== new content head 20 lines ====="
          head -20 /var/www/stage_engine_v2/history.html
          REMOTE
