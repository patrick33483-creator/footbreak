name: 唯讀核對兩套 Telegram 通知

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 唯讀核對 bot、候選、ack 及服務日誌
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          set -a
          . /etc/footbreak.env
          set +a
          cd /opt/footbreak
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          HKT = dt.timezone(dt.timedelta(hours=8))
          now = dt.datetime.now(HKT)

          def read(path, default):
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
                  return value if isinstance(value, type(default)) else default
              except Exception:
                  return default

          def parse(value):
              try:
                  parsed = dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=HKT)
                  return parsed.astimezone(HKT)
              except Exception:
                  return None

          def ident(row):
              return str(row.get("bet_id") or row.get("observation_id") or "").strip()

          def created(row):
              for key in ("created_at", "ts", "recorded_at"):
                  value = parse(row.get(key))
                  if value:
                      return value
              return None

          def telegram_probe(label, token, chat):
              result = {
                  "token_present": bool(token),
                  "chat_present": bool(chat),
                  "getMe": "not_configured",
                  "getChat": "not_configured",
              }
              if not token or not chat:
                  print(label, result)
                  return
              for method, query in (
                  ("getMe", ""),
                  ("getChat", "?" + urllib.parse.urlencode({"chat_id": chat})),
              ):
                  request = urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/{method}{query}",
                      headers={"User-Agent": "footbreak-read-only-health/1"},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=8) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                      result[method] = "ok" if payload.get("ok") is True else "api_not_ok"
                  except urllib.error.HTTPError as exc:
                      result[method] = f"http_{exc.code}"
                  except Exception as exc:
                      result[method] = type(exc).__name__
              print(label, result)

          def summarize(label, ledger_path, notify_path, system):
              ledger = read(ledger_path, {})
              notify = read(notify_path, {})
              ack = {
                  str(value) for value in (notify.get("wilson_match_alerts") or [])
                  if str(value or "").strip()
              }
              if not ack:
                  legacy = "condition_simulation_bets" if system == "footbreak" else "wilson_bets"
                  ack = {
                      str(value) for value in (notify.get(legacy) or [])
                      if str(value or "").strip()
                  }

              rows = [
                  row for row in (ledger.get("bets") or [])
                  if isinstance(row, dict)
                  and str(row.get("portfolio") or "").startswith(f"{system}_wilson_")
              ]
              validation = ledger.get("wilson_validation") or {}
              rows += [
                  row for row in (validation.get("observations") or [])
                  if isinstance(row, dict)
                  and str(row.get("portfolio") or "").startswith(f"{system}_wilson_")
              ]
              cross_name = (
                  "footbreak_crown_execution_test"
                  if system == "footbreak" else "crown_hkjc_execution_test"
              )
              cross_ns = ledger.get(cross_name) or {}
              cross_rows = [
                  row for row in (cross_ns.get("bets") or [])
                  if isinstance(row, dict)
              ]
              cross_ack_key = (
                  "crown_execution_test_alerts"
                  if system == "footbreak" else "hkjc_execution_test_alerts"
              )
              cross_ack = {
                  str(value) for value in (notify.get(cross_ack_key) or [])
                  if str(value or "").strip()
              }

              def classify(candidate_rows, acknowledged):
                  eligible = []
                  unacked = []
                  expired_unacked = []
                  for row in candidate_rows:
                      identifier = ident(row)
                      stamp = created(row)
                      kickoff = parse(row.get("kickoff") or row.get("kickoff_hkt"))
                      if not identifier or not stamp:
                          continue
                      eligible.append((identifier, stamp))
                      if identifier not in acknowledged:
                          if kickoff and kickoff <= now:
                              expired_unacked.append((identifier, stamp))
                          else:
                              unacked.append((identifier, stamp))
                  newest = max((stamp for _, stamp in eligible), default=None)
                  return {
                      "candidate_count": len(eligible),
                      "ack_count": len(acknowledged),
                      "future_unacked": len(unacked),
                      "expired_unacked": len(expired_unacked),
                      "newest_candidate_at": newest.isoformat() if newest else None,
                  }

              print(label, {
                  "wilson": classify(rows, ack),
                  "cross_book": classify(cross_rows, cross_ack),
                  "notify_state_mtime": (
                      dt.datetime.fromtimestamp(
                          Path(notify_path).stat().st_mtime, HKT
                      ).isoformat()
                      if Path(notify_path).exists() else None
                  ),
              })

          telegram_probe(
              "Footbreak bot",
              os.getenv("TELEGRAM_BOT_TOKEN", ""),
              os.getenv("TELEGRAM_CHAT_ID", ""),
          )
          telegram_probe(
              "Crown bot",
              os.getenv("CROWN_TELEGRAM_BOT_TOKEN") or os.getenv("TELEGRAM_BOT_TOKEN", ""),
              os.getenv("CROWN_TELEGRAM_CHAT_ID") or os.getenv("TELEGRAM_CHAT_ID", ""),
          )
          summarize(
              "Footbreak outbox",
              "/opt/footbreak/system/sim_ledger.json",
              "/opt/footbreak/system/notify_state.json",
              "footbreak",
          )
          summarize(
              "Crown outbox",
              "/var/lib/footbreak/crown/ledger.json",
              "/var/lib/footbreak/crown/notify_state.json",
              "crown",
          )
          PY

          echo "=== service state ==="
          systemctl show footbreak-tick.service crown-tick.service \
            -p Id -p Result -p ExecMainStatus -p ActiveState --no-pager
          echo "=== notification warnings since midnight HKT ==="
          journalctl -u footbreak-tick.service -u crown-tick.service \
            --since "today 00:00" --no-pager -o cat \
            | grep -E "telegram_|通知暫不可用|notification_warning" \
            | tail -n 120 || true
          REMOTE
