name: Diag v3 nginx

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "打 DIAGV3NGX"
        required: true
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-v3-nginx.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "DIAGV3NGX" ]; then echo bad; exit 1; fi
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"
          echo "=== list /var/www/crownsystem-v3/ ==="
          $SSH 'ls -la /var/www/crownsystem-v3/ && echo && head -20 /var/www/crownsystem-v3/index.html'
          echo
          echo "=== nginx sites-enabled ==="
          $SSH 'ls -la /etc/nginx/sites-enabled/'
          echo
          echo "=== all conf files with server blocks ==="
          $SSH 'sudo grep -rln "server {" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null'
          echo
          echo "=== search crownsystem-v3 in ALL nginx configs ==="
          $SSH 'sudo grep -rn "crownsystem-v3" /etc/nginx/ 2>/dev/null'
          echo
          echo "=== full unified-dashboard conf (server blocks summary) ==="
          $SSH 'sudo grep -nE "^(server \{|    listen|    server_name|    location|    root|    alias|    proxy_pass|    index)" /etc/nginx/sites-available/unified-dashboard | head -80'
          echo
          echo "=== curl -v /crownsystem-v3/ with auth ==="
          $SSH 'curl -sSv -u radar:toberich http://127.0.0.1/crownsystem-v3/ 2>&1 | head -30'
