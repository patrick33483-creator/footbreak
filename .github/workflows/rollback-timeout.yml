name: Rollback timeout
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/rollback-timeout.yml']
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      E: ${{ github.event_name }}
      C: ${{ inputs.confirmation }}
    steps:
      - name: guard
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "ROLLBACK" ]; then exit 1; fi
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          echo "=== BEFORE ROLLBACK ==="
          $SSH 'sudo systemctl show crown-sweep.service -p TimeoutStartUSec'
          echo
          $SSH 'sudo rm -f /etc/systemd/system/crown-sweep.service.d/timeout.conf && sudo rmdir /etc/systemd/system/crown-sweep.service.d 2>/dev/null; sudo systemctl daemon-reload && sudo systemctl restart crown-sweep.timer'
          echo "=== AFTER ROLLBACK ==="
          $SSH 'sudo systemctl show crown-sweep.service -p TimeoutStartUSec'
          echo
          $SSH 'ls -la /etc/systemd/system/crown-sweep.service.d/ 2>&1 || echo drop-in dir removed'
