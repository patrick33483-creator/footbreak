                      "agreement": len(formal_agreement),
                      "footbreak_conflicts_excluded": formal_footbreak_conflicts,
                      "crown_conflicts_excluded": formal_crown_conflicts,
                  },
              },
              "strategies": {
                  name: summarize(rows, int(hashlib.sha256(name.encode()).hexdigest()[:8], 16))
                  for name, rows in strategy_sets.items()
              },
              "limitations": [
                  "Radar T5 is the first captured quote inside the final five-minute window, not necessarily exactly T-5.",
                  "No closing quote exists in this extract, so CLV is not reported.",
                  "Threshold variants are shown together and are exploratory, not independent confirmations.",
                  "Bootstrap intervals are unstable for small samples and do not correct for strategy selection.",
              ],
              "generated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          print("COMBINED_T5_OU_BACKTEST_JSON_BEGIN")
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          print("COMBINED_T5_OU_BACKTEST_JSON_END")

          fb.rollback()
