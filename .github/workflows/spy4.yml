name: spy crown-radar shape v4
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/spy4.yml']
concurrency: {group: production-maintenance-10, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          set -e
          echo "=== matches-crown first match FULL ==="
          curl -s -u "radar:toberich" http://127.0.0.1/crown-radar/api/matches-crown | python3 <<'PY'
          import sys, json
          d = json.load(sys.stdin)
          items = d if isinstance(d, list) else d.get("matches", [])
          print("total:", len(items))
          if items:
              m = items[0]
              print("\nkeys:", sorted(m.keys()))
              print("\nfull first:")
              print(json.dumps(m, ensure_ascii=False, indent=2)[:4000])
              # snapshot keys
              snap = m.get("snapshots") or {}
              print("\nsnapshot keys:", sorted(snap.keys()))
              for k, v in list(snap.items())[:3]:
                  print(f"  {k}: keys={sorted(v.keys()) if isinstance(v, dict) else type(v).__name__}")
                  if isinstance(v, dict):
                      print(f"    sample: {json.dumps(v, ensure_ascii=False)[:400]}")
          PY

          echo ""
          echo "=== history first completed ==="
          curl -s -u "radar:toberich" http://127.0.0.1/crown-radar/api/history | python3 <<'PY'
          import sys, json
          d = json.load(sys.stdin)
          items = d if isinstance(d, list) else d.get("matches", [])
          print("total:", len(items))
          # find completed
          done = [m for m in items if isinstance(m.get("result"), dict) and m["result"].get("status") in ("完","完場")]
          print("completed:", len(done))
          if done:
              m = done[0]
              print("\nkeys:", sorted(m.keys()))
              print("\nresult sample:", json.dumps(m.get("result"), ensure_ascii=False))
              print("\nfull sample (trim):")
              print(json.dumps(m, ensure_ascii=False, indent=2)[:2500])
          PY

          echo ""
          echo "=== opticodds sample (via list_external_tools style) - just check systemd v2 endpoints ==="
          curl -s -u "radar:toberich" "http://127.0.0.1/crown-radar/api/matches-crown?limit=1" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("Fields per snap[initial_AH]:"); i=d[0] if isinstance(d,list) else d.get("matches",[{}])[0]; s=i.get("snapshots",{}); print(json.dumps(s.get("initial_AH") or s.get("T30_AH") or {}, ensure_ascii=False, indent=2))'
          EOF
