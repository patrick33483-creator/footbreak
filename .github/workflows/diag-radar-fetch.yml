name: Diag radar fetch
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-radar-fetch.yml']
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      E: ${{ github.event_name }}
      C: ${{ inputs.confirmation }}
    steps:
      - name: guard
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "RADARF" ]; then exit 1; fi
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: diag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          for D in crown-radar crown-radar-v2 odds-radar; do
            echo "======= /opt/$D ======="
            $SSH "sudo ls /opt/$D 2>&1 | head -30"
            echo
          done
          echo
          echo "=== search radar for titan fetch code ==="
          $SSH 'sudo grep -rlE "AsianOdds_n|OverDown_n|titan|1x2s" /opt/crown-radar /opt/crown-radar-v2 /opt/odds-radar 2>/dev/null | grep -vE "\.pyc|__pycache__|\.log|\.json" | head -30'
          echo
          echo "=== search for HTTP client used ==="
          $SSH 'sudo grep -rlE "requests\.get|httpx|aiohttp|urllib" /opt/crown-radar /opt/crown-radar-v2 /opt/odds-radar 2>/dev/null | grep -vE "\.pyc|__pycache__|\.log|\.json" | head -20'
          echo
          echo "=== crown-radar-v2 systemd service ==="
          $SSH 'sudo systemctl list-units --all --no-pager 2>/dev/null | grep -iE "radar" | head -20'
