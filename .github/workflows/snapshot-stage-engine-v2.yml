name: 抓取 stage-engine-v2 shadow 快照

# 用嚟驗證 v2 shadow deploy 有冇入緑：
# 拉 /var/lib/footbreak/stage_engine_v2/ledger.json 同 /var/www/stage_engine_v2/data.json
# 生成 fixture / stage coverage 摘要

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 抓 v2 ledger + dashboard 摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE' > /tmp/output.txt
          set -e
          echo "===== SERVER TIME ====="
          date -u +%FT%TZ
          TZ=Asia/Hong_Kong date +%FT%T%z

          echo ""
          echo "===== systemd timer status ====="
          systemctl status stage-engine-v2-tick.timer --no-pager 2>/dev/null | head -10 || echo "(timer 未裝)"
          echo ""
          echo "===== timer 最近觸發 ====="
          systemctl list-timers stage-engine-v2-tick.timer --no-pager 2>/dev/null || echo "(list-timers 失敗)"

          echo ""
          echo "===== tick log tail (最近 40 行) ====="
          tail -n 40 /var/log/footbreak/stage-v2-tick.log 2>/dev/null || echo "(log 未存在)"

          echo ""
          echo "===== ledger file 狀態 ====="
          stat -c 'size=%s mtime=%y path=%n' /var/lib/footbreak/stage_engine_v2/ledger.json 2>/dev/null || echo "(ledger 未存在)"
          stat -c 'size=%s mtime=%y path=%n' /var/www/stage_engine_v2/data.json 2>/dev/null || echo "(dashboard data.json 未存在)"

          echo ""
          echo "===== dashboard data.json 摘要 ====="
          if [ -f /var/www/stage_engine_v2/data.json ]; then
            /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from collections import Counter
          d = json.load(open('/var/www/stage_engine_v2/data.json'))
          print(f"generated_at_hkt = {d.get('generated_at_hkt')}")
          print(f"fixtures_count = {d.get('fixtures_count')}")
          stages_count = Counter()
          pub_count = Counter()
          reasons = Counter()
          for fx in d.get('fixtures') or []:
              for stage, row in (fx.get('stages') or {}).items():
                  stages_count[stage] += 1
                  if row.get('publish_decision') is True:
                      pub_count[stage] += 1
                  else:
                      reasons[stage] += 1
          for s in ('首預', 'T-30', 'T-5'):
              print(f"stage {s:6}: fired={stages_count[s]:>4}  推播={pub_count[s]:>4}  被 gate={reasons[s]:>4}")
          # 三 stage 齊備場數
          full = sum(1 for fx in d.get('fixtures') or [] if len(fx.get('stages') or {}) == 3)
          print(f"三 stage 齊備 fixture 數 = {full}")
          PY
          else
            echo "(dashboard payload 未存在——timer 未跑過？)"
          fi

          echo ""
          echo "===== 舊 crown pipeline 依然正常運作 (sanity check) ====="
          stat -c 'size=%s mtime=%y' /var/www/crown/data.json
          stat -c 'size=%s mtime=%y' /opt/footbreak/system/sim_ledger.json 2>/dev/null || echo "(舊 ledger 位置不同)"
          REMOTE
          cat /tmp/output.txt

      - name: 匯出 v2 live data（唯讀）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /var/www/stage_engine_v2/data.json' \
            > /tmp/stage_engine_v2_data.json
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /var/lib/footbreak/stage_engine_v2/ledger.json' \
            > /tmp/stage_engine_v2_ledger.json
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo cat /var/lib/footbreak/stage_engine_v2/operator_results.json 2>/dev/null || printf "{}\n"' \
            > /tmp/stage_engine_v2_operator_results.json
          python3 -m json.tool /tmp/stage_engine_v2_data.json >/dev/null
          python3 -m json.tool /tmp/stage_engine_v2_ledger.json >/dev/null
          python3 -m json.tool /tmp/stage_engine_v2_operator_results.json >/dev/null

      - name: 核對 9 月 5 日 result overlay（唯讀）
        run: |
          python3 - <<'PY'
          import json

          dashboard = json.load(open("/tmp/stage_engine_v2_data.json", encoding="utf-8"))
          overlay = json.load(open(
              "/tmp/stage_engine_v2_operator_results.json", encoding="utf-8"
          ))
          expected_scores = {
              "2999444":"2-1","2999445":"2-1","3073546":"0-2","3017137":"5-1",
              "3017139":"2-0","3017135":"0-0","3074121":"0-2","3011378":"0-3",
              "3072828":"0-0","3017504":"1-1","2952571":"5-0","3074031":"2-0",
              "3046401":"3-2","3022530":"3-1","3074014":"1-1","3067704":"3-0",
              "3040108":"2-0","3040109":"2-0","3044385":"2-2","3037897":"3-3",
              "3040113":"2-1","3037794":"4-0","3021974":"1-4","3034775":"1-2",
              "3062073":"0-0","2998236":"0-2","3026028":"0-3","3077486":"3-3",
              "3062727":"1-1","3062632":"1-1","3000937":"1-1","2939044":"1-1",
              "3027730":"2-1","2939043":"1-1","3019505":"0-2","3071701":"0-3",
              "3083995":"1-0","2997393":"0-0","2957032":"1-2",
          }
          excluded = {"3073570", "3041547", "2920125", "3074431"}
          assert overlay["batch_id"] == "crown-operator-result-overlay-20260905-v1"
          assert len(overlay["results"]) == 79
          observations = dashboard["segmented_conditions"]["matching_observations"]
          actual_scores = {
              str(row["match_id"]): row.get("score")
              for row in observations
              if str(row.get("match_id")) in expected_scores
          }
          assert actual_scores == expected_scores, (actual_scores, expected_scores)
          excluded_rows = [
              row for row in observations if str(row.get("match_id")) in excluded
          ]
          assert {str(row["match_id"]) for row in excluded_rows} == excluded
          assert all(row.get("result_status") == "待賽果" for row in excluded_rows)
          conditions = {
              row["id"]: row["prospective"]
              for row in dashboard["segmented_conditions"]["public_conditions"]
          }
          print(json.dumps({
              "live_verification": "ok",
              "generated_at_hkt": dashboard["generated_at_hkt"],
              "overlay_batch_id": overlay["batch_id"],
              "overlay_fixtures": len(overlay["results"]),
              "new_verified_scores": actual_scores,
              "intentionally_pending": sorted(excluded),
              "conditions": conditions,
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: 上傳快照
        uses: actions/upload-artifact@v4
        with:
          name: stage-v2-snapshot
          path: |
            /tmp/output.txt
            /tmp/stage_engine_v2_data.json
            /tmp/stage_engine_v2_ledger.json
            /tmp/stage_engine_v2_operator_results.json
          retention-days: 7
