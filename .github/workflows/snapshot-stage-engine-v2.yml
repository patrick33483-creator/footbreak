name: 抓取 stage-engine-v2 shadow 快照

# Audit-branch variant: independently recompute Crown V2 public-condition
# performance from the production dashboard payload. Read-only on production.

on:
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 獨立重算 Crown V2 條件表現
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp analysis/audit_crown_v2_condition_performance.py \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/audit_crown_v2_condition_performance.py"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /opt/footbreak/.venv/bin/python3 /tmp/audit_crown_v2_condition_performance.py /var/www/stage_engine_v2/data.json" \
            > /tmp/crown-v2-condition-performance-audit.json
          python3 -m json.tool /tmp/crown-v2-condition-performance-audit.json

      - name: 上傳快照
        uses: actions/upload-artifact@v4
        with:
          name: crown-v2-condition-performance-audit
          path: /tmp/crown-v2-condition-performance-audit.json
          retention-days: 7
