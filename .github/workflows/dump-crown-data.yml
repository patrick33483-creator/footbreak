name: dump crown data.json sample
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/dump-crown-data.yml']
concurrency: {group: production-maintenance, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - run: test "$CONFIRM_INPUT" = "CONFIRM"
      - env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          $SSH bash <<'EOF'
          set +e
          echo "=== data.json meta ==="
          python3 -c "import json;d=json.load(open('/var/www/crown/data.json'));print('keys:',list(d.keys()));print('n_matches:',len(d.get('matches') or []));m=(d.get('matches') or [])[0];print('sample keys:',list(m.keys()));print('sample kickoff_hkt:',m.get('kickoff_hkt'));print('sample titan_match_id:',m.get('titan_match_id'));print('sample stages len:',len(m.get('stages') or []));print('sample stages[0]:',json.dumps((m.get('stages') or [{}])[0],ensure_ascii=False,default=str)[:400])"
          echo ""
          echo "=== ANY match with non-empty market_predictions? ==="
          python3 -c "
          import json
          d=json.load(open('/var/www/crown/data.json'))
          matches=d.get('matches') or []
          hits=[m for m in matches if any((s.get('market_predictions') or []) for s in (m.get('stages') or []))]
          print(f'with_predictions: {len(hits)}/{len(matches)}')
          if hits:
              print(json.dumps(hits[0].get('stages'),ensure_ascii=False,indent=2,default=str)[:1200])
          "
          echo ""
          echo "=== crown scraper service ==="
          systemctl list-units --all --no-pager | grep -iE "crown-sweep|crown-tick|dashboard" | head -10
          echo ""
          echo "=== who writes /var/www/crown/data.json ==="
          find /opt/footbreak -type f \( -name "*.py" \) -exec grep -l "/var/www/crown/data.json" {} \; 2>/dev/null | head -5
          EOF
