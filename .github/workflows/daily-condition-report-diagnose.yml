name: 診斷每日細緻條件報告（只讀）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 讀取排程、送達狀態及報告檔案摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def show(*units):
              command = [
                  "systemctl", "show", *units, "--no-pager",
                  "-p", "Id", "-p", "LoadState", "-p", "UnitFileState",
                  "-p", "ActiveState", "-p", "SubState", "-p", "Result",
                  "-p", "ExecMainStatus", "-p", "LastTriggerUSec",
                  "-p", "NextElapseUSecRealtime",
              ]
              return subprocess.run(
                  command, text=True, capture_output=True, check=False, timeout=10
              ).stdout

          root = Path("/var/lib/footbreak/daily-condition-reports")
          state_path = root / "send-state.json"
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              state = {}
          files = []
          if root.is_dir():
              for path in sorted(root.glob("granular-condition-report-*"))[-4:]:
                  stat = path.stat()
                  files.append({
                      "name": path.name,
                      "size": stat.st_size,
                      "mode": oct(stat.st_mode & 0o777),
                  })
          safe = {
              "window_end": state.get("window_end"),
              "message_sent": state.get("message_sent") is True,
              "document_sent": state.get("document_sent") is True,
              "files": files,
          }
          print(show(
              "footbreak-daily-condition-report.timer",
              "footbreak-daily-condition-report.service",
          ).strip())
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          PY

      - name: 移除 SSH 私鑰
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
