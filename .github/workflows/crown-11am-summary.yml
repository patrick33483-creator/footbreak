name: 皇冠 11:00 更新摘要
on:
  workflow_dispatch:
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp deploy/crown-11am-summary.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/crown-11am-summary.sh"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo cp /tmp/crown-11am-summary.sh /opt/footbreak/deploy/crown-11am-summary.sh && sudo chmod +x /opt/footbreak/deploy/crown-11am-summary.sh && sudo /opt/footbreak/deploy/crown-11am-summary.sh"
