name: 皇冠 T-5 反向馬會比價 Rollout

on:
  workflow_dispatch:
    inputs:
      action:
        description: 執行動作
        required: true
        default: status
        type: choice
        options:
          - status
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  rollout:
    name: 核對或切換反向比價
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 更新並核對伺服器旗標
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo ROLLOUT_ACTION='$ROLLOUT_ACTION' bash -s" <<'REMOTE'
          set -euo pipefail

          cd /opt/footbreak
          env_file=/etc/footbreak-crown.env
          key=CROWN_REVERSE_T5_BRIDGE_ENABLED
          state_dir=/var/lib/footbreak/crown
          python=/opt/footbreak/.venv/bin/python3
          [ -x "$python" ] || python=python3

          case "$ROLLOUT_ACTION" in
            status)
              ;;
            enable|disable)
              value=0
              [ "$ROLLOUT_ACTION" = enable ] && value=1
              tmp="$(mktemp)"
              trap 'rm -f "$tmp"' EXIT
              if [ -f "$env_file" ]; then
                awk -v key="$key" 'index($0, key "=") != 1 { print }' \
                  "$env_file" > "$tmp"
              fi
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              install -o root -g root -m 600 "$tmp" "$env_file"
              rm -f "$tmp"
              trap - EXIT
              if [ "$ROLLOUT_ACTION" = enable ]; then
                CROWN_STATE_DIR="$state_dir" "$python" -m crown.reverse_t5_bridge_health mark-enabled
                systemctl unmask crown-reverse-t5-drain.timer 2>/dev/null || true
                systemctl enable --now crown-reverse-t5-drain.timer
              else
                CROWN_STATE_DIR="$state_dir" "$python" -m crown.reverse_t5_bridge_health mark-disabled
                systemctl disable --now crown-reverse-t5-drain.timer
                systemctl stop crown-reverse-t5-drain.service 2>/dev/null || true
                systemctl reset-failed crown-reverse-t5-drain.service 2>/dev/null || true
              fi
              ;;
            *)
              echo "Unsupported action: $ROLLOUT_ACTION" >&2
              exit 2
              ;;
          esac

          value="$(
            awk -F= -v key="$key" '$1 == key { value=$2 } END { print value }' \
              "$env_file"
          )"
          [ -n "$value" ] || value=0
          printf 'reverse_t5_bridge_enabled=%s\n' "$value"

          for unit in crown-reverse-t5-drain.timer crown-reverse-t5-drain.service; do
            safe_name="$(printf '%s' "$unit" | tr '.-' '__')"
            printf 'reverse_t5_%s_active=%s\n' "$safe_name" \
              "$(systemctl is-active "$unit" || true)"
            printf 'reverse_t5_%s_enabled=%s\n' "$safe_name" \
              "$(systemctl is-enabled "$unit" || true)"
          done

          if [ "$ROLLOUT_ACTION" = enable ]; then
            systemctl is-enabled --quiet crown-reverse-t5-drain.timer
            systemctl is-active --quiet crown-reverse-t5-drain.timer
            if [ -e /run/crown-t5-priority ]; then
              # The service condition deliberately skips optional bridge work
              # while native T-5 owns the state lock.  Do not extend rollout
              # grace for this skip; the timer will retry after priority clears.
              echo "reverse_t5_bridge_worker_triggered=deferred_native_priority"
            else
              # Type=oneshot start waits for a real completion.  A timeout or
              # service error remains non-success; require actual completion
              # telemetry rather than accepting a condition-skip false green.
              systemctl start crown-reverse-t5-drain.service
              CROWN_STATE_DIR="$state_dir" "$python" -m crown.reverse_t5_bridge_health check --require-completion
              echo "reverse_t5_bridge_worker_triggered=completed"
            fi
          fi

          CROWN_STATE_DIR="$state_dir" "$python" - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime
          from pathlib import Path

          from crown.common import HKT, parse_time, read_json

          state_dir = Path("/var/lib/footbreak/crown")
          ledger = read_json(state_dir / "ledger.json", {})
          namespace = (
              ledger.get("crown_reverse_t5_bridge") or {}
              if isinstance(ledger, dict) else {}
          )
          jobs = [
              row for row in namespace.get("jobs") or []
              if isinstance(row, dict)
          ]
          marker = read_json(state_dir / "reverse-t5-bridge-enabled.json", {})
          enabled_at = (
              parse_time(marker.get("enabled_at"))
              if isinstance(marker, dict) else None
          )
          post_enable = [
              row for row in jobs
              if enabled_at is not None
              and (parse_time(row.get("stage_at")) or datetime.min.replace(tzinfo=HKT))
              >= enabled_at
          ]
          states = Counter(str(row.get("state") or "UNKNOWN") for row in jobs)
          post_enable_states = Counter(
              str(row.get("state") or "UNKNOWN") for row in post_enable
          )
          reasons = Counter(
              str((row.get("attempts") or [{}])[-1].get("reason") or "none")
              for row in post_enable
              if row.get("attempts")
          )
          telemetry = read_json(
              state_dir / "reverse-t5-bridge-health.json", {},
          )
          completed_at = (
              parse_time(telemetry.get("last_completed"))
              if isinstance(telemetry, dict) else None
          )
          completion_age = (
              max(0.0, (datetime.now(HKT) - completed_at).total_seconds())
              if completed_at is not None else None
          )
          summary = {
              "reverse_t5_safe_evidence": True,
              "jobs_total": len(jobs),
              "job_states": dict(sorted(states.items())),
              "post_enable_jobs": len(post_enable),
              "post_enable_states": dict(sorted(post_enable_states.items())),
              "post_enable_terminal_reasons": dict(sorted(reasons.items())),
              "worker_last_status": (
                  telemetry.get("last_status")
                  if isinstance(telemetry, dict) else None
              ),
              "worker_last_claimed": (
                  telemetry.get("claimed")
                  if isinstance(telemetry, dict) else None
              ),
              "worker_last_completed": (
                  telemetry.get("completed")
                  if isinstance(telemetry, dict) else None
              ),
              "worker_completion_age_seconds": (
                  round(completion_age, 1)
                  if completion_age is not None else None
              ),
              "worker_consecutive_timeouts": (
                  telemetry.get("consecutive_timeouts")
                  if isinstance(telemetry, dict) else None
              ),
          }
          print(json.dumps(summary, ensure_ascii=True, sort_keys=True))
          PY
          REMOTE
