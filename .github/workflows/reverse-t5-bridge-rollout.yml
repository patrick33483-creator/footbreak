name: 皇冠 T-5 反向馬會比價 Rollout

on:
  workflow_dispatch:
    inputs:
      action:
        description: 執行動作
        required: true
        default: status
        type: choice
        options:
          - status
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  rollout:
    name: 核對或切換反向比價
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 更新並核對伺服器旗標
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ROLLOUT_ACTION: ${{ inputs.action }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo ROLLOUT_ACTION='$ROLLOUT_ACTION' bash -s" <<'REMOTE'
          set -euo pipefail

          env_file=/etc/footbreak-crown.env
          key=CROWN_REVERSE_T5_BRIDGE_ENABLED

          case "$ROLLOUT_ACTION" in
            status)
              ;;
            enable|disable)
              value=0
              [ "$ROLLOUT_ACTION" = enable ] && value=1
              tmp="$(mktemp)"
              trap 'rm -f "$tmp"' EXIT
              if [ -f "$env_file" ]; then
                awk -v key="$key" 'index($0, key "=") != 1 { print }' \
                  "$env_file" > "$tmp"
              fi
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              install -o root -g root -m 600 "$tmp" "$env_file"
              rm -f "$tmp"
              trap - EXIT
              ;;
            *)
              echo "Unsupported action: $ROLLOUT_ACTION" >&2
              exit 2
              ;;
          esac

          value="$(
            awk -F= -v key="$key" '$1 == key { value=$2 } END { print value }' \
              "$env_file"
          )"
          [ -n "$value" ] || value=0
          printf 'reverse_t5_bridge_enabled=%s\n' "$value"

          printf 'crown_sweep_timer_active=%s\n' \
            "$(systemctl is-active crown-sweep.timer || true)"
          printf 'crown_sweep_timer_enabled=%s\n' \
            "$(systemctl is-enabled crown-sweep.timer || true)"
          printf 'crown_tick_timer_active=%s\n' \
            "$(systemctl is-active crown-tick.timer || true)"
          printf 'crown_tick_timer_enabled=%s\n' \
            "$(systemctl is-enabled crown-tick.timer || true)"

          if [ "$ROLLOUT_ACTION" = enable ]; then
            systemctl start --no-block crown-sweep.service
            echo "reverse_t5_bridge_sweep_triggered=yes"
          fi

          for _ in $(seq 1 14); do
            [ "$(systemctl is-active crown-sweep.service || true)" != active ] && break
            sleep 5
          done
          printf 'crown_sweep_service_state=%s\n' \
            "$(systemctl is-active crown-sweep.service || true)"
          systemctl show crown-sweep.service -p Result -p ExecMainStatus --no-pager

          env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path

          from crown.common import HKT, parse_time

          ledger_path = Path("/var/lib/footbreak/crown/ledger.json")
          try:
              ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          except Exception as exc:
              print(json.dumps({
                  "reverse_t5_bridge_ledger_error": type(exc).__name__,
              }))
              raise SystemExit(0)

          jobs_ns = ledger.get("crown_reverse_t5_bridge") or {}
          reciprocal = ledger.get("crown_hkjc_execution_test") or {}
          jobs = jobs_ns.get("jobs") if isinstance(jobs_ns, dict) else []
          jobs = jobs if isinstance(jobs, list) else []
          now = datetime.now(HKT)
          upcoming = []
          for match_id, watch in (ledger.get("watch") or {}).items():
              if not isinstance(watch, dict):
                  continue
              kickoff = parse_time(watch.get("kickoff_hkt") or watch.get("kickoff"))
              if kickoff is None or not (now < kickoff <= now + timedelta(hours=24)):
                  continue
              stages = watch.get("stages") if isinstance(watch.get("stages"), list) else []
              if any(
                  isinstance(stage, dict) and stage.get("stage") == "T-5"
                  for stage in stages
              ):
                  continue
              upcoming.append({
                  "match_id": str(watch.get("match_id") or match_id),
                  "fixture": f"{watch.get('home', '')} vs {watch.get('away', '')}",
                  "kickoff_hkt": kickoff.isoformat(),
                  "minutes_to_t5": round((kickoff - now).total_seconds() / 60 - 5, 1),
              })
          upcoming.sort(key=lambda row: row["kickoff_hkt"])

          print(json.dumps({
              "reverse_t5_bridge": {
                  "schema_version": jobs_ns.get("schema_version"),
                  "jobs": len(jobs),
                  "job_states": dict(Counter(
                      str(row.get("state") or "UNKNOWN")
                      for row in jobs if isinstance(row, dict)
                  )),
                  "latest_job": next((
                      {
                          "state": str(row.get("state") or ""),
                          "stage_at": str(row.get("stage_at") or ""),
                          "completed_at": str(row.get("completed_at") or ""),
                          "last_attempt_reason": str(
                              ((row.get("attempts") or [{}])[-1] or {}).get("reason") or ""
                          ),
                      }
                      for row in reversed(jobs) if isinstance(row, dict)
                  ), None),
              },
              "reciprocal_isolated": {
                  key: len(reciprocal.get(key) or [])
                  for key in (
                      "research_observations", "counterpart_attempts",
                      "decisions", "decision_outbox", "bets",
                  )
              },
              "next_native_t5_windows": upcoming[:8],
          }, ensure_ascii=False))
          PY
          REMOTE
