name: probe cron/timer
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/probe-cron.yml']
concurrency: {group: production-maintenance, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          echo "=== mtime of nginx config ==="
          sudo -n stat /etc/nginx/sites-available/unified-dashboard | grep -E "Modify|Access"
          echo ""
          echo "=== systemd timers ==="
          sudo -n systemctl list-timers --all | grep -Ei "nginx|dashboard|crown|footbreak|v3" | head
          echo ""
          echo "=== recent crontabs ==="
          sudo -n ls -la /etc/cron.d/ 2>&1 | head
          sudo -n crontab -l 2>&1 | head
          echo ""
          echo "=== does file currently contain matches.json exception? ==="
          sudo -n grep -n "crownsystem-v3/matches.json\|crownsystem-v3/history.html\|auth_basic off" /etc/nginx/sites-available/unified-dashboard | head
          echo ""
          echo "=== search for any script that writes to unified-dashboard ==="
          sudo -n grep -rl "unified-dashboard" /etc/ /opt/ /root/ /usr/local/ 2>/dev/null | grep -v backup | head -20
          EOF
