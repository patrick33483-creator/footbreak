name: 診斷生產健康狀態（安全摘要）

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  wilson-pending-detail:
    name: Read-only Wilson pending-detail diagnosis
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 唯讀核對足破條件 7 待合併明細
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            > /tmp/condition-7-pending-detail.json <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          from analysis.wilson_validation import (
              BINARY_DECIDED_RESULTS,
              BINARY_HIT_RESULTS,
              NAMESPACE,
              _eligible_rollover_rows,
              _fixture_market_hash,
              _formal_stage_provenance_valid,
              _now,
              _time,
              active_bets,
              active_observations,
              validate_formal_row,
          )

          ledger = json.loads(Path("/opt/footbreak/system/sim_ledger.json").read_text())
          public = json.loads(Path("/var/www/footbreak/data.json").read_text())
          namespace = ledger[NAMESPACE]
          signature = namespace["condition_order"][6]
          frozen = namespace["conditions"][signature]
          ranking = (
              public.get("prediction_history", {})
              .get("stats", {})
              .get("granular_conditions", {})
              .get("ranking", [])
          )
          card = next(
              row for row in ranking
              if isinstance(row, dict) and int(row.get("condition_number") or 0) == 7
          )
          active = card.get("active_evidence") or {}
          pending = card.get("pending_progress") or {}
          published = card.get("pending_rollover_evidence") or {}
          projection_time = _time(_now())

          raw = [
              row for row in active_bets(ledger, "footbreak")
              + active_observations(ledger, "footbreak")
              if str(row.get("frozen_condition_signature") or "") == signature
          ]
          valid = []
          invalid = Counter()
          for row in raw:
              admitted, reason = validate_formal_row(
                  row,
                  system="footbreak",
                  signature=signature,
                  frozen=frozen,
                  projection_time=projection_time,
                  require_settled=True,
                  ledger=ledger,
              )
              if admitted is None:
                  invalid[str(reason or "unknown")] += 1
              else:
                  valid.append(row)
          eligible, excluded = _eligible_rollover_rows(
              valid, "footbreak", signature, active,
          )
          binding = frozen.get("prospective_matcher_binding")
          epoch = frozen.get("prospective_matcher_epoch")
          epoch_progress = (
              epoch.get("pending_progress")
              if isinstance(epoch, dict) and isinstance(
                  epoch.get("pending_progress"), dict
              )
              else {}
          )
          completed_hashes = {
              value
              for batch in (
                  epoch.get("completed_batches") or []
                  if isinstance(epoch, dict) else []
              )
              if isinstance(batch, dict)
              for value in (batch.get("fixture_market_hashes") or [])
              if isinstance(value, str)
          }
          binding_candidates = []
          for row in raw:
              if (
                  isinstance(binding, dict)
                  and row.get("prospective_matcher_binding") == binding
                  and row.get("status") == "SETTLED"
                  and row.get("result") in BINARY_DECIDED_RESULTS
                  and _formal_stage_provenance_valid(row, "footbreak")
                  and not row.get("post_hoc_backfill")
                  and not row.get("exclude_from_simulation")
              ):
                  fixture_hash = _fixture_market_hash(
                      "footbreak",
                      str(row.get("match_id") or ""),
                      str(row.get("market") or row.get("code") or ""),
                  )
                  if fixture_hash not in completed_hashes:
                      binding_candidates.append((fixture_hash, row))
          binding_candidates.sort(key=lambda item: (
              str((item[1].get("rollover_provenance") or {}).get("stage_at") or ""),
              item[0],
          ))
          public_rows = []
          for _fixture_hash, row in binding_candidates:
              public_rows.append({
                  "league": row.get("league"),
                  "home": row.get("home"),
                  "away": row.get("away"),
                  "kickoff": row.get("kickoff") or row.get("kickoff_hkt"),
                  "stage": row.get("stage"),
                  "market": row.get("market") or row.get("code"),
                  "selected_role": row.get("selected_role"),
                  "selected_side": row.get("selected_side") or row.get("side"),
                  "selected_line": row.get("selected_line", row.get("line")),
                  "odds": row.get("odds"),
                  "result": row.get("result"),
              })
          print(json.dumps({
              "read_only": True,
              "condition_number": 7,
              "condition_signature": signature,
              "summary": {
                  "display": pending.get("display"),
                  "eligible_decided": pending.get("eligible_decided"),
                  "eligible_hits": pending.get("eligible_hits"),
              },
              "published_detail": {
                  "complete": published.get("complete"),
                  "unavailable_reason": published.get("unavailable_reason"),
                  "row_count": len(published.get("rows") or []),
              },
              "reconstruction": {
                  "raw_same_signature": len(raw),
                  "strict_valid": len(valid),
                  "invalid_reasons": dict(invalid),
                  "eligible": len(eligible),
                  "eligible_hits": sum(
                      item["row"].get("result") in {"Won", "Half Won"}
                      for item in eligible
                  ),
                  "excluded": excluded,
              },
              "clean_epoch_reconstruction": {
                  "binding_present": isinstance(binding, dict),
                  "epoch_present": isinstance(epoch, dict),
                  "epoch_progress": {
                      "eligible_decided": epoch_progress.get("eligible_decided"),
                      "eligible_hits": epoch_progress.get("eligible_hits"),
                  },
                  "completed_hashes": len(completed_hashes),
                  "binding_pending_rows": len(binding_candidates),
                  "binding_pending_hits": sum(
                      row.get("result") in BINARY_HIT_RESULTS
                      for _fixture_hash, row in binding_candidates
                  ),
                  "unique_fixture_market_hashes": len({
                      fixture_hash
                      for fixture_hash, _row in binding_candidates
                  }),
              },
              "eligible_public_rows": public_rows,
          }, ensure_ascii=False, indent=2))
          PY

          cat /tmp/condition-7-pending-detail.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("/tmp/condition-7-pending-detail.json").read_text()
          )
          summary = data["summary"]
          reconstructed = data["reconstruction"]
          clean_epoch = data["clean_epoch_reconstruction"]
          published = data["published_detail"]
          rows = data["eligible_public_rows"]

          lines = [
              "# 足破條件 #7：新前瞻待合併逐場唯讀核對",
              "",
              f"- 生產摘要：**{summary.get('display') or 'unavailable'}**",
              (
                  "- 重新嚴格驗證："
                  f"**{reconstructed['eligible']} 場，"
                  f"{reconstructed['eligible_hits']} 中，"
                  f"{reconstructed['eligible'] - reconstructed['eligible_hits']} 失**"
              ),
              (
                  "- 現時 dashboard 明細："
                  f"**{published['row_count']} 場**；"
                  f"complete={published.get('complete')}；"
                  f"reason={published.get('unavailable_reason') or 'none'}"
              ),
              (
                  "- 同條件原始／嚴格有效："
                  f"{reconstructed['raw_same_signature']}／"
                  f"{reconstructed['strict_valid']}"
              ),
              (
                  "- Clean epoch binding cohort："
                  f"**{clean_epoch['binding_pending_rows']} 場，"
                  f"{clean_epoch['binding_pending_hits']} 中，"
                  f"{clean_epoch['binding_pending_rows'] - clean_epoch['binding_pending_hits']} 失**；"
                  f"獨立賽事市場身份 {clean_epoch['unique_fixture_market_hashes']}"
              ),
              "",
          ]
          if reconstructed["invalid_reasons"]:
              lines.extend([
                  "## 被正式驗證拒絕的原因",
                  "",
                  "```json",
                  json.dumps(
                      reconstructed["invalid_reasons"],
                      ensure_ascii=False,
                      indent=2,
                  ),
                  "```",
                  "",
              ])
          lines.extend([
              "## 嚴格合資格逐場名單",
              "",
              "| # | 賽事 | 開賽 | 階段 | 市場／選擇 | 賠率 | 結果 |",
              "|---:|---|---|---|---|---:|---|",
          ])
          for index, row in enumerate(rows, 1):
              match = " vs ".join(
                  value or "?"
                  for value in (row.get("home"), row.get("away"))
              )
              if row.get("league"):
                  match = f"{row['league']} · {match}"
              selection = " · ".join(
                  str(value)
                  for value in (
                      row.get("market"),
                      row.get("selected_role"),
                      row.get("selected_side"),
                      row.get("selected_line"),
                  )
                  if value not in (None, "")
              )
              lines.append(
                  "| {index} | {match} | {kickoff} | {stage} | "
                  "{selection} | {odds} | {result} |".format(
                      index=index,
                      match=match.replace("|", "\\|"),
                      kickoff=str(row.get("kickoff") or "?").replace("|", "\\|"),
                      stage=str(row.get("stage") or "?").replace("|", "\\|"),
                      selection=(selection or "?").replace("|", "\\|"),
                      odds=row.get("odds") if row.get("odds") is not None else "?",
                      result=str(row.get("result") or "?").replace("|", "\\|"),
                  )
              )
          lines.extend([
              "",
              "> 此工作只讀取生產 ledger 及 dashboard JSON；不會寫入、結算、通知或修改任何證據。",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行唯讀健康檢查並發布安全摘要
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/health-check.sh' \
            > /tmp/health-check.log 2>&1
          health_rc=$?
          set -e

          summary="$(
            grep -E -m1 '^(FAIL|ERROR) ' /tmp/health-check.log \
              | tr -cd 'A-Za-z0-9_.:= /-'
          )"
          if [ -z "$summary" ]; then
            if [ "$health_rc" -eq 0 ]; then
              summary="production health check passed"
            else
              summary="production health check failed without classified output"
            fi
          fi
          description="$(printf 'rc=%s %s' "$health_rc" "$summary" | cut -c1-140)"
          state=success
          [ "$health_rc" -eq 0 ] || state=failure

          gh api \
            --method POST \
            "repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$state" \
            -f context="diagnostic/production-health" \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          set +e
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo journalctl -u crown-sweep.service -n 240 --no-pager -o cat" \
            > /tmp/crown-sweep.log 2>/dev/null
          set -e
          origin="$(
            grep -F 'exception_origin' /tmp/crown-sweep.log \
              | tail -n 1 \
              | tr -cd 'A-Za-z0-9_.:= /{}",-' \
              | cut -c1-140
          )"
          [ -n "$origin" ] || origin="no-safe-exception-origin"
          gh api \
            --method POST \
            "repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$state" \
            -f context="diagnostic/crown-sweep-origin" \
            -f description="$(printf '%s' "$origin" | cut -c1-140)" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          exit "$health_rc"
