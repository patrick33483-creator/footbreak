name: Diag Radar Vip
on:
  workflow_dispatch:
    inputs:
      confirm: {description: 'CONFIRM', required: true}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-radar-vip.yml']

concurrency: {group: production-maintenance, cancel-in-progress: false}

jobs:
  diag:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - name: Guard
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - name: SSH
        env:
          SSHKEY: ${{ secrets.DEPLOY_SSH_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          $SSH bash <<'EOF'
          set +e
          echo "=== 1. Crown-radar 所有 titan-related files ==="
          find /opt/crown-radar -type f \( -name "*.ts" -o -name "*.js" \) | xargs grep -l "titan007\|vip.titan" 2>/dev/null | head -20
          
          echo ""
          echo "=== 2. All titan URLs in crown-radar code ==="
          grep -rhE "https?://[^\"']*titan007[^\"']*" /opt/crown-radar/ 2>/dev/null | sort -u | head -30
          
          echo ""
          echo "=== 3. crown-radar systemd service log (last 200 lines, filter titan/http) ==="
          sudo journalctl -u crown-radar --since "24 hours ago" 2>/dev/null | grep -iE "titan|http|vip|error|timeout|fetch|200|404|500" | tail -50
          
          echo ""
          echo "=== 4. Crown-radar systemd services ==="
          systemctl list-units --all --no-pager | grep -i radar | head -10
          
          echo ""
          echo "=== 5. crown-radar 用嘅 fetch code (titan-corners.ts) ==="
          if [[ -f /opt/crown-radar/server/providers/titan-corners.ts ]]; then
            cat /opt/crown-radar/server/providers/titan-corners.ts | head -60
          fi
          
          echo ""
          echo "=== 6. Test curl from prod: try each titan host again with browser headers ==="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for host in vip.titan007.com bf.titan007.com 1x2.titan007.com data.titan007.com m.titan007.com zq.titan007.com; do
            code=$(curl -o /dev/null -s -w "%{http_code}|%{time_total}s" --max-time 10 --http1.1 -H "User-Agent: $UA" -H "Referer: https://live.titan007.com/" "https://$host/" 2>&1)
            echo "$host: $code"
          done
          
          echo ""
          echo "=== 7. Test corner URL specifically (crown-radar uses this) ==="
          curl -o /dev/null -s -w "Corner HTTP=%{http_code} time=%{time_total}s size=%{size_download}\n" --max-time 15 --http1.1 \
            -H "User-Agent: $UA" -H "Referer: https://live.titan007.com/" \
            "https://vip.titan007.com/Corner.aspx?id=2910886"
          EOF
