name: Footbreak condition 17 production preflight (read only)

on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: Exact reviewed 40-hex commit deployed at /opt/footbreak
        required: true
        type: string
      expected_wilson_validation_sha256:
        description: Reviewed SHA-256 of deployed analysis/wilson_validation.py
        required: true
        type: string
      expected_repository_tree:
        description: Exact reviewed Git tree object for the deployed commit
        required: true
        type: string
      expected_manifest_hash:
        description: Trusted canonical production identity manifest SHA-256
        required: true
        type: string
      expected_condition_signature:
        description: Trusted 24-character canonical condition 17 signature
        required: true
        type: string
      expected_initial_evidence_hash:
        description: Trusted condition 17 initial evidence SHA-256
        required: true
        type: string
      ssh_port:
        description: Reviewed production SSH port bound by the pinned host key
        required: true
        default: "22"
        type: string

permissions:
  contents: read

concurrency:
  # Deployment uses this same group.  The immutable verification/capture cannot
  # overlap a reset of /opt/footbreak.
  group: production-maintenance
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only condition 17 preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PREFLIGHT_DIR: ${{ runner.temp }}/footbreak-condition17-preflight-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Verify dispatched commit and reviewed code
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          EXPECTED_VALIDATION_SHA: ${{ inputs.expected_wilson_validation_sha256 }}
          EXPECTED_REPOSITORY_TREE: ${{ inputs.expected_repository_tree }}
          EXPECTED_MANIFEST_HASH: ${{ inputs.expected_manifest_hash }}
          EXPECTED_CONDITION_SIGNATURE: ${{ inputs.expected_condition_signature }}
          EXPECTED_INITIAL_EVIDENCE_HASH: ${{ inputs.expected_initial_evidence_hash }}
          DEPLOY_PORT: ${{ inputs.ssh_port }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_VALIDATION_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REPOSITORY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MANIFEST_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CONDITION_SIGNATURE" =~ ^[0-9a-f]{24}$ ]]
          [[ "$EXPECTED_INITIAL_EVIDENCE_HASH" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          test "$DEPLOY_PORT" -ge 1
          test "$DEPLOY_PORT" -le 65535
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_DEPLOYED_SHA"
          test "$(git rev-parse "${EXPECTED_DEPLOYED_SHA}^{tree}")" = \
            "$EXPECTED_REPOSITORY_TREE"
          timeout 60s git fsck --strict --no-dangling --no-reflogs \
            "$EXPECTED_REPOSITORY_TREE" >/dev/null 2>&1
          git diff-index --cached --quiet "$EXPECTED_DEPLOYED_SHA" --
          git diff-files --quiet --
          test "$(sha256sum analysis/wilson_validation.py | awk '{print $1}')" = \
            "$EXPECTED_VALIDATION_SHA"
          test -s deploy/condition17-production-preflight.py
          test -s deploy/capture-condition17-production-snapshot.py
          test -s deploy/verify_ssh_host_key.py
          timeout 30s python3 -m py_compile \
            deploy/condition17-production-preflight.py \
            deploy/capture-condition17-production-snapshot.py \
            deploy/verify_ssh_host_key.py

      - name: Configure independently pinned SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_SSH_HOST_FINGERPRINT: ${{ secrets.DEPLOY_SSH_HOST_FINGERPRINT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ inputs.ssh_port }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$PREFLIGHT_DIR"
          install -d -m 700 "$PREFLIGHT_DIR"
          cleanup_on_error() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              rm -rf -- "$PREFLIGHT_DIR"
            fi
            trap - EXIT HUP INT TERM
            exit "$rc"
          }
          trap cleanup_on_error EXIT
          trap 'exit 130' HUP INT TERM
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$PREFLIGHT_DIR/id_ed25519"
          chmod 600 "$PREFLIGHT_DIR/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$PREFLIGHT_DIR/known_hosts"
          chmod 600 "$PREFLIGHT_DIR/known_hosts"
          timeout 30s python3 deploy/verify_ssh_host_key.py \
            --known-hosts "$PREFLIGHT_DIR/known_hosts" \
            --host "$DEPLOY_HOST" --port "$DEPLOY_PORT" \
            --expected-fingerprint "$DEPLOY_SSH_HOST_FINGERPRINT"
          trap - EXIT HUP INT TERM

      - name: Verify deployed code and run immutable snapshot preflight
        id: check
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ inputs.ssh_port }}
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          EXPECTED_VALIDATION_SHA: ${{ inputs.expected_wilson_validation_sha256 }}
          EXPECTED_REPOSITORY_TREE: ${{ inputs.expected_repository_tree }}
          EXPECTED_MANIFEST_HASH: ${{ inputs.expected_manifest_hash }}
          EXPECTED_CONDITION_SIGNATURE: ${{ inputs.expected_condition_signature }}
          EXPECTED_INITIAL_EVIDENCE_HASH: ${{ inputs.expected_initial_evidence_hash }}
        run: |
          set -euo pipefail
          umask 077
          snapshot="$PREFLIGHT_DIR/sim-ledger.snapshot"
          summary="$PREFLIGHT_DIR/condition17-production-preflight-summary.json"
          activation_marker="$PREFLIGHT_DIR/condition17.synthetic-activation.json"
          cleanup_snapshot() {
            if [ -e "$snapshot" ] || [ -L "$snapshot" ]; then
              chmod 600 "$snapshot" 2>/dev/null || true
              rm -f -- "$snapshot"
            fi
            rm -f -- \
              "$PREFLIGHT_DIR/id_ed25519" "$PREFLIGHT_DIR/known_hosts"
            rm -f -- "$activation_marker"
          }
          trap cleanup_snapshot EXIT
          trap 'exit 130' HUP INT TERM
          set -C
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            ssh -p "$DEPLOY_PORT" \
              -i "$PREFLIGHT_DIR/id_ed25519" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              -o ConnectionAttempts=1 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$PREFLIGHT_DIR/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo python3 - --lock /var/lock/footbreak.lock \
               --ledger /opt/footbreak/system/sim_ledger.json \
               --repo /opt/footbreak \
               --expected-commit '$EXPECTED_DEPLOYED_SHA' \
               --expected-tree '$EXPECTED_REPOSITORY_TREE' \
               --expected-validation-sha256 '$EXPECTED_VALIDATION_SHA' \
               --activation-marker /var/lib/footbreak/activation/condition17-legacy-cohort-v1.json \
               --lock-timeout 120" \
              < deploy/capture-condition17-production-snapshot.py \
              > "$snapshot"
          capture_rc=$?
          set -e
          if [ "$capture_rc" -ne 0 ]; then
            rm -f -- "$snapshot"
            python3 - "$summary" <<'PY'
          import json
          import os
          import stat
          import sys

          path = sys.argv[1]
          payload = json.dumps({
              "production_mutation": False,
              "read_only": True,
              "reason": "immutable_snapshot_or_deployed_code_verification_failed",
              "result": "NO-GO",
              "schema": "footbreak-condition17-production-preflight-v1",
              "synthetic_data_output": False,
          }, sort_keys=True).encode() + b"\n"
          fd = os.open(
              path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
              0o400,
          )
          try:
              os.fchmod(fd, 0o400)
              written = 0
              while written < len(payload):
                  count = os.write(fd, payload[written:])
                  if count <= 0:
                      raise RuntimeError("short summary write")
                  written += count
              os.fsync(fd)
              info = os.fstat(fd)
              path_info = os.lstat(path)
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_nlink != 1
                  or stat.S_IMODE(info.st_mode) != 0o400
                  or (path_info.st_dev, path_info.st_ino)
                  != (info.st_dev, info.st_ino)
                  or path_info.st_nlink != 1
                  or info.st_size != len(payload)
              ):
                  raise RuntimeError("unsafe summary output")
          finally:
              os.close(fd)
          PY
            exit 1
          fi
          chmod 400 "$snapshot"
          python3 - "$activation_marker" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          payload = json.dumps({
              "schema": "footbreak-condition17-legacy-cohort-v1",
              "wilson_validation_sha256": hashlib.sha256(
                  Path("analysis/wilson_validation.py").read_bytes(),
              ).hexdigest(),
              "quarter_line_sha256": hashlib.sha256(
                  Path("analysis/quarter_line.py").read_bytes(),
              ).hexdigest(),
          }, sort_keys=True, separators=(",", ":")).encode() + b"\n"
          fd = os.open(
              path,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC,
              0o400,
          )
          try:
              offset = 0
              while offset < len(payload):
                  written = os.write(fd, payload[offset:])
                  if written <= 0:
                      raise RuntimeError("short activation marker write")
                  offset += written
              os.fsync(fd)
              info = os.fstat(fd)
              current = os.lstat(path)
              if (
                  not stat.S_ISREG(info.st_mode)
                  or info.st_nlink != 1
                  or stat.S_IMODE(info.st_mode) != 0o400
                  or (current.st_dev, current.st_ino) != (info.st_dev, info.st_ino)
              ):
                  raise RuntimeError("unsafe synthetic activation marker")
          finally:
              os.close(fd)
          PY
          timeout --signal=TERM --kill-after=10s 180s \
            python3 deploy/condition17-production-preflight.py \
              --ledger "$snapshot" \
              --expected-manifest-hash "$EXPECTED_MANIFEST_HASH" \
              --expected-condition-signature "$EXPECTED_CONDITION_SIGNATURE" \
              --expected-initial-evidence-hash "$EXPECTED_INITIAL_EVIDENCE_HASH" \
              --activation-marker "$activation_marker" \
              --output "$summary"

      - name: Print bounded preflight result
        if: always()
        run: |
          set -euo pipefail
          summary="$PREFLIGHT_DIR/condition17-production-preflight-summary.json"
          test -f "$summary"
          test ! -L "$summary"
          test "$(stat -c '%h %a' "$summary")" = "1 400"
          printf '%s\n' 'CONDITION17_PRODUCTION_PREFLIGHT_BEGIN'
          cat "$summary"
          printf '%s\n' 'CONDITION17_PRODUCTION_PREFLIGHT_END'

      - name: Upload bounded preflight result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: condition17-production-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/footbreak-condition17-preflight-${{ github.run_id }}/condition17-production-preflight-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce GO
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          set -euo pipefail
          timeout 30s python3 - "$PREFLIGHT_DIR/condition17-production-preflight-summary.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              os.environ.get("CHECK_OUTCOME") != "success"
              or result.get("result") != "GO"
              or result.get("read_only") is not True
              or result.get("production_mutation") is not False
              or result.get("synthetic_data_output") is not False
          ):
              raise SystemExit("NO-GO")
          PY

      - name: Remove all preflight credentials and intermediates
        if: always()
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            trap - EXIT HUP INT TERM
            test -n "${RUNNER_TEMP:-}"
            test -n "${GITHUB_RUN_ID:-}"
            case "$PREFLIGHT_DIR" in
              "$RUNNER_TEMP"/footbreak-condition17-preflight-"$GITHUB_RUN_ID") ;;
              *) exit 2 ;;
            esac
            rm -rf -- "$PREFLIGHT_DIR"
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM
