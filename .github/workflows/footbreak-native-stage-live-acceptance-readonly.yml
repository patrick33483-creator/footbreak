name: Footbreak native-stage live acceptance (read only)

on:
  workflow_dispatch:
  push:
    branches:
      - audit/footbreak-native-stage-state-20260822

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Read normalized native evidence only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak/system:/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            > footbreak-native-stage-live-acceptance.json <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path
          from native_stage_state import HKT, completeness_projection, latest_attempts, parse_time

          ledger = json.loads(Path("/opt/footbreak/system/sim_ledger.json").read_text(encoding="utf-8"))
          now = datetime.now(HKT)
          projection = completeness_projection(ledger, now=now)
          all_attempts = [row for row in ledger.get("native_stage_attempts", []) if isinstance(row, dict)]
          jobs = [row for row in ledger.get("native_post_commit_jobs", []) if isinstance(row, dict)]
          attempts_by_key = defaultdict(list)
          for row in all_attempts:
              key = (str(row.get("hkjc_match_id") or ""), str(row.get("kickoff_at_utc") or ""), str(row.get("stage") or ""))
              if all(key):
                  attempts_by_key[key].append(row)
          jobs_by_id = defaultdict(list)
          for row in jobs:
              jobs_by_id[str(row.get("job_id") or "")].append(row)

          def safe_market(row):
              if not isinstance(row, dict):
                  return None
              return {key: row.get(key) for key in (
                  "code", "market", "condition", "line", "side", "odds",
                  "odds_status", "odds_reason", "source", "provider",
                  "observed_at", "observed_board_at",
              )}

          def safe_attempt(row):
              return {key: row.get(key) for key in (
                  "attempt_id", "status", "at", "hkjc_match_id",
                  "kickoff_at_utc", "kickoff_at_hkt", "stage",
                  "due_at_utc", "due_at_hkt", "reason",
              )}

          def safe_job(row):
              return {key: row.get(key) for key in (
                  "job_id", "status", "at", "match_id", "stage",
                  "snapshot_id", "t5_safe_to_evaluate", "reason",
              )}

          fixture_rows = []
          violations = []
          watches = ledger.get("watch") if isinstance(ledger.get("watch"), dict) else {}
          for projected in projection["fixtures"]:
              match_id = str(projected["hkjc_match_id"])
              kickoff_utc = str(projected["kickoff_at_utc"])
              watch = watches.get(match_id)
              if not isinstance(watch, dict):
                  continue
              kickoff = parse_time(kickoff_utc)
              stage_evidence = {}
              for stage in ("T-30", "T-5"):
                  snapshots = [
                      row for row in (watch.get("stages") or [])
                      if isinstance(row, dict) and str(row.get("stage") or "") == stage
                  ]
                  snapshot = snapshots[-1] if snapshots else None
                  attempt_history = [
                      safe_attempt(row) for row in attempts_by_key[(match_id, kickoff_utc, stage)]
                  ]
                  native_snapshot_id = str(snapshot.get("native_snapshot_id") or "") if isinstance(snapshot, dict) else ""
                  job_id = f"{match_id}:{native_snapshot_id}" if native_snapshot_id else ""
                  optional_history = [safe_job(row) for row in jobs_by_id[job_id]]
                  snapshot_time = parse_time(snapshot.get("ts")) if isinstance(snapshot, dict) else None
                  if snapshot_time and kickoff and snapshot_time.astimezone(timezone.utc) >= kickoff.astimezone(timezone.utc):
                      violations.append({"kind": "post_kickoff_snapshot", "match_id": match_id, "stage": stage})
                  for event in attempts_by_key[(match_id, kickoff_utc, stage)]:
                      event_time = parse_time(event.get("at"))
                      status = str(event.get("status") or "")
                      if event_time and kickoff and status != "EXPIRED" and event_time.astimezone(timezone.utc) >= kickoff.astimezone(timezone.utc):
                          violations.append({"kind": "post_kickoff_nonexpiry_attempt", "match_id": match_id, "stage": stage, "status": status})
                  stage_evidence[stage] = {
                      "projection": projected["stages"][stage],
                      "snapshot": None if not isinstance(snapshot, dict) else {
                          "stage": snapshot.get("stage"),
                          "native_snapshot_id": native_snapshot_id,
                          "saved_at": snapshot.get("ts"),
                          "match_id": snapshot.get("match_id"),
                          "kickoff_at_utc": snapshot.get("kickoff_at_utc"),
                          "kickoff_at_hkt": snapshot.get("kickoff_at_hkt"),
                          "due_at_utc": snapshot.get("due_at_utc"),
                          "due_at_hkt": snapshot.get("due_at_hkt"),
                          "prediction": snapshot.get("pick") or snapshot.get("lead"),
                          "markets": [safe_market(item) for item in (snapshot.get("market_predictions") or [])],
                          "selected_odds": [safe_market(item) for item in (snapshot.get("selected_odds_journal") or [])],
                          "source": snapshot.get("source"),
                          "source_status": snapshot.get("source_status"),
                          "odds_status": snapshot.get("odds_status"),
                          "odds_reason": snapshot.get("odds_reason"),
                      },
                      "attempt_history": attempt_history,
                      "optional_job_history": optional_history,
                      "optional_job_present_for_native_snapshot": bool(native_snapshot_id and optional_history),
                  }
              fixture_rows.append({
                  "hkjc_match_id": match_id,
                  "kickoff_at_utc": projected["kickoff_at_utc"],
                  "kickoff_at_hkt": projected["kickoff_at_hkt"],
                  "manifest_origin": projected["origin"],
                  "stages": stage_evidence,
              })
          print(json.dumps({
              "ok": True,
              "audit_kind": "provider_safe_read_only_native_acceptance",
              "generated_at_hkt": now.isoformat(),
              "projection_counts": projection["counts"],
              "fixtures": fixture_rows,
              "native_attempt_event_count": len(all_attempts),
              "optional_job_event_count": len(jobs),
              "post_kickoff_violations": violations,
          }, ensure_ascii=False, default=str))
          PY
          python3 -m json.tool footbreak-native-stage-live-acceptance.json

      - name: Upload read-only acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: footbreak-native-stage-live-acceptance
          path: footbreak-native-stage-live-acceptance.json
          retention-days: 7
