name: Patch wilson soft skip

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dryrun 或 apply"
        required: true
        type: choice
        options: [dryrun, apply]
      confirmation:
        description: "apply 模式打 PATCH_APPLY"
        required: false
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/patch-wilson-soft-20260908.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          M: ${{ inputs.mode }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$M" = "apply" ] && [ "$C" != "PATCH_APPLY" ]; then
            echo "apply mode requires PATCH_APPLY"; exit 1
          fi
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ inputs.mode }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "MODE='$MODE' sudo -E bash -s" <<'REMOTE'
          set -e
          TS=$(date +%Y%m%d-%H%M%S)
          FILE=/opt/footbreak/analysis/wilson_validation.py
          
          echo "===== Current code around line 4630-4645 ====="
          sed -n '4628,4645p' "$FILE"
          
          # Build patched version with Python (safer than sed for multi-line)
          python3 <<'PYPATCH'
          import re, shutil, os
          
          FILE = "/opt/footbreak/analysis/wilson_validation.py"
          MODE = os.environ.get('MODE', 'dryrun')
          
          src = open(FILE).read()
          
          # Pattern: within recompute_namespace, replace the raise ValueError
          # for migration_reason with a soft-skip that logs and continues
          old = (
              "    retired, migration_reason = _validate_condition_identity_migrations(\n"
              "        ledger, system, authority_context=authority_context,\n"
              "    )\n"
              "    if retired is None:\n"
              "        raise ValueError(\n"
              "            migration_reason or \"condition identity migration metadata invalid\"\n"
              "        )\n"
          )
          new = (
              "    retired, migration_reason = _validate_condition_identity_migrations(\n"
              "        ledger, system, authority_context=authority_context,\n"
              "    )\n"
              "    if retired is None:\n"
              "        # SOFT-SKIP 20260907: hard-fail was blocking sweep/settle because\n"
              "        # ledger lacks migration document; log and continue with empty\n"
              "        # retired set so recompute can proceed and dashboard can publish.\n"
              "        import sys\n"
              "        print(\n"
              "            f\"[wilson_validation] soft-skip migration check: \"\n"
              "            f\"{migration_reason or 'invalid'} (system={system})\",\n"
              "            file=sys.stderr,\n"
              "        )\n"
              "        retired = frozenset()\n"
          )
          
          if old not in src:
              print("ERROR: exact pattern not found; aborting")
              raise SystemExit(2)
          
          patched = src.replace(old, new, 1)
          
          if MODE == 'apply':
              shutil.copy(FILE, FILE + f".backup-soft-skip")
              open(FILE, "w").write(patched)
              print(f"APPLIED. Backup: {FILE}.backup-soft-skip")
              print("=== NEW LINES ===")
              # show new section
              new_src = open(FILE).read()
              idx = new_src.find("SOFT-SKIP 20260907")
              if idx > 0:
                  # find start of block
                  start = new_src.rfind("retired, migration_reason", 0, idx)
                  end = new_src.find("ns = ensure_namespace", idx)
                  print(new_src[start:end])
          else:
              print("DRYRUN. Would replace:")
              print("--- OLD ---")
              print(old)
              print("--- NEW ---")
              print(new)
          PYPATCH
          
          if [ "$MODE" = "apply" ]; then
            echo
            echo "===== Verify Python still parses ====="
            /opt/footbreak/.venv/bin/python3 -c "import ast; ast.parse(open('/opt/footbreak/analysis/wilson_validation.py').read()); print('OK: parses')"
            
            echo
            echo "===== Manual trigger footbreak-sweep to test ====="
            systemctl start footbreak-sweep.service
            sleep 30
            echo "--- status ---"
            systemctl status footbreak-sweep.service --no-pager | head -8
            echo "--- recent journal ---"
            journalctl -u footbreak-sweep.service -n 30 --no-pager | tail -30
            
            echo
            echo "===== Manual trigger crown-sweep to test ====="
            systemctl start crown-sweep.service
            sleep 30
            echo "--- status ---"
            systemctl status crown-sweep.service --no-pager | head -8
            
            echo
            echo "===== data.json fresh? ====="
            ls -la /var/www/stage_engine_v2/data.json
            python3 -c "
            import json
            d = json.load(open('/var/www/stage_engine_v2/data.json'))
            print('generated:', d.get('generated_at_utc'))
            print('fixtures:', len(d.get('fixtures',[])))
            "
            
            echo
            echo "===== Failed units after patch ====="
            systemctl --failed --no-pager
          fi
          REMOTE
