name: Crown dashboard durable-stage audit (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Compare public Crown snapshot with durable native stages
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            > crown-dashboard-durable-audit.json <<'PY'
          import json
          import os
          import subprocess
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path

          from crown.common import HKT, parse_time

          def read_json(path, default):
              try:
                  value = json.loads(Path(path).read_text(encoding="utf-8"))
                  return value
              except Exception:
                  return default

          def stages(row):
              return [
                  {
                      "stage": str(value.get("stage") or ""),
                      "status": str(value.get("status") or ""),
                      "ts": str(value.get("ts") or ""),
                  }
                  for value in (row.get("stages") or [])
                  if isinstance(value, dict)
                  and str(value.get("stage") or "") in {"首預", "T-30", "T-5"}
              ]

          def identity(row):
              return (
                  str(row.get("match_id") or "").strip(),
                  str(row.get("kickoff_hkt") or row.get("kickoff") or "").strip(),
              )

          now = datetime.now(HKT)
          horizon_start = now - timedelta(hours=48)
          horizon_end = now + timedelta(hours=24)
          ledger = read_json("/var/lib/footbreak/crown/ledger.json", {})
          cards = read_json("/var/lib/footbreak/crown/predictions.json", [])
          public_path = Path("/var/www/crown/data.json")
          public = read_json(str(public_path), {})
          watches = ledger.get("watch") if isinstance(ledger, dict) else {}
          watches = watches if isinstance(watches, dict) else {}
          cards = cards if isinstance(cards, list) else []
          public_cards = public.get("matches") if isinstance(public, dict) else []
          public_cards = public_cards if isinstance(public_cards, list) else []
          cards_by_id = {
              str(row.get("match_id") or "").strip(): row
              for row in cards if isinstance(row, dict) and row.get("match_id")
          }
          public_by_id = {
              str(row.get("match_id") or "").strip(): row
              for row in public_cards if isinstance(row, dict) and row.get("match_id")
          }
          generated_at = parse_time(public.get("generated_at")) if isinstance(public, dict) else None
          affected = []
          rows = []
          durable_t5 = 0
          public_t5 = 0
          for match_id, watch in watches.items():
              if not isinstance(watch, dict):
                  continue
              card = cards_by_id.get(str(match_id), {})
              kickoff = parse_time(
                  card.get("kickoff_hkt") or card.get("kickoff")
                  or watch.get("kickoff_hkt") or watch.get("kickoff")
              )
              if kickoff is None or kickoff < horizon_start or kickoff > horizon_end:
                  continue
              durable = stages(watch)
              if not any(value["stage"] == "T-5" for value in durable):
                  continue
              durable_t5 += 1
              public_card = public_by_id.get(str(match_id), {})
              public_stages = stages(public_card) if isinstance(public_card, dict) else []
              if any(value["stage"] == "T-5" for value in public_stages):
                  public_t5 += 1
              snapshot = {
                  "match_id": str(match_id),
                  "fixture": f"{card.get('home') or watch.get('home') or ''} vs {card.get('away') or watch.get('away') or ''}",
                  "league": str(card.get("league") or watch.get("league") or ""),
                  "kickoff_hkt": kickoff.astimezone(HKT).isoformat(),
                  "durable_stages": durable,
                  "card_stages": stages(card) if isinstance(card, dict) else [],
                  "public_stages": public_stages,
                  "public_card_present": bool(public_card),
              }
              t5 = next(value for value in durable if value["stage"] == "T-5")
              t5_at = parse_time(t5["ts"])
              mismatch = (
                  not public_card
                  or not any(value["stage"] == "T-5" for value in public_stages)
                  or (
                      generated_at is not None and t5_at is not None
                      and generated_at < t5_at
                  )
              )
              if mismatch:
                  snapshot["reason"] = (
                      "public_card_missing" if not public_card else
                      "public_t5_missing" if not any(value["stage"] == "T-5" for value in public_stages) else
                      "public_generated_before_durable_t5"
                  )
                  affected.append(snapshot)
              rows.append(snapshot)
          timers = subprocess.run(
              [
                  "systemctl", "show", "crown-tick.timer", "crown-sweep.timer",
                  "crown-tick.service", "crown-dashboard-api.service",
                  "--no-pager", "-p", "Id", "-p", "ActiveState", "-p", "SubState",
                  "-p", "Result", "-p", "LastTriggerUSec", "-p", "NextElapseUSecRealtime",
              ],
              text=True, capture_output=True, check=False, timeout=20,
          ).stdout[-8000:]
          sha = subprocess.run(
              ["git", "-C", "/opt/footbreak", "rev-parse", "HEAD"],
              text=True, capture_output=True, check=False, timeout=10,
          ).stdout.strip()
          print(json.dumps({
              "mode": "provider_free_read_only",
              "at": now.isoformat(),
              "server_sha": sha,
              "public": {
                  "schema_version": public.get("schema_version") if isinstance(public, dict) else None,
                  "generated_at": public.get("generated_at") if isinstance(public, dict) else None,
                  "mtime_hkt": datetime.fromtimestamp(public_path.stat().st_mtime, HKT).isoformat(),
                  "card_count": len(public_cards),
              },
              "window": {"start_hkt": horizon_start.isoformat(), "end_hkt": horizon_end.isoformat()},
              "counts": {
                  "durable_native_t5": durable_t5,
                  "public_t5": public_t5,
                  "affected": len(affected),
                  "durable_statuses": Counter(value["status"] for row in rows for value in row["durable_stages"]).most_common(),
              },
              "affected": affected,
              "durable_t5_rows": rows,
              "timers": timers,
          }, ensure_ascii=False, indent=2))
          PY
          python3 -m json.tool crown-dashboard-durable-audit.json >/dev/null

      - name: Inspect live Crown evidence expansion inputs
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /bin/sh -s' \
            > crown-evidence-expansion-audit.txt <<'REMOTE'
          set -eu
          cd /opt/footbreak
          printf 'server_sha=%s\n' "$(git rev-parse HEAD)"
          printf 'asset_file_sha256=%s\n' "$(sha256sum /var/www/crown/app.js | awk '{print $1}')"
          printf 'asset_helper_count=%s\n' "$(grep -c 'function evidenceBatchDetails' /var/www/crown/app.js || true)"
          printf 'asset_toggle_count=%s\n' "$(grep -c 'evidence-batch-toggle-' /var/www/crown/app.js || true)"
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/var/www/crown/data.json").read_text(encoding="utf-8"))

          def find_key(value, key, path="$"):
              hits = []
              if isinstance(value, dict):
                  if key in value:
                      hits.append((path, value[key]))
                  for child_key, child_value in value.items():
                      hits.extend(find_key(child_value, key, f"{path}.{child_key}"))
              elif isinstance(value, list):
                  for index, child_value in enumerate(value):
                      hits.extend(find_key(child_value, key, f"{path}[{index}]"))
              return hits

          granular_hits = find_key(payload, "granular_conditions")
          detail_hits = find_key(payload, "last_merged_evidence")
          print(f"granular_conditions_paths={len(granular_hits)}")
          print(f"last_merged_evidence_paths={len(detail_hits)}")

          for path, granular in granular_hits:
              ranking = granular.get("ranking", []) if isinstance(granular, dict) else []
              print(f"ranking_path={path}.ranking")
              print(f"ranking_count={len(ranking) if isinstance(ranking, list) else 0}")
              if not isinstance(ranking, list):
                  continue
              for item in ranking:
                  if not isinstance(item, dict):
                      continue
                  detail = item.get("last_merged_evidence")
                  number = item.get("condition_number")
                  if number != 4 and not isinstance(detail, dict):
                      continue
                  rows = detail.get("rows") if isinstance(detail, dict) else None
                  print(json.dumps({
                      "condition_number": number,
                      "active_version": (item.get("active_evidence") or {}).get("version"),
                      "detail_version": detail.get("version") if isinstance(detail, dict) else None,
                      "complete": detail.get("complete") if isinstance(detail, dict) else None,
                      "expected_decided": detail.get("expected_decided") if isinstance(detail, dict) else None,
                      "expected_hits": detail.get("expected_hits") if isinstance(detail, dict) else None,
                      "rows_count": len(rows) if isinstance(rows, list) else None,
                      "unavailable_reason": detail.get("unavailable_reason") if isinstance(detail, dict) else None,
                  }, ensure_ascii=False, sort_keys=True))
          PY
          REMOTE

      - name: Compare live Wilson 1.80 readiness
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /bin/sh -s' \
            > wilson-180-readiness.json <<'REMOTE'
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = {"mode": "provider_free_read_only", "systems": {}}
          for system in ("footbreak", "crown"):
              payload = json.loads(
                  Path(f"/var/www/{system}/data.json").read_text(encoding="utf-8")
              )
              granular = (
                  ((payload.get("prediction_history") or {}).get("stats") or {})
                  .get("granular_conditions") or {}
              )
              ranking = granular.get("ranking") or []
              rows = []
              for item in ranking:
                  if not isinstance(item, dict):
                      continue
                  active = item.get("active_evidence") or {}
                  pending = item.get("pending_progress") or item.get("validation_progress") or {}
                  rows.append({
                      "condition_number": item.get("condition_number"),
                      "active_version": active.get("version"),
                      "cumulative_hits": active.get("cumulative_hits"),
                      "cumulative_decided": active.get("cumulative_decided"),
                      "wilson95_lower_raw": active.get("wilson95_lower_raw"),
                      "minimum_acceptable_odds_raw": active.get("minimum_acceptable_odds_raw"),
                      "minimum_acceptable_odds_display": active.get("minimum_acceptable_odds_display"),
                      "pending_progress": pending,
                  })
              output["systems"][system] = rows
          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY
          REMOTE
          python3 -m json.tool wilson-180-readiness.json >/dev/null

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: crown-dashboard-durable-audit-${{ github.run_id }}
          path: |
            crown-dashboard-durable-audit.json
            crown-evidence-expansion-audit.txt
            wilson-180-readiness.json
          retention-days: 14
