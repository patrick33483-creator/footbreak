name: 診斷 stage-v2 tick 失敗

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 抓 tick service 詳情
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -e
          echo "===== systemctl status service ====="
          systemctl status stage-engine-v2-tick.service --no-pager 2>&1 | head -30 || true

          echo ""
          echo "===== journalctl 最近 60 行 ====="
          journalctl -u stage-engine-v2-tick.service --no-pager -n 60 2>&1 | tail -60 || true

          echo ""
          echo "===== 手動試跑 tick (root) ====="
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -m stage_engine_v2 tick \
            --crown-data /var/www/crown/data.json \
            --ledger /var/lib/footbreak/stage_engine_v2/ledger.json \
            --dashboard /var/www/stage_engine_v2/data.json \
            --sent-log /var/log/footbreak/stage-v2-sent.jsonl \
            --window-hours 48 2>&1 | head -30 || echo "(exit non-zero)"

          echo ""
          echo "===== 手動試跑 tick (footbreak user via runuser) ====="
          runuser -u footbreak -- env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -m stage_engine_v2 tick \
            --crown-data /var/www/crown/data.json \
            --ledger /var/lib/footbreak/stage_engine_v2/ledger.json \
            --dashboard /var/www/stage_engine_v2/data.json \
            --sent-log /var/log/footbreak/stage-v2-sent.jsonl \
            --window-hours 48 2>&1 | head -30 || echo "(exit non-zero)"

          echo ""
          echo "===== 目錄權限 ====="
          ls -ld /var/lib/footbreak/stage_engine_v2 /var/www/stage_engine_v2 /var/log/footbreak 2>&1
          echo ""
          id footbreak 2>&1 || echo "(footbreak user 唔存在?)"
          REMOTE

      - name: 唯讀稽核條件重複場次及賽果狀態
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/.venv/bin/python3 -' > stage-v2-dedupe-audit.json <<'PY'
          import json
          from collections import defaultdict
          from datetime import datetime, timezone
          from pathlib import Path

          dashboard = json.loads(
              Path("/var/www/stage_engine_v2/data.json").read_text(encoding="utf-8")
          )
          segmented = dashboard.get("segmented_conditions") or {}
          conditions = segmented.get("public_conditions") or []

          def canonical(row):
              home = " ".join(str(row.get("home") or "").split()).casefold()
              away = " ".join(str(row.get("away") or "").split()).casefold()
              raw = row.get("kickoff") or row.get("kickoff_hkt") or row.get("kickoff_utc")
              try:
                  kickoff = datetime.fromisoformat(str(raw)).astimezone(timezone.utc).isoformat()
              except (TypeError, ValueError):
                  kickoff = str(raw or "")
              return f"{home}|{away}|{kickoff}"

          condition_audits = []
          fixture_conditions = defaultdict(set)
          target_names = {
              ("拉夫尼茨", "卡尔斯多夫"),
              ("水户蜀葵", "鹿岛鹿角"),
              ("卢宾扎格勒比", "涅波沃米采"),
              ("马六甲fc", "槟城"),
              ("昌宁女足", "报恩尚武女足"),
              ("金泽", "今治"),
              ("大阪俱乐部(中)", "甲府风林"),
              ("瓦拉日丁u19", "塞瓦特u19"),
          }
          targets = []

          for condition in conditions:
              cid = str(condition.get("id") or "")
              observations = [
                  row for row in (condition.get("observations") or [])
                  if isinstance(row, dict)
              ]
              grouped = defaultdict(list)
              for row in observations:
                  key = canonical(row)
                  grouped[key].append(str(row.get("match_id") or row.get("id") or ""))
                  fixture_conditions[key].add(cid)
                  pair = (
                      str(row.get("home") or "").strip().casefold(),
                      str(row.get("away") or "").strip().casefold(),
                  )
                  if pair in target_names:
                      targets.append({
                          "condition_id": cid,
                          "match_id": row.get("match_id") or row.get("id"),
                          "home": row.get("home"),
                          "away": row.get("away"),
                          "kickoff": row.get("kickoff"),
                          "settlement": row.get("settlement"),
                          "result_status": row.get("result_status"),
                          "odds": row.get("odds"),
                          "line": row.get("line"),
                      })
              duplicate_groups = [
                  {"fixture": key, "record_ids": ids}
                  for key, ids in grouped.items() if len(ids) > 1
              ]
              prospective = condition.get("prospective") or {}
              condition_audits.append({
                  "condition_id": cid,
                  "observation_rows": len(observations),
                  "unique_fixtures": len(grouped),
                  "duplicate_fixture_groups": duplicate_groups,
                  "reported_qualified": prospective.get("qualified"),
                  "reported_settled": prospective.get("settled"),
                  "reported_hit_rate": prospective.get("hit_rate"),
                  "reported_roi": prospective.get("roi"),
              })

          cross_condition = [
              {"fixture": key, "condition_ids": sorted(ids)}
              for key, ids in fixture_conditions.items() if len(ids) > 1
          ]
          report = {
              "generated_at": dashboard.get("generated_at"),
              "read_only": True,
              "condition_count": len(conditions),
              "conditions": condition_audits,
              "duplicate_groups_within_condition": sum(
                  len(row["duplicate_fixture_groups"]) for row in condition_audits
              ),
              "cross_condition_overlap_count": len(cross_condition),
              "cross_condition_overlaps": cross_condition,
              "target_observations": targets,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          echo "===== STAGE_V2_DEDUPE_AUDIT_BEGIN ====="
          cat stage-v2-dedupe-audit.json
          echo "===== STAGE_V2_DEDUPE_AUDIT_END ====="

      - name: 保存唯讀稽核結果
        uses: actions/upload-artifact@v4
        with:
          name: stage-v2-dedupe-audit
          path: stage-v2-dedupe-audit.json
          retention-days: 1
