name: Persist v3 source

on:
  workflow_dispatch:
    inputs:
      confirmation: {description: "打 PERSIST", required: true, type: string}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/persist-v3-source.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "PERSIST" ]; then exit 1; fi
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: main
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"
          echo "=== Check current /opt/footbreak/deploy/nginx-unified-dashboard.conf V3 status ==="
          $SSH 'sudo grep -c crownsystem-v3 /opt/footbreak/deploy/nginx-unified-dashboard.conf || echo 0'
          echo
          echo "=== Upload updated template from main to server /opt/footbreak/deploy/ ==="
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 \
            deploy/nginx-unified-dashboard.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/v3-template.conf"
          $SSH 'sudo install -m 0644 -o root -g root /tmp/v3-template.conf /opt/footbreak/deploy/nginx-unified-dashboard.conf && rm /tmp/v3-template.conf'
          echo
          echo "=== Verify /opt/footbreak template now has V3 ==="
          $SSH 'sudo grep -c crownsystem-v3 /opt/footbreak/deploy/nginx-unified-dashboard.conf'
          echo
          echo "=== Simulate self-heal cycle: install + reload + curl ==="
          $SSH 'sudo install -m 0644 /opt/footbreak/deploy/nginx-unified-dashboard.conf /etc/nginx/sites-available/unified-dashboard
                sudo nginx -t 2>&1
                sudo systemctl reload nginx
                sleep 1
                for p in / /data.json /results.json /titan_today.json /history.html /signals.html; do
                  c=$(curl -s -o /dev/null -w "%{http_code}" -u radar:toberich "http://127.0.0.1/crownsystem-v3$p")
                  echo "  /crownsystem-v3$p -> $c"
                done
                echo "no-auth /crownsystem-v3/ -> $(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/crownsystem-v3/)"
                echo "title: $(curl -sS -u radar:toberich http://127.0.0.1/crownsystem-v3/ | grep -o "<title>[^<]*</title>")"'
