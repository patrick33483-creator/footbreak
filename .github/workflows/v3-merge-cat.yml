name: V3 merge cat
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/v3-merge-cat.yml']
concurrency: {group: production-maintenance, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - run: test "$CONFIRM_INPUT" = "CONFIRM"
      - env:
          SSHKEY: ${{ secrets.DEPLOY_SSH_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          $SSH bash <<'EOF'
          set +e
          echo "=== ls /opt/footbreak/deploy/v3 ==="
          ls -la /opt/footbreak/deploy/v3/ 2>/dev/null
          echo ""
          echo "=== merge_titan_v2.py ==="
          cat /opt/footbreak/deploy/v3/merge_titan_v2.py 2>/dev/null | head -400
          echo ""
          echo "=== matches.json size + top ==="
          ls -la /var/www/crownsystem-v3/matches.json
          head -c 3000 /var/www/crownsystem-v3/matches.json
          echo ""
          echo "=== manual run of merge (dry) ==="
          cd /opt/footbreak && sudo -u root /usr/bin/python3 /opt/footbreak/deploy/v3/merge_titan_v2.py 2>&1 | head -60
          EOF
