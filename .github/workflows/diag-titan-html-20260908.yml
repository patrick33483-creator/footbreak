name: Diag titan html raw

on:
  workflow_dispatch:
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-titan-html-20260908.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -e
          
          # Show all script src + AJAX endpoints
          echo "===== Script srcs ====="
          grep -oE 'src="[^"]*"' /tmp/titan.html | head -20
          
          echo
          echo "===== Any URL patterns for data ====="
          grep -oE '"[^"]*\.(js|aspx|ashx|json)[^"]*"' /tmp/titan.html | sort -u | head -30
          
          echo
          echo "===== Titan data JS file references ====="
          grep -E 'Compare|Data|data|inplay|allmatch' /tmp/titan.html | head -30
          
          echo
          echo "===== Any inline JS with URL ====="
          grep -oE 'https?://[a-zA-Z0-9./_?=&\-]*' /tmp/titan.html | sort -u | head -30
          REMOTE
