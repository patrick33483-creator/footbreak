name: Diag v2 files
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-v2-files.yml']
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      E: ${{ github.event_name }}
      C: ${{ inputs.confirmation }}
    steps:
      - name: guard
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "DIAGV2F" ]; then exit 1; fi
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: diag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          echo '=== stage_engine_v2 dir tree ==='
          $SSH 'sudo ls -la /opt/footbreak/stage_engine_v2/ 2>&1'
          echo
          echo '=== deploy/run.sh tick sub ==='
          $SSH 'sudo cat /opt/footbreak/deploy/run.sh 2>&1 | head -100'
          echo
          echo '=== fixtures.py defs ==='
          $SSH 'sudo grep -nE "^def |^class " /opt/footbreak/stage_engine_v2/fixtures.py 2>&1 | head -30'
          echo
          echo '=== cli.py entry ==='
          $SSH 'sudo grep -nE "^def |^class |argparse|add_parser|subparsers|first_look|first-look|首預" /opt/footbreak/stage_engine_v2/cli.py 2>&1 | head -40'
          echo
          echo '=== predictor.py defs ==='
          $SSH 'sudo grep -nE "^def |^class " /opt/footbreak/stage_engine_v2/predictor.py 2>&1 | head -30'
          echo
          echo '=== publisher.py defs ==='
          $SSH 'sudo grep -nE "^def |^class " /opt/footbreak/stage_engine_v2/publisher.py 2>&1 | head -30'
          echo
          echo '=== cli.py head 60 ==='
          $SSH 'sudo head -80 /opt/footbreak/stage_engine_v2/cli.py 2>&1'
