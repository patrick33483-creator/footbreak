name: Footbreak native-stage state audit (read only)

on:
  workflow_dispatch:
  push:
    branches:
      - audit/footbreak-native-stage-state-20260822

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Read native manifest and stage attempts only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 /opt/footbreak/deploy/audit-footbreak-native-stage-state.py' \
            > footbreak-native-stage-state-audit.json
          python3 -m json.tool footbreak-native-stage-state-audit.json

      - name: Upload read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: footbreak-native-stage-state-audit
          path: footbreak-native-stage-state-audit.json
          retention-days: 7
