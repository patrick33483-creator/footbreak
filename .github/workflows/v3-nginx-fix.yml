name: V3 nginx allow matches.json
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/v3-nginx-fix.yml']

concurrency: {group: production-maintenance, cancel-in-progress: false}

jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - name: Guard push
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "push registers only; use dispatch to run"
          exit 0
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env:
          SSHKEY: ${{ secrets.DEPLOY_SSH_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          $SSH bash <<'EOF'
          set -e
          TS=$(date +%Y%m%d-%H%M%S)
          echo "=== 1. Find nginx site for crownsystem-v3 ==="
          SITE=$(sudo -n grep -lE "crownsystem-v3" /etc/nginx/sites-enabled/* 2>/dev/null | head -1)
          [[ -z "$SITE" ]] && SITE=$(sudo -n grep -lE "crownsystem-v3" /etc/nginx/sites-available/* 2>/dev/null | head -1)
          echo "site: $SITE"
          [[ -z "$SITE" ]] && { echo "no site"; exit 1; }
          
          echo ""
          echo "=== 2. Backup + show current relevant block ==="
          sudo -n cp -p "$SITE" "${SITE}.bak.${TS}"
          sudo -n grep -n -B2 -A8 "crownsystem-v3\|auth_basic\|matches.json" "$SITE" | head -80
          
          echo ""
          echo "=== 3. Patch: add location for matches.json without auth ==="
          # Insert a location block before the closing brace of the crownsystem-v3 location or server.
          # Strategy: append a nested location for matches.json inside the crownsystem-v3 root location.
          sudo -n python3 - "$SITE" <<'PY'
          import re, sys, io
          path = sys.argv[1]
          txt = open(path).read()
          # If already patched, skip.
          if "location = /crownsystem-v3/matches.json" in txt:
              print("already patched")
              sys.exit(0)
          # Find the location block for /crownsystem-v3/
          m = re.search(r'(location\s+/crownsystem-v3/?\s*\{)', txt)
          if not m:
              print("no /crownsystem-v3/ block found")
              sys.exit(2)
          # Insert an inline location = /crownsystem-v3/matches.json { auth_basic off; } as a sibling
          # right before the /crownsystem-v3/ block for higher priority.
          inject = (
              "location = /crownsystem-v3/matches.json {\n"
              "    auth_basic off;\n"
              "    root /var/www;\n"
              "    default_type application/json;\n"
              "    add_header Cache-Control \"no-store\";\n"
              "}\n\n"
          )
          new_txt = txt[:m.start()] + inject + txt[m.start():]
          open(path,"w").write(new_txt)
          print("patched")
          PY
          
          echo ""
          echo "=== 4. Test nginx config + reload ==="
          sudo -n nginx -t
          sudo -n systemctl reload nginx
          
          echo ""
          echo "=== 5. Verify no-auth access to matches.json ==="
          curl -s -o /dev/null -w "matches.json unauth: %{http_code}\n" "http://127.0.0.1/crownsystem-v3/matches.json"
          curl -s -o /dev/null -w "SPA root unauth : %{http_code}\n" "http://127.0.0.1/crownsystem-v3/"
          echo ""
          echo "=== 6. Diff summary ==="
          sudo -n diff "${SITE}.bak.${TS}" "$SITE" | head -30
          EOF
