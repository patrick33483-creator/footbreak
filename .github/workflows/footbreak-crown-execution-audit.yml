name: Audit Footbreak to Crown execution handoff

on:
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Read only production cross-book audit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          PRODUCTION_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env PRODUCTION_HEAD='$PRODUCTION_HEAD' bash -s" <<'REMOTE' | tee footbreak-crown-execution-audit.json
          set -euo pipefail
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            deploy/audit-footbreak-crown-execution.py \
            --production-head "$PRODUCTION_HEAD"
          REMOTE

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footbreak-crown-execution-audit-${{ github.run_id }}
          path: footbreak-crown-execution-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish audit evidence to the commit checks
        if: always() && hashFiles('footbreak-crown-execution-audit.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          evidence = Path("footbreak-crown-execution-audit.json").read_text(encoding="utf-8")
          evidence = json.dumps(json.loads(evidence), ensure_ascii=False, indent=2, sort_keys=True)
          conclusion = "success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          payload = {
              "name": "Footbreak to Crown execution audit evidence",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"Cross-book audit: {conclusion}",
                  "summary": "```json\n" + evidence[:60000] + "\n```",
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"evidence_check_url={created['html_url']}")
          PY
