name: Telegram notification maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Safe audit, or the explicitly labelled one-shot system test
        required: true
        default: audit
        type: choice
        options: [audit, system-test]
      test_id:
        description: Required unique ID for system-test (never re-sent after acknowledgement)
        required: false
        type: string
      enable_crown_telegram:
        description: Set CROWN_TELEGRAM_ENABLED=1 before audit/test; does not enable Crown runner
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Audit notification outboxes and optionally verify Telegram delivery
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACTION: ${{ inputs.action }}
          TEST_ID: ${{ inputs.test_id }}
          ENABLE_CROWN_TELEGRAM: ${{ inputs.enable_crown_telegram }}
        run: |
          set -euo pipefail
          case "$ACTION" in audit|system-test) ;; *) exit 2;; esac
          if [ "$ACTION" = system-test ] && ! [[ "$TEST_ID" =~ ^[A-Za-z0-9._-]{8,96}$ ]]; then
            echo "system-test requires an 8–96 character safe test_id" >&2
            exit 2
          fi
          case "$ENABLE_CROWN_TELEGRAM" in true|false) ;; *) exit 2;; esac
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env ACTION='$ACTION' TEST_ID='$TEST_ID' ENABLE_CROWN_TELEGRAM='$ENABLE_CROWN_TELEGRAM' bash -s" <<'REMOTE' | tee telegram-notification-maintenance.json
          set -euo pipefail
          if [ "$ENABLE_CROWN_TELEGRAM" = true ]; then
            file=/etc/footbreak-crown.env
            tmp="$(mktemp)"
            grep -v '^CROWN_TELEGRAM_ENABLED=' "$file" > "$tmp" || true
            printf 'CROWN_TELEGRAM_ENABLED=1\n' >> "$tmp"
            install -m 0600 "$tmp" "$file"
            rm -f "$tmp"
          fi
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          args=()
          if [ "$ACTION" = system-test ]; then
            args+=(--system-test-id "$TEST_ID")
          fi
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            deploy/telegram-notification-maintenance.py "${args[@]}"
          REMOTE

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-notification-maintenance-${{ github.run_id }}
          path: telegram-notification-maintenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish maintenance evidence to the commit checks
        if: always() && hashFiles('telegram-notification-maintenance.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          evidence = Path("telegram-notification-maintenance.json").read_text(encoding="utf-8")
          try:
              evidence = json.dumps(json.loads(evidence), ensure_ascii=False, indent=2, sort_keys=True)
          except json.JSONDecodeError:
              pass
          conclusion = "success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          payload = {
              "name": "Telegram notification maintenance evidence",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"Telegram maintenance: {conclusion}",
                  "summary": "```json\n" + evidence[:60000] + "\n```",
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"evidence_check_url={created['html_url']}")
          PY
