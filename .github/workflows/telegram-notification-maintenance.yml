name: Telegram notification maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only audit of retired legacy notification outboxes
        required: true
        default: audit
        type: choice
        options: [audit]

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  maintain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Audit retired notification outboxes without delivery
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          [ "$ACTION" = audit ] || exit 2
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env ACTION='$ACTION' bash -s" <<'REMOTE' | tee telegram-notification-maintenance.json
          set -euo pipefail
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            deploy/telegram-notification-maintenance.py
          REMOTE

      - name: Upload maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-notification-maintenance-${{ github.run_id }}
          path: telegram-notification-maintenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Create bounded public audit summary
        if: always() && hashFiles('telegram-notification-maintenance.json') != ''
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path("telegram-notification-maintenance.json")
          payload = json.loads(source.read_text(encoding="utf-8"))

          def compact(system):
              report = payload.get(system) or {}
              identity = report.get("condition_identity_audit") or {}
              return {
                  "telegram_enabled": report.get("telegram_enabled"),
                  "bot_token_configured": report.get("bot_token_configured"),
                  "chat_id_configured": report.get("chat_id_configured"),
                  "runner_enabled": report.get("runner_enabled"),
                  "classification": report.get("classification"),
                  "eligible_outbox": report.get("eligible_outbox"),
                  "acknowledged": report.get("acknowledged"),
                  "state_updated_at": report.get("state_updated_at"),
                  "transport_tests": report.get("transport_tests"),
                  "unacknowledged_low_odds_group_sizes": report.get(
                      "unacknowledged_low_odds_group_sizes"
                  ),
                  "dashboard_authority_parity": report.get(
                      "dashboard_authority_parity"
                  ),
                  "latest_wilson_decisions": report.get(
                      "latest_wilson_decisions"
                  ),
                  "recent_low_odds_observations": report.get(
                      "recent_low_odds_observations"
                  ),
                  "recent_native_t5_wilson_outcomes": report.get(
                      "recent_native_t5_wilson_outcomes"
                  ),
                  "today_durable_condition_rows": identity.get(
                      "today_durable_condition_rows"
                  ),
                  "frozen_condition_counters": [
                      {
                          "condition_number": row.get("condition_number"),
                          "condition_signature": row.get("condition_signature"),
                          "active_evidence_version": row.get(
                              "active_evidence_version"
                          ),
                          "activation_boundary_at": row.get(
                              "activation_boundary_at"
                          ),
                          "pending_rollover_progress": row.get(
                              "pending_rollover_progress"
                          ),
                      }
                      for row in identity.get("frozen_condition_counters") or []
                      if isinstance(row, dict)
                  ],
              }

          compact_payload = {
              "generated_at": payload.get("generated_at"),
              "safe_read_only": payload.get("safe_read_only"),
              "footbreak": compact("footbreak"),
              "crown": compact("crown"),
          }
          Path("telegram-notification-maintenance-compact.json").write_text(
              json.dumps(compact_payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload compact maintenance evidence
        if: always() && hashFiles('telegram-notification-maintenance-compact.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telegram-notification-maintenance-compact-${{ github.run_id }}
          path: telegram-notification-maintenance-compact.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish maintenance evidence to the commit checks
        if: always() && hashFiles('telegram-notification-maintenance-compact.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          evidence = Path("telegram-notification-maintenance-compact.json").read_text(encoding="utf-8")
          try:
              evidence = json.dumps(json.loads(evidence), ensure_ascii=False, indent=2, sort_keys=True)
          except json.JSONDecodeError:
              pass
          conclusion = "success" if os.environ.get("JOB_STATUS") == "success" else "failure"
          payload = {
              "name": "Telegram notification maintenance evidence",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"Telegram maintenance: {conclusion}",
                  "summary": "```json\n" + evidence[:60000] + "\n```",
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              created = json.load(response)
          print(f"evidence_check_url={created['html_url']}")
          PY
