name: Verify both V2 timed-stage pipelines

on:
  workflow_dispatch:
    inputs:
      crown_kickoff_hkt:
        description: Exact Crown fixture kickoff in HKT ISO format
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify Crown native projection and both V2 timers
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CROWN_KICKOFF_HKT: ${{ inputs.crown_kickoff_hkt }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env CROWN_KICKOFF_HKT='$CROWN_KICKOFF_HKT' /opt/footbreak/.venv/bin/python3 -" <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path

          target = datetime.fromisoformat(os.environ["CROWN_KICKOFF_HKT"])
          ledger = json.loads(Path(
              "/var/lib/footbreak/stage_engine_v2/ledger.json"
          ).read_text(encoding="utf-8"))
          fixtures = ledger.get("fixtures") or {}
          rows = []
          for fixture_id, fixture in fixtures.items():
              if not isinstance(fixture, dict):
                  continue
              try:
                  kickoff = datetime.fromisoformat(
                      str(fixture.get("kickoff_hkt") or "").replace("Z", "+00:00")
                  )
              except ValueError:
                  continue
              if abs((kickoff - target).total_seconds()) > 1:
                  continue
              t5 = (fixture.get("stages") or {}).get("T-5")
              rows.append({
                  "fixture_id": str(fixture_id),
                  "home": fixture.get("home"),
                  "away": fixture.get("away"),
                  "t5_present": isinstance(t5, dict),
                  "source": t5.get("stage_payload_source") if isinstance(t5, dict) else None,
              })

          units = {}
          for timer, service in (
              ("stage-engine-v2-tick.timer", "stage-engine-v2-tick.service"),
              ("stage-engine-v2-fb-tick.timer", "stage-engine-v2-fb-tick.service"),
          ):
              active = subprocess.run(
                  ["systemctl", "is-active", "--quiet", timer],
                  check=False,
              ).returncode == 0
              result = subprocess.check_output(
                  ["systemctl", "show", service, "-p", "Result", "--value"],
                  text=True,
              ).strip()
              units[timer] = {"active": active, "service_result": result}

          summary = {
              "kickoff_hkt": target.isoformat(),
              "crown_fixture_count": len(rows),
              "crown_native_t5_count": sum(
                  1 for row in rows
                  if row["t5_present"] and row["source"] == "crown_native_stage_queue"
              ),
              "units": units,
              "rows": rows,
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          if not rows:
              raise SystemExit("no Crown V2 fixtures found for kickoff")
          if not all(
              row["t5_present"] and row["source"] == "crown_native_stage_queue"
              for row in rows
          ):
              raise SystemExit("Crown V2 native T-5 projection missing")
          if not all(
              state["active"] and state["service_result"] == "success"
              for state in units.values()
          ):
              raise SystemExit("one or more V2 timed-stage services are unhealthy")
          PY
