name: 驗證 PinnAPI 角球市場

on:
  workflow_dispatch:

jobs:
  verify:
    name: 抽查未開賽市場結構
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 安全抽查 PinnAPI 市場名稱
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from collections import Counter

          from crown.config import settings
          from crown.pinnapi import PinnapiClient

          config = settings()
          client = PinnapiClient(config)
          fixtures = client.fixtures()
          sample = fixtures[:12]
          key_paths = Counter()
          corner_events = []
          corner_market_samples = []
          failures = []

          def is_corner_event(event):
              if not isinstance(event, dict):
                  return False
              text = " ".join(str(event.get(key) or "") for key in (
                  "league_name", "league", "home", "away",
                  "special_category", "special_units",
              ))
              return "corner" in text.lower()

          def sanitise_market(market):
              if not isinstance(market, dict):
                  return None
              prices = []
              for price in market.get("prices") or []:
                  if not isinstance(price, dict):
                      continue
                  prices.append({
                      "name": price.get("name"),
                      "points": price.get("points"),
                      "price": price.get("price"),
                      "status": price.get("status"),
                      "participant_id": price.get("participant_id"),
                  })
              return {
                  "market_keys": sorted(market.keys()),
                  "type": market.get("type"),
                  "key": market.get("key"),
                  "name": market.get("name"),
                  "status": market.get("status"),
                  "prices": prices[:12],
              }

          def compact(value, depth=0):
              if depth >= 4:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {
                      str(key): compact(child, depth + 1)
                      for key, child in list(value.items())[:20]
                  }
              if isinstance(value, list):
                  return [compact(child, depth + 1) for child in value[:12]]
              if isinstance(value, (str, int, float, bool)) or value is None:
                  return value
              return type(value).__name__

          def collect_corner_markets(raw, parent_event_id):
              root = raw if isinstance(raw, dict) else {}
              events = root.get("events") or []
              if not isinstance(events, list):
                  return
              for event in events:
                  if not is_corner_event(event):
                      continue
                  special_markets = event.get("special_markets") or {}
                  periods = event.get("periods") or {}
                  market_groups = {}
                  if isinstance(special_markets, dict):
                      market_groups.update(special_markets)
                  if isinstance(periods, dict):
                      for period_key, period in periods.items():
                          if not isinstance(period, dict):
                              continue
                          for key in ("spreads", "totals", "money_line"):
                              value = period.get(key)
                              if value:
                                  market_groups[f"{period_key}.{key}"] = value
                  samples = {}
                  for group, markets in market_groups.items():
                      if isinstance(markets, dict) and not (
                          "prices" in markets
                          or "type" in markets
                          or "name" in markets
                      ):
                          samples[group] = [
                              {
                                  "line": str(line),
                                  "quote": compact(quote),
                              }
                              for line, quote in list(markets.items())[:12]
                          ]
                          continue
                      if isinstance(markets, dict):
                          markets = [markets]
                      if not isinstance(markets, list):
                          continue
                      cleaned = [
                          sanitise_market(market)
                          for market in markets[:8]
                      ]
                      samples[group] = [
                          market for market in cleaned if market is not None
                      ]
                  corner_market_samples.append({
                      "parent_event_id": parent_event_id,
                      "corner_event_id": event.get("event_id") or event.get("id"),
                      "league_name": event.get("league_name"),
                      "home": event.get("home"),
                      "away": event.get("away"),
                      "starts": event.get("starts") or event.get("start_time"),
                      "status": event.get("status"),
                      "special_category": event.get("special_category"),
                      "special_units": event.get("special_units"),
                      "event_keys": sorted(event.keys()),
                      "markets": samples,
                  })

          def walk(value, path="root", event_id=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"
                      key_paths[child_path] += 1
                      if "corner" in str(key).lower():
                          corner_events.append({
                              "event_id": event_id,
                              "path": child_path,
                              "kind": type(child).__name__,
                          })
                      walk(child, child_path, event_id)
              elif isinstance(value, list):
                  for child in value[:20]:
                      walk(child, f"{path}[]", event_id)
              elif isinstance(value, str) and "corner" in value.lower():
                  corner_events.append({
                      "event_id": event_id,
                      "path": path,
                      "value": value[:120],
                  })

          checked = []
          endpoints = {
              "lines": "/kit/v1/prematch/lines?event_id={event_id}",
              "markets": "/kit/v1/prematch/markets?event_id={event_id}",
              "markets_specials": (
                  "/kit/v1/prematch/markets?"
                  "event_id={event_id}&include_specials=1"
              ),
          }
          for fixture in sample:
              event_id = str(fixture["id"])
              for endpoint_name, path_template in endpoints.items():
                  try:
                      raw = client._get(
                          path_template.format(event_id=event_id)
                      )
                  except Exception as exc:
                      failures.append({
                          "event_id": event_id,
                          "endpoint": endpoint_name,
                          "error": type(exc).__name__,
                      })
                      continue
                  root = raw if isinstance(raw, dict) else {}
                  periods = root.get("periods") if isinstance(root.get("periods"), dict) else {}
                  full = periods.get("num_0") if isinstance(periods.get("num_0"), dict) else {}
                  checked.append({
                      "event_id": event_id,
                      "endpoint": endpoint_name,
                      "league": fixture.get("league"),
                      "home": fixture.get("home"),
                      "away": fixture.get("away"),
                      "root_keys": sorted(root.keys()),
                      "full_match_keys": sorted(full.keys()),
                  })
                  walk(raw, path=f"root.{endpoint_name}", event_id=event_id)
                  if endpoint_name == "markets_specials":
                      collect_corner_markets(raw, event_id)

          interesting = [
              {"path": path, "seen": count}
              for path, count in key_paths.most_common()
              if any(term in path.lower() for term in (
                  "market", "period", "total", "spread", "corner"
              ))
          ][:100]
          print(json.dumps({
              "fixtures_available": len(fixtures),
              "events_checked": len(checked),
              "failures": failures,
              "corner_mentions": corner_events,
              "corner_market_samples": corner_market_samples,
              "market_paths": interesting,
              "event_schemas": checked,
              "credentials_printed": False,
          }, ensure_ascii=False, indent=2))
          PY
          REMOTE

      - name: 三輪角球盤穩定性驗證
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          import time

          from crown.config import settings
          from crown.pinnapi import PinnapiClient

          client = PinnapiClient(settings())
          fixtures = client.fixtures()[:12]
          parent_ids = [str(row["id"]) for row in fixtures]
          snapshots = []
          selected = []

          for round_number in range(1, 4):
              ids = selected or parent_ids
              rows = []
              for parent_id in ids:
                  try:
                      parsed = client.corner_lines(parent_id)
                  except Exception as exc:
                      rows.append({
                          "parent_event_id": parent_id,
                          "available": False,
                          "error": type(exc).__name__,
                      })
                      continue
                  prices = parsed.get("prices") or []
                  markets = {}
                  for market in ("CHDC", "CHL"):
                      market_prices = [
                          row for row in prices if row.get("market") == market
                      ]
                      mains = [
                          row for row in market_prices if row.get("main")
                      ]
                      markets[market] = {
                          "price_count": len(market_prices),
                          "lines": sorted({
                              float(row["line"]) for row in market_prices
                          }),
                          "main": [
                              {
                                  "line": row.get("line"),
                                  "selection": row.get("selection"),
                                  "odds": row.get("odds"),
                                  "max": row.get("max"),
                              }
                              for row in mains
                          ],
                      }
                  available = bool(
                      markets["CHL"]["price_count"] >= 2
                      and markets["CHDC"]["price_count"] >= 2
                  )
                  rows.append({
                      "parent_event_id": parent_id,
                      "corner_event_id": parsed.get("corner_event_id"),
                      "available": available,
                      "market_status": parsed.get("market_status"),
                      "candidate_count": parsed.get("candidate_count"),
                      "league": parsed.get("league"),
                      "home": parsed.get("home"),
                      "away": parsed.get("away"),
                      "markets": markets,
                  })
              if round_number == 1:
                  selected = [
                      row["parent_event_id"]
                      for row in rows if row.get("available")
                  ][:8]
              snapshots.append({
                  "round": round_number,
                  "observed_at": time.time(),
                  "rows": rows,
              })
              if round_number < 3:
                  time.sleep(30)

          first = {
              row["parent_event_id"]: row
              for row in snapshots[0]["rows"] if row.get("available")
          }
          stability = []
          for parent_id in selected:
              observed = []
              for snapshot in snapshots:
                  row = next((
                      item for item in snapshot["rows"]
                      if item["parent_event_id"] == parent_id
                  ), None)
                  if row is not None:
                      observed.append(row)
              base = first.get(parent_id) or {}
              stability.append({
                  "parent_event_id": parent_id,
                  "corner_event_id": base.get("corner_event_id"),
                  "league": base.get("league"),
                  "home": base.get("home"),
                  "away": base.get("away"),
                  "available_rounds": sum(
                      1 for row in observed if row.get("available")
                  ),
                  "corner_id_consistent": len({
                      row.get("corner_event_id") for row in observed
                  }) == 1,
                  "chl_line_sets_consistent": len({
                      tuple(row.get("markets", {}).get("CHL", {}).get("lines", []))
                      for row in observed
                  }) == 1,
                  "chdc_line_sets_consistent": len({
                      tuple(row.get("markets", {}).get("CHDC", {}).get("lines", []))
                      for row in observed
                  }) == 1,
                  "rounds": observed,
              })

          print("CORNER_STABILITY_JSON")
          print(json.dumps({
              "round_interval_seconds": 30,
              "round_count": 3,
              "fixtures_sampled": len(parent_ids),
              "corner_events_selected": len(selected),
              "stable_all_rounds": sum(
                  1 for row in stability
                  if row["available_rounds"] == 3
                  and row["corner_id_consistent"]
              ),
              "events": stability,
              "credentials_printed": False,
          }, ensure_ascii=False, indent=2))
          PY
          REMOTE
