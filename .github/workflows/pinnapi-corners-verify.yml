name: 驗證 PinnAPI 角球市場

on:
  workflow_dispatch:

jobs:
  verify:
    name: 抽查未開賽市場結構
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 安全抽查 PinnAPI 市場名稱
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from collections import Counter

          from crown.config import settings
          from crown.pinnapi import PinnapiClient

          config = settings()
          client = PinnapiClient(config)
          fixtures = client.fixtures()
          sample = fixtures[:12]
          key_paths = Counter()
          corner_events = []
          corner_market_samples = []
          failures = []

          def is_corner_event(event):
              if not isinstance(event, dict):
                  return False
              text = " ".join(str(event.get(key) or "") for key in (
                  "league_name", "league", "home", "away",
                  "special_category", "special_units",
              ))
              return "corner" in text.lower()

          def sanitise_market(market):
              if not isinstance(market, dict):
                  return None
              prices = []
              for price in market.get("prices") or []:
                  if not isinstance(price, dict):
                      continue
                  prices.append({
                      "name": price.get("name"),
                      "points": price.get("points"),
                      "price": price.get("price"),
                      "status": price.get("status"),
                      "participant_id": price.get("participant_id"),
                  })
              return {
                  "market_keys": sorted(market.keys()),
                  "type": market.get("type"),
                  "key": market.get("key"),
                  "name": market.get("name"),
                  "status": market.get("status"),
                  "prices": prices[:12],
              }

          def collect_corner_markets(raw, parent_event_id):
              root = raw if isinstance(raw, dict) else {}
              events = root.get("events") or []
              if not isinstance(events, list):
                  return
              for event in events:
                  if not is_corner_event(event):
                      continue
                  special_markets = event.get("special_markets") or {}
                  periods = event.get("periods") or {}
                  market_groups = {}
                  if isinstance(special_markets, dict):
                      market_groups.update(special_markets)
                  if isinstance(periods, dict):
                      for period_key, period in periods.items():
                          if not isinstance(period, dict):
                              continue
                          for key in ("spreads", "totals", "money_line"):
                              value = period.get(key)
                              if value:
                                  market_groups[f"{period_key}.{key}"] = value
                  samples = {}
                  for group, markets in market_groups.items():
                      if isinstance(markets, dict):
                          markets = [markets]
                      if not isinstance(markets, list):
                          continue
                      cleaned = [
                          sanitise_market(market)
                          for market in markets[:8]
                      ]
                      samples[group] = [
                          market for market in cleaned if market is not None
                      ]
                  corner_market_samples.append({
                      "parent_event_id": parent_event_id,
                      "corner_event_id": event.get("event_id") or event.get("id"),
                      "league_name": event.get("league_name"),
                      "home": event.get("home"),
                      "away": event.get("away"),
                      "starts": event.get("starts") or event.get("start_time"),
                      "status": event.get("status"),
                      "special_category": event.get("special_category"),
                      "special_units": event.get("special_units"),
                      "event_keys": sorted(event.keys()),
                      "markets": samples,
                  })

          def walk(value, path="root", event_id=""):
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = f"{path}.{key}"
                      key_paths[child_path] += 1
                      if "corner" in str(key).lower():
                          corner_events.append({
                              "event_id": event_id,
                              "path": child_path,
                              "kind": type(child).__name__,
                          })
                      walk(child, child_path, event_id)
              elif isinstance(value, list):
                  for child in value[:20]:
                      walk(child, f"{path}[]", event_id)
              elif isinstance(value, str) and "corner" in value.lower():
                  corner_events.append({
                      "event_id": event_id,
                      "path": path,
                      "value": value[:120],
                  })

          checked = []
          endpoints = {
              "lines": "/kit/v1/prematch/lines?event_id={event_id}",
              "markets": "/kit/v1/prematch/markets?event_id={event_id}",
              "markets_specials": (
                  "/kit/v1/prematch/markets?"
                  "event_id={event_id}&include_specials=1"
              ),
          }
          for fixture in sample:
              event_id = str(fixture["id"])
              for endpoint_name, path_template in endpoints.items():
                  try:
                      raw = client._get(
                          path_template.format(event_id=event_id)
                      )
                  except Exception as exc:
                      failures.append({
                          "event_id": event_id,
                          "endpoint": endpoint_name,
                          "error": type(exc).__name__,
                      })
                      continue
                  root = raw if isinstance(raw, dict) else {}
                  periods = root.get("periods") if isinstance(root.get("periods"), dict) else {}
                  full = periods.get("num_0") if isinstance(periods.get("num_0"), dict) else {}
                  checked.append({
                      "event_id": event_id,
                      "endpoint": endpoint_name,
                      "league": fixture.get("league"),
                      "home": fixture.get("home"),
                      "away": fixture.get("away"),
                      "root_keys": sorted(root.keys()),
                      "full_match_keys": sorted(full.keys()),
                  })
                  walk(raw, path=f"root.{endpoint_name}", event_id=event_id)
                  if endpoint_name == "markets_specials":
                      collect_corner_markets(raw, event_id)

          interesting = [
              {"path": path, "seen": count}
              for path, count in key_paths.most_common()
              if any(term in path.lower() for term in (
                  "market", "period", "total", "spread", "corner"
              ))
          ][:100]
          print(json.dumps({
              "fixtures_available": len(fixtures),
              "events_checked": len(checked),
              "failures": failures,
              "corner_mentions": corner_events,
              "corner_market_samples": corner_market_samples,
              "market_paths": interesting,
              "event_schemas": checked,
              "credentials_printed": False,
          }, ensure_ascii=False, indent=2))
          PY
          REMOTE
