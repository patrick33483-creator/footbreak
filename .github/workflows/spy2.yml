name: spy crown-radar api v2
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/spy2.yml']
concurrency: {group: production-maintenance-8, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          echo "=== all crown-radar routes in nginx ==="
          sudo -n grep -nE "crown.radar|matches.crown" /etc/nginx/sites-available/unified-dashboard | head -20
          echo ""
          echo "=== curl variations ==="
          for u in \
            "http://127.0.0.1/crown-radar/api/matches-crown" \
            "http://127.0.0.1/crown-radar/api/matches" \
            "http://127.0.0.1/api/crown-radar/matches-crown" \
            "http://127.0.0.1:5001/api/matches-crown" \
            "http://127.0.0.1:5001/api/matches" \
            "http://127.0.0.1:5002/api/matches-crown" \
            "http://127.0.0.1:8765/api/data" \
            "http://127.0.0.1:8765/api/health" \
          ; do
            printf "  %s = " "$u"
            code=$(curl -s -o /tmp/body -w "%{http_code}" "$u")
            head=$(head -c 200 /tmp/body | tr '\n' ' ')
            printf "%s | %s\n" "$code" "$head"
          done
          echo ""
          echo "=== v2-results-sync.service (any crown-radar path)? ==="
          sudo -n systemctl cat v2-results-sync.service 2>&1 | tail -15
          echo ""
          echo "=== find crown-radar module in /opt ==="
          sudo -n find /opt -type d -name "crown*" 2>/dev/null | head -10
          sudo -n find /var/lib -type d -name "crown*" 2>/dev/null | head -10
          EOF
