name: Deploy v2 results sync (script + timer + patched html)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "打 V2RES"
        required: true
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/deploy-v2-results-20260907.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HTML_B64: 
      PY_B64: 
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "V2RES" ]; then exit 1; fi
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          H: ${{ env.HTML_B64 }}
          P: ${{ env.PY_B64 }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=60 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s '$H' '$P'" <<'REMOTE'
          set -eu
          H="$1"; P="$2"
          STAMP=$(date +%Y%m%d-%H%M%S)

          # ==== 1. Install script ====
          SCRIPT=/usr/local/bin/v2-results-sync.py
          if [ -f "$SCRIPT" ]; then
            cp -a "$SCRIPT" "$SCRIPT.backup-$STAMP"
          fi
          echo "$P" | base64 -d > "$SCRIPT.tmp"
          # sanity check
          python3 -c "import ast; ast.parse(open('/usr/local/bin/v2-results-sync.py.tmp').read())"
          grep -q "def build" "$SCRIPT.tmp"
          mv "$SCRIPT.tmp" "$SCRIPT"
          chmod 755 "$SCRIPT"
          chown root:root "$SCRIPT"

          # ==== 2. Test-run script ====
          echo "--- test run ---"
          "$SCRIPT"
          ls -la /var/www/stage_engine_v2/results.json
          head -c 400 /var/www/stage_engine_v2/results.json
          echo

          # ==== 3. systemd service + timer ====
          cat > /etc/systemd/system/v2-results-sync.service <<'UNIT'
          [Unit]
          Description=Build /var/www/stage_engine_v2/results.json from footbreak
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/v2-results-sync.py
          Nice=10
          UNIT

          cat > /etc/systemd/system/v2-results-sync.timer <<'UNIT'
          [Unit]
          Description=Run v2-results-sync every 5 minutes

          [Timer]
          OnBootSec=2min
          OnUnitActiveSec=5min
          Persistent=true

          [Install]
          WantedBy=timers.target
          UNIT

          systemctl daemon-reload
          systemctl enable v2-results-sync.timer
          systemctl start v2-results-sync.timer
          systemctl status v2-results-sync.timer --no-pager | head -10

          # ==== 4. Deploy new history.html ====
          HTML=/var/www/stage_engine_v2/history.html
          cp -a "$HTML" "$HTML.backup-$STAMP"
          echo "$H" | base64 -d > "$HTML.tmp"
          wc -c "$HTML.tmp"
          grep -q 'results.json' "$HTML.tmp"
          grep -q 'resultsMap' "$HTML.tmp"
          grep -q '初盤預測</th>' "$HTML.tmp"
          grep -q 'setInterval(load' "$HTML.tmp"
          mv "$HTML.tmp" "$HTML"
          chown root:root "$HTML"
          chmod 644 "$HTML"
          ls -la "$HTML" "$HTML.backup-$STAMP"

          echo "--- DONE ---"
          echo "backup: $HTML.backup-$STAMP"
          echo "results: $(head -c 200 /var/www/stage_engine_v2/results.json)..."
          REMOTE
