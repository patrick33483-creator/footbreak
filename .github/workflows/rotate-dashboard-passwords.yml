name: 更改足破及皇冠登入密碼

on:
  workflow_dispatch:

concurrency:
  group: rotate-dashboard-passwords
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 更新及驗證足破與皇冠密碼
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SITE_LOGIN_PASSWORD: ${{ secrets.SITE_LOGIN_PASSWORD }}
        run: |
          test -n "$SITE_LOGIN_PASSWORD"
          {
            printf '%s\n' 'IFS= read -r NEW_PASSWORD'
            printf '%s\n' "$SITE_LOGIN_PASSWORD"
            cat <<'REMOTE'
          set -euo pipefail
          test -n "$NEW_PASSWORD"

          printf '%s\n' "$NEW_PASSWORD" | htpasswd -i /etc/nginx/.htpasswd-footbreak footbreak
          printf '%s\n' "$NEW_PASSWORD" | htpasswd -i /etc/nginx/.htpasswd-crown crown
          chown root:www-data /etc/nginx/.htpasswd-footbreak /etc/nginx/.htpasswd-crown
          chmod 640 /etc/nginx/.htpasswd-footbreak /etc/nginx/.htpasswd-crown

          printf '%s\n' "$NEW_PASSWORD" > /root/footbreak-dashboard-password.txt
          printf '%s\n' "$NEW_PASSWORD" > /root/crown-dashboard-password.txt
          chmod 600 /root/footbreak-dashboard-password.txt /root/crown-dashboard-password.txt

          nginx -t
          systemctl reload nginx

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8081/)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "footbreak:$NEW_PASSWORD" http://127.0.0.1:8081/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:8082/)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "crown:$NEW_PASSWORD" http://127.0.0.1:8082/)" = 200
          echo "Footbreak and Crown authentication verified"
          REMOTE
          } | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s'
