name: Crown condition 2 odds threshold analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Analyze the exact active V2 evidence without writing production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            <<'PY' | tee /tmp/crown-condition2-threshold-result.json
          import json
          import math
          from pathlib import Path

          from analysis.recover_crown_condition2_history import (
              _condition, _kickoff, _matching_rows, _rows, _time,
          )
          from analysis.wilson_validation import wilson95

          ledger = json.loads(
              Path("/var/lib/footbreak/crown/ledger.json").read_text(
                  encoding="utf-8"
              )
          )
          history = json.loads(
              Path("/var/lib/footbreak/crown/prediction_history.json").read_text(
                  encoding="utf-8"
              )
          )
          _namespace, frozen = _condition(ledger)
          historical = frozen["historical_evidence"]
          artifact = historical.get("artifact") or {}
          boundary_text = artifact.get("as_of") or frozen.get("frozen_at")
          boundary = _time(boundary_text)
          if boundary is None:
              raise SystemExit("invalid condition #2 discovery boundary")

          eligible = [
              row for row in _rows(history)
              if (
                  _time(_kickoff(row)) is not None
                  and _time(_kickoff(row)) <= boundary
                  and _time(row.get("verified_at")) is not None
                  and _time(row.get("verified_at")) <= boundary
              )
          ]
          baseline = _matching_rows(
              eligible, frozen["definition"], settled_only=True,
          )
          holdout_size = max(1, math.ceil(len(baseline) * 0.30))
          holdout = baseline[-holdout_size:]
          recovered = frozen.get("historical_recovery_rows") or []

          def normalized_result(value):
              mapping = {
                  "won": "Won",
                  "half won": "Half Won",
                  "lost": "Lost",
                  "half lost": "Half Lost",
              }
              return mapping.get(str(value or "").strip().lower())

          def baseline_result(item):
              terminal = item["terminal"]
              candidates = []
              for grade in item["source"].get("market_grades") or []:
                  if not isinstance(grade, dict):
                      continue
                  if str(grade.get("code") or "").upper() != "HIL":
                      continue
                  if str(grade.get("side") or grade.get("selection") or "").upper() != str(
                      terminal.get("side") or ""
                  ).upper():
                      continue
                  try:
                      same_odds = abs(
                          float(grade.get("odds")) - float(terminal.get("odds"))
                      ) <= 1e-9
                      same_line = abs(
                          float(grade.get("line", grade.get("condition")))
                          - float(terminal.get("selected_line"))
                      ) <= 1e-9
                  except (TypeError, ValueError):
                      continue
                  result = normalized_result(grade.get("settlement"))
                  if same_odds and same_line and result is not None:
                      candidates.append(result)
              if len(candidates) != 1:
                  raise SystemExit(
                      f"fixture {item['fixture']} has "
                      f"{len(candidates)} exact baseline settlements"
                  )
              return candidates[0]

          evidence = []
          for cohort, rows in (
              ("baseline_v1", baseline),
              ("duplicate_holdout_v2", holdout),
          ):
              for item in rows:
                  terminal = item["terminal"]
                  hit = terminal.get("hit")
                  if hit is not True and hit is not False:
                      continue
                  evidence.append({
                      "cohort": cohort,
                      "fixture": item["fixture"],
                      "odds": terminal.get("odds"),
                      "hit": hit is True,
                      "result": baseline_result(item),
                  })
          for row in recovered:
              result = normalized_result(row.get("result"))
              if result not in {"Won", "Half Won", "Lost", "Half Lost"}:
                  continue
              evidence.append({
                  "cohort": "recovered_v2",
                  "fixture": row.get("match_id"),
                  "odds": row.get("odds"),
                  "hit": result in {"Won", "Half Won"},
                  "result": result,
              })

          total_hits = sum(row["hit"] for row in evidence)
          if len(evidence) != 530 or total_hits != 317:
              raise SystemExit(
                  f"active V2 reconstruction mismatch: "
                  f"{total_hits}/{len(evidence)}"
              )
          if any(row["odds"] is None for row in evidence):
              raise SystemExit("active V2 evidence contains missing odds")

          unique_by_fixture = {}
          duplicate_rows = []
          for row in evidence:
              fixture = str(row["fixture"] or "").strip()
              if not fixture:
                  raise SystemExit("active V2 evidence contains missing fixture")
              normalized = {
                  **row,
                  "fixture": fixture,
                  "odds": float(row["odds"]),
              }
              previous = unique_by_fixture.get(fixture)
              if previous is None:
                  unique_by_fixture[fixture] = normalized
                  continue
              duplicate_rows.append(normalized)
              if (
                  previous["hit"] != normalized["hit"]
                  or previous["result"] != normalized["result"]
                  or abs(previous["odds"] - normalized["odds"]) > 1e-9
              ):
                  raise SystemExit(
                      f"conflicting duplicate fixture {fixture}: "
                      f"{previous!r} vs {normalized!r}"
                  )

          unique_evidence = list(unique_by_fixture.values())
          unique_hits = sum(row["hit"] for row in unique_evidence)
          if len(unique_evidence) != 459 or len(duplicate_rows) != 71:
              raise SystemExit(
                  f"unexpected deduplication result: "
                  f"{len(unique_evidence)} unique, "
                  f"{len(duplicate_rows)} duplicates"
              )

          thresholds = []
          for threshold in (1.70, 1.80, 1.85, 1.90):
              selected = [
                  row for row in unique_evidence
                  if float(row["odds"]) >= threshold
              ]
              hits = sum(row["hit"] for row in selected)
              decided = len(selected)
              interval = wilson95(hits, decided)
              result_counts = {
                  result: sum(row["result"] == result for row in selected)
                  for result in ("Won", "Half Won", "Lost", "Half Lost")
              }
              def unit_pnl(row):
                  return {
                      "Won": row["odds"] - 1.0,
                      "Half Won": (row["odds"] - 1.0) / 2.0,
                      "Lost": -1.0,
                      "Half Lost": -0.5,
                  }[row["result"]]
              turnover = float(decided)
              net_pnl = sum(unit_pnl(row) for row in selected)
              gross_return = turnover + net_pnl
              thresholds.append({
                  "minimum_odds": threshold,
                  "hits": hits,
                  "losses": decided - hits,
                  "decided": decided,
                  "hit_rate": hits / decided if decided else None,
                  "wilson95_lower": interval[0] if interval else None,
                  "wilson95_upper": interval[1] if interval else None,
                  "settlements": result_counts,
                  "average_odds": (
                      sum(row["odds"] for row in selected) / decided
                      if decided else None
                  ),
                  "unit_stake": 1.0,
                  "turnover": turnover,
                  "gross_return": gross_return,
                  "net_pnl": net_pnl,
                  "roi": net_pnl / turnover if turnover else None,
              })

          print(json.dumps({
              "read_only": True,
              "condition_number": 2,
              "condition_signature": frozen.get("signature"),
              "active_v2_reconstructed": {
                  "hits": total_hits,
                  "decided": len(evidence),
                  "hit_rate": total_hits / len(evidence),
              },
              "independent_fixture_evidence": {
                  "hits": unique_hits,
                  "losses": len(unique_evidence) - unique_hits,
                  "decided": len(unique_evidence),
                  "hit_rate": unique_hits / len(unique_evidence),
                  "duplicate_rows_removed": len(duplicate_rows),
                  "deduplication_key": "fixture",
                  "duplicate_consistency": "same odds and hit",
              },
              "cohorts": {
                  cohort: {
                      "hits": sum(
                          row["hit"] for row in evidence
                          if row["cohort"] == cohort
                      ),
                      "decided": sum(
                          row["cohort"] == cohort for row in evidence
                      ),
                  }
                  for cohort in (
                      "baseline_v1",
                      "duplicate_holdout_v2",
                      "recovered_v2",
                  )
              },
              "thresholds": thresholds,
          }, ensure_ascii=False, indent=2))
          PY

          {
            echo '## Independent fixture threshold analysis'
            echo
            echo '```json'
            cat /tmp/crown-condition2-threshold-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
