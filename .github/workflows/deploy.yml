name: 部署到 DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  syntax-check:
    name: 語法檢查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 編譯所有 Python 模組
        run: |
          python3 -m compileall -q system bin crown analysis || exit 1
          echo "Python 語法 OK"

      - name: 檢查 shell 腳本
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n system/run_all.sh deploy/run.sh deploy/crown-run.sh deploy/backtest-run.sh deploy/health-check.sh deploy/footbreak-tick-preempt.sh deploy/setup.sh deploy/update.sh
          shellcheck -S error deploy/*.sh system/run_all.sh || true
          echo "Shell 語法 OK"

      - name: 驗證 Crown 與 Footbreak PinnAPI 離線回歸測試
        run: |
          bash crown/validate.sh
          python3 -m unittest discover -s system/tests -t .
          python3 -m unittest discover -s analysis/tests -t .
          echo "Crown and Footbreak offline safety tests OK"

      - name: 驗證 external-tool 相容層介面
        run: |
          set -e
          # 冇 key 應該 exit 1 兼出 JSON 錯誤,唔可以 traceback
          out=$(bin/external-tool call '{"source_id":"opticodds","arguments":{"path":"/sports"}}' 2>&1) && rc=0 || rc=$?
          [ "$rc" = "1" ] || { echo "預期 exit 1,實際 $rc"; exit 1; }
          echo "$out" | python -c "import sys,json; json.load(sys.stdin)"
          echo "相容層 OK"

  deploy:
    name: 部署
    needs: syntax-check
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: SSH 入 droplet 執行更新
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/update.sh main'

      - name: 部署後完整健康檢查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/health-check.sh'
