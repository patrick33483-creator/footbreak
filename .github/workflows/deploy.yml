name: 部署到 DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  syntax-check:
    name: 語法檢查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 編譯所有 Python 模組
        run: |
          python3 -m compileall -q system bin crown analysis || exit 1
          echo "Python 語法 OK"

      - name: 檢查 shell 腳本
        run: |
          bash -n system/run_all.sh deploy/run.sh deploy/crown-run.sh deploy/reconcile-results.sh deploy/backtest-run.sh deploy/health-check.sh deploy/dashboard-self-heal.sh deploy/enable-crown.sh deploy/footbreak-tick-preempt.sh deploy/footbreak-refresh-current-odds.sh deploy/setup.sh deploy/update.sh
          if ! command -v shellcheck >/dev/null 2>&1; then
            timeout 120s sudo apt-get update -qq &&
              timeout 120s sudo apt-get install -y -qq shellcheck ||
              echo "ShellCheck 套件暫時不可用；已完成強制 bash -n 語法檢查"
          fi
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S error deploy/*.sh system/run_all.sh || true
          fi
          echo "Shell 語法 OK"

      - name: 驗證 Crown 與 Footbreak PinnAPI 離線回歸測試
        run: |
          bash crown/validate.sh
          python3 -m unittest discover -s system/tests -t .
          python3 -m unittest discover -s analysis/tests -t .
          echo "Crown and Footbreak offline safety tests OK"

      - name: 驗證 external-tool 相容層介面
        run: |
          set -e
          # 冇 key 應該 exit 1 兼出 JSON 錯誤,唔可以 traceback
          out=$(bin/external-tool call '{"source_id":"opticodds","arguments":{"path":"/sports"}}' 2>&1) && rc=0 || rc=$?
          [ "$rc" = "1" ] || { echo "預期 exit 1,實際 $rc"; exit 1; }
          echo "$out" | python -c "import sys,json; json.load(sys.stdin)"
          echo "相容層 OK"

  deploy:
    name: 部署
    needs: syntax-check
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: SSH 入 droplet 執行更新
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo bash -c '"'"'
              set -euo pipefail
              available_kb=$(df -Pk / | awk "NR == 2 {print \$4}")
              echo "deployment_preflight_available_kb=$available_kb"
              if [ "$available_kb" -lt 524288 ]; then
                apt-get clean
                rm -rf /var/lib/apt/lists/*
                journalctl --vacuum-size=100M >/dev/null 2>&1 || true
                find /tmp -xdev -type f -mtime +2 -delete 2>/dev/null || true
              fi
              available_kb=$(df -Pk / | awk "NR == 2 {print \$4}")
              echo "deployment_preflight_available_after_kb=$available_kb"
              if [ "$available_kb" -lt 131072 ]; then
                echo "Insufficient safe free space for deployment" >&2
                exit 1
              fi
            '"'"''
          if ! ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/update.sh main'; then
            echo "正常更新失敗；用 GitHub 官方 SSH 443 備援拉取最新部署腳本後重試"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              'sudo bash -c '"'"'
                set -euo pipefail
                cd /opt/footbreak
                export GIT_SSH_COMMAND="ssh -i /home/radar/.ssh/footbreak_github -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/radar/.ssh/known_hosts -o ConnectTimeout=10 -o Hostname=ssh.github.com -p 443 -o HostKeyAlias=github.com"
                git fetch --quiet origin main
                git reset --hard --quiet origin/main
                exec /opt/footbreak/deploy/update.sh main
              '"'"''
          fi

      - name: 部署後完整健康檢查
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/health-check.sh' \
            > /tmp/health-check.log 2>&1
          health_rc=$?
          set -e
          cat /tmp/health-check.log
          if [ "$health_rc" -ne 0 ]; then
            health_error=$(tail -n 30 /tmp/health-check.log | tr "\n" " " | sed "s/%/%25/g")
            echo "::error file=.github/workflows/deploy.yml,line=70::$health_error"
            exit "$health_rc"
          fi

      - name: 部署後只刷新未開賽 Crown 現價（不重跑階段）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # refresh is explicitly dashboard-quote-only: no ledger/history
          # mutation, settlement, simulation, or Telegram notification. Titan
          # can take several minutes across many cards, so DigitalOcean owns
          # the long-running process instead of holding the deployment SSH
          # session open. crown-run.sh's non-blocking lock still guarantees
          # that only one refresh can run.
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo sh -c 'install -d -m 0700 /var/lib/footbreak/private; \
              nohup /opt/footbreak/deploy/crown-run.sh refresh \
              >>/var/lib/footbreak/private/crown-current-odds-refresh.log \
              2>&1 </dev/null &'"
          echo "Crown current-quote refresh handed to the protected server process."

      - name: 部署後只刷新未開賽 Footbreak 現價（不重跑階段）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # This command updates a separate current-quote journal for future
          # cards only. It does not run prediction, ledger, settlement, bet,
          # learning, or notification paths and fails closed on board errors.
          set +e
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo /opt/footbreak/deploy/footbreak-refresh-current-odds.sh'
          refresh_rc=$?
          set -e
          if [ "$refresh_rc" -eq 75 ]; then
            echo "Footbreak current-quote refresh is already running; reuse that protected run."
          elif [ "$refresh_rc" -ne 0 ]; then
            exit "$refresh_rc"
          fi
