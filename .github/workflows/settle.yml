name: 手動正式結算

on:
  workflow_dispatch:

concurrency:
  group: production-settlement
  cancel-in-progress: false

jobs:
  settle:
    name: 結算足破及皇冠
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行兩套模擬系統結算
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            restart_timers() {
              sudo systemctl start footbreak-tick.timer
              sudo systemctl start footbreak-sweep.timer
            }
            trap restart_timers EXIT
            sudo systemctl stop footbreak-tick.timer footbreak-sweep.timer
            for i in $(seq 1 120); do
              sudo flock -n /var/lock/footbreak.lock true && break
              sleep 5
            done
            if ! sudo flock -n /var/lock/footbreak.lock true; then
              echo "足破資料鎖超過 10 分鐘仍未釋放，拒絕假裝結算成功" >&2
              exit 1
            fi
            echo "=== Footbreak settlement ==="
            sudo /opt/footbreak/deploy/run.sh settle
            echo "=== Crown dashboard settlement API ==="
            response=$(curl --fail --silent --show-error --max-time 240 \
              -X POST http://127.0.0.1:8765/api/settle \
              -H "Content-Type: application/json" \
              -H "X-Crown-Action: settle-simulation" \
              --data "{\"confirm\":\"simulation-only\"}")
            python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get(\"ok\") is True; print(\"Crown API OK\", d.get(\"settled_count\", 0), d.get(\"pending_count\", 0), d.get(\"warning\"))" <<< "$response"
          '
