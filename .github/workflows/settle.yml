name: 手動正式結算

on:
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  settle:
    name: 結算足破及皇冠
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行兩套模擬系統結算
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            restart_timers() {
              sudo systemctl start footbreak-tick.timer
              sudo systemctl start footbreak-sweep.timer
              sudo systemctl start crown-tick.timer
              sudo systemctl start crown-sweep.timer
              sudo systemctl start crown-settle.timer
            }
            trap restart_timers EXIT
            sudo systemctl stop footbreak-tick.timer footbreak-sweep.timer
            sudo systemctl stop crown-tick.timer crown-sweep.timer crown-settle.timer
            sudo systemctl stop footbreak-tick.service footbreak-sweep.service footbreak-settle.service || true
            sudo systemctl stop crown-tick.service crown-sweep.service crown-settle.service || true
            sudo rm -f /run/footbreak-t5-priority
            for i in $(seq 1 120); do
              sudo flock -n /var/lock/footbreak.lock true && break
              sleep 5
            done
            if ! sudo flock -n /var/lock/footbreak.lock true; then
              echo "足破資料鎖超過 10 分鐘仍未釋放，拒絕假裝結算成功" >&2
              exit 1
            fi
            echo "=== Footbreak settlement ==="
            set +e
            footbreak_output=$(sudo /opt/footbreak/deploy/run.sh settle 2>&1)
            footbreak_rc=$?
            set -e
            printf "%s\n" "$footbreak_output"
            if [ "$footbreak_rc" -ne 0 ]; then
              footbreak_error=$(printf "%s\n" "$footbreak_output" | tail -n 20 | tr "\n" " " | sed "s/%/%25/g")
              echo "::error file=.github/workflows/settle.yml,line=52::$footbreak_error"
              exit "$footbreak_rc"
            fi
            echo "=== Crown direct settlement ==="
            crown_rc=75
            crown_output=""
            for crown_attempt in 1 2 3; do
              set +e
              crown_output=$(sudo /opt/footbreak/deploy/crown-run.sh settle 2>&1)
              crown_rc=$?
              set -e
              printf "%s\n" "$crown_output"
              [ "$crown_rc" -ne 75 ] && break
              echo "Crown settle lock busy; retry $crown_attempt/3"
              sleep 5
            done
            if [ "$crown_rc" -ne 0 ]; then
              crown_error=$(printf "%s\n" "$crown_output" | tail -n 20 | tr "\n" " " | sed "s/%/%25/g")
              echo "::error file=.github/workflows/settle.yml,line=65::$crown_error"
              exit "$crown_rc"
            fi
            python3 -c "import json; d=json.load(open(\"/var/www/crown/data.json\", encoding=\"utf-8\")); assert d.get(\"schema_version\") == \"crown-dashboard-v2\"; l=d.get(\"ledger\") or {}; print(\"Crown direct OK\", {\"condition_simulation_bets\": len(l.get(\"bets\") or []), \"strategy\": (l.get(\"stats\") or {}).get(\"strategy\"), \"result_sync\": (d.get(\"prediction_history\") or {}).get(\"result_sync\")})"
            echo "=== Prediction-history production assertions ==="
            sudo /opt/footbreak/.venv/bin/python3 \
              /opt/footbreak/deploy/verify-result-integrity.py
          ' > /tmp/settlement.log 2>&1
          settlement_rc=$?
          set -e
          cat /tmp/settlement.log
          if [ "$settlement_rc" -ne 0 ]; then
            settlement_error=$(tail -n 30 /tmp/settlement.log | tr "\n" " " | sed "s/%/%25/g")
            echo "::error file=.github/workflows/settle.yml,line=25::$settlement_error"
            exit "$settlement_rc"
          fi
