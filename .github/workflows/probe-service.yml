name: probe merge service
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/probe-service.yml']
concurrency: {group: production-maintenance, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          echo "=== crownsystem-v3-merge.service ==="
          sudo -n systemctl cat crownsystem-v3-merge.service 2>&1 | head -30
          echo ""
          echo "=== /opt/footbreak/deploy/v3/ contents ==="
          sudo -n ls -la /opt/footbreak/deploy/v3/
          echo ""
          echo "=== does merge script touch nginx? ==="
          sudo -n grep -nE "nginx|sites-available" /opt/footbreak/deploy/v3/*.py 2>/dev/null | head
          echo ""
          echo "=== nginx config mtime + current state ==="
          sudo -n stat /etc/nginx/sites-available/unified-dashboard | grep -E "Modify|Size"
          sudo -n grep -n "crownsystem-v3" /etc/nginx/sites-available/unified-dashboard
          echo ""
          echo "=== who has been writing recently ==="
          sudo -n find /etc/nginx/sites-available/ -newer /tmp -mmin -30 -ls 2>/dev/null
          EOF
