name: Crown condition 6 independent history audit

on:
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Reconstruct condition 6 without writing production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env EXPECTED_COMMIT='$EXPECTED_COMMIT' bash -s" \
            <<'REMOTE' | tee crown-condition6-history-audit.json
          set -euo pipefail
          cd /opt/footbreak
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          python=/opt/footbreak/.venv/bin/python3
          [ -x "$python" ] || python=python3
          if [ -f /etc/footbreak.env ]; then set -a; . /etc/footbreak.env; set +a; fi
          if [ -f /etc/footbreak-crown.env ]; then
            set -a; . /etc/footbreak-crown.env; set +a
          fi
          export CROWN_STATE_DIR="${CROWN_STATE_DIR:-/var/lib/footbreak/crown}"
          ledger="$CROWN_STATE_DIR/ledger.json"
          history="$CROWN_STATE_DIR/prediction_history.json"
          test -s "$ledger"
          test -s "$history"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          exec 8>"$CROWN_STATE_DIR/.state.lock"
          flock -s -w 120 8
          cp --preserve=mode,timestamps "$ledger" "$work/ledger.json"
          cp --preserve=mode,timestamps "$history" "$work/history.json"
          flock -u 8
          PYTHONPATH=/opt/footbreak "$python" \
            analysis/audit_crown_condition6_history.py \
            --ledger "$work/ledger.json" \
            --history "$work/history.json"
          REMOTE

      - name: Remove SSH key
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-condition6-history-audit-${{ github.run_id }}
          path: crown-condition6-history-audit.json
          retention-days: 30
          if-no-files-found: error
