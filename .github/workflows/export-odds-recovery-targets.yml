name: 匯出缺賠率只讀稽核目標

on:
  workflow_dispatch:

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 匯出最小化缺賠率目標
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 audit-targets
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$target" 'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            > audit-targets/targets.json <<'PY'
          import json
          from pathlib import Path

          from analysis.odds_recovery import _load_rows, compact_provider_target_rows

          sources = {
              "footbreak": Path("/var/www/footbreak/data.json"),
              "crown": Path("/var/lib/footbreak/crown/prediction_history.json"),
          }
          payload = {
              "schema_version": 1,
              "read_only": True,
              "systems": {
                  system: compact_provider_target_rows(_load_rows(path), system)
                  for system, path in sources.items()
              },
          }
          print(json.dumps(payload, ensure_ascii=False, separators=(",", ":")))
          PY
          chmod 600 audit-targets/targets.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("audit-targets/targets.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          manifest = {
              "schema_version": 1,
              "read_only": True,
              "target_counts": {
                  system: len(rows)
                  for system, rows in payload.get("systems", {}).items()
              },
          }
          Path("audit-targets/manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          chmod 600 audit-targets/manifest.json

      - name: 保存私有稽核輸入
        uses: actions/upload-artifact@v4
        with:
          name: odds-recovery-compact-targets
          path: audit-targets/
          retention-days: 1
          if-no-files-found: error

      - name: 清理 runner 暫存
        if: always()
        run: rm -rf -- audit-targets
