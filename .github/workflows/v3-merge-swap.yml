name: V3 merge swap to crown-radar
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/v3-merge-swap.yml']

concurrency: {group: production-maintenance, cancel-in-progress: false}

jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Guard push (only dispatch runs the swap)
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "push event registered workflow. Skipping. Use workflow_dispatch to actually swap."
          exit 0
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env:
          SSHKEY: ${{ secrets.DEPLOY_SSH_KEY }}
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          SSH="ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 $U@$H"
          SCP="scp -i ~/.ssh/id -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30"
          
          # Upload new merge script to a staging path
          $SCP .github/scripts/merge_titan_v2.new.py $U@$H:/tmp/merge_titan_v2.new.py
          
          $SSH bash <<'EOF'
          set -e
          TS=$(date +%Y%m%d-%H%M%S)
          echo "=== 1. Backup old ==="
          sudo -n cp -p /opt/footbreak/deploy/v3/merge_titan_v2.py /opt/footbreak/deploy/v3/merge_titan_v2.py.bak.$TS
          ls -la /opt/footbreak/deploy/v3/
          
          echo ""
          echo "=== 2. Install new ==="
          sudo -n cp /tmp/merge_titan_v2.new.py /opt/footbreak/deploy/v3/merge_titan_v2.py
          sudo -n chmod +x /opt/footbreak/deploy/v3/merge_titan_v2.py
          
          echo ""
          echo "=== 3. Manual run new merge ==="
          sudo -n /usr/bin/python3 /opt/footbreak/deploy/v3/merge_titan_v2.py
          
          echo ""
          echo "=== 4. Verify matches.json ==="
          ls -la /var/www/crownsystem-v3/matches.json
          python3 -c "
          import json
          d=json.load(open('/var/www/crownsystem-v3/matches.json'))
          print('count:',d.get('count'),'source:',d.get('source'))
          ms=d.get('matches') or []
          ok=[m for m in ms if not m['first'].startswith('(') and not m['first'].startswith('-')]
          empty=[m for m in ms if m['first'].startswith('(等候中')]
          print('with_forecast:',len(ok),'/',len(ms))
          print('empty:',len(empty),'/',len(ms))
          for m in ms[:3]:
              print(m['kickoff_display'],m['home'],'vs',m['away'],'| first:',m['first'],'| t30:',m['t30'],'| t5:',m['t5'])
          "
          EOF
