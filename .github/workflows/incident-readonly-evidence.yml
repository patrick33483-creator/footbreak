name: Verify notification display deployment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Configure existing SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Verify notification code and automatic service health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/crown-resend-2000-${GITHUB_RUN_ID}"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          scp analysis/check_v3_tg_display.py \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo python3 '$remote/check_v3_tg_display.py'" \
            > crown-2000-resend-prepared.json
      - uses: actions/upload-artifact@v4
        with:
          name: crown-2000-resend-prepared
          path: crown-2000-resend-prepared.json
          retention-days: 3
