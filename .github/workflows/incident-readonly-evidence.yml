name: Isolated A-low N2 read-only replay evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Configure existing SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Stream read-only evidence to runner
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' \
            < analysis/alow_n2_evidence.py | gzip > alow-n2-evidence.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: alow-n2-readonly-evidence
          path: alow-n2-evidence.json.gz
          retention-days: 3
