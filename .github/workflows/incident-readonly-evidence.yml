name: Aplus first natural TG acceptance monitor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Configure existing SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Test independent monitor
        run: python3 -m unittest discover -s analysis -p test_alow_first_tg_watch.py
      - name: Install read-only Aplus monitor without restarting production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/alow-first-tg-${GITHUB_RUN_ID}"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          scp analysis/install_alow_first_tg_watch.py analysis/alow_first_tg_watch.py analysis/alow_first_tg_runtime.mjs \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo python3 '$remote/install_alow_first_tg_watch.py'" \
            > alow-first-tg-receipt.json
          sleep 40
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo python3 /opt/crown-radar-v2/ops/alow-first-tg/watch.py --status; sudo systemctl show crown-alow-first-tg-watch.service -p Result -p ExecMainStatus" \
            > alow-first-tg-postcheck.txt
      - uses: actions/upload-artifact@v4
        with:
          name: alow-first-tg-receipt
          path: |
            alow-first-tg-receipt.json
            alow-first-tg-postcheck.txt
          retention-days: 3
