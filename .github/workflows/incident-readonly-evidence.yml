name: Incident read-only evidence bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    if: ${{ false }}
    name: Preserve Crown and Radar incident evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Collect bounded, read-only production evidence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 -' \
            > incident-evidence.json <<'PY'
          import base64
          import json
          import os
          import sqlite3
          import subprocess
          import urllib.request
          from collections import Counter
          from datetime import datetime, timedelta
          from pathlib import Path

          from crown.common import HKT, parse_time
          from crown.ledger import PREDICTION_ERA, completed_stages
          from crown.matching import MATCHING_VERSION

          def run(*command):
              try:
                  return subprocess.run(
                      command, text=True, capture_output=True, timeout=20, check=False
                  ).stdout[-6000:]
              except Exception as exc:
                  return type(exc).__name__

          def read_json(path, default):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return json.load(fh)
              except Exception:
                  return default

          now = datetime.now(HKT)
          ledger = read_json("/var/lib/footbreak/crown/ledger.json", {})
          cards = read_json("/var/lib/footbreak/crown/predictions.json", [])
          public = read_json("/var/www/crown/data.json", {})
          watch = ledger.get("watch", {}) if isinstance(ledger, dict) else {}
          cards_by_id = {
              str(row.get("match_id")): row for row in cards
              if isinstance(row, dict) and row.get("match_id")
          }
          incident = []
          for match_id, item in watch.items():
              if not isinstance(item, dict):
                  continue
              card = cards_by_id.get(str(match_id), {})
              merged = dict(item)
              merged.update({k: v for k, v in card.items() if v is not None})
              kickoff = parse_time(merged.get("kickoff_hkt") or merged.get("kickoff"))
              if kickoff is None:
                  continue
              kickoff = kickoff.astimezone(HKT)
              if kickoff.strftime("%Y-%m-%d %H:%M") != now.strftime("%Y-%m-%d") + " 18:30":
                  continue
              stages = [
                  {
                      "stage": str(stage.get("stage") or ""),
                      "status": str(stage.get("status") or ""),
                      "ts": str(stage.get("ts") or ""),
                      "odds_status": str(stage.get("odds_status") or ""),
                      "no_bet_reason": str(stage.get("no_bet_reason") or "")[:180],
                  }
                  for stage in item.get("stages", [])
                  if isinstance(stage, dict) and stage.get("stage") in {"首預", "T-30", "T-5"}
              ]
              done = completed_stages(item, MATCHING_VERSION, PREDICTION_ERA)
              t5 = [stage for stage in stages if stage["stage"] == "T-5"]
              incident.append({
                  "match_id": str(match_id),
                  "fixture": f"{merged.get('home', '')} vs {merged.get('away', '')}",
                  "league": str(merged.get("league") or ""),
                  "kickoff_hkt": kickoff.isoformat(),
                  "native_t5_truth": (
                      "durably_recorded" if "T-5" in done else
                      "attempted_rejected" if t5 else "missed_no_persisted_attempt"
                  ),
                  "stages": stages,
                  "card_status": str(card.get("status") or ""),
                  "card_reason": str(card.get("no_bet_reason") or "")[:180],
              })
          incident.sort(key=lambda row: row["fixture"])
          upcoming = []
          for match_id, item in watch.items():
              if not isinstance(item, dict):
                  continue
              merged = dict(item)
              card = cards_by_id.get(str(match_id), {})
              merged.update({k: v for k, v in card.items() if v is not None})
              kickoff = parse_time(merged.get("kickoff_hkt") or merged.get("kickoff"))
              stages = item.get("stages") if isinstance(item.get("stages"), list) else []
              if (kickoff is None or kickoff <= now or kickoff > now + timedelta(hours=24)
                      or any(isinstance(stage, dict) and stage.get("stage") == "T-5" for stage in stages)):
                  continue
              upcoming.append({
                  "match_id": str(match_id), "fixture": f"{merged.get('home', '')} vs {merged.get('away', '')}",
                  "league": str(merged.get("league") or ""), "kickoff_hkt": kickoff.astimezone(HKT).isoformat(),
                  "minutes_to_t5": round((kickoff - now).total_seconds() / 60.0 - 5.0, 1),
                  "stages": [{"stage": str(stage.get("stage") or ""), "status": str(stage.get("status") or ""),
                              "ts": str(stage.get("ts") or "")} for stage in stages if isinstance(stage, dict)],
              })
          upcoming.sort(key=lambda row: row["kickoff_hkt"])
          validation_ids = {"2952553", "3049304", "3064095", "3069328"}
          validation = []
          for match_id in validation_ids:
              item = watch.get(match_id, {})
              card = cards_by_id.get(match_id, {})
              if not isinstance(item, dict):
                  continue
              validation.append({
                  "match_id": match_id, "fixture": f"{item.get('home', '')} vs {item.get('away', '')}",
                  "kickoff_hkt": str(item.get("kickoff_hkt") or item.get("kickoff") or ""),
                  "stages": [{"stage": str(stage.get("stage") or ""), "status": str(stage.get("status") or ""),
                              "ts": str(stage.get("ts") or ""), "odds_status": str(stage.get("odds_status") or "")}
                             for stage in item.get("stages", []) if isinstance(stage, dict)],
                  "card_status": str(card.get("status") or ""),
                  "card_selected_quote": card.get("selected_odds_journal") or card.get("current_selected_odds_journal") or [],
              })
          validation.sort(key=lambda row: row["match_id"])

          def radar_dashboard():
              values = {}
              try:
                  for raw in Path("/opt/odds-radar/.env").read_text().splitlines():
                      if "=" in raw and not raw.lstrip().startswith("#"):
                          key, value = raw.split("=", 1)
                          values[key] = value
                  token = base64.b64encode(
                      f"{values.get('RADAR_ACCESS_USER','')}:{values.get('RADAR_ACCESS_PASSWORD','')}".encode()
                  ).decode()
                  req = urllib.request.Request(
                      "http://127.0.0.1:5001/api/dashboard",
                      headers={"Authorization": f"Basic {token}"},
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.load(response)
                  matches = data.get("matches", []) if isinstance(data, dict) else []
                  market = Counter()
                  exact = Counter()
                  for match in matches:
                      for line in match.get("lines", []) if isinstance(match, dict) else []:
                          name = str(line.get("market") or "")
                          market[name] += 1
                          if line.get("exactLine"):
                              exact[name] += 1
                  return {
                      "http_status": 200,
                      "matches": len(matches),
                      "lines_by_market": dict(market),
                      "exact_lines_by_market": dict(exact),
                      "status": data.get("status", {}),
                  }
              except Exception as exc:
                  return {"http_status": None, "error": type(exc).__name__}

          radar_db = {}
          try:
              db = sqlite3.connect("/opt/odds-radar/data/data.db")
              radar_db = {
                  "matches": db.execute("select count(*) from matches").fetchone()[0],
                  "latest_rows": db.execute("select count(*) from odds_latest").fetchone()[0],
                  "snapshot_rows": db.execute("select count(*) from odds_snapshots").fetchone()[0],
              }
              db.close()
          except Exception as exc:
              radar_db = {"error": type(exc).__name__}

          print(json.dumps({
              "generated_at_hkt": now.isoformat(),
              "read_only": True,
              "provider_requests": False,
              "crown_incident_fixtures": incident,
              "upcoming_crown_t5": upcoming[:8],
              "validation_crown_t5": validation,
              "crown_runtime": {
                  "units": run("systemctl", "show", "crown-tick.timer", "crown-tick.service",
                               "footbreak-server-health-monitor.timer",
                               "--no-pager", "-p", "ActiveState", "-p", "SubState", "-p", "Result",
                               "-p", "LastTriggerUSec", "-p", "NextElapseUSecRealtime",
                               "-p", "ExecMainStatus"),
                  "recent_tick_journal": run("journalctl", "-u", "crown-tick.service",
                                             "--since", "2026-08-21 17:45:00",
                                             "--until", "2026-08-21 19:05:00",
                                             "--no-pager", "-o", "short-iso"),
                  "recent_monitor_journal": run("journalctl", "-u", "footbreak-server-health-monitor.service",
                                                "--since", "2026-08-21 17:45:00",
                                                "--until", "2026-08-21 19:05:00",
                                                "--no-pager", "-o", "short-iso"),
                  "lock_holders": run("fuser", "/var/lock/footbreak-crown-tick.lock"),
              },
              "radar": {
                  "dashboard": radar_dashboard(),
                  "database": radar_db,
                  "compose": run("docker", "compose", "-f", "/opt/odds-radar/compose.yaml", "ps"),
                  "recent_logs": run("docker", "compose", "-f", "/opt/odds-radar/compose.yaml",
                                     "logs", "--tail", "180", "radar"),
              },
          }, ensure_ascii=False))
          PY

      - name: Upload immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: incident-readonly-evidence
          path: incident-evidence.json
          if-no-files-found: error
          retention-days: 30

  confirmed-results-dry-run:
    name: Validate confirmed results against a production ledger snapshot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify reviewed inputs
        run: |
          set -euo pipefail
          git merge-base --is-ancestor \
            "21ab43ccd31e86f752d89250f0fa6ee0ff93c737" HEAD
          echo "b8fb0ca635909a117b48a8c8fbf951e606e95d5c6f0c7f95bf034460b14a417b  crown/backfill_confirmed_results.py" \
            | sha256sum --check --strict
          echo "6e996b0c8caf7330b39885afc4d3fd03ba9cc9b4d084364050d4f2542991d3d1  deploy/backfill/fixtures_42_verified.json" \
            | sha256sum --check --strict

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Run against an isolated production ledger snapshot
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="$(ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
            'umask 077; mktemp -d /tmp/crown-confirmed-results-dry-run.XXXXXX')"
          cleanup() {
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              "sudo rm -rf -- $(printf '%q' "$remote_dir")" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git archive --format=tar HEAD crown analysis \
            | ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
                "tar -xf - -C $(printf '%q' "$remote_dir")"
          scp -q deploy/backfill/fixtures_42_verified.json \
            "$target:$remote_dir/fixtures_42_verified.json"

          ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
            "sudo env REMOTE_DIR=$(printf '%q' "$remote_dir") \
              PYTHONPATH=$(printf '%q' "$remote_dir") \
              /opt/footbreak/.venv/bin/python3 -s" \
            > crown-confirmed-results-production-dry-run.json <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          from crown.backfill_confirmed_results import execute
          from crown.config import settings
          from dataclasses import replace

          remote_dir = Path(os.environ["REMOTE_DIR"])
          production_ledger = Path("/var/lib/footbreak/crown/ledger.json")
          snapshot_state = remote_dir / "state"
          snapshot_state.mkdir(mode=0o700)
          snapshot_ledger = snapshot_state / "ledger.json"

          before_raw = production_ledger.read_bytes()
          before_sha = hashlib.sha256(before_raw).hexdigest()
          shutil.copyfile(production_ledger, snapshot_ledger)
          snapshot_ledger.chmod(0o600)

          config = replace(settings(), state_dir=snapshot_state)
          manifest_path = remote_dir / "dry-run-manifest.json"
          result = execute(
              config,
              remote_dir / "fixtures_42_verified.json",
              apply=False,
              manifest_path=manifest_path,
          )

          after_raw = production_ledger.read_bytes()
          after_sha = hashlib.sha256(after_raw).hexdigest()
          if before_sha != after_sha or before_raw != after_raw:
              raise SystemExit("production_ledger_changed_during_dry_run")

          output = {
              "reviewed_commit": "21ab43ccd31e86f752d89250f0fa6ee0ff93c737",
              "production_ledger_before_sha256": before_sha,
              "production_ledger_after_sha256": after_sha,
              "production_ledger_byte_unchanged": True,
              "dry_run": result,
          }
          print(json.dumps(output, ensure_ascii=False, indent=2, sort_keys=True))
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("crown-confirmed-results-production-dry-run.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          dry_run = result["dry_run"]
          counts = dry_run["counts"]
          assert result["production_ledger_byte_unchanged"] is True
          assert result["production_ledger_before_sha256"] == result["production_ledger_after_sha256"]
          assert dry_run["mode"] == "dry-run"
          assert dry_run["safe_to_apply"] is True
          assert dry_run["applied"] is False
          assert counts["fixtures"] == 42
          assert counts["confirmed_fixtures"] == 34
          assert counts["conflict_fixtures"] == 8
          assert counts["confirmed_rows"] == 66
          assert counts["pending_rows_before"] == 66
          assert counts["already_applied_rows"] == 0
          assert counts["changed_rows"] == 66
          assert counts["conflict_rows_unchanged"] == 17
          assert dry_run["side_effects"] == {
              "provider_calls": 0,
              "telegram_calls": 0,
              "dashboard_publications": 0,
          }
          print(json.dumps({
              "safe_to_apply": dry_run["safe_to_apply"],
              "counts": counts,
              "side_effects": dry_run["side_effects"],
              "production_ledger_before_sha256": result["production_ledger_before_sha256"],
              "production_ledger_after_sha256": result["production_ledger_after_sha256"],
              "production_ledger_byte_unchanged": True,
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Apply the CAS-bound confirmed cohort and verify every changed row
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="$(ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
            'umask 077; mktemp -d /tmp/crown-confirmed-results-apply.XXXXXX')"
          cleanup() {
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              "sudo rm -rf -- $(printf '%q' "$remote_dir")" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git archive --format=tar HEAD crown analysis \
            | ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
                "tar -xf - -C $(printf '%q' "$remote_dir")"
          scp -q deploy/backfill/fixtures_42_verified.json \
            "$target:$remote_dir/fixtures_42_verified.json"

          ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
            "sudo env REMOTE_DIR=$(printf '%q' "$remote_dir") \
              PYTHONPATH=$(printf '%q' "$remote_dir") \
              /opt/footbreak/.venv/bin/python3 -s" \
            > crown-confirmed-results-production-apply.json <<'PY'
          import hashlib
          import json
          import os
          import stat
          import time
          from dataclasses import replace
          from pathlib import Path

          from crown.backfill_confirmed_results import (
              BackfillError,
              _ledger_rows,
              _row_digest,
              execute,
          )
          from crown.config import settings

          remote_dir = Path(os.environ["REMOTE_DIR"])
          state_dir = Path("/var/lib/footbreak/crown")
          ledger_path = state_dir / "ledger.json"

          config = replace(settings(), state_dir=state_dir)
          for attempt in range(20):
              before_raw = ledger_path.read_bytes()
              before_sha = hashlib.sha256(before_raw).hexdigest()
              manifest_path = (
                  state_dir / "backfill-manifests"
                  / f"confirmed-34-apply-{before_sha[:16]}.json"
              )
              try:
                  result = execute(
                      config,
                      remote_dir / "fixtures_42_verified.json",
                      apply=True,
                      expected_ledger_sha256=before_sha,
                      manifest_path=manifest_path,
                  )
                  break
              except BackfillError as exc:
                  if not str(exc).startswith("ledger_cas_mismatch:"):
                      raise
                  if attempt == 19:
                      raise
                  time.sleep(0.2)
          else:
              raise AssertionError("unreachable_apply_retry_exhausted")

          counts = result["counts"]
          assert result["mode"] == "apply"
          assert result["safe_to_apply"] is True
          assert result["applied"] is True
          assert result["idempotent_noop"] is False
          assert counts["changed_rows"] == 66
          assert counts["already_applied_rows"] == 0
          assert counts["conflict_rows_unchanged"] == 17
          assert all(
              row["status"] == "PENDING"
              for row in result["protected_conflict_rows"]
          )

          after_raw = ledger_path.read_bytes()
          after_sha = hashlib.sha256(after_raw).hexdigest()
          assert after_sha == result["ledger_after_sha256"]
          ledger = json.loads(after_raw)
          rows = {location: row for location, row in _ledger_rows(ledger)}
          for change in result["changes"]:
              row = rows[change["location"]]
              assert row["status"] == "SETTLED"
              assert _row_digest(row) == change["after_sha256"]
          for protected in result["protected_conflict_rows"]:
              row = rows[protected["location"]]
              assert row["status"] == "PENDING"
              assert _row_digest(row) == protected["before_sha256"]

          backup_path = Path(result["backup_path"])
          assert backup_path.read_bytes() == before_raw
          assert stat.S_IMODE(backup_path.stat().st_mode) == stat.S_IRUSR
          assert hashlib.sha256(backup_path.read_bytes()).hexdigest() == before_sha

          print(json.dumps({
              "reviewed_commit": "21ab43ccd31e86f752d89250f0fa6ee0ff93c737",
              "workflow_commit": os.environ.get("GITHUB_SHA"),
              "mode": result["mode"],
              "safe_to_apply": result["safe_to_apply"],
              "applied": result["applied"],
              "counts": counts,
              "ledger_before_sha256": before_sha,
              "ledger_after_sha256": after_sha,
              "backup_path": str(backup_path),
              "backup_mode": "0400",
              "manifest_path": str(manifest_path),
              "confirmed_rows_verified_settled": 66,
              "conflict_rows_verified_pending_and_unchanged": 17,
              "side_effects": result["side_effects"],
          }, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Regenerate and validate Crown dashboard
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" '
            set -euo pipefail
            sudo env PYTHONPATH=/opt/footbreak \
              /opt/footbreak/.venv/bin/python3 -m crown.dashboard_data \
              --out /var/www/crown/data.json
            sudo /opt/footbreak/.venv/bin/python3 -m json.tool \
              /var/www/crown/data.json >/dev/null
          '

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crown-confirmed-results-production-dry-run
          path: |
            crown-confirmed-results-production-dry-run.json
            crown-confirmed-results-production-apply.json
          if-no-files-found: error
          retention-days: 30
