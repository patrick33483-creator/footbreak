name: Authorized first natural N2 Telegram observer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Configure existing SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Test isolated observer
        run: python3 -m unittest discover -s analysis -p test_n2_first_tg_watch.py
      - name: Install isolated observer without restarting production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          remote="/tmp/n2-first-tg-${GITHUB_RUN_ID}"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$remote'"
          scp analysis/install_n2_first_tg_watch.py analysis/n2_first_tg_watch.py analysis/n2_first_tg_runtime.mjs \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote/"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo python3 '$remote/install_n2_first_tg_watch.py' '$remote'" \
            | tee n2-first-tg-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: n2-first-tg-receipt
          path: n2-first-tg-receipt.json
          retention-days: 3
