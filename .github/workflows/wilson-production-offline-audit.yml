name: Wilson production offline audit

on:
  push:
    branches:
      - ops/wilson-production-audit-20260825
    paths:
      - .github/workflows/wilson-production-offline-audit.yml

permissions:
  contents: write

concurrency:
  group: wilson-production-offline-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit immutable Footbreak and Crown ledger copies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: c18050edd0b0727308dc16bbe5e44bd2cd14dec1

      - name: Verify approved audit code
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c18050edd0b0727308dc16bbe5e44bd2cd14dec1"
          printf '%s  %s\n' \
            e360522043d7cc1f24a72aec6523e681255b2631c44f1118142d721549178f4e \
            analysis/wilson_registry_manifest.py \
            | sha256sum --check --strict
          printf '%s  %s\n' \
            9bc0e8f009ed6e52c32118df2563645a771ea86ce2b1aa3f0b69ba2c467b495b \
            analysis/wilson_validation.py \
            | sha256sum --check --strict

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Capture immutable ledger copies under production locks
        id: capture
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          cleanup() {
            shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
          }
          trap cleanup EXIT
          install -d -m 700 audit-input
          capture_locked() {
            lock_path="$1"
            ledger_path="$2"
            output_path="$3"
            ssh -o BatchMode=yes -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo python3 - '$lock_path' '$ledger_path'" > "$output_path" <<'PY'
          import fcntl
          import os
          import signal
          import sys

          lock_path, ledger_path = sys.argv[1:3]
          signal.alarm(30)
          lock_fd = os.open(lock_path, os.O_RDWR | os.O_NOFOLLOW)
          try:
              fcntl.flock(lock_fd, fcntl.LOCK_EX)
              with open(ledger_path, "rb") as handle:
                  payload = handle.read(134_217_729)
              if len(payload) > 134_217_728:
                  raise RuntimeError("ledger exceeds 128 MiB capture bound")
          finally:
              fcntl.flock(lock_fd, fcntl.LOCK_UN)
              os.close(lock_fd)
          signal.alarm(0)
          sys.stdout.buffer.write(payload)
          PY
          }
          capture_locked \
            /var/lock/footbreak.lock \
            /opt/footbreak/system/sim_ledger.json \
            audit-input/footbreak-ledger.json
          capture_locked \
            /var/lib/footbreak/crown/.state.lock \
            /var/lib/footbreak/crown/ledger.json \
            audit-input/crown-ledger.json
          python3 -m json.tool audit-input/footbreak-ledger.json >/dev/null
          python3 -m json.tool audit-input/crown-ledger.json >/dev/null
          sha256sum audit-input/footbreak-ledger.json audit-input/crown-ledger.json \
            > ledger-sha256.txt

      - name: Remove SSH credentials
        if: always()
        run: |
          shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

      - name: Run fail-closed offline registry audits
        id: registry
        if: always()
        run: |
          set +e
          run_audit() {
            system="$1"
            ledger="audit-input/${system}-ledger.json"
            output="${system}-wilson-registry-audit.json"
            if [ ! -s "$ledger" ]; then
              printf '{"schema":"wilson-registry-manifest-v2","system":"%s","valid":false,"rejection_reasons":{"capture_failed":1},"recovery":{"implemented":false,"mode":"audit-only","safely_recoverable_missed_rows":0,"reason":"Recovery is hard-disabled."}}\n' \
                "$system" > "$output"
              return 2
            fi
            python3 -m analysis.wilson_registry_manifest \
              --system "$system" \
              --ledger "$ledger" \
              --output "$output" \
              --require-valid \
              > "${system}-audit-process.log" 2>&1
            rc=$?
            if [ ! -s "$output" ]; then
              printf '{"schema":"wilson-registry-manifest-v2","system":"%s","valid":false,"rejection_reasons":{"audit_process_failed":1},"recovery":{"implemented":false,"mode":"audit-only","safely_recoverable_missed_rows":0,"reason":"Recovery is hard-disabled."}}\n' \
                "$system" > "$output"
              return 2
            fi
            return "$rc"
          }
          run_audit footbreak
          footbreak_rc=$?
          run_audit crown
          crown_rc=$?
          set -e
          printf 'footbreak_rc=%s\n' "$footbreak_rc" >> "$GITHUB_OUTPUT"
          printf 'crown_rc=%s\n' "$crown_rc" >> "$GITHUB_OUTPUT"

      - name: Build non-sensitive audit summary
        if: always()
        env:
          AUDITED_COMMIT: c18050edd0b0727308dc16bbe5e44bd2cd14dec1
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          FOOTBREAK_RC: ${{ steps.registry.outputs.footbreak_rc }}
          CROWN_RC: ${{ steps.registry.outputs.crown_rc }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          hashes = {}
          hash_path = Path("ledger-sha256.txt")
          if hash_path.is_file():
              for line in hash_path.read_text(encoding="utf-8").splitlines():
                  digest, path = line.split(maxsplit=1)
                  hashes[Path(path).name] = digest

          manifests = {}
          for system in ("footbreak", "crown"):
              path = Path(f"{system}-wilson-registry-audit.json")
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  data = {
                      "valid": False,
                      "rejection_reasons": {"audit_manifest_unreadable": 1},
                      "recovery": {"implemented": False},
                  }
                  path.write_text(
                      json.dumps(data, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
                      encoding="utf-8",
                  )
              manifests[system] = {
                  "valid": data.get("valid") is True,
                  "condition_count": data.get("condition_count"),
                  "decision_stage_counts": data.get("decision_stage_counts"),
                  "rejection_reasons": data.get("rejection_reasons"),
                  "recovery": data.get("recovery"),
              }

          def exit_code(value):
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return 2

          summary = {
              "schema": "wilson-production-offline-audit-v1",
              "audited_commit": os.environ["AUDITED_COMMIT"],
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "capture_outcome": os.environ.get("CAPTURE_OUTCOME"),
              "ledger_sha256": hashes,
              "exit_codes": {
                  "footbreak": exit_code(os.environ.get("FOOTBREAK_RC")),
                  "crown": exit_code(os.environ.get("CROWN_RC")),
              },
              "systems": manifests,
              "production_mutation": False,
              "recovery_enabled": False,
          }
          Path("wilson-production-audit-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wilson-production-offline-audit
          path: |
            ledger-sha256.txt
            wilson-production-audit-summary.json
            footbreak-wilson-registry-audit.json
            crown-wilson-registry-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish temporary audit result branch
        if: always()
        run: |
          set -euo pipefail
          install -d /tmp/wilson-production-audit
          cp wilson-production-audit-summary.json \
            footbreak-wilson-registry-audit.json \
            crown-wilson-registry-audit.json \
            /tmp/wilson-production-audit/
          if [ -s ledger-sha256.txt ]; then
            cp ledger-sha256.txt /tmp/wilson-production-audit/
          else
            : > /tmp/wilson-production-audit/ledger-sha256.txt
          fi
          git checkout --orphan wilson-production-audit-result
          git rm -rf .
          cp /tmp/wilson-production-audit/* .
          git add ledger-sha256.txt \
            wilson-production-audit-summary.json \
            footbreak-wilson-registry-audit.json \
            crown-wilson-registry-audit.json
          git -c user.name=github-actions -c user.email=actions@github.com \
            commit -m "Temporary Wilson production offline audit"
          git push --force origin HEAD:wilson-production-audit-result

      - name: Enforce valid manifests
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          FOOTBREAK_RC: ${{ steps.registry.outputs.footbreak_rc }}
          CROWN_RC: ${{ steps.registry.outputs.crown_rc }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for system in ("footbreak", "crown"):
              data = json.loads(
                  Path(f"{system}-wilson-registry-audit.json").read_text(encoding="utf-8")
              )
              if not isinstance(data, dict):
                  raise SystemExit(f"{system}: manifest is not an object")
              if data.get("schema") != "wilson-registry-manifest-v2":
                  raise SystemExit(f"{system}: unexpected manifest schema")
              if data.get("system") != system:
                  raise SystemExit(f"{system}: manifest system mismatch")
              if data.get("valid") is not True:
                  raise SystemExit(f"{system}: manifest is not valid")
              recovery = data.get("recovery")
              if not isinstance(recovery, dict) or recovery.get("implemented") is not False:
                  raise SystemExit(f"{system}: recovery isolation is not proven")
          PY
          test "$CAPTURE_OUTCOME" = "success"
          test "$FOOTBREAK_RC" -eq 0
          test "$CROWN_RC" -eq 0
