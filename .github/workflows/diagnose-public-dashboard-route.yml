name: 診斷公開 Dashboard 路由

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose authenticated port 80 dashboard routes
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀檢查公開 Crown 路徑
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo /bin/sh -s' <<'REMOTE'
          set -eu

          password_file=/root/crown-dashboard-password.txt
          test -s "$password_file"
          IFS= read -r dashboard_password < "$password_file"
          test -n "$dashboard_password"

          check_url() {
            url="$1"
            body="$(mktemp)"
            headers="$(mktemp)"
            trap 'rm -f "$body" "$headers"' EXIT HUP INT TERM
            status="$(curl --silent --show-error --max-time 8 \
              --user "crown:${dashboard_password}" \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}' "$url" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^Content-Type:/{value=$0} END{sub(/\r$/, "", value); sub(/^[^:]+:[[:space:]]*/, "", value); print value}' "$headers")"
            kind="$(python3 - "$body" <<'PY'
          import json
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_bytes()
          try:
              payload = json.loads(raw)
          except Exception:
              prefix = raw.lstrip()[:32].lower()
              print("html" if prefix.startswith((b"<!doctype", b"<html")) else "other")
          else:
              if isinstance(payload, dict):
                  print("json:" + str(payload.get("schema_version") or "object"))
              else:
                  print("json:" + type(payload).__name__)
          PY
          )"
            printf '%s status=%s content_type=%s kind=%s bytes=%s\n' \
              "$url" "${status:-unreachable}" "${content_type:-missing}" "$kind" \
              "$(wc -c < "$body")"
            rm -f "$body" "$headers"
            trap - EXIT HUP INT TERM
          }

          check_url http://127.0.0.1/crown/
          check_url http://127.0.0.1/crown/data.json
          check_url http://127.0.0.1/crown/api/data
          check_url http://127.0.0.1/api/data
          check_url http://127.0.0.1:8082/data.json
          check_url http://127.0.0.1:8082/api/data
          unset dashboard_password

          echo "--- Crown data.json bounded size summary ---"
          python3 - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("/var/www/crown/data.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"total_bytes={path.stat().st_size}")
          for key, value in sorted(
              payload.items(),
              key=lambda item: len(json.dumps(item[1], ensure_ascii=False, separators=(",", ":"))),
              reverse=True,
          )[:12]:
              size = len(json.dumps(value, ensure_ascii=False, separators=(",", ":")).encode())
              count = len(value) if isinstance(value, (dict, list)) else "-"
              print(f"key={key} bytes={size} count={count}")

          print("--- Wilson pending detail projection ---")
          ranking = (
              payload.get("prediction_history", {})
              .get("stats", {})
              .get("granular_conditions", {})
              .get("ranking", [])
          )
          for item in ranking:
              if not isinstance(item, dict):
                  continue
              progress = item.get("validation_progress") or item.get("pending_progress") or {}
              detail = item.get("pending_rollover_evidence") or {}
              decided = int(
                  progress.get("pending_decided")
                  or progress.get("eligible_decided")
                  or detail.get("expected_decided")
                  or 0
              )
              if decided <= 0:
                  continue
              rows = detail.get("rows") if isinstance(detail.get("rows"), list) else []
              print(json.dumps({
                  "condition_number": item.get("condition_number"),
                  "display": progress.get("display"),
                  "pending_decided": decided,
                  "pending_hits": (
                      progress.get("pending_hits")
                      if progress.get("pending_hits") is not None
                      else progress.get("eligible_hits")
                  ),
                  "detail_expected_decided": detail.get("expected_decided"),
                  "detail_expected_hits": detail.get("expected_hits"),
                  "detail_complete": detail.get("complete"),
                  "detail_rows": len(rows),
                  "detail_reason": detail.get("reason"),
              }, ensure_ascii=False, sort_keys=True))
          PY

          echo "--- Footbreak Wilson pending detail projection ---"
          python3 - <<'PY'
          import json
          import pathlib

          path = pathlib.Path("/var/www/footbreak/data.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          print(f"total_bytes={path.stat().st_size}")
          ranking = (
              payload.get("prediction_history", {})
              .get("stats", {})
              .get("granular_conditions", {})
              .get("ranking", [])
          )
          for item in ranking:
              if not isinstance(item, dict):
                  continue
              progress = item.get("validation_progress") or item.get("pending_progress") or {}
              detail = item.get("pending_rollover_evidence") or {}
              decided = int(
                  progress.get("pending_decided")
                  or progress.get("eligible_decided")
                  or detail.get("expected_decided")
                  or 0
              )
              if decided <= 0:
                  continue
              rows = detail.get("rows") if isinstance(detail.get("rows"), list) else []
              print(json.dumps({
                  "condition_number": item.get("condition_number"),
                  "display": progress.get("display"),
                  "pending_decided": decided,
                  "pending_hits": (
                      progress.get("pending_hits")
                      if progress.get("pending_hits") is not None
                      else progress.get("eligible_hits")
                  ),
                  "detail_expected_decided": detail.get("expected_decided"),
                  "detail_expected_hits": detail.get("expected_hits"),
                  "detail_complete": detail.get("complete"),
                  "detail_rows": len(rows),
                  "detail_reason": (
                      detail.get("unavailable_reason")
                      if detail.get("unavailable_reason") is not None
                      else detail.get("reason")
                  ),
              }, ensure_ascii=False, sort_keys=True))
          PY

          echo "--- Footbreak condition 17 identity diagnosis ---"
          env PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 - <<'PY'
          import copy
          import json
          from collections import Counter
          from pathlib import Path

          from analysis.wilson_validation import (
              NAMESPACE,
              _eligible_rollover_rows,
              _now,
              _time,
              active_bets,
              active_observations,
              validate_formal_row,
          )

          ledger = json.loads(
              Path("/opt/footbreak/system/sim_ledger.json").read_text(encoding="utf-8")
          )
          namespace = ledger[NAMESPACE]
          signature = namespace["condition_order"][16]
          frozen = namespace["conditions"][signature]
          versions = frozen.get("evidence_versions") or []
          active = versions[-1]
          pending = frozen.get("pending_rollover_progress") or {}
          projection_time = _time(_now())
          raw = [
              row
              for row in active_bets(ledger, "footbreak")
              + active_observations(ledger, "footbreak")
              if str(row.get("frozen_condition_signature") or "") == signature
          ]

          valid = []
          rejected = []
          missing = Counter()
          for row in raw:
              admitted, reason = validate_formal_row(
                  row,
                  system="footbreak",
                  signature=signature,
                  frozen=frozen,
                  projection_time=projection_time,
                  require_settled=True,
                  ledger=ledger,
              )
              if admitted is not None:
                  valid.append(row)
                  continue
              rejected.append((row, str(reason or "unknown")))
              for key in (
                  "frozen_condition_definition",
                  "native_stage_at",
                  "rollover_provenance",
                  "admitted_evidence_version",
                  "admitted_evidence_hash",
                  "formal_evidence_id",
                  "formal_evidence_hash",
              ):
                  if row.get(key) in (None, {}, ""):
                      missing[key] += 1

          repaired_valid = []
          repaired_reasons = Counter()
          for row, reason in rejected:
              if reason != "invalid_formal_admission_binding":
                  repaired_reasons[reason] += 1
                  continue
              repaired = copy.deepcopy(row)
              changed = False
              stored_definition = row.get("frozen_condition_definition")
              if stored_definition == {}:
                  repaired["frozen_condition_definition"] = copy.deepcopy(
                      frozen.get("definition")
                  )
                  changed = True
              elif stored_definition != frozen.get("definition"):
                  repaired_reasons["conflicting_frozen_definition"] += 1
                  continue
              marker = row.get("rollover_provenance")
              if row.get("native_stage_at") is None:
                  if not isinstance(marker, dict) or _time(marker.get("stage_at")) is None:
                      repaired_reasons["missing_recoverable_stage"] += 1
                      continue
                  repaired["native_stage_at"] = marker["stage_at"]
                  changed = True
              elif (
                  not isinstance(marker, dict)
                  or row.get("native_stage_at") != marker.get("stage_at")
              ):
                  repaired_reasons["conflicting_stage"] += 1
                  continue
              if not changed:
                  repaired_reasons["no_allowed_legacy_omission"] += 1
                  continue
              admitted, repaired_reason = validate_formal_row(
                  repaired,
                  system="footbreak",
                  signature=signature,
                  frozen=frozen,
                  projection_time=projection_time,
                  require_settled=True,
                  ledger=ledger,
              )
              if admitted is not None and repaired_reason is None:
                  repaired_valid.append(row)
              else:
                  repaired_reasons[str(repaired_reason or "unknown")] += 1

          strict_eligible, strict_excluded = _eligible_rollover_rows(
              valid, "footbreak", signature, active
          )
          compatible_eligible, compatible_excluded = _eligible_rollover_rows(
              [*valid, *repaired_valid], "footbreak", signature, active
          )
          print(json.dumps({
              "condition_number": 17,
              "summary_decided": pending.get("eligible_decided"),
              "summary_hits": pending.get("eligible_hits"),
              "summary_excluded": pending.get("excluded"),
              "raw_same_signature": len(raw),
              "strict_valid": len(valid),
              "strict_invalid_reasons": dict(Counter(reason for _, reason in rejected)),
              "missing_field_counts": dict(missing),
              "strict_eligible": len(strict_eligible),
              "strict_hits": sum(bool(item["hit"]) for item in strict_eligible),
              "strict_excluded": strict_excluded,
              "legacy_repaired_valid": len(repaired_valid),
              "legacy_repair_rejections": dict(repaired_reasons),
              "compatible_eligible": len(compatible_eligible),
              "compatible_hits": sum(bool(item["hit"]) for item in compatible_eligible),
              "compatible_excluded": compatible_excluded,
              "compatible_exclusions_match": (
                  pending.get("excluded") == compatible_excluded
              ),
              "legacy_shape_counts": dict(Counter(
                  json.dumps({
                      "status": row.get("status"),
                      "result": row.get("result"),
                      "stage": row.get("stage"),
                      "definition_state": (
                          "empty" if row.get("frozen_condition_definition") == {}
                          else "exact" if row.get("frozen_condition_definition")
                          == frozen.get("definition")
                          else "other"
                      ),
                      "native_stage_present": row.get("native_stage_at") is not None,
                      "first_t5": row.get("first_native_pre_kickoff_t5"),
                      "first_stage": row.get("first_native_pre_kickoff_stage"),
                      "marker_schema": (
                          (row.get("rollover_provenance") or {}).get("schema_version")
                          if isinstance(row.get("rollover_provenance"), dict)
                          else None
                      ),
                      "marker_keys": sorted(
                          (row.get("rollover_provenance") or {}).keys()
                          if isinstance(row.get("rollover_provenance"), dict)
                          else []
                      ),
                      "marker_t5": (
                          (row.get("rollover_provenance") or {}).get(
                              "native_pre_kickoff_t5"
                          )
                          if isinstance(row.get("rollover_provenance"), dict)
                          else None
                      ),
                      "marker_first_stage": (
                          (row.get("rollover_provenance") or {}).get(
                              "first_native_pre_kickoff_stage"
                          )
                          if isinstance(row.get("rollover_provenance"), dict)
                          else None
                      ),
                      "marker_decision_stage": (
                          (row.get("rollover_provenance") or {}).get("decision_stage")
                          if isinstance(row.get("rollover_provenance"), dict)
                          else None
                      ),
                      "marker_stage_present": (
                          (row.get("rollover_provenance") or {}).get("stage_at")
                          is not None
                          if isinstance(row.get("rollover_provenance"), dict)
                          else False
                      ),
                      "evidence_version": row.get("evidence_version"),
                      "created_at_present": row.get("created_at") is not None,
                      "kickoff_present": (
                          row.get("kickoff") is not None
                          or row.get("kickoff_hkt") is not None
                      ),
                      "settled_at_present": row.get("settled_at") is not None,
                      "timeline_valid": (
                          (
                              _time(
                                  (row.get("rollover_provenance") or {}).get("stage_at")
                              )
                              <= _time(row.get("created_at"))
                              < _time(row.get("kickoff") or row.get("kickoff_hkt"))
                              <= _time(row.get("settled_at"))
                              <= projection_time
                          )
                          if (
                              isinstance(row.get("rollover_provenance"), dict)
                              and _time(
                                  (row.get("rollover_provenance") or {}).get("stage_at")
                              ) is not None
                              and _time(row.get("created_at")) is not None
                              and _time(
                                  row.get("kickoff") or row.get("kickoff_hkt")
                              ) is not None
                              and _time(row.get("settled_at")) is not None
                          )
                          else False
                      ),
                      "marker_evidence_version": (
                          (row.get("rollover_provenance") or {}).get(
                              "admitted_evidence_version"
                          )
                          if isinstance(row.get("rollover_provenance"), dict)
                          else None
                      ),
                  }, ensure_ascii=False, sort_keys=True)
                  for row, reason in rejected
                  if reason == "invalid_formal_admission_binding"
              )),
          }, ensure_ascii=False, sort_keys=True))
          PY

          echo "--- unified-dashboard configuration ---"
          sed -E 's#(auth_basic_user_file[[:space:]]+)[^;]+#\1[redacted]#g' \
            /etc/nginx/sites-enabled/unified-dashboard

          echo "--- sanitized Crown route directives ---"
          nginx -T 2>/dev/null \
            | awk '
                /configuration file / { file=$0 }
                /listen[[:space:]]+80([[:space:]]|;)/ ||
                /server_name/ ||
                /location[[:space:]].*crown/ ||
                /proxy_pass[[:space:]].*8082/ ||
                /alias[[:space:]].*crown/ ||
                /root[[:space:]].*crown/ ||
                /try_files.*crown/ {
                  print file
                  print
                }
              ' \
            | sed -E 's#(auth_basic_user_file[[:space:]]+)[^;]+#\1[redacted]#g'
          REMOTE
