name: Verify v3 crown
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/verify-v3-crown.yml']
concurrency:
  group: production-maintenance
  cancel-in-progress: false
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      E: ${{ github.event_name }}
      C: ${{ inputs.confirmation }}
    steps:
      - name: guard
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "VERIFYVC" ]; then exit 1; fi
      - name: ssh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new $DEPLOY_USER@$DEPLOY_HOST"
          echo '=== matches.json count + prediction fill ratio ==='
          $SSH "sudo /opt/footbreak/.venv/bin/python3 -c 'import json;d=json.load(open(\"/var/www/crownsystem-v3/matches.json\"));m=d[\"matches\"];print(\"total:\",len(m));f=sum(1 for x in m if x.get(\"first\") not in (\"-\",\"\",\"(等候中)\"));t30=sum(1 for x in m if x.get(\"t30\") not in (\"-\",\"\",\"(等候中)\"));t5=sum(1 for x in m if x.get(\"t5\") not in (\"-\",\"\",\"(等候中)\"));print(f\"首預 filled: {f}/{len(m)}\");print(f\"T-30 filled: {t30}/{len(m)}\");print(f\"T-5 filled: {t5}/{len(m)}\");print(\"---first 5 rows---\");[print(x[\"kickoff_display\"],\"|\",x[\"home\"][:12],\"vs\",x[\"away\"][:12],\"|\",\"首:\",x[\"first\"][:30],\"|\",\"T30:\",x[\"t30\"][:20],\"|\",\"T5:\",x[\"t5\"][:20]) for x in m[:5]]'"
