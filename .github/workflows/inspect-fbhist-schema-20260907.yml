name: Inspect footbreak prediction_history schema

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "打 FBHIST"
        required: true
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/inspect-fbhist-schema-20260907.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  i:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "FBHIST" ]; then exit 1; fi
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set +e
          echo "===== 1) prediction_history.json 檔案大小 ====="
          ls -la /var/lib/footbreak/crown/prediction_history.json
          echo
          echo "===== 2) top-level keys ====="
          sudo python3 -c "
          import json
          d = json.load(open('/var/lib/footbreak/crown/prediction_history.json'))
          if isinstance(d, dict):
              print('top: dict, keys:', list(d.keys())[:20])
              for k in list(d.keys())[:3]:
                  v = d[k]
                  print(f'  {k!r} type:', type(v).__name__)
                  if isinstance(v, list) and v:
                      print(f'    len:', len(v))
                      print(f'    [0] type:', type(v[0]).__name__)
                      if isinstance(v[0], dict):
                          print(f'    [0] keys:', sorted(v[0].keys()))
          elif isinstance(d, list):
              print('top: list, len:', len(d))
              if d and isinstance(d[0], dict):
                  print('  [0] keys:', sorted(d[0].keys()))
          "
          echo
          echo "===== 3) 首 3 row 完整 dump ====="
          sudo python3 -c "
          import json
          d = json.load(open('/var/lib/footbreak/crown/prediction_history.json'))
          rows = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), [])
          for r in rows[:3]:
              print(json.dumps(r, ensure_ascii=False, indent=2)[:1500])
              print('---')
          "
          echo
          echo "===== 4) 有 score 嘅 row (揾一個 sample) ====="
          sudo python3 -c "
          import json
          d = json.load(open('/var/lib/footbreak/crown/prediction_history.json'))
          rows = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), [])
          score_keys = ['score', 'result_score', 'home_score', 'final_score', 'result']
          n = 0
          for r in rows:
              if not isinstance(r, dict): continue
              hit = any(r.get(k) not in (None, '', 0) for k in score_keys)
              if hit:
                  print(json.dumps({k: r.get(k) for k in list(r.keys())[:30]}, ensure_ascii=False, indent=2)[:2000])
                  n += 1
                  if n >= 2: break
          print(f'-- total scored samples printed: {n} --')
          "
          echo
          echo "===== 5) v2 data.json fixture 個 id 樣 ====="
          sudo python3 -c "
          import json
          d = json.load(open('/var/www/stage_engine_v2/data.json'))
          fx = d.get('fixtures', [])[:3]
          for f in fx:
              print(json.dumps({k: f.get(k) for k in ['id','league','home','away','kickoff_utc','source']}, ensure_ascii=False))
          "
          REMOTE
