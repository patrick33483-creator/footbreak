name: Diag v3 data shape

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/diag-v3-data-shape.yml'

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH probe
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"
          $SSH 'set -eu
            echo "=== data.json keys ==="
            sudo python3 -c "
import json
d=json.load(open(\"/var/www/stage_engine_v2/data.json\"))
print(\"top:\", list(d.keys()) if isinstance(d,dict) else \"list len\",len(d))
if isinstance(d,dict):
    for k in d.keys():
        v=d[k]
        if isinstance(v,list) and v:
            print(k,\"list len\",len(v),\"sample keys:\",list(v[0].keys())[:20])
        else:
            print(k, type(v).__name__)
else:
    print(\"first item keys:\",list(d[0].keys())[:20])
    print(\"sample:\",json.dumps(d[0],ensure_ascii=False)[:800])
"
            echo "=== results.json shape ==="
            sudo python3 -c "
import json
r=json.load(open(\"/var/www/stage_engine_v2/results.json\"))
print(\"top:\", type(r).__name__, \"len\",len(r) if hasattr(r,\"__len__\") else \"?\")
if isinstance(r,list) and r:
    print(\"first keys:\",list(r[0].keys())[:20])
    print(\"sample:\",json.dumps(r[0],ensure_ascii=False)[:400])
elif isinstance(r,dict):
    firstk=list(r.keys())[0]
    print(\"first key:\",firstk,\"val:\",json.dumps(r[firstk],ensure_ascii=False)[:400])
"
            echo "=== fixture stages sample ==="
            sudo python3 -c "
import json
d=json.load(open(\"/var/www/stage_engine_v2/data.json\"))
fixtures=d if isinstance(d,list) else d.get(\"fixtures\") or d.get(\"matches\") or []
staged=[f for f in fixtures if f.get(\"stages\")][:2]
for f in staged:
    print(\"---\")
    print(\"kickoff:\",f.get(\"kickoff\"),\"home:\",f.get(\"home\"),\"away:\",f.get(\"away\"),\"league:\",f.get(\"league\"))
    print(\"stages keys:\",list(f[\"stages\"].keys()))
    for k,v in f[\"stages\"].items():
        print(\" \",k,\":\",json.dumps(v,ensure_ascii=False)[:200])
"
            echo "=== titan_today.json sample ==="
            sudo head -c 800 /var/www/stage_engine_v2/titan_today.json
          '
