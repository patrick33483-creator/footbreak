name: 匯出三階段方向矩陣（只讀）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-three-stage-direction-matrix
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 匯出正式環境三階段報表
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo bash -s' \
            > three-stage-direction-matrix.json <<'REMOTE'
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          cp /var/lib/footbreak/direction-path-conditions/ledger.json "$TMP_DIR/ledger.json"
          cd /opt/footbreak
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 \
            -m analysis.direction_path_conditions \
            --state "$TMP_DIR/ledger.json" \
            --public "$TMP_DIR/report.json" \
            --lock "$TMP_DIR/report.lock" \
            >/dev/null
          PYTHONPATH=/opt/footbreak /opt/footbreak/.venv/bin/python3 - "$TMP_DIR" <<'PY'
          import json
          import sys
          from collections import Counter
          from pathlib import Path

          from analysis.direction_path_conditions import normalized_line, qualifies

          root = Path(sys.argv[1])
          state = json.loads((root / "ledger.json").read_text(encoding="utf-8"))
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          thresholds = (1.70, 1.75, 1.80, 1.85, 1.95)
          funnel = Counter()
          for row in state.get("observations", {}).values():
              provider = str(row.get("provider"))
              market = str(row.get("market"))
              cohort = str(row.get("cohort"))
              dimensions = (
                  ("all", "all", "all"),
                  (provider, market, cohort),
                  (provider, market, "all"),
                  ("all", market, "all"),
              )
              for dimension in dimensions:
                  funnel[(*dimension, "complete_path")] += 1
                  if normalized_line(row) is not None:
                      funnel[(*dimension, "same_line")] += 1
                  for threshold in thresholds:
                      if qualifies(row, threshold):
                          funnel[(*dimension, f"odds_gt_{threshold:g}")] += 1
          rows = []
          dimensions = sorted({key[:3] for key in funnel})
          for provider, market, cohort in dimensions:
              rows.append({
                  "provider": provider,
                  "market": market,
                  "cohort": cohort,
                  **{
                      metric: funnel[(provider, market, cohort, metric)]
                      for metric in (
                          "complete_path",
                          "same_line",
                          "odds_gt_1.7",
                          "odds_gt_1.75",
                          "odds_gt_1.8",
                          "odds_gt_1.85",
                          "odds_gt_1.95",
                      )
                  },
              })
          report["audit_funnel"] = rows
          def compact_example(row):
              same_line = normalized_line(row) is not None
              if qualifies(row, 1.70):
                  reason = "有效：三段同線，三段方向賠率均嚴格 >1.70"
              elif not same_line:
                  reason = "無效：三段線位不一致"
              else:
                  failed = [
                      stage
                      for stage in ("initial", "T30", "T5")
                      if float((row.get(stage) or {}).get("odds") or 0) <= 1.70
                  ]
                  reason = "無效：" + "、".join(failed) + " 方向賠率 ≤1.70"
              return {
                  "fixture_id": row.get("fixture_id"),
                  "kickoff": row.get("kickoff"),
                  "home_team": row.get("home_team"),
                  "away_team": row.get("away_team"),
                  "provider": row.get("provider"),
                  "direction_path": row.get("direction_path"),
                  "initial": row.get("initial"),
                  "T30": row.get("T30"),
                  "T5": row.get("T5"),
                  "settlement": row.get("settlement"),
                  "eligible": qualifies(row, 1.70),
                  "reason": reason,
              }

          ah_rows = [
              row
              for row in state.get("observations", {}).values()
              if row.get("market") == "AH"
              and row.get("home_team")
              and row.get("away_team")
          ]
          valid_rows = sorted(
              [row for row in ah_rows if qualifies(row, 1.70)],
              key=lambda row: int(row.get("kickoff") or 0),
              reverse=True,
          )
          different_line_rows = sorted(
              [
                  row
                  for row in ah_rows
                  if normalized_line(row) is None
              ],
              key=lambda row: int(row.get("kickoff") or 0),
              reverse=True,
          )
          low_price_rows = sorted(
              [
                  row
                  for row in ah_rows
                  if normalized_line(row) is not None
                  and not qualifies(row, 1.70)
              ],
              key=lambda row: int(row.get("kickoff") or 0),
              reverse=True,
          )
          report["audit_examples"] = {
              "valid": [compact_example(row) for row in valid_rows[:3]],
              "invalid": [
                  *[compact_example(row) for row in different_line_rows[:2]],
                  *[compact_example(row) for row in low_price_rows[:1]],
              ],
          }
          (root / "report.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$TMP_DIR/report.json"
          REMOTE
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("three-stage-direction-matrix.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload.get("schema_version") == 2
          assert payload.get("report") == "direction_path_conditions"
          assert payload.get("conditions")
          expected = {
              "odds_gt_1_7",
              "odds_gt_1_75",
              "odds_gt_1_8",
              "odds_gt_1_85",
              "odds_gt_1_95",
          }
          for condition in payload["conditions"]:
              assert expected <= set(condition["combined"])
          print(json.dumps(payload["summary"], ensure_ascii=False, sort_keys=True))
          PY
          sha256sum three-stage-direction-matrix.json
          echo "THREE_STAGE_MATRIX_JSON_BEGIN"
          python -m json.tool three-stage-direction-matrix.json
          echo "THREE_STAGE_MATRIX_JSON_END"

      - name: 上載完整矩陣
        uses: actions/upload-artifact@v4
        with:
          name: three-stage-direction-matrix
          path: three-stage-direction-matrix.json
          retention-days: 3
          if-no-files-found: error
