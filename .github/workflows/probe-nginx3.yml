name: probe nginx v3 all
on:
  workflow_dispatch:
    inputs: {confirm: {description: 'CONFIRM', required: true}}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/probe-nginx3.yml']
concurrency: {group: production-maintenance, cancel-in-progress: false}
jobs:
  x:
    runs-on: ubuntu-latest
    env: {CONFIRM_INPUT: "${{ github.event.inputs.confirm || 'CONFIRM' }}"}
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: test "$CONFIRM_INPUT" = "CONFIRM"
      - if: github.event_name == 'workflow_dispatch'
        env: {SSHKEY: "${{ secrets.DEPLOY_SSH_KEY }}", H: "${{ secrets.DEPLOY_HOST }}", U: "${{ secrets.DEPLOY_USER }}"}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$SSHKEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh -i ~/.ssh/id -o StrictHostKeyChecking=accept-new $U@$H bash <<'EOF'
          echo "=== crown ==="
          sudo -n cat /etc/nginx/sites-available/crown | head -80
          echo ""
          echo "=== footbreak ==="
          sudo -n cat /etc/nginx/sites-available/footbreak | head -80
          echo ""
          echo "=== which one has crownsystem-v3? ==="
          for f in /etc/nginx/sites-enabled/*; do
            echo "-- $f --"
            sudo -n grep -c crownsystem-v3 "$f" 2>/dev/null
          done
          EOF
