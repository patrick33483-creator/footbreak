name: Patch history table to radar layout

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "打 PATCHTBL"
        required: true
        type: string
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/patch-history-table-20260907.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PATCH_SCRIPT_B64: 
    steps:
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "PATCHTBL" ]; then exit 1; fi
      - if: github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SCRIPT_B64: ${{ env.PATCH_SCRIPT_B64 }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=60 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s $SCRIPT_B64" <<'REMOTE'
          set -eu
          SCRIPT_B64="$1"
          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP=/var/www/crown/app.js.backup-${STAMP}
          cp -a /var/www/crown/app.js "$BACKUP"
          echo "Backup: $BACKUP"

          echo "$SCRIPT_B64" | base64 -d > /tmp/patch_history.py
          wc -l /tmp/patch_history.py

          python3 /tmp/patch_history.py

          chown root:www-data /var/www/crown/app.js
          chmod 644 /var/www/crown/app.js
          ls -la /var/www/crown/app.js "$BACKUP"

          echo
          echo "===== Sanity: new markers ====="
          grep -c "初盤預測</th>" /var/www/crown/app.js
          grep -c "const historyRows = (items) => {" /var/www/crown/app.js
          REMOTE
