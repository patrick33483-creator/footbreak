name: Backfill Crown pending via titan007

# Nightly audit run at 03:00 HKT (19:00 UTC prev day) discovers pending Crown
# fixtures within the last 7 days and probes titan007 for verified scores.
# Audit mode is safe — reads production ledger, writes only a JSON artifact.
# Apply mode is intentionally NOT wired until a follow-up PR adds settlement
# integration; see analysis/backfill_titan007_scores.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit is read-only; apply is currently blocked pending settlement wiring
        required: true
        default: audit
        type: choice
        options: [audit, apply]
      lookback_days:
        description: how many past days of pending to scan
        required: false
        default: "7"
      source:
        description: pending target source
        required: true
        default: crown_history
        type: choice
        options: [crown_history, v2_conditions]
  schedule:
    # 03:00 HKT nightly = 19:00 UTC previous day
    - cron: "0 19 * * *"

concurrency:
  group: crown-titan007-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Probe titan007 for pending Crown scores
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          MODE: ${{ inputs.mode || 'audit' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          SOURCE: ${{ inputs.source || 'crown_history' }}
        run: |
          set -euo pipefail
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_work="$(
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              'umask 077; mktemp -d /tmp/crown-titan007-backfill.XXXXXX'
          )"
          cleanup_remote() {
            ssh -o BatchMode=yes -o ConnectTimeout=20 "$target" \
              "rm -rf -- $(printf '%q' "$remote_work")" >/dev/null 2>&1 || true
          }
          trap cleanup_remote EXIT

          scp -q -o BatchMode=yes -o ConnectTimeout=20 \
            analysis/backfill_titan007_scores.py \
            "$target:$remote_work/"

          script_sha="$(
            sha256sum analysis/backfill_titan007_scores.py |
              awk '{print $1}'
          )"

          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$target" \
            "sudo env MODE='$MODE' LOOKBACK_DAYS='$LOOKBACK_DAYS' SOURCE='$SOURCE' \
              REMOTE_WORK='$remote_work' SCRIPT_SHA='$script_sha' bash -s" \
            <<'REMOTE' | tee crown-titan007-backfill.json
          set -euo pipefail
          cd "$REMOTE_WORK"
          actual="$(sha256sum backfill_titan007_scores.py | awk '{print $1}')"
          if [ "$actual" != "$SCRIPT_SHA" ]; then
            echo "ERROR: script sha mismatch (expected $SCRIPT_SHA, got $actual)" >&2
            exit 1
          fi
          history=/var/lib/footbreak/crown/prediction_history.json
          if [ "$SOURCE" = "v2_conditions" ]; then
            history="$REMOTE_WORK/v2-pending-targets.json"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/var/www/stage_engine_v2/data.json").read_text(encoding="utf-8")
          )
          matches = {}
          conditions = (
              (payload.get("segmented_conditions") or {}).get("public_conditions") or []
          )
          for condition in conditions:
              for row in condition.get("observations") or []:
                  if row.get("settlement"):
                      continue
                  match_id = str(row.get("match_id") or "").strip()
                  if not match_id:
                      continue
                  matches[match_id] = {
                      "home": row.get("home"),
                      "away": row.get("away"),
                      "kickoff_hkt": row.get("kickoff"),
                      "result_status": row.get("result_status") or "待賽果",
                  }
          target = Path(os.environ["REMOTE_WORK"]) / "v2-pending-targets.json"
          target.write_text(
              json.dumps({"matches": matches}, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"V2 pending targets exported: {len(matches)}")
          PY
          fi
          python3 backfill_titan007_scores.py \
            --history "$history" \
            --mode "$MODE" \
            --lookback-days "$LOOKBACK_DAYS" \
            --out "$REMOTE_WORK/report.json"
          cat "$REMOTE_WORK/report.json"
          REMOTE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-titan007-backfill-${{ github.run_id }}
          path: crown-titan007-backfill.json
          retention-days: 30
