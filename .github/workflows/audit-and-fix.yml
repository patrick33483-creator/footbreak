name: 完整 audit + 修好
on: workflow_dispatch
jobs:
  a:
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          echo "===== STEP 1: 睇 self-heal script 內容有無碰 nginx config ====="
          grep -nE "nginx|sites-available|unified-dashboard" /opt/footbreak/deploy/dashboard-self-heal.sh | head -30 || echo "(冇碰)"

          echo ""
          echo "===== STEP 2: 記錄目前 unified-dashboard sha256 ====="
          sha256sum /etc/nginx/sites-available/unified-dashboard

          echo ""
          echo "===== STEP 3: 記錄目前所有 recent bak sha256 ====="
          for f in /etc/nginx/sites-available/unified-dashboard.bak-*; do
            [ -f "$f" ] || continue
            sha256sum "$f"
          done

          echo ""
          echo "===== STEP 4: 用 auditctl watch unified-dashboard 15 秒睇邊個寫 ====="
          if command -v auditctl >/dev/null 2>&1; then
            auditctl -w /etc/nginx/sites-available/unified-dashboard -p wa -k dash_write
            echo "watch 開始..."
            sleep 20
            ausearch -k dash_write --start recent 2>&1 | grep -E "type=(SYSCALL|PATH)" | tail -30 || echo "(冇 audit hit)"
            auditctl -W /etc/nginx/sites-available/unified-dashboard -p wa -k dash_write 2>/dev/null || true
          else
            echo "auditctl 未安裝，改用 stat 對比 mtime 30 秒"
            m1=$(stat -c "%Y" /etc/nginx/sites-available/unified-dashboard)
            sleep 30
            m2=$(stat -c "%Y" /etc/nginx/sites-available/unified-dashboard)
            echo "30 秒前 mtime=$m1 → 而家 mtime=$m2 (差 $((m2-m1)) 秒)"
          fi

          echo ""
          echo "===== STEP 5: 停 dashboard-self-heal.timer ====="
          systemctl stop footbreak-dashboard-self-heal.timer || true
          systemctl disable footbreak-dashboard-self-heal.timer || true
          echo "停咗"
          systemctl is-active footbreak-dashboard-self-heal.timer || true

          echo ""
          echo "===== STEP 6: 重新插入 stage-v2 block（可靠版）====="
          CONF=/etc/nginx/sites-available/unified-dashboard
          cp -a "$CONF" "${CONF}.bak-audit-$(date +%Y%m%d-%H%M%S)"

          # 先清舊 stage-v2 block（如果殘留）
          python3 <<'PY'
          import re, pathlib
          p = pathlib.Path("/etc/nginx/sites-available/unified-dashboard")
          text = p.read_text()
          out = []; i, n = 0, len(text)
          while i < n:
              m = re.match(r'[ \t]*location[^{;]*stage-v2[^{;]*[{;]', text[i:])
              m2 = re.match(r'[ \t]*#[^\n]*Stage Engine v2', text[i:])
              if m:
                  while out and out[-1] in ' \t': out.pop()
                  end = i + m.end()
                  if m.group(0).rstrip().endswith('{'):
                      depth = 1; k = end
                      while k < n and depth > 0:
                          if text[k] == '{': depth += 1
                          elif text[k] == '}': depth -= 1
                          k += 1
                      while k < n and text[k] in ' \t': k += 1
                      if k < n and text[k] == '\n': k += 1
                      i = k
                  else:
                      k = end
                      while k < n and text[k] in ' \t': k += 1
                      if k < n and text[k] == '\n': k += 1
                      i = k
                  continue
              if m2:
                  k = i
                  while k < n and text[k] != '\n': k += 1
                  if k < n: k += 1
                  if 'end Stage Engine' in text[k:k+400]:
                      end_line = text.find('\n', k + text[k:].find('end Stage Engine'))
                      if end_line > 0: k = end_line + 1
                  i = k
                  continue
              out.append(text[i]); i += 1
          p.write_text(''.join(out))
          PY

          # 插入 stage-v2 proxy block 喺 location / 之前
          python3 <<'PY'
          import pathlib, re
          p = pathlib.Path("/etc/nginx/sites-available/unified-dashboard")
          text = p.read_text()
          insert = """
              # ---- Stage Engine v2 (皇冠系統V2) proxy → 127.0.0.1:8083 ----
              location ^~ /stage-v2/ {
                  proxy_pass http://127.0.0.1:8083/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location = /stage-v2 { return 301 /stage-v2/; }
              # ---- end Stage Engine v2 ----
          """
          m = re.search(r'\n[ \t]*location\s*/\s*\{[^}]*proxy_pass[^}]*5001', text)
          if not m: raise SystemExit("搵唔到 location / proxy 5001")
          idx = m.start() + 1
          p.write_text(text[:idx] + insert + text[idx:])
          print("插入好")
          PY

          nginx -t
          systemctl reload nginx
          echo ""
          echo "===== STEP 7: verify from inside ====="
          for u in "/stage-v2/" "/stage-v2/history.html" "/stage-v2/data.json"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1$u")
            realm=$(curl -sSI "http://127.0.0.1$u" | grep -i "^WWW-Authenticate:" | head -1 | tr -d '\r')
            xpow=$(curl -sSI "http://127.0.0.1$u" | grep -i "^X-Powered-By:" | head -1 | tr -d '\r')
            echo "$u -> $code | $realm | ${xpow:-(no Express)}"
          done

          echo ""
          echo "===== STEP 8: 15 秒後檢查 config 有無被人再蓋 ====="
          sleep 15
          new_count=$(grep -c "stage-v2" "$CONF" || echo 0)
          echo "15 秒後 unified-dashboard 中 stage-v2 出現次數: $new_count"
          if [ "$new_count" = "0" ]; then
            echo "!!! 條 stage-v2 又被人清走 —— 罪犯仲喺度"
          else
            echo "OK: 15 秒後 stage-v2 依然喺 config"
          fi
          REMOTE
