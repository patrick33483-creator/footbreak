name: Diag v3 sync source

on:
  workflow_dispatch:
    inputs:
      confirmation: {description: "打 DIAGV3S", required: true, type: string}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-v3-syncsource.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "DIAGV3S" ]; then exit 1; fi
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"
          set +e
          echo "=== dashboard-self-heal.sh ==="
          $SSH 'sudo cat /opt/footbreak/deploy/dashboard-self-heal.sh 2>/dev/null | head -60'
          echo
          echo "=== sync-nginx.sh ==="
          $SSH 'sudo cat /opt/footbreak/deploy/sync-nginx.sh 2>/dev/null | head -80'
          echo
          echo "=== find source unified-dashboard template ==="
          $SSH 'sudo find /opt/footbreak -name "unified-dashboard*" 2>/dev/null | head -10'
          echo
          echo "=== timer status ==="
          $SSH 'systemctl status footbreak-dashboard-self-heal.timer --no-pager 2>/dev/null | head -15'
          echo
          echo "=== last self-heal run ==="
          $SSH 'sudo journalctl -u footbreak-dashboard-self-heal.service --since "1 hour ago" --no-pager | tail -30'
