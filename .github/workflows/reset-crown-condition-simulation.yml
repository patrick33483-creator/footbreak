name: 重置皇冠條件模擬倉（一次性）

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RESET_CROWN_CONDITION_SIMULATION_50000 exactly. This clears the Crown main simulation ledger and retired legacy portfolio keys.'
        required: true
        type: string

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Guarded Crown condition simulation reset
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact confirmation before SSH
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [ "$CONFIRMATION" = "RESET_CROWN_CONDITION_SIMULATION_50000" ] || {
            echo "Reset refused: exact confirmation is required." >&2
            exit 1
          }

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Reset only the Crown simulation state and publish aggregate summary
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo CONFIRMATION='$CONFIRMATION' /bin/sh -s" <<'REMOTE'
          set -eu
          cd /opt/footbreak
          set -a
          [ ! -f /etc/footbreak.env ] || . /etc/footbreak.env
          [ ! -f /etc/footbreak-crown.env ] || . /etc/footbreak-crown.env
          set +a
          [ "${CONFIRMATION:-}" = "RESET_CROWN_CONDITION_SIMULATION_50000" ] || exit 64
          systemctl stop crown-tick.timer crown-sweep.timer crown-settle.timer
          restart_timers() {
            systemctl start crown-tick.timer crown-sweep.timer crown-settle.timer
          }
          trap restart_timers EXIT
          /opt/footbreak/.venv/bin/python3 -m crown.reset_condition_simulation \
            --confirm "$CONFIRMATION" > /tmp/crown-condition-reset.json
          /opt/footbreak/.venv/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/crown-condition-reset.json').read_text())
          # Aggregate-only output: no state, fixtures, names, paths, or secrets.
          print(json.dumps({
              'ok': data.get('ok') is True,
              'bankroll': data.get('bankroll'),
              'cleared_main_bets': data.get('cleared_main_bets'),
              'legacy_keys_removed': data.get('legacy_keys_removed') is True,
          }, sort_keys=True))
          PY
          REMOTE
