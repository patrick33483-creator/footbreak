name: Diag v2 sid vs radar

on:
  workflow_dispatch:
    inputs:
      confirmation: {description: "打 DIAGSID", required: true, type: string}
  push:
    branches: [diagnose/crown-v2-pending-20260906]
    paths: ['.github/workflows/diag-v2-sid.yml']

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          E: ${{ github.event_name }}
          C: ${{ inputs.confirmation }}
        run: |
          if [ "$E" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$C" != "DIAGSID" ]; then exit 1; fi
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=30 -i ~/.ssh/id_ed25519 $DEPLOY_USER@$DEPLOY_HOST"

          # Write py locally, scp, then run
          cat > /tmp/diag.py <<'PYEOF'
          import json
          from datetime import datetime, timezone
          now_ms = int(datetime.now(timezone.utc).timestamp() * 1000)
          print("now UTC:", datetime.now(timezone.utc).isoformat())
          print()

          d = json.load(open("/var/www/stage_engine_v2/data.json"))
          fx = d.get("fixtures", [])
          print("V2 fixtures:", len(fx))
          future = past = no_time = 0
          for f in fx:
              k = f.get("kickoff_utc")
              if not k: no_time += 1; continue
              try:
                  t = datetime.fromisoformat(k.replace("Z","+00:00"))
                  if t.timestamp()*1000 > now_ms: future += 1
                  else: past += 1
              except: no_time += 1
          print(f"V2 kickoff: future={future} past={past} no_time={no_time}")
          print("V2 sample:", json.dumps({k: fx[0].get(k) for k in ["id","source","home","away","kickoff_utc","league"]}, ensure_ascii=False))
          print()

          import urllib.request
          try:
              r = urllib.request.urlopen("http://127.0.0.1:5002/api/matches", timeout=8)
              radar = json.loads(r.read())
              print("radar /api/matches:", len(radar), "upcoming")
              if radar:
                  m = radar[0]
                  print("radar sample:", json.dumps({k: m.get(k) for k in ["sid","league","home","away","kickoff_utc"]}, ensure_ascii=False))
                  t = datetime.fromtimestamp(m["kickoff_utc"]/1000, tz=timezone.utc)
                  print("  kickoff ISO:", t.isoformat())
                  # Match by (home, away)
                  radar_by_ha = {(str(m.get("home","")).strip(), str(m.get("away","")).strip()): m for m in radar}
                  v2_by_ha = {(str(f.get("home","")).strip(), str(f.get("away","")).strip()): f for f in fx}
                  common = set(radar_by_ha) & set(v2_by_ha)
                  print(f"(home,away) match: {len(common)} / radar={len(radar_by_ha)}, v2={len(v2_by_ha)}")
                  if common:
                      key = list(common)[0]
                      rf = radar_by_ha[key]; vf = v2_by_ha[key]
                      print(f"  sample match: home={key[0]} away={key[1]}")
                      print(f"    radar kickoff: {datetime.fromtimestamp(rf['kickoff_utc']/1000, tz=timezone.utc).isoformat()}")
                      print(f"    v2 kickoff:    {vf.get('kickoff_utc')}")
                      print(f"    v2 stages: {list(vf.get('stages',{}).keys())}")
                  # Also try sid-based match
                  v2_sids = {str(f.get("id")) for f in fx}
                  radar_sids = {str(m["sid"]) for m in radar}
                  print(f"sid overlap: {len(v2_sids & radar_sids)}")
          except Exception as e:
              print("radar API error:", e)
          PYEOF
          # de-indent
          sed -i 's/^          //' /tmp/diag.py
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 /tmp/diag.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/diag.py"
          $SSH 'python3 /tmp/diag.py; rm -f /tmp/diag.py'
