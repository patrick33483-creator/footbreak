name: Crown V2 operator result overlay

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Required: APPLY_CROWN_V2_OPERATOR_RESULTS_20260902"
        required: true
        type: string

concurrency:
  group: production-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout approved result batch
        uses: actions/checkout@v4

      - name: Validate and package result batch
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = APPLY_CROWN_V2_OPERATOR_RESULTS_20260902
          test -s analysis/crown_v2_operator_results_20260902.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("analysis/crown_v2_operator_results_20260902.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert len(payload["results"]) == 18
          assert len({str(row["match_id"]) for row in payload["results"]}) == 18
          assert {str(row["match_id"]) for row in payload["excluded"]} == {
              "3073570", "3022525", "3000437"
          }
          print(json.dumps({
              "batch_id": payload["batch_id"],
              "results": len(payload["results"]),
              "excluded": payload["excluded"],
          }, ensure_ascii=False))
          PY
          cp analysis/crown_v2_operator_results_20260902.json /tmp/crown-v2-results.json

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload verified result batch
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp /tmp/crown-v2-results.json \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/crown-v2-results-20260902.json"

      - name: Merge, apply, rebuild, and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=90 \
            "$DEPLOY_USER@$DEPLOY_HOST" "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          python=/opt/footbreak/.venv/bin/python3
          [ -x "$python" ] || python=python3
          state=/var/lib/footbreak/stage_engine_v2
          ledger="$state/ledger.json"
          overlay="$state/operator_results.json"
          incoming=/tmp/crown-v2-results-20260902.json
          dashboard=/var/www/stage_engine_v2/data.json
          timer=stage-engine-v2-tick.timer
          service=stage-engine-v2-tick.service
          stamp="$(TZ=Asia/Hong_Kong date +%Y%m%d-%H%M%S)"
          backup_root="/var/lib/footbreak/backups/crown-v2-operator-overlay-$stamp"
          merged="/tmp/crown-v2-operator-results-merged-$stamp.json"
          timer_was_active=0
          applied=0

          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$applied" -eq 1 ]; then
              systemctl stop "$timer" "$service" || true
              if [ -f "$backup_root/operator_results.json" ]; then
                install -m 0600 "$backup_root/operator_results.json" "$overlay"
              else
                rm -f "$overlay"
              fi
              if [ -f "$backup_root/data.json" ]; then
                install -m 0644 "$backup_root/data.json" "$dashboard"
              fi
              systemctl start "$service" || true
            fi
            if [ "$timer_was_active" -eq 1 ]; then
              systemctl start "$timer" || true
            fi
            rm -f "$merged"
            exit "$rc"
          }
          trap cleanup EXIT

          test -s "$ledger"
          test -s "$incoming"
          mkdir -p "$backup_root"
          if [ -f "$overlay" ]; then
            cp -a "$overlay" "$backup_root/operator_results.json"
          fi
          if [ -f "$dashboard" ]; then
            cp -a "$dashboard" "$backup_root/data.json"
          fi

          "$python" - "$overlay" "$incoming" "$merged" <<'PY'
          import json, sys
          from pathlib import Path

          overlay_path, incoming_path, merged_path = map(Path, sys.argv[1:])
          incoming = json.loads(incoming_path.read_text(encoding="utf-8"))
          if overlay_path.exists():
              current = json.loads(overlay_path.read_text(encoding="utf-8"))
          else:
              current = {
                  "schema_version": 1,
                  "score_scope": incoming["score_scope"],
                  "results": [],
                  "excluded": [],
              }
          assert current["schema_version"] == incoming["schema_version"] == 1
          assert current["score_scope"] == incoming["score_scope"]
          merged = {str(row["match_id"]): row for row in current.get("results", [])}
          for row in incoming["results"]:
              match_id = str(row["match_id"])
              old = merged.get(match_id)
              if old is not None:
                  assert (old["home_score"], old["away_score"]) == (
                      row["home_score"], row["away_score"]
                  ), (match_id, old, row)
              merged[match_id] = row
          resolved_ids = set(merged)
          excluded = {}
          for row in [*current.get("excluded", []), *incoming.get("excluded", [])]:
              match_id = str(row["match_id"])
              if match_id not in resolved_ids:
                  excluded[match_id] = row
          payload = {
              "schema_version": 1,
              "batch_id": incoming["batch_id"],
              "score_scope": incoming["score_scope"],
              "verified_at": incoming["verified_at"],
              "results": list(merged.values()),
              "excluded": list(excluded.values()),
          }
          merged_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps({
              "existing_results": len(current.get("results", [])),
              "incoming_results": len(incoming["results"]),
              "merged_results": len(payload["results"]),
              "excluded": payload["excluded"],
          }, ensure_ascii=False))
          PY

          PYTHONPATH=/opt/footbreak "$python" - "$ledger" "$merged" <<'PY'
          import json, sys
          from pathlib import Path
          from stage_engine_v2.operator_results import load_operator_history_rows

          ledger = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rows = load_operator_history_rows(Path(sys.argv[2]), ledger)
          expected_scores = {
              "3057155":"5-0", "3004483":"2-1", "3061632":"0-1",
              "2999460":"1-2", "3028286":"2-1", "3044637":"2-1",
              "3045076":"5-0", "2924114":"2-1", "3073572":"0-1",
              "3013048":"0-0", "3061596":"3-1", "3074079":"2-2",
              "3081369":"3-2", "3069665":"0-0", "3056263":"1-2",
              "3048471":"1-1", "3059438":"0-0", "3061598":"3-2",
          }
          actual = {}
          for row in rows:
              match_id = str(row["match_id"])
              if match_id in expected_scores:
                  actual.setdefault(match_id, set()).add(row["score"])
          assert set(actual) == set(expected_scores), (set(actual), set(expected_scores))
          assert all(actual[key] == {score} for key, score in expected_scores.items()), actual
          print(json.dumps({"dry_run": "ok", "scores": expected_scores}, ensure_ascii=False))
          PY

          if systemctl is-active --quiet "$timer"; then timer_was_active=1; fi
          systemctl stop "$timer" || true
          systemctl stop "$service" || true
          install -m 0600 "$merged" "$overlay"
          applied=1
          systemctl start "$service"
          sleep 45

          "$python" - "$dashboard" "$incoming" "$backup_root" <<'PY'
          import hashlib, json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          dashboard_path, incoming_path, backup_root = map(Path, sys.argv[1:])
          payload = json.loads(dashboard_path.read_text(encoding="utf-8"))
          incoming = json.loads(incoming_path.read_text(encoding="utf-8"))
          expected_scores = {
              str(row["match_id"]): f'{row["home_score"]}-{row["away_score"]}'
              for row in incoming["results"]
          }
          observations = payload["segmented_conditions"]["matching_observations"]
          actual = {}
          for row in observations:
              match_id = str(row.get("match_id"))
              if match_id in expected_scores:
                  actual.setdefault(match_id, set()).add(row.get("score"))
          assert set(actual) == set(expected_scores), (set(actual), set(expected_scores))
          assert all(actual[key] == {score} for key, score in expected_scores.items()), actual
          pending = {
              str(row["match_id"])
              for row in observations
              if row.get("result_status") == "待賽果"
          }
          assert not (pending & set(expected_scores)), pending & set(expected_scores)
          conditions = {
              row["id"]: row["prospective"]
              for row in payload["segmented_conditions"]["public_conditions"]
          }
          audit = {
              "schema_version": 1,
              "applied_at_utc": datetime.now(timezone.utc).isoformat(),
              "batch_id": incoming["batch_id"],
              "incoming_sha256": hashlib.sha256(incoming_path.read_bytes()).hexdigest(),
              "verified_fixtures": len(expected_scores),
              "scores": expected_scores,
              "remaining_pending_ids": sorted(pending),
              "conditions": conditions,
              "dashboard_generated_at_utc": payload["generated_at_utc"],
              "backup_root": str(backup_root),
          }
          audit_path = Path(
              "/var/lib/footbreak/stage_engine_v2/operator_results_20260902_audit.json"
          )
          audit_path.write_text(
              json.dumps(audit, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2, sort_keys=True))
          PY

          if [ "$timer_was_active" -eq 1 ]; then
            systemctl start "$timer"
          fi
          sleep 30
          systemctl is-active --quiet "$timer"
          systemctl is-failed --quiet "$service" && exit 1 || true
          "$python" - "$dashboard" "$incoming" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          incoming = json.load(open(sys.argv[2], encoding="utf-8"))
          expected = {str(row["match_id"]) for row in incoming["results"]}
          observations = payload["segmented_conditions"]["matching_observations"]
          pending = {
              str(row["match_id"]) for row in observations
              if row.get("result_status") == "待賽果"
          }
          assert not (pending & expected), pending & expected
          print(json.dumps({
              "persistence_check": "ok",
              "verified_fixtures": len(expected),
              "remaining_pending_ids": sorted(pending),
              "generated_at_utc": payload["generated_at_utc"],
          }, ensure_ascii=False))
          PY
          trap - EXIT
          rm -f "$merged"
          echo "Crown V2 result overlay merged and verified: $backup_root"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519
