name: 手動掃描足破及皇冠

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 設定群組通知並執行一次真實掃描
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          [[ "$GROUP_CHAT_ID" =~ ^-?[0-9]+$ ]] || {
            echo "TELEGRAM_GROUP_CHAT_ID 缺失或格式錯誤" >&2
            exit 1
          }
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo env GROUP_CHAT_ID='$GROUP_CHAT_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          upsert_env() {
            local file="$1" key="$2" value="$3" tmp
            touch "$file"
            chmod 600 "$file"
            tmp="$(mktemp)"
            grep -v "^${key}=" "$file" > "$tmp" || true
            printf '%s=%s\n' "$key" "$value" >> "$tmp"
            install -m 0600 "$tmp" "$file"
            rm -f "$tmp"
          }

          upsert_env /etc/footbreak.env TELEGRAM_CHAT_ID "$GROUP_CHAT_ID"
          upsert_env /etc/footbreak-crown.env CROWN_TELEGRAM_CHAT_ID "$GROUP_CHAT_ID"
          upsert_env /etc/footbreak-crown.env CROWN_TELEGRAM_ENABLED 1

          set -a
          . /etc/footbreak.env
          set +a
          test -n "${TELEGRAM_BOT_TOKEN:-}" || {
            echo "伺服器未設定 TELEGRAM_BOT_TOKEN" >&2
            exit 1
          }

          /opt/footbreak/deploy/run.sh tick
          /opt/footbreak/deploy/crown-run.sh tick

          python3 - <<'PY'
          import json
          from pathlib import Path

          def count(path, key):
              try:
                  return len((json.loads(Path(path).read_text()).get(key) or []))
              except Exception:
                  return None

          print(json.dumps({
              "footbreak_bets": count("/opt/footbreak/system/sim_ledger.json", "bets"),
              "footbreak_notified": count("/opt/footbreak/system/notify_state.json", "bets"),
              "crown_bets": count("/var/lib/footbreak/crown/ledger.json", "bets"),
              "crown_notified": count("/var/lib/footbreak/crown/notify_state.json", "bets"),
          }, ensure_ascii=False))
          PY
          REMOTE
