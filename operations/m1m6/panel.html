<style>
#m1m6-root{--muted:#94a3b8;max-width:1400px;margin:0 auto;padding:16px 18px 40px;font-size:14px;line-height:1.6}
#m1m6-root *{box-sizing:border-box}#m1m6-root h2{font-size:18px;margin:24px 0 12px}#m1m6-root h3{font-size:15px;margin:0 0 8px}
#m1m6-root .m-panel{background:var(--panel,#121a2d);border:1px solid var(--border,#1e293b);padding:16px;border-radius:6px;margin-bottom:12px}
#m1m6-root .m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
#m1m6-root .m-muted{color:var(--muted)}#m1m6-root .m-pass{color:#6ee7b7}#m1m6-root .m-warn{color:#fbbf24}
#m1m6-root button{background:transparent;border:1px solid var(--border,#334155);color:inherit;border-radius:4px;min-height:44px;padding:8px 16px;cursor:pointer}
#m1m6-root button:focus-visible{outline:2px solid var(--accent,#22d3ee);outline-offset:3px}
#m1m6-root .m-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#m1m6-root .m-table{overflow-x:auto}#m1m6-root table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
#m1m6-root th,#m1m6-root td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border,#1e293b);vertical-align:top}
#m1m6-root .m-code{font-family:monospace;white-space:nowrap}#m1m6-root p{margin:8px 0}
#m1m6-root summary{cursor:pointer;min-height:44px;padding:8px 0}
@media(max-width:500px){#m1m6-root{padding:12px}#m1m6-root .m-panel{padding:12px}#m1m6-root th,#m1m6-root td{padding:8px 6px}}
</style>
<main id="m1m6-root">
 <div class="m-toolbar"><div><h2 style="margin-top:0">M1–M6 批次通知</h2><div id="m-updated" class="m-muted" role="status">正在讀取通知帳本…</div></div><button id="m-refresh" type="button">立即更新</button></div>
 <section class="m-panel" style="margin-top:16px" aria-labelledby="m-lock"><h3 id="m-lock">正在核對批次狀態</h3><p>同一次掃描可通知多場；整批正式賽果齊全前不開下一批。結算後，各分支須最近20場≥95%或30場≥90%，才可再推下一場。</p><p class="m-muted">同場同市場同方向同盤線只計一次。缺資料、未達門檻、批次鎖定會分開顯示；走盤不計命中率分母，半贏計命中但只收半注收益。</p></section>
 <h2>六個固定條件與目前窗口</h2><div id="m-rules" class="m-grid"><div class="m-panel m-muted">載入六組條件及最近窗口…</div></div>
 <h2>新版本TG通知帳本</h2><div class="m-panel"><p class="m-muted">只列新版本實際發送嘗試；歷史研究樣本與舊8條策略不混入本帳本。</p><div id="m-ledger" class="m-table">載入中…</div></div>
 <details class="m-panel"><summary>目前掃描診斷</summary><div id="m-diagnostics" class="m-muted"></div><p class="m-muted">取消、延期或缺正式賽果不會自動當作已結算解鎖；會保留等候狀態。</p></details>
</main>
<script>
(()=>{"use strict";
 const $=id=>document.getElementById(id);
 const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const time=x=>x?new Date(x).toLocaleString("zh-HK",{timeZone:"Asia/Hong_Kong",hour12:false}):"未有";
 const states={sent:"TG已確認",uncertain:"發送結果待核實",rejected:"TG拒絕",skipped:"未發送",prepared:"準備中",sending:"發送中"};
 const results={W:"全贏",HW:"半贏",P:"走盤",HL:"半輸",L:"全輸"};
 const reasons={matched:"固定條件符合",fixed_conditions_not_met:"固定條件不符",missing_or_invalid_six_snapshots:"六快照資料不足／無效",invalid_T30_time:"T30時點不符",invalid_T5_time:"T5時點不符",invalid_snapshot:"快照資料無效",nonchronological:"時點次序不符",outside_market_scope:"盤線超出範圍",invalid_match_time:"開賽時間無效"};
 let busy=false;
 function stat(s){if(!s)return "資料不足";return `${s.n}/${s.required_n}場；${s.den?`${s.wins}/${s.den}＝${(s.hit*100).toFixed(1)}%`:"未有非走盤"}；${s.pnl>=0?"+":""}${s.pnl.toFixed(3)}u`;}
 async function load(){
  if(busy)return;busy=true;$("m-refresh").disabled=true;
  try{
   const data=window.M1M6_PREVIEW_DATA || await fetch("/crownsystem-v3/m1m6_status.json?t="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()});
   const stale=Date.now()-data.updated_at>90000;
   $("m-updated").textContent=`香港時間 ${time(data.updated_at)}｜${data.version}${stale?"｜資料超過90秒未更新，勿當即時訊號":""}`;
   const locked=data.locked_batch;
   $("m-lock").textContent=locked?`批次 #${locked.batch_id} 鎖定：等候 ${locked.waiting} 筆正式賽果`:"批次已解鎖：等候新賽前訊號";
   $("m-lock").className=locked?"m-warn":"m-pass";
   $("m-rules").innerHTML=data.rules.map(r=>`<article class="m-panel"><h3>${esc(r.id)}｜${esc(r.label)}</h3><p>${esc(r.description)}</p><p class="${r.gate.pass?"m-pass":"m-warn"}">${r.gate.pass?(locked?"窗口達標，仍受整批鎖限制":"窗口達標，等候固定條件命中"):"窗口未達標，暫不放行"}</p><div>最近20：${esc(stat(r.gate["20"]))}</div><div>最近30：${esc(stat(r.gate["30"]))}</div><p class="m-muted">窗口是所有符合條件的已結算場次，並非實際TG命中率。</p></article>`).join("");
   $("m-ledger").innerHTML=data.ledger.length?`<table><thead><tr><th>批次／策略</th><th>香港開賽／賽事</th><th>盤價</th><th>TG狀態</th><th>正式結果</th></tr></thead><tbody>${data.ledger.map(r=>`<tr><td>#${r.batch_id}<br>${esc(r.rules.join("／"))}</td><td>${esc(time(r.ko))}<br>${esc(r.home)} vs ${esc(r.away)}</td><td>${r.side==="under"?"買細":"買主"} ${esc(r.line)}<br>港賠 ${Number(r.hk).toFixed(2)}</td><td>${esc(states[r.delivery_status]||r.delivery_status)}<br>${esc(time(r.ack_at))}</td><td>${r.result?`${esc(r.result.score)}｜${esc(results[r.result.result])}<br>${r.result.pnl>=0?"+":""}${r.result.pnl.toFixed(3)}u`:"等候正式賽果"}</td></tr>`).join("")}</tbody></table>`:"尚未有新版本通知紀錄。系統只會處理切換後新到達、仍未開賽嘅T5訊號，不補發歷史場次。";
   $("m-diagnostics").innerHTML=Object.entries(data.scan_reasons).map(([k,v])=>`<div>${esc(reasons[k]||k)}：${v}場</div>`).join("")+`<div>目前固定條件命中：${data.live_condition_hits.length}個分支紀錄（未去重，未必可發送）</div>`;
   for(const id of ["status","meta"]){if($(id))$(id).textContent="M1–M6｜"+time(data.updated_at);}
  }catch(e){$("m-updated").textContent="暫時未能讀取新通知帳本，請稍後按「立即更新」；未有資料不代表沒有符合場次。";$("m-lock").textContent="狀態未能確認";}
  finally{busy=false;$("m-refresh").disabled=false;}
 }
 $("m-refresh").addEventListener("click",load);load();setInterval(load,20000);
})();
</script>
