<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>皇冠球賽預測系統V3 · 歷史</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #f59e0b;
      --up: #22c55e; --down: #ef4444; --live: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text); font-size: 14px; }
    header { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 18px; margin: 0; color: var(--accent); }
    .status { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
    th { background: var(--panel); color: var(--muted); font-weight: 500; font-size: 12px; position: sticky; top: 0; }
    tr:hover { background: rgba(255,255,255,0.04); }
    .ko { color: var(--muted); font-size: 12px; }
    .league { color: var(--muted); font-size: 12px; }
    .team { font-weight: 500; }
    .score { font-family: "SF Mono", ui-monospace, monospace; font-weight: 600; font-size: 15px; }
    .score-h { color: var(--up); }
    .score-a { color: var(--text); }
    .score-sep { color: var(--muted); margin: 0 4px; }
    .status-tag { padding: 1px 6px; border-radius: 3px; font-size: 10px; display: inline-block; margin-top: 2px; }
    .status-live { background: rgba(239,68,68,0.2); color: var(--live); }
    .status-done { background: rgba(34,197,94,0.15); color: var(--up); }
    .status-pending { color: var(--muted); font-size: 11px; }
    .pred-cell { display: flex; flex-direction: column; gap: 2px; align-items: center; font-family: "SF Mono", ui-monospace, monospace; font-size: 12px; }
    .pred-label { font-weight: 500; color: var(--text); }
    .pred-meta { font-size: 10px; color: var(--muted); }
    .pred-published { color: var(--accent); font-weight: 600; }
    .pred-below { color: var(--muted); }
    .pred-win { color: var(--up); font-weight: 600; }
    .pred-lose { color: var(--down); font-weight: 600; }
    .empty { color: #475569; }
    .filter { padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .filter input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; width: 220px; }
    footer { padding: 12px 20px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); }
    nav a { padding: 4px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; margin-right: 4px; }
    .nav-active { background: rgba(245,158,11,0.2); border: 1px solid var(--accent); color: var(--accent); }
    .nav-inactive { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    @media (max-width: 768px) {
      th, td { padding: 6px 6px; font-size: 12px; }
      .filter input { width: 160px; }
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:16px;">
      <h1>皇冠球賽預測系統V3 <span style="color: var(--muted); font-weight: 400; font-size: 13px;">· 歷史比賽</span></h1>
      <nav>
        <a href="./" class="nav-inactive">即時開賽</a>
        <a href="./history.html" class="nav-active">歷史</a>
        <a href="./signals.html" class="nav-inactive">訊號</a>
      </nav>
    </div>
    <div class="status" id="status">載入中…</div>
  </header>
  <div class="filter">
    <input type="text" id="filter" placeholder="搜尋聯賽 / 隊名…" />
    <span class="status" id="count" style="margin-left: 12px;"></span>
  </div>
  <div style="overflow-x: auto;">
    <table>
      <thead>
        <tr>
          <th>開賽</th>
          <th>聯賽</th>
          <th>主隊</th>
          <th>比分</th>
          <th>客隊</th>
          <th>初盤預測</th>
          <th>T-30預測</th>
          <th>T-5預測</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="more-wrap" style="text-align:center; padding:14px;">
      <button id="more-btn" style="background:var(--panel); border:1px solid var(--border); color:var(--accent); padding:6px 18px; border-radius:4px; cursor:pointer; font-size:12px;">顯示更多（+20）</button>
    </div>
  </div>
  <footer>
    比分來源：Titan007 completed + live · 越近上 · 只顯示 kickoff 已過的預測賽事
  </footer>
  <script>
    const fmtKO = (iso) => {
      if (!iso) return "—";
      const d = new Date(iso);
      const m = d.getMonth()+1;
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      return `${m}-${dd} ${hh}:${mm}`;
    };
    function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function predCell(stage) {
      if (!stage) return '<span class="empty">—</span>';
      const label = stage.lead_label || "—";
      const odds = stage.lead_odds != null ? stage.lead_odds.toFixed(2) : "—";
      const prob = stage.lead_prob != null ? (stage.lead_prob*100).toFixed(1)+"%" : "—";
      const conv = stage.conviction != null ? stage.conviction.toFixed(1) : "—";
      const cls = stage.publish_decision ? "pred-published" : "pred-below";
      return `<div class="pred-cell">
        <div class="pred-label ${cls}">${escapeHtml(label)}</div>
        <div class="pred-meta">賠 ${odds} · 概 ${prob} · 信 ${conv}</div>
      </div>`;
    }
    function scoreCell(m) {
      const r = m._result;
      const live = m._live;
      // Priority: result > live > pending
      if (r && r.home_score != null && r.away_score != null) {
        return `<div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
          <span class="score"><span class="score-h">${r.home_score}</span><span class="score-sep">-</span><span class="score-a">${r.away_score}</span></span>
          <span class="status-tag status-done">完場</span>
        </div>`;
      }
      if (live && live.score) {
        const parts = String(live.score).split("-");
        if (parts.length === 2) {
          return `<div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
            <span class="score"><span class="score-h">${escapeHtml(parts[0])}</span><span class="score-sep">-</span><span class="score-a">${escapeHtml(parts[1])}</span></span>
            <span class="status-tag status-live">${escapeHtml(live.status || "進行中")}</span>
          </div>`;
        }
      }
      return '<span class="status-pending">未取</span>';
    }
    let allData = [];
    let showLimit = 20;
    function render() {
      const q = document.getElementById("filter").value.toLowerCase();
      const filtered = allData.filter(m => !q || (String(m.league||"") + String(m.home||"") + String(m.away||"")).toLowerCase().includes(q));
      const shown = filtered.slice(0, showLimit);
      document.getElementById("count").textContent = `共 ${filtered.length} 場（已開賽）· 顯示 ${Math.min(showLimit, filtered.length)}`;
      const moreBtn = document.getElementById("more-btn");
      if (showLimit >= filtered.length) {
        moreBtn.style.display = "none";
      } else {
        moreBtn.style.display = "";
        moreBtn.textContent = `顯示更多（+20，剩 ${filtered.length - showLimit}）`;
      }
      const rows = shown.map(m => {
        const s = m.stages || {};
        return `<tr>
          <td class="ko">${fmtKO(m.kickoff_hkt || m.kickoff_utc)}</td>
          <td class="league">${escapeHtml(m.league)}</td>
          <td class="team">${escapeHtml(m.home)}</td>
          <td>${scoreCell(m)}</td>
          <td class="team">${escapeHtml(m.away)}</td>
          <td>${predCell(s["首預"])}</td>
          <td>${predCell(s["T-30"])}</td>
          <td>${predCell(s["T-5"])}</td>
        </tr>`;
      }).join("");
      document.getElementById("rows").innerHTML = rows || '<tr><td colspan="8" style="text-align:center;padding:40px;color:#64748b">暫無已開賽記錄</td></tr>';
    }
    async function load() {
      try {
        const [data, results, titan] = await Promise.all([
          fetch("./data.json?_=" + Date.now()).then(r => r.json()),
          fetch("./results.json?_=" + Date.now()).then(r => r.json()).catch(() => ({results:{}})),
          fetch("./titan_today.json?_=" + Date.now()).then(r => r.json()).catch(() => ({fixtures:[]})),
        ]);
        const resultsMap = results.results || {};
        const liveMap = {};
        (titan.fixtures || []).forEach(f => { if (f.sid) liveMap[String(f.sid)] = f; });
        const now = Date.now();
        allData = (data.fixtures || [])
          .filter(m => {
            const ko = m.kickoff_utc ? new Date(m.kickoff_utc).getTime() : 0;
            return ko <= now;
          })
          .map(m => ({
            ...m,
            _result: resultsMap[String(m.id)] || null,
            _live: liveMap[String(m.id)] || null,
          }))
          .sort((a, b) => new Date(b.kickoff_utc).getTime() - new Date(a.kickoff_utc).getTime());
        document.getElementById("status").textContent =
          `歷史場數 ${allData.length} · 完場 ${Object.keys(resultsMap).length} · 現進行 ${(titan.fixtures||[]).filter(x=>x.score).length}`;
        render();
      } catch (err) {
        document.getElementById("status").textContent = "載入錯誤：" + err.message;
      }
    }
    document.getElementById("filter").addEventListener("input", () => { showLimit = 20; render(); });
    document.getElementById("more-btn").addEventListener("click", () => { showLimit += 20; render(); });
    load();
    setInterval(load, 60_000);
  </script>
</body>
</html>
