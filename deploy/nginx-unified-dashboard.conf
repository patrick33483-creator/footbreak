server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    location = /footbreak { return 301 /footbreak/; }
    location = /footbreak/data.json {
        auth_basic "fb_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        alias /var/www/footbreak/data.json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ^~ /footbreak/api/ {
        auth_basic "fb_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }
    location ^~ /footbreak/ {
        auth_basic "fb_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        alias /var/www/footbreak/;
        index index.html;
    }

    location = /crown { return 301 /crown/; }
    location = /crown/data.json {
        auth_basic "crown_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-kwanv2;
        alias /var/www/crown/data.json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ^~ /crown/api/ {
        auth_basic "crown_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-kwanv2;
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }
    location ^~ /crown/ {
        auth_basic "crown_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-kwanv2;
        alias /var/www/crown/;
        index index.html;
    }

    # V2 皇冠 shadow dashboard
    location = /v2/crown { return 301 /v2/crown/; }
    location = /v2/crown/data.json {
        auth_basic "v2_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        alias /var/www/stage_engine_v2/data.json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ^~ /v2/crown/ {
        auth_basic "v2_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        alias /var/www/stage_engine_v2/;
        index index.html;
    }

    # 舊時盤路雷達 — 8081 dashboard
    location = /radar { return 301 /radar/; }
    location ^~ /radar/ {
        auth_basic "radar_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # 舊時盤路雷達 — 8082 challenger
    location = /radar-challenger { return 301 /radar-challenger/; }
    location ^~ /radar-challenger/ {
        auth_basic "radar_2026";
        auth_basic_user_file /etc/nginx/.htpasswd-fbv2;
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
