server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    charset utf-8;
    client_max_body_size 10m;
    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    location = /footbreak { return 301 /footbreak/; }
    location = /footbreak/data.json {
        auth_basic "Footbreak";
        auth_basic_user_file /etc/nginx/.htpasswd-footbreak;
        alias /var/www/footbreak/data.json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ^~ /footbreak/api/ {
        auth_basic "Footbreak";
        auth_basic_user_file /etc/nginx/.htpasswd-footbreak;
        proxy_pass http://127.0.0.1:8766/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }
    location ^~ /footbreak/ {
        auth_basic "Footbreak";
        auth_basic_user_file /etc/nginx/.htpasswd-footbreak;
        alias /var/www/footbreak/;
        index index.html;
    }

    location = /crown { return 301 /crown/; }
    location = /crown/data.json {
        auth_basic "Footbreak Crown";
        auth_basic_user_file /etc/nginx/.htpasswd-crown;
        alias /var/www/crown/data.json;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ^~ /crown/api/ {
        auth_basic "Footbreak Crown";
        auth_basic_user_file /etc/nginx/.htpasswd-crown;
        proxy_pass http://127.0.0.1:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }
    location ^~ /crown/ {
        auth_basic "Footbreak Crown";
        auth_basic_user_file /etc/nginx/.htpasswd-crown;
        alias /var/www/crown/;
        index index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
