server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/footbreak;
    index index.html;
    auth_basic "Footbreak";
    auth_basic_user_file /etc/nginx/.htpasswd-footbreak;

    charset utf-8;
    gzip on;
    # text/html is already a built-in gzip type; do not repeat it and trigger
    # nginx's duplicate MIME-type warning.
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    # data.json 每 2 分鐘就變,唔可以快取
    location = /data.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files /index.html =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }

    # 儀表板修正要即時生效，避免手機繼續載入舊 JS/CSS。
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/footbreak.access.log;
    error_log  /var/log/nginx/footbreak.error.log;
}
