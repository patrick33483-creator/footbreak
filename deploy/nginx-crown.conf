server {
    listen 8082;
    listen [::]:8082;
    server_name _;

    root /var/www/crown;
    index index.html;
    auth_basic "Footbreak Crown";
    auth_basic_user_file /etc/nginx/.htpasswd-crown;

    charset utf-8;
    gzip on;
    # text/html is already a built-in gzip type; do not repeat it and trigger
    # nginx's duplicate MIME-type warning.
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;

    location = /data.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    # Complete prediction-history rows are fetched only when the History view
    # opens.  They are independently replaced by the dashboard publisher.
    location = /history.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ~ ^/history-[0-9a-f]{20}\.json$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    # 挑戰模型報告每日重寫,前端亦有時間戳,唔可以快取。
    location = /challenger-status.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    # 資料健康報告由伺服器排程重寫,前端亦有時間戳,唔可以快取。
    location = /data-health.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /shadow-condition-report.json {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files /index.html =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 330s;
        add_header Cache-Control "no-store";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location / { try_files $uri $uri/ =404; }

    access_log /var/log/nginx/crown.access.log;
    error_log /var/log/nginx/crown.error.log;
}
