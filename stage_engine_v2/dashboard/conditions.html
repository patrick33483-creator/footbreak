<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="皇冠系統 V2 細分條件及符合場次持續累積。">
<title>皇冠 V2 累積訊號</title>
<!-- 部署相容標記：皇冠系統V2 · 三階段細分 -->
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f6f7f8;--surface:#ffffff;--surface-2:#f3f5f6;--border:#d9dee2;
  --text:#20272c;--muted:#677179;--faint:#8c959c;--accent:#147da0;
  --accent-soft:#e6f2f6;--green:#287c5a;--green-soft:#eaf4ef;
  --gold:#a87616;--gold-soft:#faf1d9;--warning:#a65a2d;--danger:#a33b50;
  --result-hit:#16885f;--result-loss:#c14f49;--result-refund:#a87616;
  --shadow:0 1px 2px rgb(23 39 49 / .05);
}
[data-theme="dark"]{
  --bg:#111416;--surface:#181c1f;--surface-2:#202529;--border:#343b40;
  --text:#edf1f3;--muted:#a3adb4;--faint:#7f8a91;--accent:#69b9d1;
  --accent-soft:#18313a;--green:#72bd99;--green-soft:#183128;
  --gold:#e0b95f;--gold-soft:#3c3118;--warning:#df9468;--danger:#df8295;
  --result-hit:#72bd99;--result-loss:#ed7b75;--result-refund:#e0b95f;
  --shadow:0 1px 2px rgb(0 0 0 / .28);
}
:root{
  --font-body:"Satoshi","PingFang HK","Noto Sans CJK TC",sans-serif;
  --text-xs:clamp(.75rem,.72rem + .12vw,.8125rem);
  --text-sm:clamp(.875rem,.84rem + .14vw,.9375rem);
  --text-base:clamp(1rem,.97rem + .12vw,1.0625rem);
  --text-lg:clamp(1.125rem,1.05rem + .28vw,1.25rem);
  --text-xl:clamp(1.375rem,1.2rem + .55vw,1.625rem);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;
  --s6:1.5rem;--s8:2rem;--s10:2.5rem;--radius:.5rem;
  --transition:180ms cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;text-size-adjust:none;scroll-behavior:smooth;background:var(--bg)}
body{min-height:100dvh;background:var(--bg);color:var(--text);font:var(--text-sm)/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:.25rem}
.skip-link{position:fixed;z-index:10;top:var(--s2);left:var(--s2);padding:var(--s2) var(--s3);background:var(--text);color:var(--bg);border-radius:.375rem;transform:translateY(-160%);transition:transform var(--transition)}
.skip-link:focus{transform:translateY(0)}
.shell{min-height:100dvh}.topbar{background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-main{min-height:4rem;padding:var(--s3) clamp(var(--s4),3vw,var(--s8));display:flex;align-items:center;justify-content:space-between;gap:var(--s5)}
.brand{display:flex;align-items:center;gap:var(--s3);min-width:0}
.mark{width:2rem;height:2rem;flex:none;color:var(--accent)}
.brand h1{font-size:var(--text-base);line-height:1.15;font-weight:700;letter-spacing:-.015em}
.brand p{font-size:var(--text-xs);color:var(--muted);margin-top:var(--s1)}
.actions{display:flex;align-items:center;gap:var(--s2)}
.icon-btn,.nav-link{min-width:2.75rem;min-height:2.75rem;padding:0 var(--s3);border:1px solid transparent;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);border-radius:.375rem}
.icon-btn:hover,.nav-link:hover{background:var(--surface-2);color:var(--text)}
.icon-btn svg,.nav-link svg{width:1rem;height:1rem}
.mobile-label{display:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--border)}
.kpi{padding:var(--s3) clamp(var(--s4),3vw,var(--s8));border-right:1px solid var(--border)}
.kpi:last-child{border-right:0}.kpi span{display:block;color:var(--muted);font-size:var(--text-xs)}
.kpi strong{display:block;margin-top:var(--s1);font-size:var(--text-xl);line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.kpi.settled strong{color:var(--green)}
.tabs{display:flex;gap:var(--s1);padding:var(--s3) clamp(var(--s4),3vw,var(--s8));background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{min-height:2.75rem;white-space:nowrap;border:0;border-radius:.375rem;padding:var(--s2) var(--s3);background:transparent;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text)}
.main{width:min(100%,75rem);margin:0 auto;padding:var(--s5) clamp(var(--s4),3vw,var(--s8)) var(--s10)}
.statusline{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s4);color:var(--muted);font-size:var(--text-xs)}
.statusline strong{color:var(--text);font-size:var(--text-sm)}
.live-dot{display:inline-block;width:.5rem;height:.5rem;margin-right:var(--s2);border-radius:50%;background:var(--accent);box-shadow:0 0 0 .25rem var(--accent-soft)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.rule{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:var(--s4);min-width:0}
.rule.featured{grid-column:1/-1}.rule-head{display:flex;justify-content:space-between;gap:var(--s4);align-items:flex-start}
.rule h2{font-size:var(--text-base);line-height:1.3;font-weight:700;letter-spacing:-.01em}
.rule-id{margin-top:var(--s1);font-size:var(--text-xs);color:var(--faint)}
.badge{flex:none;padding:var(--s1) var(--s2);border-radius:.25rem;background:var(--green-soft);color:var(--green);font-size:var(--text-xs);font-weight:700}
.badge.s{background:var(--gold-soft);color:var(--gold)}
.definition{color:var(--muted);font-size:var(--text-xs);margin-top:var(--s3)}
.path{font-weight:600;margin-top:var(--s3)}
.history-note{color:var(--muted);font-size:var(--text-xs);margin-top:var(--s2)}
.live-stats{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border);display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.live-stats strong{font-size:var(--text-sm)}.live-stats span{color:var(--muted)}
.live-stats .rate{color:var(--green);font-weight:700}
.rule-actions{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
.btn{min-height:2.75rem;border:1px solid var(--border);border-radius:.375rem;padding:var(--s2) var(--s3);background:var(--surface);color:var(--muted);font-size:var(--text-xs);font-weight:500}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.primary{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.inline-matches{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--border)}
.inline-matches[hidden]{display:none}
.inline-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2)}
.inline-head strong{font-size:var(--text-sm)}.inline-head span{color:var(--muted);font-size:var(--text-xs)}
.inline-matches .match{background:var(--surface-2);box-shadow:none}
.matches-section{margin-top:var(--s6);scroll-margin-top:var(--s4)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s3)}
.section-head h2{font-size:var(--text-lg);letter-spacing:-.015em}.updated{font-size:var(--text-xs);color:var(--muted)}
.active-filter{display:none;margin-bottom:var(--s3);padding:var(--s2) var(--s3);border:1px solid var(--border);border-radius:.375rem;background:var(--surface);color:var(--muted)}
.active-filter.visible{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.active-filter button{min-height:2.75rem;border:0;background:none;color:var(--accent);font-weight:600}
.match-list{display:grid;gap:var(--s2)}
.match{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--s3) var(--s4);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4);align-items:center}
.match-main{min-width:0}.match-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match-meta,.match-path{font-size:var(--text-xs);color:var(--muted);margin-top:var(--s1)}
.match-result{text-align:right;white-space:nowrap}.match-result strong{display:block;font-size:var(--text-sm)}
.match-result .hit{color:var(--result-hit)}.match-result .loss{color:var(--result-loss)}
.match-result .refund{color:var(--result-refund)}.match-result .pending{color:var(--warning)}
.empty{padding:var(--s10) var(--s5);border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface);text-align:center;color:var(--muted)}
.empty svg{width:1.5rem;height:1.5rem;margin:0 auto var(--s3);color:var(--faint)}
.error{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--border))}
.foot{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--border);color:var(--muted);font-size:var(--text-xs)}
@media(max-width:720px){
  .topbar-main{align-items:flex-start}.nav-link span{display:none}.mobile-label{display:inline}
  .kpi{padding:var(--s3)}.kpi strong{font-size:var(--text-lg)}
  .rules{grid-template-columns:1fr}.rule.featured{grid-column:auto}
  .match{grid-template-columns:1fr}.match-result{text-align:left;display:flex;gap:var(--s2);align-items:center}
  .brand p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14rem}
}
@media(max-width:430px){
  .topbar-main{padding-inline:var(--s3)}.main{padding-inline:var(--s3)}
  .actions .nav-link{display:none}.kpi span{font-size:.75rem}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要內容</a>
<div class="shell">
  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="./conditions.html" aria-label="皇冠 V2 累積訊號">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 19.5 11 11l5 5 5-5 3 8.5H8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M10 22h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <div><h1>皇冠 V2 累積訊號</h1><p>初盤預測 · T-30 · T-5 條件持續累積</p></div>
      </a>
      <div class="actions">
        <a class="nav-link" href="./" data-testid="link-dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h7v6H4zM13 5h7v10h-7zM4 13h7v6H4zM13 17h7v2h-7z"/></svg><span>即時</span>
        </a>
        <a class="nav-link" href="./history.html" data-testid="link-history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h16"/></svg><span>研究數據</span>
        </a>
        <button class="icon-btn" type="button" data-theme-toggle data-testid="button-theme" aria-label="切換深色模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
    <div class="kpis" aria-label="訊號總覽">
      <div class="kpi"><span>目前可留意</span><strong id="kpi-live" data-testid="kpi-live">—</strong></div>
      <div class="kpi"><span>累積訊號</span><strong id="kpi-total" data-testid="kpi-total">—</strong></div>
      <div class="kpi settled"><span>已有賽果</span><strong id="kpi-settled" data-testid="kpi-settled">—</strong></div>
    </div>
    <nav class="tabs" aria-label="場次狀態">
      <button class="tab" type="button" data-mode="live" aria-selected="true" data-testid="tab-live">未開賽／進行中</button>
      <button class="tab" type="button" data-mode="all" aria-selected="false" data-testid="tab-all">全部累積</button>
      <button class="tab" type="button" data-mode="settled" aria-selected="false" data-testid="tab-settled">已完場／待賽果</button>
      <button class="tab" type="button" data-market="all" aria-selected="true" data-testid="tab-market-all">全部條件</button>
      <button class="tab" type="button" data-market="HDC" aria-selected="false" data-testid="tab-market-hdc">讓球</button>
      <button class="tab" type="button" data-market="HIL" aria-selected="false" data-testid="tab-market-hil">入球大細</button>
    </nav>
  </header>

  <main class="main" id="main-content">
    <div class="statusline">
      <strong><span class="live-dot"></span>監察條件</strong>
      <span id="condition-count">載入中</span>
    </div>
    <section class="rules" id="rules" aria-label="累積條件">
      <div class="empty">正在讀取條件…</div>
    </section>

    <section class="matches-section" id="matches-section">
      <div class="section-head"><h2 id="matches-title">現時運行符合場次</h2><span class="updated" id="updated">載入中</span></div>
      <div class="active-filter" id="active-filter">
        <span id="active-filter-text"></span>
        <button type="button" id="clear-filter" data-testid="button-clear-condition">清除篩選</button>
      </div>
      <div class="match-list" id="match-list"><div class="empty">正在讀取場次…</div></div>
    </section>

    <p class="foot">命中率以全贏及半贏為命中，走水不計入分母。歷史回測只作條件參考；累積訊號、已判定及符合場次會隨 V2 資料持續更新。</p>
  </main>
</div>

<script>
const state={payload:null,mode:"live",market:"all",condition:null};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(v,d=1)=>v==null?"待累積":`${(Number(v)*100).toFixed(d)}%`;
const n=v=>Number(v||0).toLocaleString("zh-HK");
const fmtTime=v=>v?new Date(v).toLocaleString("zh-HK",{timeZone:"Asia/Hong_Kong",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}):"—";
const conditionMap=()=>Object.fromEntries((state.payload?.public_conditions||[]).map(c=>[c.id,c]));
function statusOf(row){
  if(row.settlement)return "settled";
  const kick=new Date(row.kickoff).getTime();
  return Number.isFinite(kick)&&kick>Date.now()-3*60*60*1000?"live":"awaiting";
}
function stagePath(row){
  return ["首預","T-30","T-5"].filter(s=>row.directions?.[s]).map(s=>{
    const name=s==="首預"?"初盤":s,ln=row.lines?.[s],odd=row.odds_by_stage?.[s];
    const line=ln==null?"":` ${Number(ln)>0?"+":""}${Number(ln)}`;
    return `${name} ${row.directions[s]}${line}${odd==null?"":` @ ${Number(odd).toFixed(2)}`}`;
  }).join(" → ");
}
function resultView(row){
  const settlement=String(row.settlement||"");
  if(["Won","Half Won"].includes(settlement))return {label:"中",className:"hit"};
  if(["Lost","Half Lost"].includes(settlement))return {label:"失",className:"loss"};
  if(settlement==="Refunded")return {label:"走",className:"refund"};
  return {label:"待賽果",className:"pending"};
}
function allObservations(){
  return (state.payload?.public_conditions||[]).flatMap(c=>(c.observations||[]).map(o=>({...o,_condition:c.id,_title:c.title})));
}
function visibleObservations(){
  return allObservations().filter(o=>{
    if(state.market!=="all"&&o.market!==state.market)return false;
    if(state.condition&&o._condition!==state.condition)return false;
    if(state.mode==="live")return statusOf(o)==="live";
    if(state.mode==="settled")return statusOf(o)!=="live";
    return true;
  }).sort((a,b)=>String(b.kickoff||"").localeCompare(String(a.kickoff||"")));
}
function matchMarkup(r){
  const result=resultView(r),score=r.score?` · ${esc(String(r.score).replace(/-/g,"–"))}`:"";
  return `<article class="match" data-testid="match-${esc(r._condition)}-${esc(r.match_id)}">
    <div class="match-main">
      <div class="match-title">${esc(r.home)} 對 ${esc(r.away)}</div>
      <div class="match-meta">${esc(r.league)} · ${fmtTime(r.kickoff)} · ${esc(r.tier)}級</div>
      <div class="match-path">${esc(stagePath(r))}</div>
    </div>
    <div class="match-result">
      <strong class="${result.className}">${result.label}${score}</strong>
    </div>
  </article>`;
}
function ruleCard(c,index){
  const p=c.prospective||{},h=c.historical||{};
  const observations=(c.observations||[])
    .map(o=>({...o,_condition:c.id,_title:c.title}))
    .sort((a,b)=>String(b.kickoff||"").localeCompare(String(a.kickoff||"")));
  const inlineId=`inline-${c.id}`;
  return `<article class="rule ${index===0?"featured":""}" data-testid="card-condition-${esc(c.id)}">
    <div class="rule-head">
      <div><h2>${esc(c.title)}</h2><div class="rule-id">${esc(c.id)}</div></div>
      <span class="badge ${c.tier==="S"?"s":""}">${esc(c.tier)}級</span>
    </div>
    <p class="definition">${esc(c.definition)}</p>
    <p class="path">${esc(c.path_label)}</p>
    <p class="history-note">歷史參考：${n(h.sample)} 場 · 命中 ${pct(h.hit_rate)} · ROI ${pct(h.roi,2)}</p>
    <div class="live-stats"><strong>累積 ${n(p.qualified)}</strong><span>· 已判定 ${n(p.settled)}</span><span>· 目前命中 <b class="rate">${pct(p.hit_rate)}</b></span></div>
    <div class="rule-actions">
      <button class="btn primary" type="button" data-only="${esc(c.id)}" data-testid="button-only-${esc(c.id)}">只顯示此條件</button>
      <button class="btn" type="button" data-expand="${esc(c.id)}" data-testid="button-expand-${esc(c.id)}" aria-expanded="false" aria-controls="${esc(inlineId)}">展開符合場次 (${n(p.qualified)})</button>
    </div>
    <div class="inline-matches" id="${esc(inlineId)}" data-inline="${esc(c.id)}" hidden>
      <div class="inline-head"><strong>此條件符合場次</strong><span>${n(observations.length)} 場</span></div>
      <div class="match-list">${observations.length?observations.map(matchMarkup).join(""):`<div class="empty">此條件暫時未有累積場次。</div>`}</div>
    </div>
  </article>`;
}
function renderRules(){
  const rows=(state.payload?.public_conditions||[]).filter(c=>state.market==="all"||c.market===state.market);
  document.getElementById("condition-count").textContent=`${rows.length} 個公開 S/A 條件`;
  document.getElementById("rules").innerHTML=rows.length?rows.map(ruleCard).join(""):`<div class="empty">此分類暫時未有公開條件。</div>`;
}
function emptyMessage(){
  if(state.mode==="live")return "暫時未有未開賽或進行中的符合場次";
  if(state.condition)return "這個條件目前未有符合場次";
  return "目前未有符合場次";
}
function renderMatches(){
  const rows=visibleObservations(),filter=document.getElementById("active-filter");
  document.getElementById("matches-title").textContent={
    live:"現時運行符合場次",
    all:"全部累積符合場次",
    settled:"已完場／待賽果"
  }[state.mode];
  if(state.condition){
    const c=conditionMap()[state.condition];
    filter.classList.add("visible");
    document.getElementById("active-filter-text").textContent=`只顯示：${c?.title||state.condition}`;
  }else filter.classList.remove("visible");
  document.getElementById("match-list").innerHTML=rows.length?rows.map(matchMarkup).join(""):`<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h16M12 4v16"/><circle cx="12" cy="12" r="9"/></svg>
      ${emptyMessage()}
    </div>`;
}
function render(){
  const observations=allObservations();
  document.getElementById("kpi-live").textContent=n(observations.filter(o=>statusOf(o)==="live").length);
  document.getElementById("kpi-total").textContent=n(observations.length);
  document.getElementById("kpi-settled").textContent=n(observations.filter(o=>o.settlement).length);
  document.getElementById("updated").textContent=`更新於 ${fmtTime(state.payload.generated_at)}`;
  renderRules();renderMatches();
}
document.querySelectorAll("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{
  state.mode=btn.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(x=>x.setAttribute("aria-selected",String(x===btn)));
  renderMatches();
}));
document.querySelectorAll("[data-market]").forEach(btn=>btn.addEventListener("click",()=>{
  state.market=btn.dataset.market;state.condition=null;
  document.querySelectorAll("[data-market]").forEach(x=>x.setAttribute("aria-selected",String(x===btn)));
  render();
}));
document.getElementById("rules").addEventListener("click",event=>{
  const only=event.target.closest("[data-only]"),expand=event.target.closest("[data-expand]");
  if(!only&&!expand)return;
  if(expand){
    const card=expand.closest(".rule"),panel=card.querySelector("[data-inline]");
    const opening=panel.hidden;
    panel.hidden=!opening;
    expand.setAttribute("aria-expanded",String(opening));
    expand.textContent=`${opening?"收起":"展開"}符合場次 (${panel.querySelectorAll(".match").length})`;
    return;
  }
  state.condition=only.dataset.only;
  renderMatches();
  document.getElementById("matches-section").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("clear-filter").addEventListener("click",()=>{state.condition=null;renderMatches()});
let theme="light";
document.querySelector("[data-theme-toggle]").addEventListener("click",event=>{
  theme=theme==="light"?"dark":"light";document.documentElement.dataset.theme=theme;
  event.currentTarget.setAttribute("aria-label",theme==="light"?"切換深色模式":"切換淺色模式");
});
async function load(){
  try{
    const response=await fetch(`./data.json?ts=${Date.now()}`,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const payload=await response.json(),sc=payload.segmented_conditions;
    if(!sc||sc.direction_basis!=="model_prediction_not_quote_direction")throw new Error("資料口徑不符");
    state.payload=sc;render();
  }catch(error){
    document.getElementById("rules").innerHTML=`<div class="empty error">載入失敗：${esc(error.message)}。系統會自動重試。</div>`;
    document.getElementById("match-list").innerHTML="";
    document.getElementById("updated").textContent="載入失敗";
  }
}
load();setInterval(load,60000);
</script>
</body>
</html>
