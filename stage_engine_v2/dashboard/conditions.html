<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>皇冠系統V2 · 細分條件</title>
<!-- 部署相容標記：皇冠系統V2 · 三階段細分 -->
<style>
:root {
  --bg:#11100f; --surface:#191817; --surface-2:#211f1d; --border:#34312e;
  --text:#f0eee9; --muted:#9c9891; --faint:#696660; --accent:#52a0aa;
  --gold:#d6a64a; --green:#80b963; --red:#d56e75; --orange:#d88658;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;padding:24px;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans CJK TC",sans-serif
}
a{color:inherit}.shell{width:min(1180px,100%);margin:auto}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
h1{margin:0;font-size:24px;letter-spacing:-.02em}.sub{margin:5px 0 0;color:var(--muted)}
.shadow{display:inline-flex;padding:3px 9px;border-radius:5px;background:var(--orange);color:#17120e;font-size:11px;font-weight:800}
.nav{display:flex;gap:18px;margin:22px 0;border-bottom:1px solid var(--border)}
.nav a{padding:10px 0 8px;text-decoration:none;color:var(--muted);font-size:13px}
.nav a.active{color:var(--text);border-bottom:2px solid var(--accent)}
.notice{display:flex;gap:12px;padding:14px 16px;border:1px solid #355b60;border-radius:9px;background:#172326}
.notice strong{white-space:nowrap;color:#8fc7ce}.notice span{color:var(--muted)}
.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0}
.chip{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:12px}
.chip.live{border-color:#4d6c42;color:#9ac881;background:#1b2518}.updated{margin-left:auto;color:var(--faint);font-size:12px}
.market{margin-top:26px}.market-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}
.market h2{margin:0;font-size:20px}.market-meta{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.card.tier-s::before{background:var(--gold)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.tier{display:inline-flex;min-width:34px;justify-content:center;padding:4px 9px;border-radius:5px;background:#26444a;color:#9ed0d6;font-weight:800;font-size:12px}
.tier.s{background:#493b1d;color:#f2cf75}.eyebrow{color:var(--faint);font-size:10px;letter-spacing:.06em;margin-bottom:4px}
.card h3{font-size:17px;margin:0}.definition{min-height:44px;color:var(--muted);margin:10px 0 14px}
.path{padding:10px 12px;border-radius:7px;background:var(--surface-2);color:#d9d6d0;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.panel{padding:13px;border:1px solid var(--border);border-radius:8px;background:#171615}
.panel-title{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:10px}
.hero-num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}.hero-num small{font-size:12px;color:var(--muted);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat span{display:block;color:var(--faint);font-size:10px}.stat b{font-size:13px;font-variant-numeric:tabular-nums}
.positive{color:var(--green)}.pending{color:var(--orange)}
.matches{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
.matches summary{cursor:pointer;color:var(--muted);font-size:12px}.match{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid #292724}
.match:last-child{border-bottom:0}.match strong{font-size:13px}.match small{display:block;color:var(--muted)}
.result{text-align:right}.result b{display:block}.empty{padding:24px;border:1px dashed var(--border);border-radius:9px;color:var(--muted);text-align:center;background:var(--surface)}
.footnote{margin-top:28px;padding:15px 17px;border:1px solid var(--border);border-radius:9px;color:var(--muted);background:var(--surface)}
.footnote strong{color:var(--text)}footer{text-align:center;color:var(--faint);font-size:11px;margin-top:20px}
.error{color:#e58da9;border-color:#74445c}
@media(max-width:760px){
 body{padding:16px}.top{display:block}.shadow{margin-top:10px}.grid{grid-template-columns:1fr}.split{grid-template-columns:1fr}
 .definition{min-height:0}.toolbar{flex-wrap:wrap}.updated{width:100%;margin-left:0}.nav{gap:15px;overflow-x:auto;white-space:nowrap}
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="top">
      <div><h1>皇冠系統V2 · 細分條件</h1><p class="sub">初盤預測 → T-30 → T-5 · 只顯示 S級及 A級</p></div>
      <span class="shadow">SHADOW · 純統計</span>
    </div>
    <nav class="nav" aria-label="V2 導航">
      <a href="./">即時 dashboard</a>
      <a href="./history.html">歷史紀錄</a>
      <a href="./conditions.html" class="active" aria-current="page">細分條件</a>
    </nav>
  </header>

  <main>
    <div class="notice">
      <strong>預測方向，唔係報價方向</strong>
      <span>只按每個時點模型揀出嘅預測計算。歷史基準同啟用後實績分開顯示；條件只讀，唔會改模型、推介、注碼或通知。</span>
    </div>
    <div class="toolbar">
      <span class="chip live">後台持續累積</span>
      <span class="chip" id="cutoff">前瞻啟用線 —</span>
      <span class="updated" id="updated">載入中…</span>
    </div>
    <div id="content"><div class="empty">正在讀取 V2 細分條件…</div></div>
    <div class="footnote">
      <strong>統計口徑：</strong>命中率以全贏及半贏為命中，走水不計入分母；ROI 用每場條件成立時實際所選賠率計算。其他未達 S／A 級條件只在後台累積，不會公開顯示。
    </div>
  </main>
  <footer>皇冠系統 V2 · read-only prospective measurement</footer>
</div>

<script>
const MARKET_ORDER = ["HDC","HIL","CHL"];
const MARKET_LABEL = {HDC:"讓球",HIL:"入球大細",CHL:"角球大細"};
const STAGES = ["首預","T-30","T-5"];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pct(v,d=1){return v==null?"—":`${(Number(v)*100).toFixed(d)}%`}
function num(v){return Number(v||0).toLocaleString("zh-HK")}
function line(v){return v==null?"—":Number(v)>0?`+${Number(v)}`:`${Number(v)}`}
function stageName(v){return v==="首預"?"初盤預測":v}
function stagePath(obs){
  return STAGES.filter(s=>obs.directions?.[s]).map(s=>{
    const odd=obs.odds_by_stage?.[s], ln=obs.lines?.[s];
    return `${stageName(s)} ${obs.directions[s]} ${ln==null?"":line(ln)}${odd==null?"":` @ ${Number(odd).toFixed(2)}`}`;
  }).join(" → ");
}
function metric(label,value,cls=""){return `<div class="stat"><span>${label}</span><b class="${cls}">${value}</b></div>`}
function panel(title,m,history=false){
  const sample=history?m.sample:m.settled;
  const sub=history?`${num(m.sample)} 場固定基準`:`${num(m.settled)} 已結算 / ${num(m.pending)} 待賽果`;
  return `<div class="panel">
    <div class="panel-title"><span>${title}</span><span>${sub}</span></div>
    <div class="hero-num ${m.hit_rate!=null?"positive":""}">${pct(m.hit_rate)} <small>命中率</small></div>
    <div class="stats">
      ${metric("樣本",num(sample))}
      ${metric("ROI",pct(m.roi,2),m.roi>0?"positive":"")}
      ${metric(history?"走水":"入組",num(history?m.push:m.qualified))}
    </div>
  </div>`;
}
function matches(rows){
  if(!rows?.length)return "";
  return `<details class="matches"><summary>查看啟用後符合場次 (${rows.length})</summary>${rows.map(r=>`
    <div class="match">
      <div><strong>${esc(r.home)} 對 ${esc(r.away)}</strong><small>${esc(r.league)} · ${esc((r.kickoff||"").replace("T"," ").slice(0,16))}</small><small>${esc(stagePath(r))}</small></div>
      <div class="result"><b class="${r.settlement?"positive":"pending"}">${esc(r.settlement_label)}</b><small>${esc(r.score||"未有賽果")}</small></div>
    </div>`).join("")}</details>`;
}
function card(c){
  const cls=c.tier==="S"?"tier-s":"";
  return `<article class="card ${cls}">
    <div class="card-head"><div><div class="eyebrow">${esc(c.id)}</div><h3>${esc(c.title)}</h3></div><span class="tier ${c.tier==="S"?"s":""}">${esc(c.tier)}級</span></div>
    <p class="definition">${esc(c.definition)}</p>
    <div class="path">${esc(c.path_label)}</div>
    <div class="split">${panel("歷史回測基準",c.historical,true)}${panel("啟用後實績",c.prospective,false)}</div>
    ${matches(c.observations)}
  </article>`;
}
function render(sc){
  if(!sc||sc.direction_basis!=="model_prediction_not_quote_direction")throw new Error("資料唔係預測方向口徑");
  if(JSON.stringify(sc.public_tiers)!==JSON.stringify(["S","A"]))throw new Error("公開級別設定不符");
  const conditions=sc.public_conditions||[];
  document.getElementById("cutoff").textContent=`前瞻啟用線 ${new Date(sc.activation_cutoff).toLocaleString("zh-HK",{timeZone:"Asia/Hong_Kong",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})} HKT`;
  document.getElementById("updated").textContent=`更新 ${new Date(sc.generated_at).toLocaleString("zh-HK",{timeZone:"Asia/Hong_Kong",hour12:false})}`;
  document.getElementById("content").innerHTML=MARKET_ORDER.map(code=>{
    const rows=conditions.filter(c=>c.market===code&&["S","A"].includes(c.tier));
    return `<section class="market"><div class="market-head"><h2>${MARKET_LABEL[code]}</h2><span class="market-meta">${rows.length} 個公開 S/A 條件</span></div>
      ${rows.length?`<div class="grid">${rows.map(card).join("")}</div>`:`<div class="empty">目前未有達到 S／A 級嘅條件；後台繼續累積。</div>`}
    </section>`;
  }).join("");
}
async function load(){
  try{
    const response=await fetch(`./data.json?ts=${Date.now()}`,{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const payload=await response.json();
    render(payload.segmented_conditions);
  }catch(error){
    document.getElementById("content").innerHTML=`<div class="empty error">載入失敗：${esc(error.message)}。V2 排程會自動重試。</div>`;
    document.getElementById("updated").textContent="載入失敗";
  }
}
load();setInterval(load,60000);
</script>
</body>
</html>
